<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Hub logo: a happy person holding up a big burger -->
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffc56b"/>
      <stop offset="1" stop-color="#ff7a3d"/>
    </radialGradient>
    <radialGradient id="skin" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffd9b0"/>
      <stop offset="1" stop-color="#e2a76f"/>
    </radialGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa3f0"/>
      <stop offset="1" stop-color="#2a6fbf"/>
    </linearGradient>
    <radialGradient id="bun" cx="40%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ffd28a"/>
      <stop offset="1" stop-color="#c97a2a"/>
    </radialGradient>
    <clipPath id="badge"><circle cx="50" cy="50" r="47"/></clipPath>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
  <g clip-path="url(#badge)">
    <!-- body -->
    <path d="M10 104 Q12 70 38 68 L52 68 Q72 70 74 104 Z" fill="url(#shirt)"/>
    <path d="M36 68 Q45 76 54 68" fill="none" stroke="#1f5a9e" stroke-width="3" stroke-linecap="round"/>
    <!-- head -->
    <rect x="40" y="56" width="10" height="12" rx="3" fill="#d89a62"/>
    <circle cx="45" cy="44" r="17" fill="url(#skin)"/>
    <circle cx="28.5" cy="46" r="4" fill="#e2a76f"/>
    <!-- hair -->
    <path d="M28 42 Q28 24 46 24 Q63 24 62 40 Q56 33 47 33 Q36 33 30 44 Z" fill="#3b2414"/>
    <!-- face -->
    <circle cx="39" cy="45" r="2.6" fill="#1d1a17"/>
    <circle cx="51" cy="45" r="2.6" fill="#1d1a17"/>
    <circle cx="39.8" cy="44.2" r="0.9" fill="#fff"/>
    <circle cx="51.8" cy="44.2" r="0.9" fill="#fff"/>
    <circle cx="35" cy="51" r="3" fill="#ff8f8f" opacity="0.45"/>
    <circle cx="56" cy="51" r="3" fill="#ff8f8f" opacity="0.45"/>
    <path d="M39 51 Q45 58 51 51 Z" fill="#7a2a1e"/>
    <!-- arm holding the burger up -->
    <path d="M64 70 Q70 62 72 54" fill="none" stroke="url(#shirt)" stroke-width="9" stroke-linecap="round"/>
    <circle cx="73" cy="52" r="5.5" fill="url(#skin)"/>
  </g>

  <!-- burger -->
  <g transform="translate(73 38) rotate(-8)">
    <rect x="-17" y="7" width="34" height="7" rx="3.5" fill="#d98c3a"/>
    <ellipse cx="0" cy="5" rx="17" ry="4.5" fill="#6b3c1f"/>
    <path d="M-17 2 L17 2 L17 4 Q10 4 9 8 Q7 4 0 4 Q-3 4 -4 9 Q-6 4 -17 4 Z" fill="#ffcc33"/>
    <path d="M-18 0 Q-14 3 -10 0 Q-6 3 -2 0 Q2 3 6 0 Q10 3 14 0 Q16 2 18 0 L18 -1 L-18 -1 Z" fill="#5cbf3a"/>
    <path d="M-17 -1 A17 11 0 0 1 17 -1 Z" fill="url(#bun)"/>
    <ellipse cx="-6" cy="-6" rx="1.6" ry="0.9" fill="#fff4d6"/>
    <ellipse cx="2" cy="-8" rx="1.6" ry="0.9" fill="#fff4d6"/>
    <ellipse cx="9" cy="-5" rx="1.6" ry="0.9" fill="#fff4d6"/>
    <ellipse cx="-1" cy="-4" rx="1.6" ry="0.9" fill="#fff4d6"/>
  </g>

  <circle cx="50" cy="50" r="47" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="2.5"/>
</svg>
