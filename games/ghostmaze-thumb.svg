<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Ghost Maze game card: a glowbug zooming through a neon maze, chased by cheeky ghosts -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1d66"/>
      <stop offset="1" stop-color="#0c0824"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <radialGradient id="hero" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="0.55" stop-color="#ffd84a"/>
      <stop offset="1" stop-color="#c38a12"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb0b8"/>
      <stop offset="0.35" stop-color="#ff5f6d"/>
      <stop offset="1" stop-color="#b8263e"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd2f1"/>
      <stop offset="0.35" stop-color="#ff8fd8"/>
      <stop offset="1" stop-color="#b8459a"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2fff9"/>
      <stop offset="0.35" stop-color="#4fe3d8"/>
      <stop offset="1" stop-color="#168c86"/>
    </linearGradient>
    <radialGradient id="orb" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ff8fd0"/>
      <stop offset="1" stop-color="#a8307a"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a8"/>
      <stop offset="1" stop-color="#ffc21a"/>
    </linearGradient>
    <symbol id="star" viewBox="-10 -10 20 20">
      <circle r="9" fill="#fff27a" opacity="0.25"/>
      <path d="M0 -6 L1.8 -2 L6 -1.8 L2.8 1.1 L3.7 5.4 L0 3.2 L-3.7 5.4 L-2.8 1.1 L-6 -1.8 L-1.8 -2 Z" fill="#fff27a" stroke="#fff" stroke-width="0.6"/>
    </symbol>
    <symbol id="ghost" viewBox="-30 -32 60 64">
      <path d="M-24 -2 A24 24 0 0 1 24 -2 L24 18 Q18 28 12 18 Q6 28 0 18 Q-6 28 -12 18 Q-18 28 -24 18 Z"/>
    </symbol>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- maze walls -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#b18cff" stroke-width="16" filter="url(#glow)" opacity="0.95">
      <path d="M20 20 H620 V340 H20 Z"/>
      <path d="M80 80 H220 M80 80 V150"/>
      <path d="M420 80 H560 M560 80 V150"/>
      <path d="M80 280 H220 M80 210 V280"/>
      <path d="M420 280 H560 M560 210 V280"/>
      <path d="M290 245 H350"/>
    </g>
    <g stroke="#3d2a8a" stroke-width="10">
      <path d="M20 20 H620 V340 H20 Z"/>
      <path d="M80 80 H220 M80 80 V150"/>
      <path d="M420 80 H560 M560 80 V150"/>
      <path d="M80 280 H220 M80 210 V280"/>
      <path d="M420 280 H560 M560 210 V280"/>
      <path d="M290 245 H350"/>
    </g>
    <g stroke="#f2eaff" stroke-width="2.5" opacity="0.8">
      <path d="M20 20 H620 V340 H20 Z"/>
      <path d="M80 80 H220 M80 80 V150"/>
      <path d="M420 80 H560 M560 80 V150"/>
      <path d="M80 280 H220 M80 210 V280"/>
      <path d="M420 280 H560 M560 210 V280"/>
      <path d="M290 245 H350"/>
    </g>
  </g>

  <!-- stars along the bottom corridor -->
  <g>
    <use href="#star" x="244" y="300" width="24" height="24"/>
    <use href="#star" x="284" y="300" width="24" height="24"/>
    <use href="#star" x="324" y="300" width="24" height="24"/>
    <use href="#star" x="364" y="300" width="24" height="24"/>
    <use href="#star" x="404" y="300" width="24" height="24"/>
    <use href="#star" x="444" y="300" width="24" height="24"/>
    <use href="#star" x="484" y="300" width="24" height="24"/>
    <use href="#star" x="38" y="175" width="24" height="24"/>
    <use href="#star" x="578" y="175" width="24" height="24"/>
    <use href="#star" x="38" y="300" width="24" height="24"/>
    <use href="#star" x="38" y="38" width="24" height="24"/>
    <use href="#star" x="578" y="38" width="24" height="24"/>
    <use href="#star" x="578" y="300" width="24" height="24"/>
  </g>
  <!-- power orb -->
  <circle cx="530" cy="312" r="20" fill="#ff8fd0" opacity="0.25"/>
  <circle cx="530" cy="312" r="11" fill="url(#orb)"/>

  <!-- title -->
  <g text-anchor="middle" font-family="Fredoka, 'Trebuchet MS', Arial, sans-serif" font-weight="700">
    <text x="320" y="182" font-size="78" fill="#7a4b00" opacity="0.9">Ghost Maze</text>
    <text x="320" y="176" font-size="78" fill="url(#title)" stroke="#6a3d00" stroke-width="3" paint-order="stroke">Ghost Maze</text>
    <text x="320" y="214" font-size="20" fill="#e2d8ff" font-family="Nunito, Arial, sans-serif" font-weight="800">grab the stars · dodge the ghosts</text>
  </g>

  <!-- the hero, running left -->
  <g transform="translate(150 312)">
    <ellipse cx="0" cy="22" rx="18" ry="5" fill="#000" opacity="0.3"/>
    <ellipse cx="-10" cy="19" rx="7" ry="4.5" fill="#c38a12"/>
    <ellipse cx="10" cy="19" rx="7" ry="4.5" fill="#c38a12"/>
    <path d="M3 -22 Q6 -32 12 -33" stroke="#c38a12" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="12" cy="-33" r="8" fill="#fff27a" opacity="0.4"/>
    <circle cx="12" cy="-33" r="4" fill="#fff6a8"/>
    <circle r="22" fill="url(#hero)" stroke="#8a5e08" stroke-width="2"/>
    <ellipse cx="-9" cy="-11" rx="7" ry="4" fill="#fff" opacity="0.55" transform="rotate(-28 -9 -11)"/>
    <ellipse cx="-11" cy="-3" rx="3.4" ry="4.3" fill="#1d1a17"/>
    <ellipse cx="3" cy="-3" rx="3.4" ry="4.3" fill="#1d1a17"/>
    <circle cx="-10" cy="-4.5" r="1.3" fill="#fff"/>
    <circle cx="4" cy="-4.5" r="1.3" fill="#fff"/>
    <ellipse cx="-17" cy="5" rx="3.5" ry="2.2" fill="#ff6e96" opacity="0.5"/>
    <ellipse cx="9" cy="5" rx="3.5" ry="2.2" fill="#ff6e96" opacity="0.5"/>
    <path d="M-8 4 Q-4 9 0 4" stroke="#3a1a10" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>
  <!-- speed sparkles -->
  <g fill="#ffd84a">
    <path d="M190 300 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 Z" opacity="0.9"/>
    <path d="M210 320 l1.5 4 4 1.5 -4 1.5 -1.5 4 -1.5 -4 -4 -1.5 4 -1.5 Z" opacity="0.6"/>
  </g>

  <!-- ghosts -->
  <g transform="translate(250 52) scale(0.78)">
    <ellipse cx="0" cy="30" rx="18" ry="4" fill="#000" opacity="0.25"/>
    <use href="#ghost" x="-30" y="-32" width="60" height="64" fill="url(#red)" stroke="#7a1428" stroke-width="2"/>
    <path d="M10 -24 l-9 -6 v12 Z M10 -24 l9 -6 v12 Z" fill="#ffe066"/><circle cx="10" cy="-24" r="2.6" fill="#ffb800"/>
    <ellipse cx="-8" cy="-6" rx="6" ry="7.5" fill="#fff"/><ellipse cx="8" cy="-6" rx="6" ry="7.5" fill="#fff"/>
    <circle cx="-5" cy="-5" r="3.4" fill="#2a2366"/><circle cx="11" cy="-5" r="3.4" fill="#2a2366"/>
    <path d="M-4 7 q2 3 4 0 q2 3 4 0" stroke="#5a0a18" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(330 52) scale(0.78)">
    <ellipse cx="0" cy="30" rx="18" ry="4" fill="#000" opacity="0.25"/>
    <use href="#ghost" x="-30" y="-32" width="60" height="64" fill="url(#pink)" stroke="#7a1e62" stroke-width="2"/>
    <g transform="translate(-13 -22)"><circle cx="0" cy="-4" r="3.2" fill="#fff"/><circle cx="4" cy="0" r="3.2" fill="#fff"/><circle cx="0" cy="4" r="3.2" fill="#fff"/><circle cx="-4" cy="0" r="3.2" fill="#fff"/><circle r="2.6" fill="#ffd84a"/></g>
    <ellipse cx="-8" cy="-6" rx="6" ry="7.5" fill="#fff"/><ellipse cx="8" cy="-6" rx="6" ry="7.5" fill="#fff"/>
    <circle cx="-10" cy="-4" r="3.4" fill="#2a2366"/><circle cx="6" cy="-4" r="3.4" fill="#2a2366"/>
    <path d="M-4 7 q2 3 4 0 q2 3 4 0" stroke="#5a0a40" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(410 52) scale(0.78)">
    <ellipse cx="0" cy="30" rx="18" ry="4" fill="#000" opacity="0.25"/>
    <use href="#ghost" x="-30" y="-32" width="60" height="64" fill="url(#teal)" stroke="#0a5450" stroke-width="2"/>
    <path d="M-12 -21 A12 8 0 0 1 12 -21 Z" fill="#4a6bff"/><rect x="0" y="-22" width="16" height="3" fill="#4a6bff"/>
    <ellipse cx="-8" cy="-6" rx="6" ry="7.5" fill="#fff"/><ellipse cx="8" cy="-6" rx="6" ry="7.5" fill="#fff"/>
    <circle cx="-11" cy="-5" r="3.4" fill="#2a2366"/><circle cx="5" cy="-5" r="3.4" fill="#2a2366"/>
    <path d="M-4 7 q2 3 4 0 q2 3 4 0" stroke="#064a46" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
