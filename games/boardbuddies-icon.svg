<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Board Buddies icon: a bunny peeking over a checkerboard -->
  <defs>
    <radialGradient id="bg" cx="35%" cy="25%" r="80%">
      <stop offset="0" stop-color="#ffd98f"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </radialGradient>
    <radialGradient id="fur" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ddd3e8"/>
    </radialGradient>
    <radialGradient id="red" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ff9a8c"/>
      <stop offset="0.55" stop-color="#e8453c"/>
      <stop offset="1" stop-color="#9b1f19"/>
    </radialGradient>
    <clipPath id="badge"><rect x="3" y="3" width="94" height="94" rx="22"/></clipPath>
  </defs>
  <rect x="3" y="3" width="94" height="94" rx="22" fill="url(#bg)"/>
  <g clip-path="url(#badge)">
    <!-- bunny -->
    <g transform="translate(50 52)">
      <ellipse cx="-11" cy="-30" rx="7" ry="20" fill="url(#fur)" stroke="#8d7fa0" stroke-width="2" transform="rotate(-12 -11 -30)"/>
      <ellipse cx="-11" cy="-28" rx="3.2" ry="14" fill="#ffbcd0" transform="rotate(-12 -11 -28)"/>
      <ellipse cx="11" cy="-30" rx="7" ry="20" fill="url(#fur)" stroke="#8d7fa0" stroke-width="2" transform="rotate(12 11 -30)"/>
      <ellipse cx="11" cy="-28" rx="3.2" ry="14" fill="#ffbcd0" transform="rotate(12 11 -28)"/>
      <ellipse cx="0" cy="0" rx="26" ry="23" fill="url(#fur)" stroke="#8d7fa0" stroke-width="2"/>
      <ellipse cx="-9" cy="-3" rx="3.4" ry="4" fill="#2a1a12"/>
      <ellipse cx="9" cy="-3" rx="3.4" ry="4" fill="#2a1a12"/>
      <circle cx="-8" cy="-4.5" r="1.2" fill="#fff"/><circle cx="10" cy="-4.5" r="1.2" fill="#fff"/>
      <ellipse cx="-17" cy="6" rx="4" ry="2.5" fill="#ffb7cb"/><ellipse cx="17" cy="6" rx="4" ry="2.5" fill="#ffb7cb"/>
      <ellipse cx="0" cy="5" rx="2.6" ry="2" fill="#ff7fa3"/>
    </g>
    <!-- board -->
    <g transform="translate(0 66)">
      <rect x="0" y="0" width="100" height="40" fill="#6b3f1f"/>
      <g fill="#f4ddb4">
        <rect x="6" y="4" width="11" height="11"/><rect x="28" y="4" width="11" height="11"/><rect x="50" y="4" width="11" height="11"/><rect x="72" y="4" width="11" height="11"/>
        <rect x="17" y="15" width="11" height="11"/><rect x="39" y="15" width="11" height="11"/><rect x="61" y="15" width="11" height="11"/><rect x="83" y="15" width="11" height="11"/>
      </g>
      <g fill="#a8693a">
        <rect x="17" y="4" width="11" height="11"/><rect x="39" y="4" width="11" height="11"/><rect x="61" y="4" width="11" height="11"/><rect x="83" y="4" width="11" height="11"/>
        <rect x="6" y="15" width="11" height="11"/><rect x="28" y="15" width="11" height="11"/><rect x="50" y="15" width="11" height="11"/><rect x="72" y="15" width="11" height="11"/>
      </g>
    </g>
    <!-- bunny paws -->
    <ellipse cx="36" cy="68" rx="7" ry="4.5" fill="#fff" stroke="#8d7fa0" stroke-width="1.6"/>
    <ellipse cx="64" cy="68" rx="7" ry="4.5" fill="#fff" stroke="#8d7fa0" stroke-width="1.6"/>
    <!-- red piece -->
    <ellipse cx="75" cy="78" rx="12" ry="11" fill="#000" opacity="0.25"/>
    <circle cx="74" cy="75" r="11" fill="url(#red)" stroke="#9b1f19" stroke-width="1.4"/>
    <circle cx="74" cy="75" r="7" fill="none" stroke="#000" stroke-opacity="0.2" stroke-width="1.5"/>
    <path d="M67 77 L67 70 L70.5 73 L74 67 L77.5 73 L81 70 L81 77 Z" fill="#ffc93d" stroke="#8a5a00" stroke-width="1" stroke-linejoin="round"/>
  </g>
  <rect x="3" y="3" width="94" height="94" rx="22" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="2.5"/>
</svg>
