<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Candy Drop game card: a candy swinging on a rope above a hungry green monster -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9ccf"/>
      <stop offset="0.6" stop-color="#c98aff"/>
      <stop offset="1" stop-color="#7a5cff"/>
    </linearGradient>
    <radialGradient id="body" cx="40%" cy="30%" r="80%">
      <stop offset="0" stop-color="#b6f59a"/>
      <stop offset="0.6" stop-color="#4fc94a"/>
      <stop offset="1" stop-color="#2f9a3a"/>
    </radialGradient>
    <radialGradient id="shine" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.2"/>
    </radialGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a86a"/>
      <stop offset="1" stop-color="#a8743e"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a0"/>
      <stop offset="0.5" stop-color="#ffd43b"/>
      <stop offset="1" stop-color="#ffaa00"/>
    </linearGradient>
    <linearGradient id="t1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd1e8"/>
      <stop offset="1" stop-color="#ff5fa2"/>
    </linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6fff0"/>
      <stop offset="1" stop-color="#3fd6a0"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="0.65" stop-color="#100018" stop-opacity="0"/>
      <stop offset="1" stop-color="#100018" stop-opacity="0.3"/>
    </radialGradient>
    <clipPath id="cball"><circle cx="0" cy="0" r="30"/></clipPath>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- background lollipop swirls -->
  <g opacity="0.2" fill="none" stroke="#fff" stroke-width="7">
    <circle cx="560" cy="70" r="46" fill="#fff" fill-opacity="0.4"/>
    <path d="M560 70 m-6 0 a6 6 0 1 1 12 0 a12 12 0 1 1 -24 0 a18 18 0 1 1 36 0 a24 24 0 1 1 -48 0 a30 30 0 1 1 60 0"/>
    <circle cx="70" cy="300" r="40" fill="#fff" fill-opacity="0.4"/>
    <path d="M70 300 m-6 0 a6 6 0 1 1 12 0 a12 12 0 1 1 -24 0 a18 18 0 1 1 36 0 a24 24 0 1 1 -48 0"/>
  </g>
  <g fill="#ffffff" opacity="0.25">
    <path d="M380 40 l6 12 13 2 -10 9 3 13 -12 -7 -12 7 3 -13 -10 -9 13 -2z"/>
    <path d="M300 320 l4 8 9 1 -7 6 2 9 -8 -5 -8 5 2 -9 -7 -6 9 -1z"/>
  </g>

  <!-- pin and rope -->
  <circle cx="440" cy="26" r="11" fill="#c9ced9" stroke="#7a8094" stroke-width="2"/>
  <circle cx="440" cy="26" r="4" fill="#5a6070"/>
  <path d="M440 26 Q470 80 494 128" fill="none" stroke="#7a4a26" stroke-width="9" stroke-linecap="round"/>
  <path d="M440 26 Q470 80 494 128" fill="none" stroke="#d9a86a" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="7 7"/>
  <!-- swipe slash -->
  <path d="M420 104 L520 66" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M440 98 L500 75" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.5"/>

  <!-- candy -->
  <g transform="translate(500 150) rotate(-15)">
    <path d="M-26 0 L-56 -24 Q-48 0 -56 24 Z" fill="#ff8fa8" stroke="#c0405a" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M26 0 L56 -24 Q48 0 56 24 Z" fill="#ff8fa8" stroke="#c0405a" stroke-opacity="0.4" stroke-width="2"/>
    <circle r="30" fill="#ffffff"/>
    <g clip-path="url(#cball)" fill="#ff4d6d">
      <path d="M0 0 Q20 -10 34 -34 L0 -40 Z"/>
      <path d="M0 0 Q10 20 34 34 L40 0 Z"/>
      <path d="M0 0 Q-20 10 -34 34 L0 40 Z"/>
      <path d="M0 0 Q-10 -20 -34 -34 L-40 0 Z"/>
    </g>
    <circle r="30" fill="url(#shine)"/>
    <circle r="30" fill="none" stroke="#8a2034" stroke-opacity="0.3" stroke-width="2"/>
  </g>

  <!-- stars along the path -->
  <g>
    <path d="M470 222 l7 14 15 2 -11 10 3 15 -14 -7 -14 7 3 -15 -11 -10 15 -2z" fill="url(#star)" stroke="#c98a00" stroke-width="2"/>
    <path d="M430 270 l6 12 13 2 -10 9 3 13 -12 -7 -12 7 3 -13 -10 -9 13 -2z" fill="url(#star)" stroke="#c98a00" stroke-width="2"/>
  </g>

  <!-- Munch the monster on a box -->
  <g transform="translate(360 352)">
    <rect x="-56" y="-30" width="112" height="34" rx="8" fill="url(#box)"/>
    <line x1="-56" y1="-18" x2="56" y2="-18" stroke="#6a4020" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M-48 -30 Q-58 -92 -30 -112 Q0 -128 30 -112 Q58 -92 48 -30 Z" fill="url(#body)" stroke="#1f6b2a" stroke-width="3"/>
    <ellipse cx="-24" cy="-30" rx="16" ry="8" fill="#2f9a3a"/><ellipse cx="24" cy="-30" rx="16" ry="8" fill="#2f9a3a"/>
    <path d="M-16 -112 Q-24 -134 -32 -140" stroke="#2f9a3a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M16 -112 Q24 -134 32 -140" stroke="#2f9a3a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="-32" cy="-142" r="7" fill="#ffd43b"/><circle cx="32" cy="-142" r="7" fill="#ffd43b"/>
    <ellipse cx="-19" cy="-92" rx="14" ry="16" fill="#fff"/><ellipse cx="19" cy="-92" rx="14" ry="16" fill="#fff"/>
    <circle cx="-14" cy="-96" r="8" fill="#1a1a2a"/><circle cx="24" cy="-96" r="8" fill="#1a1a2a"/>
    <circle cx="-11" cy="-99" r="3" fill="#fff"/><circle cx="27" cy="-99" r="3" fill="#fff"/>
    <ellipse cx="0" cy="-58" rx="25" ry="18" fill="#5a1030"/>
    <ellipse cx="0" cy="-50" rx="14" ry="7" fill="#ff6b8f"/>
    <rect x="-13" y="-77" width="8" height="8" fill="#fff"/><rect x="5" y="-77" width="8" height="8" fill="#fff"/>
    <circle cx="-36" cy="-62" r="6" fill="#ff7896" opacity="0.45"/><circle cx="36" cy="-62" r="6" fill="#ff7896" opacity="0.45"/>
  </g>

  <!-- title -->
  <g font-family="Fredoka, 'Trebuchet MS', Arial, sans-serif" font-weight="700">
    <text x="32" y="112" font-size="82" fill="#5a0a3a" opacity="0.35" transform="translate(4 6)">Candy</text>
    <text x="32" y="112" font-size="82" fill="url(#t1)" stroke="#a8285e" stroke-width="5" paint-order="stroke" stroke-linejoin="round">Candy</text>
    <text x="32" y="196" font-size="82" fill="#0a3a2a" opacity="0.35" transform="translate(4 6)">Drop</text>
    <text x="32" y="196" font-size="82" fill="url(#t2)" stroke="#1f8a66" stroke-width="5" paint-order="stroke" stroke-linejoin="round">Drop</text>
    <text x="36" y="232" font-size="20" fill="#ffffff" stroke="#6a2a90" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Cut the rope. Feed Munch!</text>
  </g>
  <rect width="640" height="360" fill="url(#vig)"/>
</svg>
