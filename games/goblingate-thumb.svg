  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb8ee"/>
      <stop offset="1" stop-color="#d4f0ff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd05c"/>
      <stop offset="1" stop-color="#4f9a35"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9bd58a"/>
      <stop offset="1" stop-color="#6fb05a"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2dccd"/>
      <stop offset="0.5" stop-color="#bdb5a4"/>
      <stop offset="1" stop-color="#858072"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a8fe0"/>
      <stop offset="1" stop-color="#22448a"/>
    </linearGradient>
    <linearGradient id="redroof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef6a58"/>
      <stop offset="1" stop-color="#9c2a1e"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c08a52"/>
      <stop offset="1" stop-color="#6e4521"/>
    </linearGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2f8ff"/>
      <stop offset="0.5" stop-color="#7fd6ff"/>
      <stop offset="1" stop-color="#3a8fd6"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7280"/>
      <stop offset="0.35" stop-color="#d1d5db"/>
      <stop offset="0.6" stop-color="#4b5563"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <radialGradient id="gob" cx="60%" cy="35%" r="70%">
      <stop offset="0" stop-color="#b8ef80"/>
      <stop offset="0.65" stop-color="#6fb23a"/>
      <stop offset="1" stop-color="#467f24"/>
    </radialGradient>
    <radialGradient id="orcskin" cx="60%" cy="35%" r="70%">
      <stop offset="0" stop-color="#b4cca2"/>
      <stop offset="0.65" stop-color="#6f8a5c"/>
      <stop offset="1" stop-color="#4a5e3c"/>
    </radialGradient>
    <linearGradient id="helmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f4f7"/>
      <stop offset="0.5" stop-color="#a9b1bc"/>
      <stop offset="1" stop-color="#6a727d"/>
