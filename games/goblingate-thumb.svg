  <g>
    <circle cx="70" cy="214" r="3" fill="#fff"/><circle cx="74" cy="210" r="3" fill="#fff"/><circle cx="66" cy="210" r="3" fill="#fff"/><circle cx="70" cy="211" r="2" fill="#f5a623"/>
    <circle cx="500" cy="318" r="3" fill="#ff8fb1"/><circle cx="504" cy="314" r="3" fill="#ff8fb1"/><circle cx="496" cy="314" r="3" fill="#ff8fb1"/><circle cx="500" cy="315" r="2" fill="#f5a623"/>
    <circle cx="250" cy="338" r="3" fill="#ffe066"/><circle cx="254" cy="334" r="3" fill="#ffe066"/><circle cx="246" cy="334" r="3" fill="#ffe066"/><circle cx="250" cy="335" r="2" fill="#f5a623"/>
  </g>

  <!-- the road to the castle -->
  <path d="M-30 334 C80 304 120 244 220 264 S360 326 440 254 S520 204 560 200" fill="none" stroke="#000" stroke-opacity="0.15" stroke-width="66" transform="translate(0 5)"/>
  <path d="M-30 334 C80 304 120 244 220 264 S360 326 440 254 S520 204 560 200" fill="none" stroke="#9c7745" stroke-width="62" stroke-linecap="round"/>
  <path d="M-30 334 C80 304 120 244 220 264 S360 326 440 254 S520 204 560 200" fill="none" stroke="#d6b07a" stroke-width="50" stroke-linecap="round"/>
  <path d="M-30 334 C80 304 120 244 220 264 S360 326 440 254 S520 204 560 200" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="18" stroke-linecap="round"/>

