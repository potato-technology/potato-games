    <ellipse cx="420" cy="62" rx="32" ry="10"/><ellipse cx="442" cy="55" rx="20" ry="10"/>
  </g>

  <!-- hills far away -->
  <path d="M0 150 Q80 104 170 132 Q260 92 360 128 Q450 96 540 120 Q600 104 640 118 L640 200 L0 200 Z" fill="url(#hill)"/>
  <path d="M0 150 Q80 104 170 132 Q260 92 360 128 Q450 96 540 120 Q600 104 640 118" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="3"/>
  <g fill="#4f9a35">
    <circle cx="40" cy="138" r="14"/><circle cx="58" cy="134" r="11"/><circle cx="210" cy="124" r="12"/><circle cx="226" cy="120" r="9"/>
    <circle cx="470" cy="112" r="11"/><circle cx="486" cy="116" r="8"/>
  </g>

  <!-- grass field -->
  <path d="M0 160 Q160 140 320 150 Q480 160 640 140 L640 360 L0 360 Z" fill="url(#grass)"/>
  <g fill="#3f7f27" opacity="0.35">
