  <!-- the goblin army -->
  <use href="#goblin" transform="translate(36 336) scale(1.45)"/>
  <use href="#goblin" transform="translate(94 312) scale(1.45)"/>
  <!-- armored orc -->
  <g transform="translate(176 282) scale(1.35)">
    <ellipse cx="0" cy="1" rx="16" ry="5" fill="#000" opacity="0.25"/>
    <path d="M-5 -14 L-8 -1 M5 -14 L8 -1" stroke="#3a2c1f" stroke-width="7" stroke-linecap="round"/>
    <rect x="-13" y="-38" width="26" height="25" rx="8" fill="url(#helmet)"/>
    <path d="M-13 -28h26M-13 -21h26" stroke="#3a3f47" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="-13" y="-16" width="26" height="4" fill="#6b4a2a"/>
    <path d="M12 -26 L12 -54" stroke="#6b4a2a" stroke-width="3"/>
    <path d="M12 -54 Q28 -56 26 -40 Q20 -44 12 -42 Z" fill="url(#helmet)"/>
    <ellipse cx="1" cy="-47" rx="12" ry="11" fill="url(#orcskin)"/>
    <ellipse cx="6" cy="-48" rx="2.6" ry="2.2" fill="#ffef9a"/><circle cx="6.6" cy="-48" r="1.3" fill="#1a1206"/>
    <ellipse cx="-1" cy="-48" rx="2.4" ry="2" fill="#ffef9a"/><circle cx="-0.4" cy="-48" r="1.2" fill="#1a1206"/>
    <path d="M3 -41 L4.5 -46 L6 -41 Z M8 -41 L9.5 -46 L11 -41 Z" fill="#fffbea"/>
    <path d="M-12.5 -50 A13.5 12 0 0 1 14.5 -50 Z" fill="url(#helmet)"/>
    <path d="M-4 -61 L-10 -71 L-2 -62 Z M6 -61 L12 -71 L4 -62 Z" fill="#6a727d"/>
  </g>
  <use href="#goblin" transform="translate(262 276) scale(1.45)"/>
  <use href="#goblin" transform="translate(222 266) scale(1.3)"/>

  <!-- cannonball blast in the middle of them -->
  <circle cx="300" cy="286" r="30" fill="url(#boom)"/>
  <g fill="#6b4a2a"><rect x="282" y="262" width="5" height="5" transform="rotate(20 284 264)"/><rect x="318" y="268" width="4" height="4"/><rect x="306" y="252" width="4" height="4" transform="rotate(40 308 254)"/></g>

  <!-- coins popping out -->
  <g>
    <circle cx="60" cy="262" r="9" fill="url(#coin)"/><circle cx="60" cy="262" r="5.5" fill="none" stroke="#a8730f" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="84" cy="246" r="8" fill="url(#coin)"/><circle cx="84" cy="246" r="5" fill="none" stroke="#a8730f" stroke-opacity="0.6" stroke-width="1.5"/>
    <path d="M70 236 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z" fill="#fff"/>
