  <g transform="translate(350 220)">
    <ellipse cx="4" cy="10" rx="32" ry="11" fill="#000" opacity="0.26"/>
    <path d="M-25 6 L-17 -30 L17 -30 L25 6 Q0 16 -25 6 Z" fill="#cfe2f6"/>
    <path d="M-25 6 L-17 -30 L-6 -30 L-10 10 Q-18 9 -25 6 Z" fill="#fff" opacity="0.45"/>
    <ellipse cx="0" cy="-30" rx="17" ry="5" fill="#e8f2ff"/>
    <path d="M-12 -30 L-10 -60 L-6 -70 L-2 -60 L0 -30 Z" fill="url(#crystal)"/>
    <path d="M12 -30 L10 -58 L6 -66 L2 -58 L0 -30 Z" fill="url(#crystal)"/>
    <path d="M-6 -30 L-5 -78 L0 -92 L5 -78 L6 -30 Z" fill="url(#crystal)"/>
    <path d="M-3 -32 L-2 -76 L0 -88 L-0.5 -32 Z" fill="#fff" opacity="0.6"/>
    <circle cx="0" cy="-114" r="28" fill="url(#orbglow)"/>
    <circle cx="0" cy="-114" r="10" fill="url(#orb)"/>
    <circle cx="14" cy="-110" r="2" fill="#e8fbff"/><circle cx="-13" cy="-118" r="1.6" fill="#e8fbff"/>
  </g>
