    <radialGradient id="orb" cx="40%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#9feaff"/>
      <stop offset="1" stop-color="#3aa6e6"/>
    </radialGradient>
    <radialGradient id="orbglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a0ebff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a0ebff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="boom" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.45" stop-color="#ffb03a"/>
      <stop offset="1" stop-color="#ff5a1e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coin" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.5" stop-color="#ffd43b"/>
      <stop offset="1" stop-color="#d99a0e"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
