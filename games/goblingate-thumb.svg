      <rect x="-9" y="-28" width="18" height="18" rx="6" fill="#8a5a2b"/>
      <rect x="-9" y="-16" width="18" height="3" fill="#3d2814"/>
      <circle cx="0" cy="-14.5" r="1.6" fill="#c9a227"/>
      <path d="M9 -20 L16 -38 Q19 -44 22 -38 L13 -18 Z" fill="#a0703d"/>
      <circle cx="10" cy="-20" r="3.4" fill="#6fb23a"/>
      <path d="M-7 -40 L-22 -47 L-8 -33 Z" fill="#6fb23a"/>
      <path d="M6 -41 L20 -50 L9 -34 Z" fill="#6fb23a"/>
      <path d="M-9 -39 L-17 -44 L-9 -35 Z" fill="#d97a7a" opacity="0.5"/>
      <ellipse cx="0" cy="-38" rx="12" ry="11" fill="url(#gob)"/>
      <ellipse cx="5" cy="-40" rx="3" ry="3.4" fill="#fff7c2"/>
      <circle cx="6" cy="-40" r="1.6" fill="#1a1206"/>
      <ellipse cx="-2" cy="-40" rx="2.8" ry="3.2" fill="#fff7c2"/>
      <circle cx="-1" cy="-40" r="1.5" fill="#1a1206"/>
      <path d="M1 -45 L8 -43" stroke="#467f24" stroke-width="1.6" stroke-linecap="round"/>
