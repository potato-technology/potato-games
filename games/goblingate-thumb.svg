    </g>
    <path d="M556 122 L576 122 L576 146 L566 140 L556 146 Z" fill="#c0392b"/>
    <path d="M566 126 l2.2 4.6 5 0.6 -3.7 3.4 1 5 -4.5 -2.5 -4.5 2.5 1 -5 -3.7 -3.4 5 -0.6z" fill="#ffc145"/>
  </g>

