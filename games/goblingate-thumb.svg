  <circle cx="300" cy="230" r="4.5" fill="#fff"/>
  <g fill="#d6f6ff"><circle cx="312" cy="222" r="2"/><circle cx="322" cy="214" r="1.6"/><circle cx="330" cy="206" r="1.2"/></g>

