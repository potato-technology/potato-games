    <text x="98" y="31" text-anchor="middle" font-family="'Arial Rounded MT Bold', 'Trebuchet MS', Arial, sans-serif" font-weight="900" font-size="27" fill="#3a2400">GOBLIN GATE</text>
  </g>

  <rect width="640" height="360" fill="url(#vignette)"/>
