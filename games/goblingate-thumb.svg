    <g stroke="#5a5448" stroke-opacity="0.3" stroke-width="1">
      <path d="M506 132h120M506 146h120M506 160h120M506 174h120M506 188h120M506 202h120"/>
      <path d="M526 118v14M556 118v14M586 118v14M541 132v14M571 132v14M601 132v14M526 146v14M556 146v14M586 146v14M541 160v14M601 160v14M526 174v14M601 174v14M541 188v14M601 188v14"/>
    </g>
    <g fill="#ddd6c6"><rect x="506" y="106" width="14" height="14"/><rect x="530" y="106" width="14" height="14"/><rect x="554" y="106" width="14" height="14"/><rect x="578" y="106" width="14" height="14"/><rect x="602" y="106" width="14" height="14"/></g>
    <path d="M546 210 L546 174 Q546 152 566 152 Q586 152 586 174 L586 210 Z" fill="#5b4632"/>
    <path d="M550 210 L550 176 Q550 158 566 158 Q582 158 582 176 L582 210 Z" fill="#1a120c"/>
    <g stroke="#4a4a50" stroke-width="2.5"><path d="M550 170h32M550 180h32M550 190h32M550 200h32M558 160v50M566 158v52M574 160v50"/></g>
