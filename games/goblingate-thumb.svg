    <ellipse cx="4" cy="8" rx="36" ry="11" fill="#000" opacity="0.28"/>
    <rect x="-28" y="-20" width="56" height="24" fill="url(#stone)"/>
    <ellipse cx="0" cy="4" rx="28" ry="9" fill="#858072"/>
    <ellipse cx="0" cy="-20" rx="28" ry="9" fill="#e0dace"/>
    <g fill="#d4cdbd"><rect x="-26" y="-30" width="9" height="10"/><rect x="-12" y="-32" width="9" height="10"/><rect x="3" y="-32" width="9" height="10"/><rect x="17" y="-30" width="9" height="10"/></g>
    <g transform="translate(0 -28) rotate(200)">
      <rect x="-8" y="-9" width="40" height="18" rx="6" fill="url(#iron)"/>
      <rect x="22" y="-10" width="4" height="20" fill="#ffd43b"/>
      <ellipse cx="32" cy="0" rx="3.5" ry="7" fill="#111827"/>
    </g>
    <circle cx="0" cy="-28" r="10" fill="#4b5563"/>
    <circle cx="-3" cy="-31" r="3" fill="#9ca3af"/>
    <circle cx="-38" cy="-42" r="12" fill="url(#boom)"/>
