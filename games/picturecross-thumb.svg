<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Picture Cross game card: a picture logic grid with clues, half filled, turning into a colourful strawberry -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3efff"/>
      <stop offset="1" stop-color="#d9cff8"/>
    </linearGradient>
    <linearGradient id="crayon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8fab"/>
      <stop offset="1" stop-color="#e85a80"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2e245a" flood-opacity="0.25"/>
    </filter>
    <g id="ink"><rect x="2" y="2" width="20" height="20" rx="4" fill="#3a3f8f"/><rect x="4" y="4" width="16" height="3" fill="#fff" opacity="0.2"/></g>
    <g id="x"><path d="M7 7 L17 17 M17 7 L7 17" stroke="#8b80b8" stroke-width="2.4" stroke-linecap="round"/></g>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- floating pixel doodles -->
  <g opacity="0.35">
    <rect x="30" y="40" width="14" height="14" fill="#ff6f91"/><rect x="44" y="54" width="14" height="14" fill="#ff6f91"/>
    <rect x="590" y="300" width="14" height="14" fill="#4cbf4a"/><rect x="576" y="314" width="14" height="14" fill="#4cbf4a"/>
    <rect x="600" y="40" width="12" height="12" fill="#ffc23d"/><rect x="40" y="300" width="12" height="12" fill="#3a86e8"/>
  </g>

  <!-- puzzle sheet -->
  <g transform="translate(176 112)" filter="url(#sh)">
    <rect x="-14" y="-14" width="316" height="252" rx="18" fill="#fff"/>
  </g>
  <g transform="translate(176 112)">
    <rect x="0" y="54" width="62" height="168" rx="10" fill="#f4f1ff"/>
    <rect x="70" y="-2" width="216" height="50" rx="10" fill="#f4f1ff"/>
    <!-- 9 columns x 7 rows grid of 24px at (70, 54) -->
    <g transform="translate(70 54)">
      <rect width="216" height="168" fill="#fff"/>
      <!-- coloured part (revealed strawberry, left) -->
      <g>
        <rect x="72" y="0" width="24" height="24" fill="#23803a"/><rect x="96" y="0" width="24" height="24" fill="#23803a"/>
        <rect x="24" y="24" width="24" height="24" fill="#e8453c"/><rect x="48" y="24" width="24" height="24" fill="#e8453c"/><rect x="72" y="24" width="24" height="24" fill="#23803a"/><rect x="96" y="24" width="24" height="24" fill="#23803a"/>
        <rect x="0" y="48" width="24" height="24" fill="#e8453c"/><rect x="24" y="48" width="24" height="24" fill="#ffd23d"/><rect x="48" y="48" width="24" height="24" fill="#e8453c"/><rect x="72" y="48" width="24" height="24" fill="#e8453c"/><rect x="96" y="48" width="24" height="24" fill="#e8453c"/>
        <rect x="0" y="72" width="24" height="24" fill="#e8453c"/><rect x="24" y="72" width="24" height="24" fill="#e8453c"/><rect x="48" y="72" width="24" height="24" fill="#e8453c"/><rect x="72" y="72" width="24" height="24" fill="#ffd23d"/><rect x="96" y="72" width="24" height="24" fill="#e8453c"/>
        <rect x="24" y="96" width="24" height="24" fill="#e8453c"/><rect x="48" y="96" width="24" height="24" fill="#ffd23d"/><rect x="72" y="96" width="24" height="24" fill="#e8453c"/><rect x="96" y="96" width="24" height="24" fill="#e8453c"/>
        <rect x="48" y="120" width="24" height="24" fill="#e8453c"/><rect x="72" y="120" width="24" height="24" fill="#e8453c"/><rect x="96" y="120" width="24" height="24" fill="#e8453c"/>
        <rect x="72" y="144" width="24" height="24" fill="#e8453c"/><rect x="96" y="144" width="24" height="24" fill="#e8453c"/>
      </g>
      <!-- ink part (still being solved, right) -->
      <use href="#ink" x="120" y="0"/><use href="#ink" x="144" y="0"/>
      <use href="#ink" x="120" y="24"/><use href="#x" x="144" y="24"/><use href="#x" x="192" y="24"/>
      <use href="#ink" x="120" y="48"/><use href="#ink" x="144" y="48"/><use href="#ink" x="168" y="48"/>
      <use href="#ink" x="120" y="72"/><use href="#ink" x="144" y="72"/><use href="#x" x="192" y="72"/>
      <use href="#ink" x="120" y="96"/><use href="#x" x="168" y="96"/><use href="#x" x="192" y="96"/>
      <use href="#x" x="144" y="120"/><use href="#x" x="192" y="144"/>
      <!-- grid lines -->
      <g stroke="#d9d2f0" stroke-width="1">
        <path d="M24 0V168M48 0V168M72 0V168M96 0V168M144 0V168M168 0V168M192 0V168M0 24H216M0 48H216M0 72H216M96 0V168M0 96H216M0 120H216M0 144H216"/>
      </g>
      <path d="M120 0V168" stroke="#a99de0" stroke-width="2.5"/>
      <rect width="216" height="168" fill="none" stroke="#a99de0" stroke-width="2.5"/>
      <!-- cursor -->
      <rect x="168" y="72" width="24" height="24" rx="5" fill="none" stroke="#ff6f91" stroke-width="3"/>
    </g>
    <!-- clues -->
    <g font-family="'Fredoka', 'Arial Rounded MT Bold', 'Trebuchet MS', Arial, sans-serif" font-weight="800" font-size="15" fill="#3c3566" text-anchor="middle">
      <text x="82" y="42">2</text><text x="106" y="42">4</text><text x="130" y="42">5</text><text x="154" y="42">7</text><text x="178" y="42">6</text><text x="202" y="42">4</text><text x="226" y="42">3</text><text x="250" y="42">2</text><text x="274" y="42">1</text>
      <text x="130" y="22">1</text><text x="226" y="22">1</text>
      <text x="44" y="71">2 2</text><text x="44" y="95">4 1</text><text x="44" y="119">8</text><text x="44" y="143">6 1</text><text x="44" y="167">5</text><text x="44" y="191">3</text><text x="44" y="215">2</text>
    </g>
  </g>

  <!-- crayon buddy -->
  <g transform="translate(548 236) rotate(8)">
    <ellipse cx="0" cy="66" rx="34" ry="8" fill="#2e245a" opacity="0.18"/>
    <path d="M-22 -40 L0 -84 L22 -40 Z" fill="#f6c89a"/>
    <path d="M-9 -66 L0 -84 L9 -66 Z" fill="#ff6f91"/>
    <rect x="-22" y="-42" width="44" height="100" rx="8" fill="url(#crayon)"/>
    <rect x="-22" y="4" width="44" height="22" fill="#fff"/>
    <text x="0" y="20" font-family="'Fredoka', 'Arial Rounded MT Bold', Arial, sans-serif" font-weight="900" font-size="13" fill="#ff6f91" text-anchor="middle">PIX</text>
    <ellipse cx="-9" cy="-18" rx="3.5" ry="4.5" fill="#2b2b35"/><ellipse cx="9" cy="-18" rx="3.5" ry="4.5" fill="#2b2b35"/>
    <circle cx="-8" cy="-20" r="1.3" fill="#fff"/><circle cx="10" cy="-20" r="1.3" fill="#fff"/>
    <path d="M-7 -8 Q0 0 7 -8" stroke="#2b2b35" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M-22 -2 L-44 -24" stroke="#2b2b35" stroke-width="3" stroke-linecap="round"/>
    <path d="M22 -2 L40 8" stroke="#2b2b35" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-10" cy="60" rx="9" ry="5" fill="#2b2b35"/><ellipse cx="10" cy="60" rx="9" ry="5" fill="#2b2b35"/>
  </g>
  <!-- finished picture card -->
  <g transform="translate(70 230) rotate(-8)" filter="url(#sh)">
    <rect x="-6" y="-6" width="84" height="84" rx="10" fill="#ffc94d"/>
    <rect x="0" y="0" width="72" height="72" fill="#fff"/>
    <g transform="translate(6 6) scale(0.5)">
      <rect x="24" y="0" width="24" height="24" fill="#e8453c"/><rect x="72" y="0" width="24" height="24" fill="#e8453c"/>
      <rect x="0" y="24" width="120" height="24" fill="#e8453c"/>
      <rect x="0" y="48" width="120" height="24" fill="#e8453c"/>
      <rect x="24" y="72" width="72" height="24" fill="#e8453c"/>
      <rect x="48" y="96" width="24" height="24" fill="#e8453c"/>
      <rect x="24" y="24" width="24" height="24" fill="#ff9a8c"/>
    </g>
  </g>

  <!-- title -->
  <g font-family="'Fredoka', 'Arial Rounded MT Bold', 'Trebuchet MS', Arial, sans-serif" font-weight="900" font-size="64" text-anchor="middle">
    <text x="320" y="74" textLength="470" lengthAdjust="spacingAndGlyphs" fill="#2e245a" opacity="0.25" transform="translate(0 5)">Picture Cross</text>
    <text x="320" y="74" textLength="470" lengthAdjust="spacingAndGlyphs" fill="none" stroke="#fff" stroke-width="12" stroke-linejoin="round">Picture Cross</text>
    <text x="320" y="74" textLength="470" lengthAdjust="spacingAndGlyphs"><tspan fill="#ff6f91">Pi</tspan><tspan fill="#ff8a3d">ct</tspan><tspan fill="#e0a200">ur</tspan><tspan fill="#4cbf4a">e </tspan><tspan fill="#3a86e8">Cr</tspan><tspan fill="#9b5de5">oss</tspan></text>
  </g>
</svg>
