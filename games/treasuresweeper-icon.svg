<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Treasure Sweeper icon: an open treasure chest on a sand tile with a little flag -->
  <defs>
    <radialGradient id="bg" cx="35%" cy="25%" r="80%">
      <stop offset="0" stop-color="#5ed8ea"/>
      <stop offset="1" stop-color="#0f7fae"/>
    </radialGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbd889"/>
      <stop offset="1" stop-color="#e0a94f"/>
    </linearGradient>
    <linearGradient id="chest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b0682e"/>
      <stop offset="1" stop-color="#7a3e14"/>
    </linearGradient>
    <radialGradient id="coin" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fff3a3"/>
      <stop offset="0.6" stop-color="#ffc93d"/>
      <stop offset="1" stop-color="#c48a00"/>
    </radialGradient>
  </defs>
  <rect x="3" y="3" width="94" height="94" rx="22" fill="url(#bg)"/>
  <ellipse cx="50" cy="70" rx="40" ry="20" fill="#ffe9b0"/>
  <ellipse cx="50" cy="68" rx="34" ry="15" fill="url(#sand)"/>
  <!-- flag -->
  <path d="M74 64 V30" stroke="#6b3f1f" stroke-width="3" stroke-linecap="round"/>
  <path d="M74 30 Q82 28 91 32 L91 44 Q82 41 74 44 Z" fill="#e8453c" stroke="#9b1f19" stroke-width="1"/>
  <circle cx="82" cy="37" r="2.6" fill="#fff"/>
  <!-- chest -->
  <path d="M24 44 Q44 22 64 40 L62 50 L26 52 Z" fill="#9a5a26" stroke="#4a2208" stroke-width="2.4" transform="rotate(-12 26 52)"/>
  <ellipse cx="45" cy="52" rx="19" ry="5" fill="#ffd84a"/>
  <circle cx="36" cy="49" r="5" fill="url(#coin)" stroke="#8a5a00"/>
  <circle cx="46" cy="47" r="5" fill="url(#coin)" stroke="#8a5a00"/>
  <circle cx="55" cy="49" r="5" fill="url(#coin)" stroke="#8a5a00"/>
  <rect x="25" y="52" width="40" height="24" rx="4" fill="url(#chest)" stroke="#4a2208" stroke-width="2.4"/>
  <rect x="29" y="52" width="4" height="24" fill="#ffc93d"/><rect x="57" y="52" width="4" height="24" fill="#ffc93d"/>
  <rect x="41.5" y="55" width="7" height="8" rx="1.5" fill="#ffc93d" stroke="#8a5a00" stroke-width="1.2"/>
  <path d="M22 30 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 z" fill="#fff6c8"/>
  <rect x="3" y="3" width="94" height="94" rx="22" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="2.5"/>
</svg>
