<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Shadow Heist icon: an orange cat burglar face with a black domino mask, on a night-purple badge -->
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#5a4a9a"/>
      <stop offset="1" stop-color="#1b1638"/>
    </radialGradient>
    <radialGradient id="fur" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffbd80"/>
      <stop offset="1" stop-color="#e8823a"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
  <!-- ears -->
  <path d="M18 50 L20 12 L44 32 Z" fill="#f0954a"/>
  <path d="M82 50 L80 12 L56 32 Z" fill="#f0954a"/>
  <path d="M24 42 L25 22 L38 33 Z" fill="#ff9fb0"/>
  <path d="M76 42 L75 22 L62 33 Z" fill="#ff9fb0"/>
  <!-- head -->
  <ellipse cx="50" cy="58" rx="36" ry="31" fill="url(#fur)"/>
  <path d="M47 28 h6 v10 h-6 Z" fill="#c96a2a"/>
  <ellipse cx="50" cy="74" rx="19" ry="12" fill="#ffe2c4"/>
  <!-- mask -->
  <path d="M12 54 Q50 36 88 54 L85 68 Q50 58 15 68 Z" fill="#141320"/>
  <circle cx="34" cy="57" r="8" fill="#fff"/>
  <circle cx="66" cy="57" r="8" fill="#fff"/>
  <circle cx="36" cy="58" r="5" fill="#141320"/>
  <circle cx="68" cy="58" r="5" fill="#141320"/>
  <circle cx="37.5" cy="56" r="1.8" fill="#fff"/>
  <circle cx="69.5" cy="56" r="1.8" fill="#fff"/>
  <!-- nose + smile -->
  <path d="M45 69 h10 l-5 5 Z" fill="#ff6f8a"/>
  <path d="M42 79 Q46 83 50 77 Q54 83 58 79" stroke="#6a3a1a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <!-- sparkle -->
  <path d="M84 16 q0 8 8 8 q-8 0 -8 8 q0 -8 -8 -8 q8 0 8 -8z" fill="#ffd84a"/>
  <circle cx="50" cy="50" r="47" fill="none" stroke="#ffc94a" stroke-opacity="0.8" stroke-width="2.5"/>
</svg>
