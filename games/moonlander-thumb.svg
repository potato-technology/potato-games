<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Moon Lander game card: a little lander coming down onto a landing pad, an astronaut waving, crystals glowing -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02030f"/>
      <stop offset="0.6" stop-color="#0d1638"/>
      <stop offset="1" stop-color="#1e2a5c"/>
    </linearGradient>
    <radialGradient id="earth" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#8fd4ff"/>
      <stop offset="1" stop-color="#1a5aa8"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4d7e0"/>
      <stop offset="0.35" stop-color="#9a9eac"/>
      <stop offset="1" stop-color="#555a68"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#363c58"/>
      <stop offset="1" stop-color="#232842"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.35" stop-color="#ffc83a"/>
      <stop offset="1" stop-color="#ff5a14" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c0d0"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9821c"/>
      <stop offset="0.45" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#b07a16"/>
    </linearGradient>
    <radialGradient id="glass" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#5fd4ff"/>
      <stop offset="1" stop-color="#1a6a9a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8af0ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#8af0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#e09a20"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="40" cy="30" r="1.2"/><circle cx="90" cy="80" r="1"/><circle cx="150" cy="22" r="1.6"/><circle cx="210" cy="60" r="1"/><circle cx="270" cy="18" r="1.2"/><circle cx="330" cy="70" r="1"/><circle cx="380" cy="30" r="1.5"/><circle cx="430" cy="90" r="1"/><circle cx="600" cy="140" r="1.3"/><circle cx="560" cy="200" r="1"/><circle cx="24" cy="140" r="1"/><circle cx="120" cy="150" r="1.2"/><circle cx="250" cy="120" r="1"/><circle cx="470" cy="20" r="1"/><circle cx="610" cy="40" r="1.1"/>
  </g>
  <!-- earth -->
  <circle cx="545" cy="70" r="58" fill="#fff" opacity="0.06"/>
  <circle cx="545" cy="70" r="46" fill="url(#earth)"/>
  <path d="M520 50 q12 -14 24 -4 q8 10 -4 22 q-10 12 -20 2 q-8 -10 0 -20z" fill="#3fae5a"/>
  <path d="M556 82 q14 -6 20 6 q-4 12 -16 10 q-10 -4 -4 -16z" fill="#3fae5a"/>
  <g fill="#fff" opacity="0.8"><ellipse cx="530" cy="40" rx="18" ry="4"/><ellipse cx="560" cy="64" rx="16" ry="3.5"/><ellipse cx="535" cy="100" rx="14" ry="3"/></g>
  <circle cx="568" cy="88" r="48" fill="#000018" opacity="0.4"/>

  <!-- far hills -->
  <path d="M0 230 L60 200 L130 214 L210 186 L290 208 L380 190 L460 212 L540 196 L640 214 L640 360 L0 360 Z" fill="url(#far)"/>

  <!-- ground -->
  <path d="M0 262 Q70 248 140 258 T280 252 L300 256 L430 256 Q500 250 560 262 T640 258 L640 360 L0 360 Z" fill="url(#ground)"/>
  <path d="M0 262 Q70 248 140 258 T280 252 L300 256 L430 256 Q500 250 560 262 T640 258" fill="none" stroke="#f4f5fa" stroke-width="3"/>
  <g fill="#000" opacity="0.15">
    <ellipse cx="90" cy="300" rx="34" ry="8"/><ellipse cx="520" cy="310" rx="40" ry="9"/><ellipse cx="240" cy="330" rx="26" ry="6"/>
  </g>
  <g fill="#fff" opacity="0.12">
    <ellipse cx="90" cy="303" rx="28" ry="4"/><ellipse cx="520" cy="314" rx="32" ry="4"/>
  </g>
  <g fill="#7a7f8e">
    <ellipse cx="180" cy="262" rx="8" ry="6"/><ellipse cx="470" cy="258" rx="6" ry="4.5"/><ellipse cx="600" cy="262" rx="9" ry="6"/>
  </g>

  <!-- landing pad -->
  <rect x="314" y="256" width="6" height="16" fill="#4a5068"/>
  <rect x="404" y="256" width="6" height="16" fill="#4a5068"/>
  <rect x="300" y="248" width="124" height="10" rx="3" fill="#cfd4e2"/>
  <g fill="#2fd07a">
    <path d="M300 258 l8 -10 h8 l-8 10z"/><path d="M324 258 l8 -10 h8 l-8 10z"/><path d="M348 258 l8 -10 h8 l-8 10z"/><path d="M372 258 l8 -10 h8 l-8 10z"/><path d="M396 258 l8 -10 h8 l-8 10z"/>
  </g>
  <circle cx="304" cy="243" r="4" fill="#3ee08f"/><circle cx="304" cy="243" r="10" fill="#3ee08f" opacity="0.25"/>
  <circle cx="420" cy="243" r="4" fill="#3ee08f"/><circle cx="420" cy="243" r="10" fill="#3ee08f" opacity="0.25"/>
  <!-- beacon and flag -->
  <rect x="436" y="186" width="4" height="70" fill="#5a6080"/>
  <path d="M440 188 q12 4 26 8 l-26 12z" fill="#2fd07a"/>
  <circle cx="438" cy="182" r="10" fill="#50ffa0" opacity="0.35"/>
  <circle cx="438" cy="182" r="4" fill="#b6ffd6"/>
  <!-- dust kicked up -->
  <g fill="#e6e8ef" opacity="0.55">
    <ellipse cx="330" cy="244" rx="16" ry="6"/><ellipse cx="392" cy="244" rx="16" ry="6"/><ellipse cx="312" cy="248" rx="10" ry="4"/><ellipse cx="412" cy="248" rx="10" ry="4"/>
  </g>

  <!-- lander -->
  <g transform="translate(362 168) rotate(-6)">
    <path d="M-9 26 Q0 74 9 26 Z" fill="url(#flame)"/>
    <circle cx="0" cy="28" r="12" fill="#fff3b0" opacity="0.35"/>
    <g stroke="#9aa3b8" stroke-width="3.5" stroke-linecap="round">
      <path d="M-12 8 L-21 30 M12 8 L21 30 M-9 14 L-21 30 M9 14 L21 30"/>
    </g>
    <rect x="-27" y="28" width="12" height="4" rx="2" fill="#9aa3b8"/>
    <rect x="15" y="28" width="12" height="4" rx="2" fill="#9aa3b8"/>
    <path d="M-8 14 H8 L11 24 H-11 Z" fill="#5a6078"/>
    <rect x="-19" y="-3" width="38" height="17" rx="4" fill="url(#foil)"/>
    <path d="M-6 -3 V14 M6 -3 V14" stroke="#000" stroke-opacity="0.2" stroke-width="1.5"/>
    <path d="M-17 -2 V-15 Q-17 -32 0 -32 Q17 -32 17 -15 V-2 Z" fill="url(#hull)" stroke="#7a8296" stroke-width="1.5"/>
    <circle cx="0" cy="-16" r="8.5" fill="url(#glass)" stroke="#9aa3b8" stroke-width="2.5"/>
    <path d="M8 -29 L14 -41" stroke="#9aa3b8" stroke-width="2.2"/>
    <circle cx="14" cy="-42" r="3" fill="#ff5d6c"/>
    <rect x="-22" y="-15" width="5" height="8" fill="#9aa3b8"/>
    <rect x="17" y="-15" width="5" height="8" fill="#9aa3b8"/>
  </g>

  <!-- astronaut waving on a small pad -->
  <rect x="168" y="246" width="70" height="7" rx="3" fill="#cfd4e2"/>
  <g fill="#ffb020"><path d="M168 253 l6 -7 h6 l-6 7z"/><path d="M186 253 l6 -7 h6 l-6 7z"/><path d="M204 253 l6 -7 h6 l-6 7z"/><path d="M222 253 l6 -7 h6 l-6 7z"/></g>
  <g transform="translate(206 244)">
    <rect x="-7" y="-14" width="5" height="14" rx="2" fill="#e8ecf4"/>
    <rect x="2" y="-14" width="5" height="14" rx="2" fill="#e8ecf4"/>
    <rect x="-12" y="-33" width="8" height="16" rx="2" fill="#b8c0d0"/>
    <rect x="-8" y="-34" width="16" height="21" rx="6" fill="#f6f8fc"/>
    <rect x="-2" y="-29" width="5" height="4" fill="#ff5d6c"/>
    <path d="M7 -30 L16 -46" stroke="#f6f8fc" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="0" cy="-42" r="10" fill="#ffffff"/>
    <ellipse cx="2" cy="-42" rx="6.5" ry="5.2" fill="url(#visor)"/>
    <ellipse cx="0" cy="-44.5" rx="2.2" ry="1.2" fill="#fff" opacity="0.8"/>
  </g>
  <rect x="150" y="160" width="50" height="22" rx="10" fill="#fff"/>
  <path d="M180 182 l8 8 l2 -8z" fill="#fff"/>
  <text x="175" y="176" text-anchor="middle" font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" font-size="13" fill="#2a3a8a">Help!</text>

  <!-- crystals -->
  <g>
    <circle cx="120" cy="150" r="26" fill="url(#glow)"/>
    <path d="M120 135 l11 10 -5 18 h-12 l-5 -18z" fill="#5fd8ff"/>
    <path d="M120 135 l11 10 -11 4 -11 -4z" fill="#c8f6ff"/>
    <path d="M120 149 l6 14 h-12z" fill="#2aa0d8"/>
    <circle cx="470" cy="140" r="22" fill="url(#glow)"/>
    <path d="M470 128 l9 8 -4 15 h-10 l-4 -15z" fill="#5fd8ff"/>
    <path d="M470 128 l9 8 -9 3 -9 -3z" fill="#c8f6ff"/>
    <path d="M132 136 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#fff"/>
  </g>

  <!-- title -->
  <g font-family="Fredoka, 'Trebuchet MS', Arial Rounded MT Bold, sans-serif" font-weight="700" font-size="60" text-anchor="middle">
    <text x="320" y="340" fill="#0a0f2e" stroke="#0a0f2e" stroke-width="12" stroke-linejoin="round" opacity="0.85">Moon Lander</text>
    <text x="320" y="340"><tspan fill="#ffffff">Moon </tspan><tspan fill="#ffb020">Lander</tspan></text>
  </g>
</svg>
