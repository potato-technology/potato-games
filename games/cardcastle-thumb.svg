<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Card Castle game card: a fan of playing cards in front of a castle on green felt -->
  <defs>
    <radialGradient id="felt" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#3a9a5e"/>
      <stop offset="0.7" stop-color="#22703f"/>
      <stop offset="1" stop-color="#123d22"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1ece2"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a7ee0"/>
      <stop offset="1" stop-color="#1d4a94"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.55" stop-color="#ffcf4d"/>
      <stop offset="1" stop-color="#f29a1f"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e5ec"/>
      <stop offset="1" stop-color="#b4bac8"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#b8232f"/>
    </linearGradient>
    <pattern id="lat" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="url(#back)"/>
      <path d="M0 0 H10 M0 0 V10" stroke="#fff" stroke-opacity="0.28" stroke-width="1.4"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff6c8" stop-opacity="0"/>
    </radialGradient>
    <g id="heart"><path d="M0 7 C-12 -1 -6 -11 0 -4 C6 -11 12 -1 0 7 Z"/></g>
    <g id="spade"><path d="M0 -9 C-3 -5 -11 -2 -9 3 C-7.5 7 -2.5 6.5 -1 4 L-2.5 9 H2.5 L1 4 C2.5 6.5 7.5 7 9 3 C11 -2 3 -5 0 -9 Z"/></g>
    <g id="diamond"><path d="M0 -10 Q3 -4 8 0 Q3 4 0 10 Q-3 4 -8 0 Q-3 -4 0 -10 Z"/></g>
    <g id="club"><circle cx="0" cy="-4.5" r="4"/><circle cx="-4.5" cy="1.2" r="4"/><circle cx="4.5" cy="1.2" r="4"/><path d="M0 0 L-2.8 9.5 H2.8 Z"/></g>
  </defs>

  <rect width="640" height="360" fill="url(#felt)"/>
  <g opacity="0.07" fill="#000">
    <circle cx="80" cy="60" r="3"/><circle cx="560" cy="300" r="3"/><circle cx="600" cy="80" r="2"/><circle cx="40" cy="300" r="2"/>
  </g>

  <!-- the castle -->
  <ellipse cx="452" cy="300" rx="190" ry="38" fill="#0e3a1f" opacity="0.45"/>
  <circle cx="452" cy="130" r="120" fill="url(#glow)"/>
  <g stroke="#8a90a0" stroke-width="2">
    <rect x="352" y="170" width="200" height="120" fill="url(#stone)"/>
    <path d="M352 170 v-16 h20 v16 h20 v-16 h20 v16 h20 v-16 h20 v16 h20 v-16 h20 v16 h20 v-16 h20 v16 h20 v-16" fill="url(#stone)"/>
    <rect x="322" y="120" width="54" height="170" fill="url(#stone)"/>
    <rect x="528" y="120" width="54" height="170" fill="url(#stone)"/>
    <rect x="410" y="90" width="84" height="110" fill="url(#stone)"/>
  </g>
  <g stroke="#a0a6b4" stroke-width="1.5" opacity="0.8">
    <path d="M352 200 H552 M352 230 H552 M352 260 H552 M322 150 H376 M322 180 H376 M322 210 H376 M322 240 H376 M528 150 H582 M528 180 H582 M528 210 H582 M528 240 H582 M410 120 H494 M410 150 H494"/>
  </g>
  <path d="M316 122 L349 60 L382 122 Z" fill="url(#roof)" stroke="#7a1820" stroke-width="2"/>
  <path d="M522 122 L555 60 L588 122 Z" fill="url(#roof)" stroke="#7a1820" stroke-width="2"/>
  <path d="M402 92 L452 30 L502 92 Z" fill="url(#roof)" stroke="#7a1820" stroke-width="2"/>
  <g stroke="#4a3a2a" stroke-width="2.5"><line x1="349" y1="62" x2="349" y2="36"/><line x1="555" y1="62" x2="555" y2="36"/><line x1="452" y1="32" x2="452" y2="8"/></g>
  <path d="M349 36 l22 6 l-22 6 Z M555 36 l22 6 l-22 6 Z M452 8 l24 7 l-24 7 Z" fill="#ffcf4d"/>
  <path d="M430 290 v-46 a22 22 0 0 1 44 0 v46 Z" fill="#6b4425" stroke="#3a2410" stroke-width="2"/>
  <g fill="#ffe680"><path d="M344 172 v-12 a5 5 0 0 1 10 0 v12 Z M550 172 v-12 a5 5 0 0 1 10 0 v12 Z M432 140 v-12 a5 5 0 0 1 10 0 v12 Z M462 140 v-12 a5 5 0 0 1 10 0 v12 Z"/></g>

  <!-- fan of cards -->
  <g transform="translate(170 340)">
    <g transform="rotate(-26) translate(-42 -236)">
      <rect width="84" height="118" rx="8" fill="url(#lat)" stroke="#fff" stroke-width="5"/>
      <rect width="84" height="118" rx="8" fill="none" stroke="#b9b2a4" stroke-width="1"/>
    </g>
    <g transform="rotate(-13) translate(-42 -240)">
      <rect width="84" height="118" rx="8" fill="url(#face)" stroke="#b9b2a4" stroke-width="1.5"/>
      <text x="8" y="22" font-family="Fredoka, 'Trebuchet MS', Arial, sans-serif" font-weight="700" font-size="20" fill="#d6303c">Q</text>
      <use href="#diamond" transform="translate(15 34) scale(0.6)" fill="#d6303c"/>
      <use href="#diamond" transform="translate(42 66) scale(2.2)" fill="#d6303c"/>
    </g>
    <g transform="rotate(0) translate(-42 -242)">
      <rect width="84" height="118" rx="8" fill="url(#face)" stroke="#b9b2a4" stroke-width="1.5"/>
      <text x="8" y="22" font-family="Fredoka, 'Trebuchet MS', Arial, sans-serif" font-weight="700" font-size="20" fill="#1b2130">J</text>
      <use href="#club" transform="translate(13 34) scale(0.6)" fill="#1b2130"/>
      <use href="#club" transform="translate(42 66) scale(2.3)" fill="#1b2130"/>
    </g>
    <g transform="rotate(13) translate(-42 -240)">
      <rect width="84" height="118" rx="8" fill="url(#face)" stroke="#b9b2a4" stroke-width="1.5"/>
      <text x="8" y="22" font-family="Fredoka, 'Trebuchet MS', Arial, sans-serif" font-weight="700" font-size="20" fill="#d6303c">K</text>
      <use href="#heart" transform="translate(14 34) scale(0.65)" fill="#d6303c"/>
      <rect x="20" y="34" width="44" height="66" rx="4" fill="#ffe9e0" stroke="#c9a23a" stroke-width="2"/>
      <path d="M26 100 a16 18 0 0 1 32 0 Z" fill="#c8283a"/>
      <circle cx="42" cy="66" r="10" fill="#ffd9b8"/>
      <path d="M31 57 l1 -12 l5 6 l5 -9 l5 9 l5 -6 l1 12 Z" fill="#ffcf4d" stroke="#8a6410" stroke-width="1"/>
      <circle cx="38" cy="65" r="1.4" fill="#2a1a10"/><circle cx="46" cy="65" r="1.4" fill="#2a1a10"/>
      <path d="M38 70 q4 3 8 0" stroke="#7a2a1a" stroke-width="1.2" fill="none"/>
    </g>
    <g transform="rotate(26) translate(-42 -236)">
      <rect width="84" height="118" rx="8" fill="url(#face)" stroke="#b9b2a4" stroke-width="1.5"/>
      <text x="8" y="22" font-family="Fredoka, 'Trebuchet MS', Arial, sans-serif" font-weight="700" font-size="20" fill="#1b2130">A</text>
      <use href="#spade" transform="translate(14 34) scale(0.6)" fill="#1b2130"/>
      <circle cx="42" cy="62" r="24" fill="none" stroke="#1b2130" stroke-opacity="0.15" stroke-width="2"/>
      <use href="#spade" transform="translate(42 62) scale(2.6)" fill="#1b2130"/>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#fff6c8">
    <path d="M300 60 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3 Z"/>
    <path d="M612 150 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 Z"/>
    <path d="M40 140 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 Z"/>
  </g>

  <!-- title -->
  <g font-family="Fredoka, 'Trebuchet MS', Arial, sans-serif" font-weight="700" font-size="64" text-anchor="middle" stroke-linejoin="round">
    <text x="320" y="338" fill="#4a2a00" stroke="#4a2a00" stroke-width="14">CARD CASTLE</text>
    <text x="320" y="333" fill="#8a5a00" stroke="#8a5a00" stroke-width="9">CARD CASTLE</text>
    <text x="320" y="331" fill="url(#title)">CARD CASTLE</text>
  </g>
</svg>
