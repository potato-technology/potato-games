<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Star Blaster icon: a blue star fighter blasting upward through a purple nebula -->
  <defs>
    <radialGradient id="bg" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#5a3ad0"/>
      <stop offset="0.55" stop-color="#1e1460"/>
      <stop offset="1" stop-color="#080a28"/>
    </radialGradient>
    <radialGradient id="neb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff3fc8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff3fc8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#6ad7ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#6ad7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#6ad7ff"/>
      <stop offset="1" stop-color="#6ad7ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wingL" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#6aa8ff"/>
      <stop offset="1" stop-color="#1d3a8a"/>
    </linearGradient>
    <linearGradient id="wingR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f2ff"/>
      <stop offset="0.45" stop-color="#4a88e8"/>
      <stop offset="1" stop-color="#14306a"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d3a8a"/>
      <stop offset="0.3" stop-color="#6aa8ff"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#6aa8ff"/>
      <stop offset="1" stop-color="#1d3a8a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fdff"/>
      <stop offset="0.35" stop-color="#6ad7ff"/>
      <stop offset="1" stop-color="#0a1f4a"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="50" cy="50" r="48"/></clipPath>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
  <g clip-path="url(#disc)">
    <circle cx="74" cy="28" r="30" fill="url(#neb)"/>
    <g fill="#fff">
      <circle cx="20" cy="24" r="1.6"/><circle cx="80" cy="62" r="1.3"/><circle cx="30" cy="70" r="1.1"/><circle cx="70" cy="14" r="1.2"/>
      <path d="M22 40 q0 5 5 5 q-5 0 -5 5 q0 -5 -5 -5 q5 0 5 -5z"/>
      <path d="M80 36 q0 4 4 4 q-4 0 -4 4 q0 -4 -4 -4 q4 0 4 -4z" opacity="0.85"/>
    </g>
    <!-- bolts -->
    <g stroke-linecap="round">
      <path d="M38 22 L38 8" stroke="#7dffb0" stroke-width="5" opacity="0.5"/>
      <path d="M62 22 L62 8" stroke="#7dffb0" stroke-width="5" opacity="0.5"/>
      <path d="M38 22 L38 8" stroke="#fff" stroke-width="2.2"/>
      <path d="M62 22 L62 8" stroke="#fff" stroke-width="2.2"/>
    </g>
    <!-- engine glow -->
    <ellipse cx="50" cy="84" rx="13" ry="15" fill="url(#flameGlow)"/>
    <path d="M41 75 Q44 97 47 75 Z" fill="url(#flame)"/>
    <path d="M53 75 Q56 97 59 75 Z" fill="url(#flame)"/>
  </g>
  <!-- ship -->
  <g transform="translate(50 50) scale(1.2)">
    <path d="M-2 -8 L-25 11 L-28 22 L-9 18 L-3 14 Z" fill="url(#wingL)"/>
    <path d="M2 -8 L25 11 L28 22 L9 18 L3 14 Z" fill="url(#wingR)"/>
    <path d="M-15 7 L-23 13 L-24 17 L-14 12 Z" fill="#ff5a6a"/>
    <path d="M15 7 L23 13 L24 17 L14 12 Z" fill="#ff5a6a"/>
    <path d="M0 -31 C6 -24 9 -8 9 6 L7 22 L-7 22 L-9 6 C-9 -8 -6 -24 0 -31 Z" fill="url(#hull)"/>
    <path d="M0 -31 L3.5 -24 L-3.5 -24 Z" fill="#ff5a6a"/>
    <ellipse cx="0" cy="-10" rx="4.6" ry="8.5" fill="url(#glass)"/>
    <ellipse cx="-1.5" cy="-13" rx="1.4" ry="3.5" fill="#fff" opacity="0.85"/>
  </g>
  <circle cx="50" cy="50" r="47" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="2.5"/>
</svg>
