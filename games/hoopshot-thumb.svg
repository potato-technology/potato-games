<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Hoop Shot game card: a flaming basketball arcs into a glass-backboard hoop in a packed, spotlit arena with glossy hardwood and a "+3 SWISH!" pop -->
  <defs>
    <linearGradient id="arena" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="1" stop-color="#1b2348"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98f4e"/>
      <stop offset="0.35" stop-color="#e5b375"/>
      <stop offset="1" stop-color="#d49c5a"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4fb0"/>
      <stop offset="1" stop-color="#173c8c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff1ff" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#a8d0ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#dff1ff" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f0ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e8f0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a5c94"/>
      <stop offset="1" stop-color="#1d2647"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="reflO" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a2a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="reflB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ad7ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7ad7ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffb070"/>
      <stop offset="0.45" stop-color="#ee7420"/>
      <stop offset="1" stop-color="#9a3a08"/>
    </radialGradient>
    <radialGradient id="fireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#ff7a1a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff3a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset="0.35" stop-color="#ffb52a"/>
      <stop offset="0.75" stop-color="#ff5a14" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff2a00" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff8e0" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#ffe7b0" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffe7b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2140"/>
      <stop offset="1" stop-color="#0b0e1e"/>
    </linearGradient>
    <!-- crowd: little fans in rows -->
    <pattern id="crowdA" width="26" height="24" patternUnits="userSpaceOnUse">
      <rect x="3" y="12" width="9" height="12" rx="3" fill="#ff8a2a"/>
      <circle cx="7.5" cy="9" r="3.6" fill="#f1c39a"/>
      <path d="M3.9 8.6 a3.7 3.7 0 0 1 7.2 0z" fill="#3a2414"/>
      <rect x="16" y="13" width="9" height="11" rx="3" fill="#2b4fb8"/>
      <circle cx="20.5" cy="10" r="3.6" fill="#b5774a"/>
      <path d="M16.9 9.6 a3.7 3.7 0 0 1 7.2 0z" fill="#1a1a1a"/>
    </pattern>
    <pattern id="crowdB" width="26" height="24" patternUnits="userSpaceOnUse" x="13" y="0">
      <rect x="3" y="13" width="9" height="11" rx="3" fill="#f2f2f2"/>
      <circle cx="7.5" cy="10" r="3.6" fill="#ffd9b8"/>
      <path d="M3.9 9.6 a3.7 3.7 0 0 1 7.2 0z" fill="#c9a050"/>
      <rect x="16" y="12" width="9" height="12" rx="3" fill="#e2453c"/>
      <circle cx="20.5" cy="9" r="3.6" fill="#8a5432"/>
      <path d="M16.9 8.6 a3.7 3.7 0 0 1 7.2 0z" fill="#2a1a10"/>
      <path d="M17 11 L13.5 2 M24 11 L27 2" stroke="#e2453c" stroke-width="2.4" stroke-linecap="round"/>
    </pattern>
    <pattern id="crowdC" width="26" height="24" patternUnits="userSpaceOnUse" x="6" y="0">
      <rect x="3" y="12" width="9" height="12" rx="3" fill="#2fb8a8"/>
      <circle cx="7.5" cy="9" r="3.6" fill="#d9a273"/>
      <rect x="16" y="13" width="9" height="11" rx="3" fill="#ffd23f"/>
      <circle cx="20.5" cy="10" r="3.6" fill="#f1c39a"/>
      <path d="M16.9 9.6 a3.7 3.7 0 0 1 7.2 0z" fill="#8a3a1a"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="ballClip"><circle cx="0" cy="0" r="27"/></clipPath>
  </defs>

  <!-- arena and stands -->
  <rect width="640" height="360" fill="url(#arena)"/>
  <rect x="0" y="6" width="640" height="34" fill="url(#crowdC)" opacity="0.55"/>
  <rect x="0" y="34" width="640" height="28" fill="#141b38"/>
  <rect x="0" y="36" width="640" height="26" fill="url(#crowdB)" opacity="0.75"/>
  <rect x="0" y="60" width="640" height="30" fill="#171f40"/>
  <rect x="0" y="62" width="640" height="28" fill="url(#crowdA)" opacity="0.85"/>
  <rect x="0" y="88" width="640" height="32" fill="#1a2244"/>
  <rect x="0" y="90" width="640" height="30" fill="url(#crowdB)"/>
  <rect x="0" y="118" width="640" height="34" fill="#1d2650"/>
  <rect x="0" y="120" width="640" height="32" fill="url(#crowdA)"/>
  <rect x="0" y="150" width="640" height="36" fill="#212b58"/>
  <rect x="0" y="152" width="640" height="34" fill="url(#crowdC)"/>
  <!-- camera flashes -->
  <g fill="#ffffff">
    <path d="M96 70 q0 5 5 5 q-5 0 -5 5 q0 -5 -5 -5 q5 0 5 -5z"/>
    <path d="M262 104 q0 4 4 4 q-4 0 -4 4 q0 -4 -4 -4 q4 0 4 -4z"/>
    <path d="M590 60 q0 5 5 5 q-5 0 -5 5 q0 -5 -5 -5 q5 0 5 -5z"/>
    <path d="M340 40 q0 3 3 3 q-3 0 -3 3 q0 -3 -3 -3 q3 0 3 -3z"/>
  </g>
  <!-- ceiling lights -->
  <circle cx="120" cy="0" r="70" fill="url(#lamp)"/>
  <circle cx="330" cy="0" r="70" fill="url(#lamp)"/>
  <circle cx="540" cy="0" r="70" fill="url(#lamp)"/>

  <!-- LED ad boards -->
  <rect x="0" y="186" width="640" height="30" fill="#080b18"/>
  <rect x="4" y="189" width="200" height="24" fill="#131a3e"/>
  <rect x="210" y="189" width="210" height="24" fill="#131a3e"/>
  <rect x="426" y="189" width="210" height="24" fill="#131a3e"/>
  <g font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" font-size="15" text-anchor="middle" filter="url(#glow)">
    <text x="104" y="206" fill="#ff8a2a">HOOP SHOT</text>
    <text x="315" y="206" fill="#7ad7ff">NOTHING BUT NET</text>
    <text x="531" y="206" fill="#ff5e5e">★ FIRE IT UP ★</text>
  </g>

  <!-- glossy hardwood -->
  <rect x="0" y="216" width="640" height="144" fill="url(#wood)"/>
  <g stroke="#8a5420" stroke-opacity="0.22" stroke-width="0.8">
    <path d="M0 222H640M0 229H640M0 237H640M0 246H640M0 256H640M0 267H640M0 279H640M0 292H640M0 306H640M0 321H640M0 337H640M0 354H640"/>
    <path d="M60 222V229M210 229V237M400 237V246M120 246V256M520 256V267M300 267V279M30 279V292M450 292V306M170 306V321M580 321V337M260 337V354"/>
  </g>
  <!-- ad board reflections -->
  <rect x="8" y="216" width="192" height="40" fill="url(#reflO)"/>
  <rect x="214" y="216" width="202" height="40" fill="url(#reflB)"/>
  <rect x="430" y="216" width="202" height="40" fill="url(#reflO)" opacity="0.7"/>
  <!-- painted lane and lines -->
  <path d="M330 360 L372 262 L640 262 L640 360 Z" fill="url(#lane)"/>
  <path d="M372 262 L640 262" stroke="#ff8a2a" stroke-width="3"/>
  <g fill="none" stroke="#ffffff" stroke-width="3.5" stroke-opacity="0.95">
    <path d="M330 360 L372 262"/>
    <path d="M0 230 L640 230"/>
    <path d="M150 360 C 160 300, 330 246, 640 244"/>
    <path d="M372 262 C 300 266, 268 300, 300 330" stroke-dasharray="7 7"/>
  </g>
  <ellipse cx="160" cy="262" rx="78" ry="15" fill="#1f4fb0" opacity="0.85"/>
  <ellipse cx="160" cy="262" rx="78" ry="15" fill="none" stroke="#ff8a2a" stroke-width="3"/>
  <text x="160" y="268" font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" font-size="17" fill="#ffffff" text-anchor="middle" transform="translate(160 266) scale(1 0.6) translate(-160 -266)">HOOP SHOT</text>
  <rect x="0" y="216" width="640" height="144" fill="url(#sheen)"/>
  <!-- light reflections on the floor -->
  <ellipse cx="120" cy="300" rx="14" ry="70" fill="#fff6e0" opacity="0.08"/>
  <ellipse cx="330" cy="300" rx="14" ry="70" fill="#fff6e0" opacity="0.08"/>

  <!-- spotlight beams -->
  <path d="M320 0 L250 340 L360 340 L334 0 Z" fill="url(#beam)"/>
  <path d="M540 0 L470 340 L600 340 L552 0 Z" fill="url(#beam)" opacity="0.8"/>

  <!-- hoop stanchion -->
  <rect x="600" y="70" width="14" height="230" fill="url(#pole)"/>
  <path d="M600 300 L592 290 L640 290 L640 340 L600 340 Z" fill="#1a3f92"/>
  <path d="M560 86 L604 80" stroke="#1d2647" stroke-width="10"/>
  <path d="M560 86 L604 80" stroke="#4a5c94" stroke-width="5"/>
  <path d="M560 120 L604 110" stroke="#1d2647" stroke-width="5"/>
  <ellipse cx="520" cy="314" rx="80" ry="10" fill="#000" opacity="0.12"/>

  <!-- glass backboard -->
  <path d="M498 30 L568 18 L568 132 L498 140 Z" fill="#a8c6e8" opacity="0.5" transform="translate(4 0)"/>
  <path d="M498 30 L568 18 L568 132 L498 140 Z" fill="url(#glass)"/>
  <path d="M506 34 L520 32 L512 136 L500 138 Z" fill="#ffffff" opacity="0.22"/>
  <path d="M498 30 L568 18 L568 132 L498 140 Z" fill="none" stroke="#141a30" stroke-width="7" stroke-linejoin="round"/>
  <path d="M498 30 L568 18 L568 132 L498 140 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  <path d="M515 80 L548 75 L548 120 L515 124 Z" fill="none" stroke="#ff8a2a" stroke-width="3.5"/>
  <path d="M498 140 L568 132" stroke="#1f4fb0" stroke-width="6"/>
  <!-- rim bracket -->
  <path d="M500 132 L524 124" stroke="#5a1a08" stroke-width="7"/>

  <!-- back rim and back net -->
  <path d="M424 132 A44 9 0 0 1 512 132" fill="none" stroke="#7a1e06" stroke-width="6"/>
  <path d="M424 132 A44 9 0 0 1 512 132" fill="none" stroke="#ff5a1f" stroke-width="3.5"/>
  <g stroke="#c3c9da" stroke-width="1.6" stroke-opacity="0.7" fill="none">
    <path d="M436 126 L446 150 L452 172 L458 194"/>
    <path d="M458 123 L462 150 L466 172 L468 194"/>
    <path d="M480 123 L476 150 L474 172 L474 194"/>
    <path d="M500 126 L490 150 L482 172 L480 194"/>
  </g>

  <!-- shot arc -->
  <path d="M70 320 Q 230 -110 452 112" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 13" opacity="0.75"/>

  <!-- the flaming ball -->
  <circle cx="452" cy="104" r="62" fill="url(#fireGlow)"/>
  <path d="M470 86 C 430 70, 392 60, 340 30 C 380 62, 360 66, 330 70 C 380 84, 372 96, 350 112 C 400 112, 424 126, 440 132 Z" fill="url(#flame)"/>
  <path d="M466 92 C 440 84, 420 78, 392 64 C 414 84, 406 90, 392 98 C 420 104, 432 112, 444 124 Z" fill="#fff1a8" opacity="0.7"/>
  <g transform="translate(452 104) rotate(-24)">
    <circle cx="0" cy="0" r="27" fill="url(#ball)"/>
    <g clip-path="url(#ballClip)" stroke="#2a1306" stroke-width="2.6" fill="none" stroke-linecap="round">
      <path d="M0 -27 V27 M-27 0 H27"/>
      <path d="M-17 -22 Q -1 0 -17 22"/>
      <path d="M17 -22 Q 1 0 17 22"/>
    </g>
  </g>
  <ellipse cx="442" cy="92" rx="8" ry="4.5" fill="#ffffff" opacity="0.55" transform="rotate(-35 442 92)"/>

  <!-- front net and front rim -->
  <g stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path d="M424 134 L440 158 L452 182 L458 198"/>
    <path d="M440 140 L452 158 L460 182 L464 200"/>
    <path d="M460 142 L466 160 L468 182 L470 200"/>
    <path d="M482 142 L476 160 L474 182 L474 200"/>
    <path d="M500 139 L486 160 L480 182 L478 198"/>
    <path d="M512 134 L496 156 L484 180 L480 196"/>
    <path d="M424 134 L452 158 L468 182"/>
    <path d="M440 140 L466 160 L474 182 L480 196"/>
    <path d="M460 142 L476 160"/>
    <path d="M512 134 L486 160 L468 182 L458 198"/>
    <path d="M500 139 L466 160 L452 182"/>
    <path d="M482 142 L452 158 L460 182"/>
    <path d="M440 158 L496 156 M452 182 L484 180"/>
  </g>
  <path d="M424 132 A44 9 0 0 0 512 132" fill="none" stroke="#7a1e06" stroke-width="7"/>
  <path d="M424 132 A44 9 0 0 0 512 132" fill="none" stroke="#ff5a1f" stroke-width="4.5"/>
  <path d="M427 131 A42 8 0 0 0 509 131" fill="none" stroke="#ffd2b8" stroke-width="1.4" opacity="0.8"/>

  <!-- sparkles and confetti -->
  <g fill="#ffffff">
    <path d="M396 150 q0 7 7 7 q-7 0 -7 7 q0 -7 -7 -7 q7 0 7 -7z"/>
    <path d="M532 168 q0 6 6 6 q-6 0 -6 6 q0 -6 -6 -6 q6 0 6 -6z"/>
  </g>
  <g fill="#ffd23f">
    <path d="M420 182 q0 5 5 5 q-5 0 -5 5 q0 -5 -5 -5 q5 0 5 -5z"/>
    <path d="M552 60 q0 5 5 5 q-5 0 -5 5 q0 -5 -5 -5 q5 0 5 -5z"/>
  </g>
  <rect x="250" y="60" width="8" height="4" fill="#4fd88a" transform="rotate(30 254 62)"/>
  <rect x="300" y="120" width="8" height="4" fill="#ff5e8a" transform="rotate(-20 304 122)"/>
  <rect x="590" y="140" width="8" height="4" fill="#7ad7ff" transform="rotate(50 594 142)"/>
  <rect x="380" y="200" width="8" height="4" fill="#ffd23f" transform="rotate(10 384 202)"/>
  <rect x="200" y="160" width="8" height="4" fill="#ff8a2a" transform="rotate(-40 204 162)"/>

  <!-- +3 SWISH! -->
  <g font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" text-anchor="middle" transform="rotate(-6 330 74)">
    <text x="330" y="86" font-size="40" fill="none" stroke="#0a0c1e" stroke-width="9" stroke-linejoin="round">+3 SWISH!</text>
    <text x="330" y="86" font-size="40" fill="#7ad7ff">+3 SWISH!</text>
  </g>

  <!-- scoreboard -->
  <rect x="34" y="16" width="168" height="48" rx="11" fill="url(#board)" stroke="#ff8a2a" stroke-width="2"/>
  <g font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" text-anchor="middle">
    <text x="78" y="29" font-size="8" fill="#c8d0f0" opacity="0.8">SCORE</text>
    <text x="78" y="55" font-size="23" fill="#ffb347" filter="url(#glow)">098</text>
    <text x="156" y="29" font-size="8" fill="#c8d0f0" opacity="0.8">TIME</text>
    <text x="156" y="55" font-size="23" fill="#ff4d4d" filter="url(#glow)">0:12</text>
  </g>
  <!-- logo badge -->
  <g>
    <rect x="16" y="296" width="190" height="50" rx="14" fill="#1d2340" stroke="#ff8a2a" stroke-width="3"/>
    <text x="111" y="332" text-anchor="middle" font-family="'Trebuchet MS', 'Arial Black', Arial, sans-serif" font-weight="900" font-size="30" fill="#7a2e00">HOOP SHOT</text>
    <text x="111" y="329" text-anchor="middle" font-family="'Trebuchet MS', 'Arial Black', Arial, sans-serif" font-weight="900" font-size="30" fill="#ff9a3a">HOOP SHOT</text>
  </g>
</svg>
