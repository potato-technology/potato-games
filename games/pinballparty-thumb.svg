<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Pinball Party game card: a glowing neon pinball table with pop bumpers, a ramp, flippers and a shiny ball mid-flight, plus three themed table badges (pirate, space, candy) -->
  <defs>
    <radialGradient id="bg" cx="60%" cy="40%" r="80%">
      <stop offset="0" stop-color="#3a1f6a"/>
      <stop offset="1" stop-color="#0c0620"/>
    </radialGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1450"/>
      <stop offset="1" stop-color="#07051c"/>
    </linearGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c8d0e0"/>
      <stop offset="1" stop-color="#3a4058"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5fae" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff5fae" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#59e3ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#59e3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p1" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#9be7ff"/><stop offset="1" stop-color="#2a5ab8"/></radialGradient>
    <radialGradient id="p2" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#ffb07a"/><stop offset="1" stop-color="#a0402a"/></radialGradient>
    <radialGradient id="p3" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#ff7ac0"/><stop offset="1" stop-color="#8a1a5a"/></radialGradient>
    <linearGradient id="flip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b9c0d8"/></linearGradient>
    <linearGradient id="title1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffd0ea"/></linearGradient>
    <linearGradient id="title2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8fdff"/><stop offset="1" stop-color="#7ae8ff"/></linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- light beams -->
  <path d="M120 0 L200 0 L330 360 L180 360z" fill="#ff5fae" opacity="0.06"/>
  <path d="M470 0 L540 0 L420 360 L300 360z" fill="#59e3ff" opacity="0.06"/>
  <!-- table (slight perspective) -->
  <g transform="translate(40 8)">
    <path d="M20 352 L48 120 Q60 22 160 14 Q260 22 272 120 L300 352z" fill="#0a0614"/>
    <path d="M32 352 L58 124 Q70 34 160 26 Q250 34 262 124 L288 352z" fill="url(#field)"/>
    <!-- stars on the playfield -->
    <g fill="#ffffff" opacity="0.7">
      <circle cx="90" cy="90" r="1.2"/><circle cx="210" cy="70" r="1.5"/><circle cx="240" cy="170" r="1"/><circle cx="80" cy="200" r="1.3"/><circle cx="150" cy="250" r="1"/><circle cx="230" cy="280" r="1.2"/><circle cx="120" cy="150" r="1"/>
    </g>
    <!-- neon rail -->
    <path d="M32 352 L58 124 Q70 34 160 26 Q250 34 262 124 L288 352" fill="none" stroke="#ff5fae" stroke-width="5" filter="url(#neon)"/>
    <!-- ramp -->
    <path d="M220 230 L222 120 Q216 70 170 62 Q110 60 92 100 L84 230" fill="none" stroke="#59e3ff" stroke-opacity="0.35" stroke-width="22" stroke-linecap="round"/>
    <path d="M220 230 L222 120 Q216 70 170 62 Q110 60 92 100 L84 230" fill="none" stroke="#59e3ff" stroke-width="2.5" filter="url(#neon)"/>
    <!-- bumpers -->
    <circle cx="125" cy="128" r="40" fill="url(#glowPink)"/>
    <circle cx="125" cy="128" r="20" fill="url(#p3)"/>
    <ellipse cx="125" cy="128" rx="30" ry="8" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="2" transform="rotate(-20 125 128)"/>
    <circle cx="190" cy="118" r="18" fill="url(#p1)"/>
    <ellipse cx="190" cy="118" rx="27" ry="7" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="2" transform="rotate(-20 190 118)"/>
    <circle cx="160" cy="176" r="19" fill="url(#p2)"/>
    <ellipse cx="160" cy="176" rx="28" ry="7" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="2" transform="rotate(-20 160 176)"/>
    <!-- lights -->
    <g>
      <circle cx="110" cy="240" r="5" fill="#ffd43b" filter="url(#neon)"/><circle cx="135" cy="244" r="5" fill="#ff5fae" filter="url(#neon)"/><circle cx="160" cy="246" r="5" fill="#59e3ff" filter="url(#neon)"/><circle cx="185" cy="244" r="5" fill="#5ef0a0" filter="url(#neon)"/><circle cx="210" cy="240" r="5" fill="#ffd43b" filter="url(#neon)"/>
    </g>
    <!-- slings -->
    <path d="M74 262 L74 300 L104 318z" fill="#59e3ff" opacity="0.85"/>
    <path d="M246 262 L246 300 L216 318z" fill="#59e3ff" opacity="0.85"/>
    <!-- flippers -->
    <path d="M100 322 L146 342 a6 6 0 0 1 -4 10 L96 336 a9 9 0 0 1 4 -14z" fill="url(#flip)" stroke="#59e3ff" stroke-width="2.5"/>
    <path d="M220 322 L184 330 a6 6 0 0 0 0 10 L222 336 a9 9 0 0 0 -2 -14z" fill="url(#flip)" stroke="#59e3ff" stroke-width="2.5"/>
    <!-- ball with trail -->
    <g fill="#ffffff"><circle cx="152" cy="282" r="5" opacity="0.12"/><circle cx="166" cy="261" r="7" opacity="0.18"/><circle cx="179" cy="240" r="9" opacity="0.25"/><circle cx="190" cy="223" r="11" opacity="0.32"/></g>
    <circle cx="200" cy="208" r="13" fill="url(#ball)"/>
    <ellipse cx="195" cy="203" rx="4" ry="2.5" fill="#fff" opacity="0.9" transform="rotate(-30 195 203)"/>
    <!-- sparks -->
    <g fill="#fff6a8"><path d="M218 192 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/><path d="M146 104 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6z"/></g>
  </g>
  <!-- title -->
  <g font-family="Fredoka, 'Trebuchet MS', Arial, sans-serif" font-weight="700" text-anchor="middle">
    <text x="478" y="118" font-size="66" fill="#6a0f45">PINBALL</text>
    <text x="474" y="112" font-size="66" fill="url(#title1)" stroke="#b8237a" stroke-width="3" paint-order="stroke" filter="url(#neon)">PINBALL</text>
    <text x="478" y="186" font-size="66" fill="#0e4a63">PARTY</text>
    <text x="474" y="180" font-size="66" fill="url(#title2)" stroke="#1b7fa5" stroke-width="3" paint-order="stroke" filter="url(#neon)">PARTY</text>
  </g>
  <!-- table badges -->
  <g font-family="Nunito, Arial, sans-serif" font-weight="900" font-size="12" text-anchor="middle">
    <g transform="translate(398 250)">
      <circle r="30" fill="#0f4a6a" stroke="#ffd43b" stroke-width="3"/>
      <g stroke="#d9a066" stroke-width="3.5" stroke-linecap="round" fill="none"><circle r="13"/><path d="M0 -21 V21 M-21 0 H21 M-15 -15 L15 15 M15 -15 L-15 15"/></g><circle r="5" fill="#ffd43b"/>
      <text y="48" fill="#ffd43b">PIRATES</text>
    </g>
    <g transform="translate(476 250)">
      <circle r="30" fill="#1a1450" stroke="#59e3ff" stroke-width="3"/>
      <circle r="13" fill="url(#p2)"/><ellipse rx="22" ry="5" fill="none" stroke="#ffe0b0" stroke-width="2.5" transform="rotate(-20)"/>
      <text y="48" fill="#59e3ff">SPACE</text>
    </g>
    <g transform="translate(554 250)">
      <circle r="30" fill="#ff9ccf" stroke="#ffffff" stroke-width="3"/>
      <circle r="14" fill="#ff5fae"/><path d="M0 0 m-9 0 a9 9 0 1 0 18 0 a6 6 0 1 0 -12 0 a3 3 0 1 0 6 0" fill="none" stroke="#fff" stroke-width="2.5"/>
      <text y="48" fill="#ffffff">CANDY</text>
    </g>
  </g>
</svg>
