<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Sky Bounce game card: a happy green bouncer leaping up through the clouds -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8fe8"/>
      <stop offset="0.55" stop-color="#7fd0ff"/>
      <stop offset="1" stop-color="#e2f7ff"/>
    </linearGradient>
    <radialGradient id="sun" cx="40%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="1" stop-color="#ffd84a"/>
    </radialGradient>
    <radialGradient id="body" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#b6f5b0"/>
      <stop offset="0.6" stop-color="#5fd36b"/>
      <stop offset="1" stop-color="#2f9a45"/>
    </radialGradient>
    <radialGradient id="puff" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffd1ea"/>
      <stop offset="1" stop-color="#ff5fae"/>
    </radialGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe05a"/>
      <stop offset="0.45" stop-color="#5cc43f"/>
      <stop offset="0.46" stop-color="#a06a3a"/>
      <stop offset="1" stop-color="#6e4424"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc8ff"/>
      <stop offset="0.45" stop-color="#5ab8ff"/>
      <stop offset="0.46" stop-color="#2a6fc0"/>
      <stop offset="1" stop-color="#1d5296"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3a0"/>
      <stop offset="0.5" stop-color="#ffcf3f"/>
      <stop offset="1" stop-color="#e8a100"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="1" stop-color="#ffc21a"/>
    </linearGradient>
    <linearGradient id="title2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6f6ff"/>
      <stop offset="1" stop-color="#5ad1ff"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="0.65" stop-color="#001" stop-opacity="0"/>
      <stop offset="1" stop-color="#001" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <!-- sun -->
  <g transform="translate(560 70)">
    <g fill="#fff0a8" opacity="0.55">
      <path d="M0 -70 L8 -46 L-8 -46Z"/><path d="M0 70 L8 46 L-8 46Z"/><path d="M-70 0 L-46 8 L-46 -8Z"/><path d="M70 0 L46 8 L46 -8Z"/>
      <path d="M49 -49 L38 -26 L26 -38Z"/><path d="M-49 49 L-38 26 L-26 38Z"/><path d="M-49 -49 L-26 -38 L-38 -26Z"/><path d="M49 49 L26 38 L38 26Z"/>
    </g>
    <circle r="38" fill="url(#sun)"/>
  </g>
  <!-- distant islands and clouds -->
  <g opacity="0.75" transform="translate(232 -90) scale(0.85)">
    <path d="M60 210 Q80 255 108 268 Q130 250 156 210Z" fill="#c3b6e6"/>
    <ellipse cx="108" cy="210" rx="50" ry="11" fill="#d4efd0"/>
    <rect x="92" y="176" width="32" height="30" fill="#f6f3ff"/><rect x="84" y="166" width="11" height="40" fill="#f6f3ff"/><rect x="121" y="166" width="11" height="40" fill="#f6f3ff"/>
    <path d="M82 166 L89.5 152 L97 166Z M119 166 L126.5 152 L134 166Z" fill="#f2c4dd"/>
  </g>
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="200" cy="80" rx="52" ry="18"/><ellipse cx="180" cy="70" rx="26" ry="20"/><ellipse cx="216" cy="62" rx="30" ry="24"/>
    <ellipse cx="420" cy="140" rx="44" ry="15"/><ellipse cx="404" cy="131" rx="22" ry="16"/><ellipse cx="434" cy="124" rx="25" ry="19"/>
    <ellipse cx="80" cy="320" rx="80" ry="26"/><ellipse cx="560" cy="330" rx="90" ry="28"/>
  </g>
  <!-- hills -->
  <path d="M0 360 L0 300 Q90 270 180 300 Q260 326 340 296 Q440 262 520 292 Q590 312 640 290 L640 360Z" fill="#5fbf4f"/>
  <path d="M0 360 L0 326 Q120 304 230 330 Q330 350 430 324 Q540 300 640 322 L640 360Z" fill="#4aa93d"/>

  <!-- platforms -->
  <g>
    <rect x="456" y="290" width="104" height="20" rx="10" fill="#000" opacity="0.13"/>
    <rect x="450" y="284" width="104" height="20" rx="10" fill="url(#grass)" stroke="#2e5a1c" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="462" y="287" width="80" height="4" rx="2" fill="#fff" opacity="0.45"/>
    <!-- spring -->
    <path d="M520 284 l-8 -4 l16 -5 l-16 -5 l16 -5 l-8 -3" fill="none" stroke="#8a95a8" stroke-width="3.5" stroke-linejoin="round"/>
    <rect x="505" y="257" width="30" height="8" rx="4" fill="#e8453c"/>
  </g>
  <g>
    <rect x="356" y="196" width="90" height="18" rx="9" fill="#000" opacity="0.13"/>
    <rect x="350" y="190" width="90" height="18" rx="9" fill="url(#blue)" stroke="#123a70" stroke-opacity="0.4" stroke-width="1.5"/>
    <path d="M372 199 l8 -5 v10z M418 199 l-8 -5 v10z" fill="#fff" opacity="0.9"/>
  </g>
  <g>
    <rect x="262" y="270" width="84" height="18" rx="9" fill="#000" opacity="0.13"/>
    <rect x="256" y="264" width="84" height="18" rx="9" fill="url(#grass)" stroke="#2e5a1c" stroke-opacity="0.4" stroke-width="1.5"/>
  </g>
  <!-- cloud platform with sleepy face -->
  <g>
    <g fill="#6e82cd" opacity="0.8"><ellipse cx="502" cy="122" rx="20" ry="13"/><ellipse cx="530" cy="120" rx="22" ry="14"/><ellipse cx="558" cy="122" rx="20" ry="13"/></g>
    <g fill="#ffffff"><ellipse cx="502" cy="121" rx="18" ry="11"/><ellipse cx="530" cy="119" rx="20" ry="12"/><ellipse cx="558" cy="121" rx="18" ry="11"/></g>
    <path d="M522 120 q3 3 6 0 M533 120 q3 3 6 0" stroke="#505fa0" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- coins -->
  <g>
    <circle cx="395" cy="160" r="11" fill="url(#coin)" stroke="#b8860b" stroke-width="1.5"/>
    <circle cx="395" cy="122" r="11" fill="url(#coin)" stroke="#b8860b" stroke-width="1.5"/>
    <ellipse cx="395" cy="84" rx="5" ry="11" fill="url(#coin)" stroke="#b8860b" stroke-width="1.5"/>
    <path d="M395 154 l1.8 4 4.2 .4 -3.2 2.8 1 4.2 -3.8 -2.2 -3.8 2.2 1 -4.2 -3.2 -2.8 4.2 -.4z" fill="#c99a00"/>
    <path d="M395 116 l1.8 4 4.2 .4 -3.2 2.8 1 4.2 -3.8 -2.2 -3.8 2.2 1 -4.2 -3.2 -2.8 4.2 -.4z" fill="#c99a00"/>
  </g>

  <!-- puff monster -->
  <g transform="translate(560 200)">
    <ellipse cx="-24" cy="-8" rx="13" ry="7" fill="#ffe6f3" transform="rotate(-25 -24 -8)"/>
    <ellipse cx="24" cy="-8" rx="13" ry="7" fill="#ffe6f3" transform="rotate(25 24 -8)"/>
    <g fill="url(#puff)">
      <circle r="20"/><circle cx="-14" cy="-10" r="10"/><circle cx="14" cy="-10" r="10"/><circle cx="-16" cy="8" r="10"/><circle cx="16" cy="8" r="10"/><circle cx="0" cy="-18" r="10"/><circle cx="0" cy="16" r="9"/>
    </g>
    <ellipse cx="-7" cy="-2" rx="5" ry="6" fill="#fff"/><ellipse cx="7" cy="-2" rx="5" ry="6" fill="#fff"/>
    <circle cx="-6" cy="-1" r="3" fill="#1a1220"/><circle cx="8" cy="-1" r="3" fill="#1a1220"/>
    <path d="M-12 -10 L-4 -8 M12 -10 L4 -8" stroke="#1a1220" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="0" cy="8" rx="4" ry="2.6" fill="#5a1a3a"/>
  </g>

  <!-- hero: green bouncer leaping up with motion lines -->
  <g opacity="0.55" stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <path d="M470 236 L462 262"/><path d="M492 230 L488 252"/><path d="M448 246 L436 266"/>
  </g>
  <g transform="translate(470 196) rotate(-8)">
    <ellipse cx="-11" cy="30" rx="10" ry="6" fill="#2f9a45"/>
    <ellipse cx="11" cy="30" rx="10" ry="6" fill="#2f9a45"/>
    <ellipse cx="0" cy="0" rx="30" ry="33" fill="url(#body)" stroke="#1f6b30" stroke-width="2.5"/>
    <ellipse cx="3" cy="11" rx="17" ry="14" fill="#ffffff" opacity="0.3"/>
    <ellipse cx="-12" cy="-18" rx="9" ry="5" fill="#ffffff" opacity="0.5" transform="rotate(-30 -12 -18)"/>
    <ellipse cx="-6" cy="-7" rx="8" ry="9.5" fill="#fff"/>
    <ellipse cx="14" cy="-7" rx="8" ry="9.5" fill="#fff"/>
    <circle cx="-3" cy="-9" r="4.6" fill="#1a1220"/><circle cx="17" cy="-9" r="4.6" fill="#1a1220"/>
    <circle cx="-1.5" cy="-11" r="1.7" fill="#fff"/><circle cx="18.5" cy="-11" r="1.7" fill="#fff"/>
    <circle cx="-14" cy="5" r="4.5" fill="#ff6e8c" opacity="0.35"/><circle cx="24" cy="5" r="4.5" fill="#ff6e8c" opacity="0.35"/>
    <path d="M-2 6 Q5 16 12 6 Z" fill="#7a2a3a"/>
  </g>
  <g fill="#fff6a0">
    <path d="M420 172 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
    <path d="M510 160 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
  </g>

  <!-- title -->
  <g font-family="Fredoka, 'Trebuchet MS', Arial, sans-serif" font-weight="700" text-anchor="start">
    <text x="34" y="122" font-size="84" fill="#7a3d00" opacity="0.35" transform="translate(4 6)">Sky</text>
    <text x="34" y="122" font-size="84" fill="url(#title)" stroke="#a85a00" stroke-width="5" paint-order="stroke" stroke-linejoin="round">Sky</text>
    <text x="34" y="206" font-size="84" fill="#0d3c66" opacity="0.35" transform="translate(4 6)">Bounce</text>
    <text x="34" y="206" font-size="84" fill="url(#title2)" stroke="#155b8c" stroke-width="5" paint-order="stroke" stroke-linejoin="round">Bounce</text>
    <text x="38" y="240" font-size="20" fill="#ffffff" stroke="#1d4f86" stroke-width="4" paint-order="stroke" stroke-linejoin="round">How high can you go?</text>
  </g>
  <rect width="640" height="360" fill="url(#vig)"/>
</svg>
