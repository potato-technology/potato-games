<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Gem Mine icon: a big sparkly amethyst with a pickaxe behind it -->
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#6a58b0"/>
      <stop offset="1" stop-color="#241c48"/>
    </radialGradient>
    <linearGradient id="table" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4d6ff"/>
      <stop offset="0.6" stop-color="#b04ef0"/>
      <stop offset="1" stop-color="#6e1fa8"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f4f7"/>
      <stop offset="1" stop-color="#7d8692"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e2b8ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#e2b8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
  <!-- pickaxe -->
  <g transform="translate(50 50) rotate(-40)">
    <rect x="-3.5" y="-6" width="7" height="50" rx="3" fill="#a0703d"/>
    <path d="M-36 -18 Q0 -40 36 -18 Q0 -28 -36 -18 Z" fill="url(#metal)"/>
  </g>
  <circle cx="50" cy="52" r="40" fill="url(#glow)"/>
  <!-- the gem -->
  <g transform="translate(50 52) scale(1.75)">
    <path d="M18.5 7.7 L7.7 18.5 L-7.7 18.5 L-18.5 7.7 L-18.5 -7.7 L-7.7 -18.5 L7.7 -18.5 L18.5 -7.7 Z" fill="#470a75"/>
    <path d="M18.5 7.7 L7.7 18.5 L4.3 10.4 L10.4 4.3 Z" fill="#550d8a"/>
    <path d="M7.7 18.5 L-7.7 18.5 L-4.3 10.4 L4.3 10.4 Z" fill="#6e1fa8"/>
    <path d="M-7.7 18.5 L-18.5 7.7 L-10.4 4.3 L-4.3 10.4 Z" fill="#8a2fd0"/>
    <path d="M-18.5 7.7 L-18.5 -7.7 L-10.4 -4.3 L-10.4 4.3 Z" fill="#b866f0"/>
    <path d="M-18.5 -7.7 L-7.7 -18.5 L-4.3 -10.4 L-10.4 -4.3 Z" fill="#e8c0ff"/>
    <path d="M-7.7 -18.5 L7.7 -18.5 L4.3 -10.4 L-4.3 -10.4 Z" fill="#d496ff"/>
    <path d="M7.7 -18.5 L18.5 -7.7 L10.4 -4.3 L4.3 -10.4 Z" fill="#a43be6"/>
    <path d="M18.5 -7.7 L18.5 7.7 L10.4 4.3 L10.4 -4.3 Z" fill="#8229c4"/>
    <path d="M10.4 4.3 L4.3 10.4 L-4.3 10.4 L-10.4 4.3 L-10.4 -4.3 L-4.3 -10.4 L4.3 -10.4 L10.4 -4.3 Z" fill="url(#table)"/>
    <path d="M-10.4 -4.3 L-4.3 -10.4 L2 -10.4 L-10.4 2 Z" fill="#fff" opacity="0.5"/>
    <path d="M18.5 7.7 L7.7 18.5 L-7.7 18.5 L-18.5 7.7 L-18.5 -7.7 L-7.7 -18.5 L7.7 -18.5 L18.5 -7.7 Z" fill="none" stroke="#3a0860" stroke-width="1"/>
  </g>
  <path d="M30 26 q0 8 8 8 q-8 0 -8 8 q0 -8 -8 -8 q8 0 8 -8z" fill="#fff"/>
  <path d="M74 66 q0 5 5 5 q-5 0 -5 5 q0 -5 -5 -5 q5 0 5 -5z" fill="#fff" opacity="0.85"/>
  <circle cx="50" cy="50" r="47" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="2.5"/>
