<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Tank Arena game card: a blue tank bounces a shell off a wall and pops a green bot tank into confetti -->
  <defs>
    <pattern id="grass" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#7cc25a"/>
      <rect width="32" height="32" fill="#72b852"/>
      <rect x="32" y="32" width="32" height="32" fill="#72b852"/>
      <path d="M10 20 l-2 -6 M13 20 l1 -7 M16 20 l2 -5" stroke="#3f8a2a" stroke-width="2" stroke-linecap="round"/>
      <path d="M44 52 l-2 -6 M47 52 l1 -7 M50 52 l2 -5" stroke="#3f8a2a" stroke-width="2" stroke-linecap="round"/>
    </pattern>
    <linearGradient id="wallTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4bcc5"/>
      <stop offset="1" stop-color="#9aa3ad"/>
    </linearGradient>
    <linearGradient id="crate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2ab6a"/>
      <stop offset="1" stop-color="#a86c32"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7db4ff"/>
      <stop offset="0.5" stop-color="#3d8bfd"/>
      <stop offset="1" stop-color="#2a62c0"/>
    </linearGradient>
    <radialGradient id="blueT" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#a9cdff"/>
      <stop offset="1" stop-color="#2a62c0"/>
    </radialGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb37a"/>
      <stop offset="0.5" stop-color="#ff8c42"/>
      <stop offset="1" stop-color="#c25a14"/>
    </linearGradient>
    <radialGradient id="orangeT" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffd0a8"/>
      <stop offset="1" stop-color="#c25a14"/>
    </radialGradient>
    <radialGradient id="blast" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.5" stop-color="#ffd43b" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.5" stop-color="#ffc93c"/>
      <stop offset="1" stop-color="#c78a00"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="72%">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#grass)"/>
  <g fill="#fff"><circle cx="90" cy="60" r="3"/><circle cx="420" cy="40" r="3"/><circle cx="560" cy="210" r="3"/><circle cx="250" cy="300" r="3"/></g>
  <g fill="#ffd43b"><circle cx="90" cy="60" r="1.6"/><circle cx="420" cy="40" r="1.6"/><circle cx="560" cy="210" r="1.6"/><circle cx="250" cy="300" r="1.6"/></g>

  <!-- tread marks -->
  <g fill="#2a2010" opacity="0.15">
    <rect x="40" y="226" width="6" height="6"/><rect x="40" y="258" width="6" height="6"/><rect x="58" y="224" width="6" height="6"/><rect x="58" y="256" width="6" height="6"/>
    <rect x="76" y="222" width="6" height="6"/><rect x="76" y="254" width="6" height="6"/><rect x="94" y="221" width="6" height="6"/><rect x="94" y="253" width="6" height="6"/>
  </g>

  <!-- walls -->
  <g>
    <rect x="236" y="20" width="160" height="56" fill="#000" opacity="0.2" transform="translate(7 9)"/>
    <rect x="236" y="20" width="160" height="48" fill="url(#wallTop)"/>
    <rect x="236" y="68" width="160" height="10" fill="#6c7580"/>
    <path d="M236 44 H396 M276 20 V44 M336 20 V44 M256 44 V68 M316 44 V68 M376 44 V68" stroke="#000" stroke-opacity="0.15" stroke-width="2"/>
    <rect x="236" y="20" width="160" height="3" fill="#fff" opacity="0.3"/>
    <rect x="452" y="120" width="52" height="110" fill="#000" opacity="0.2" transform="translate(7 9)"/>
    <rect x="452" y="120" width="52" height="102" fill="url(#wallTop)"/>
    <rect x="452" y="222" width="52" height="10" fill="#6c7580"/>
    <path d="M452 170 H504 M478 120 V170 M466 170 V222" stroke="#000" stroke-opacity="0.15" stroke-width="2"/>
  </g>
  <!-- crates -->
  <g>
    <rect x="128" y="88" width="46" height="46" fill="#000" opacity="0.22" transform="translate(5 7)"/>
    <rect x="128" y="88" width="46" height="40" fill="url(#crate)" stroke="#6e4318" stroke-width="3"/>
    <rect x="128" y="128" width="46" height="7" fill="#6e4318"/>
    <path d="M132 92 L170 124" stroke="#6e4318" stroke-width="4"/>
    <rect x="560" y="290" width="46" height="46" fill="#000" opacity="0.22" transform="translate(5 7)"/>
    <rect x="560" y="290" width="46" height="40" fill="url(#crate)" stroke="#6e4318" stroke-width="3"/>
    <rect x="560" y="330" width="46" height="7" fill="#6e4318"/>
    <path d="M564 294 L602 326" stroke="#6e4318" stroke-width="4"/>
  </g>

  <!-- shell path: out of the blue tank, off the wall, into the bot -->
  <path d="M190 214 L316 80 L420 196" fill="none" stroke="#fff" stroke-opacity="0.75" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
  <g fill="#fff3b0"><circle cx="316" cy="82" r="4"/><circle cx="306" cy="88" r="2.5"/><circle cx="326" cy="88" r="2.5"/></g>
  <g transform="translate(392 166) rotate(48)">
    <path d="M-10 -6 L4 -6 Q14 0 4 6 L-10 6 Z" fill="url(#shell)" stroke="#5a3a00" stroke-width="1.2"/>
  </g>

  <!-- the bot popping into confetti -->
  <g transform="translate(444 238)">
    <circle r="54" fill="url(#blast)"/>
    <g opacity="0.75" fill="#9aa0a8"><circle cx="-30" cy="-14" r="16"/><circle cx="26" cy="-22" r="14"/><circle cx="6" cy="26" r="18"/><circle cx="-18" cy="20" r="12"/></g>
    <g>
      <rect x="-60" y="-40" width="10" height="5" fill="#ffd43b" transform="rotate(25 -55 -38)"/>
      <rect x="46" y="-46" width="10" height="5" fill="#ff5d8f" transform="rotate(-30 51 -44)"/>
      <rect x="58" y="10" width="10" height="5" fill="#4dabf7" transform="rotate(60 63 12)"/>
      <rect x="-70" y="16" width="10" height="5" fill="#b28dff" transform="rotate(-50 -65 18)"/>
      <rect x="-20" y="-62" width="10" height="5" fill="#7ccf4a" transform="rotate(15 -15 -60)"/>
      <rect x="18" y="56" width="10" height="5" fill="#ff8c42" transform="rotate(-20 23 58)"/>
      <rect x="-48" y="50" width="10" height="5" fill="#ffd43b" transform="rotate(40 -43 52)"/>
      <rect x="70" y="-18" width="10" height="5" fill="#fff" transform="rotate(10 75 -16)"/>
      <rect x="-82" y="-12" width="10" height="5" fill="#4dabf7" transform="rotate(70 -77 -10)"/>
      <rect x="34" y="34" width="8" height="4" fill="#b28dff" transform="rotate(-60 38 36)"/>
    </g>
    <text x="0" y="8" font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" font-size="34" text-anchor="middle" stroke="#2a1a10" stroke-width="6" stroke-linejoin="round" fill="none">POP!</text>
    <text x="0" y="8" font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" font-size="34" text-anchor="middle" fill="#fff">POP!</text>
  </g>

  <!-- orange bot tank -->
  <g transform="translate(560 110) rotate(160)">
    <ellipse cx="4" cy="6" rx="34" ry="28" fill="#000" opacity="0.25"/>
    <rect x="-33" y="-29" width="66" height="18" rx="8" fill="#2b2f36"/>
    <rect x="-33" y="11" width="66" height="18" rx="8" fill="#2b2f36"/>
    <g fill="#4a515c"><rect x="-28" y="-29" width="5" height="18"/><rect x="-18" y="-29" width="5" height="18"/><rect x="-8" y="-29" width="5" height="18"/><rect x="2" y="-29" width="5" height="18"/><rect x="12" y="-29" width="5" height="18"/><rect x="22" y="-29" width="5" height="18"/>
      <rect x="-28" y="11" width="5" height="18"/><rect x="-18" y="11" width="5" height="18"/><rect x="-8" y="11" width="5" height="18"/><rect x="2" y="11" width="5" height="18"/><rect x="12" y="11" width="5" height="18"/><rect x="22" y="11" width="5" height="18"/></g>
    <rect x="-30" y="-22" width="60" height="44" rx="11" fill="url(#orange)" stroke="#3a1f0a" stroke-opacity="0.6" stroke-width="3"/>
    <rect x="6" y="-6" width="38" height="12" rx="4" fill="#3b414b"/>
    <rect x="42" y="-8" width="9" height="16" rx="3" fill="#2b2f36"/>
    <circle r="18" fill="url(#orangeT)" stroke="#3a1f0a" stroke-opacity="0.6" stroke-width="3"/>
    <ellipse cx="6" cy="-7" rx="5.5" ry="6.5" fill="#fff"/><ellipse cx="6" cy="7" rx="5.5" ry="6.5" fill="#fff"/>
    <circle cx="8.5" cy="-7" r="3" fill="#1d1a17"/><circle cx="8.5" cy="7" r="3" fill="#1d1a17"/>
    <path d="M11 -3 L13 -13 M11 3 L13 13" stroke="#1d1a17" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- the hero: a cute blue tank -->
  <g transform="translate(150 240) rotate(-48)">
    <ellipse cx="5" cy="7" rx="40" ry="33" fill="#000" opacity="0.25"/>
    <rect x="-38" y="-34" width="76" height="20" rx="9" fill="#2b2f36"/>
    <rect x="-38" y="14" width="76" height="20" rx="9" fill="#2b2f36"/>
    <g fill="#4a515c"><rect x="-33" y="-34" width="6" height="20"/><rect x="-21" y="-34" width="6" height="20"/><rect x="-9" y="-34" width="6" height="20"/><rect x="3" y="-34" width="6" height="20"/><rect x="15" y="-34" width="6" height="20"/><rect x="27" y="-34" width="6" height="20"/>
      <rect x="-33" y="14" width="6" height="20"/><rect x="-21" y="14" width="6" height="20"/><rect x="-9" y="14" width="6" height="20"/><rect x="3" y="14" width="6" height="20"/><rect x="15" y="14" width="6" height="20"/><rect x="27" y="14" width="6" height="20"/></g>
    <rect x="-35" y="-26" width="70" height="52" rx="13" fill="url(#blue)" stroke="#101a33" stroke-opacity="0.6" stroke-width="3"/>
    <rect x="-28" y="-21" width="56" height="6" rx="3" fill="#fff" opacity="0.3"/>
    <circle cx="31" cy="-16" r="3.5" fill="#fff6c4"/><circle cx="31" cy="16" r="3.5" fill="#fff6c4"/>
    <rect x="7" y="-7" width="44" height="14" rx="5" fill="#3b414b"/>
    <rect x="49" y="-10" width="10" height="20" rx="3" fill="#2b2f36"/>
    <path d="M60 -10 L78 0 L60 10 Z" fill="#fff6c4"/>
    <circle cx="61" cy="0" r="9" fill="#ffd43b" opacity="0.9"/>
    <circle r="21" fill="url(#blueT)" stroke="#101a33" stroke-opacity="0.6" stroke-width="3"/>
    <ellipse cx="7" cy="-8.5" rx="6" ry="7" fill="#fff"/><ellipse cx="7" cy="8.5" rx="6" ry="7" fill="#fff"/>
    <circle cx="9.5" cy="-8.5" r="3.4" fill="#1d1a17"/><circle cx="9.5" cy="8.5" r="3.4" fill="#1d1a17"/>
    <circle cx="10.5" cy="-10" r="1.2" fill="#fff"/><circle cx="10.5" cy="7" r="1.2" fill="#fff"/>
    <circle cx="-5" cy="-13" r="3.4" fill="#ff7890" opacity="0.6"/><circle cx="-5" cy="13" r="3.4" fill="#ff7890" opacity="0.6"/>
  </g>
  <!-- smoke puffs from the shot -->
  <g fill="#fff" opacity="0.6"><circle cx="200" cy="200" r="9"/><circle cx="212" cy="190" r="6"/><circle cx="196" cy="186" r="5"/></g>
  <!-- coins -->
  <g><circle cx="500" cy="300" r="9" fill="#ffd43b" stroke="#a06c00" stroke-width="2"/><rect x="498.5" y="295" width="3" height="10" fill="#c78a00"/>
    <circle cx="522" cy="282" r="9" fill="#ffd43b" stroke="#a06c00" stroke-width="2"/><rect x="520.5" y="277" width="3" height="10" fill="#c78a00"/></g>

  <rect width="640" height="360" fill="url(#vig)"/>

  <g font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" text-anchor="middle">
    <text x="320" y="345" font-size="60" fill="#000" opacity="0.35">Tank Arena</text>
    <text x="320" y="339" font-size="60" stroke="#132a0a" stroke-width="10" stroke-linejoin="round" fill="none">Tank Arena</text>
    <text x="320" y="339" font-size="60" fill="#8be05a">Tank <tspan fill="#ffb547">Arena</tspan></text>
  </g>
</svg>
