<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Block Stack game card: a stack of falling blocks with a row clearing in a flash -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a66"/>
      <stop offset="0.55" stop-color="#2c1f66"/>
      <stop offset="1" stop-color="#121a44"/>
    </linearGradient>
    <radialGradient id="glowA" cx="20%" cy="20%" r="60%"><stop offset="0" stop-color="#45d8ff" stop-opacity="0.35"/><stop offset="1" stop-color="#45d8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="85%" cy="85%" r="60%"><stop offset="0" stop-color="#b06bff" stop-opacity="0.35"/><stop offset="1" stop-color="#b06bff" stop-opacity="0"/></radialGradient>
    <linearGradient id="well" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0f26"/><stop offset="1" stop-color="#151a3e"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a5aa8"/><stop offset="0.5" stop-color="#7d8fe0"/><stop offset="1" stop-color="#3b4a90"/></linearGradient>
    <linearGradient id="flash" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.2" stop-color="#fff" stop-opacity="0.95"/><stop offset="0.8" stop-color="#fff" stop-opacity="0.95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <!-- one beveled block per color -->
    <g id="c"><rect width="30" height="30" fill="#3fd8f0"/><path d="M0 0 H30 L25 5 H5 V25 L0 30 Z" fill="#a8f3ff"/><path d="M30 30 H0 L5 25 H25 V5 L30 0 Z" fill="#1d93a8"/><rect x="5" y="5" width="20" height="20" fill="#52e0f5"/></g>
    <g id="y"><rect width="30" height="30" fill="#ffd43b"/><path d="M0 0 H30 L25 5 H5 V25 L0 30 Z" fill="#fff0a8"/><path d="M30 30 H0 L5 25 H25 V5 L30 0 Z" fill="#b8900a"/><rect x="5" y="5" width="20" height="20" fill="#ffdf62"/></g>
    <g id="p"><rect width="30" height="30" fill="#b06bff"/><path d="M0 0 H30 L25 5 H5 V25 L0 30 Z" fill="#dcbfff"/><path d="M30 30 H0 L5 25 H25 V5 L30 0 Z" fill="#6f32c0"/><rect x="5" y="5" width="20" height="20" fill="#bf85ff"/></g>
    <g id="g"><rect width="30" height="30" fill="#4cd964"/><path d="M0 0 H30 L25 5 H5 V25 L0 30 Z" fill="#b2f5bf"/><path d="M30 30 H0 L5 25 H25 V5 L30 0 Z" fill="#1f8f37"/><rect x="5" y="5" width="20" height="20" fill="#63e278"/></g>
    <g id="r"><rect width="30" height="30" fill="#ff4d5e"/><path d="M0 0 H30 L25 5 H5 V25 L0 30 Z" fill="#ffb3bb"/><path d="M30 30 H0 L5 25 H25 V5 L30 0 Z" fill="#b8202f"/><rect x="5" y="5" width="20" height="20" fill="#ff6a78"/></g>
    <g id="b"><rect width="30" height="30" fill="#3b7bff"/><path d="M0 0 H30 L25 5 H5 V25 L0 30 Z" fill="#b0caff"/><path d="M30 30 H0 L5 25 H25 V5 L30 0 Z" fill="#1c48b0"/><rect x="5" y="5" width="20" height="20" fill="#5a90ff"/></g>
    <g id="o"><rect width="30" height="30" fill="#ff9a2a"/><path d="M0 0 H30 L25 5 H5 V25 L0 30 Z" fill="#ffd2a0"/><path d="M30 30 H0 L5 25 H25 V5 L30 0 Z" fill="#b85a00"/><rect x="5" y="5" width="20" height="20" fill="#ffaa4a"/></g>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glowA)"/>
  <rect width="640" height="360" fill="url(#glowB)"/>
  <!-- faint background pieces -->
  <g opacity="0.12" fill="#fff">
    <rect x="40" y="60" width="26" height="26" rx="4"/><rect x="68" y="60" width="26" height="26" rx="4"/><rect x="96" y="60" width="26" height="26" rx="4"/><rect x="68" y="32" width="26" height="26" rx="4"/>
    <rect x="560" y="40" width="26" height="26" rx="4"/><rect x="560" y="68" width="26" height="26" rx="4"/><rect x="588" y="68" width="26" height="26" rx="4"/><rect x="588" y="96" width="26" height="26" rx="4"/>
    <rect x="520" y="260" width="26" height="26" rx="4"/><rect x="548" y="260" width="26" height="26" rx="4"/><rect x="520" y="288" width="26" height="26" rx="4"/><rect x="548" y="288" width="26" height="26" rx="4"/>
  </g>

  <!-- the well -->
  <rect x="166" y="-10" width="308" height="382" rx="14" fill="url(#frame)"/>
  <rect x="170" y="-10" width="300" height="370" fill="url(#well)"/>
  <g stroke="#fff" stroke-opacity="0.05">
    <path d="M200 0 V360 M230 0 V360 M260 0 V360 M290 0 V360 M320 0 V360 M350 0 V360 M380 0 V360 M410 0 V360 M440 0 V360"/>
  </g>

  <!-- stacked rows (bottom row is clearing) -->
  <g transform="translate(170 0)">
    <!-- row at y=330 (clearing) -->
    <use href="#c" x="0" y="330"/><use href="#c" x="30" y="330"/><use href="#y" x="60" y="330"/><use href="#y" x="90" y="330"/><use href="#p" x="120" y="330"/><use href="#g" x="150" y="330"/><use href="#g" x="180" y="330"/><use href="#r" x="210" y="330"/><use href="#b" x="240" y="330"/><use href="#b" x="270" y="330"/>
    <!-- row 300 -->
    <use href="#o" x="0" y="300"/><use href="#c" x="30" y="300"/><use href="#y" x="60" y="300"/><use href="#y" x="90" y="300"/><use href="#p" x="120" y="300"/><use href="#p" x="150" y="300"/><use href="#g" x="180" y="300"/><use href="#r" x="210" y="300"/><use href="#r" x="240" y="300"/>
    <!-- row 270 -->
    <use href="#o" x="0" y="270"/><use href="#o" x="30" y="270"/><use href="#b" x="90" y="270"/><use href="#p" x="150" y="270"/><use href="#g" x="180" y="270"/><use href="#g" x="210" y="270"/><use href="#r" x="240" y="270"/>
    <!-- row 240 -->
    <use href="#b" x="90" y="240"/><use href="#b" x="120" y="240"/><use href="#g" x="210" y="240"/>
    <!-- falling piece (purple T) with ghost -->
    <g opacity="0.35"><rect x="241" y="241" width="28" height="28" fill="none" stroke="#b06bff" stroke-width="2"/><rect x="271" y="241" width="28" height="28" fill="none" stroke="#b06bff" stroke-width="2"/><rect x="271" y="211" width="28" height="28" fill="none" stroke="#b06bff" stroke-width="2"/><rect x="271" y="271" width="28" height="28" fill="none" stroke="#b06bff" stroke-width="2"/></g>
    <use href="#c" x="240" y="60"/><use href="#c" x="240" y="90"/><use href="#c" x="240" y="120"/><use href="#c" x="240" y="150"/>
    <use href="#p" x="60" y="110"/><use href="#p" x="90" y="110"/><use href="#p" x="120" y="110"/><use href="#p" x="90" y="80"/>
  </g>
  <!-- line clear flash and sparkles -->
  <rect x="150" y="328" width="340" height="34" fill="url(#flash)"/>
  <g>
    <rect x="150" y="306" width="10" height="10" fill="#ffd43b" transform="rotate(20 155 311)"/>
    <rect x="486" y="300" width="12" height="12" fill="#3fd8f0" transform="rotate(35 492 306)"/>
    <rect x="132" y="282" width="8" height="8" fill="#ff4d5e" transform="rotate(10 136 286)"/>
    <rect x="508" y="276" width="9" height="9" fill="#4cd964" transform="rotate(50 512 280)"/>
    <rect x="120" y="318" width="7" height="7" fill="#b06bff"/>
    <rect x="520" y="320" width="7" height="7" fill="#ff9a2a"/>
  </g>

  <!-- title -->
  <g font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" font-size="72" text-anchor="middle" stroke="#0b0f26" stroke-width="9" stroke-linejoin="round" paint-order="stroke">
    <text x="320" y="196"><tspan fill="#ff4d5e">B</tspan><tspan fill="#ffd43b">l</tspan><tspan fill="#4cd964">o</tspan><tspan fill="#45d8ff">c</tspan><tspan fill="#b06bff">k</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#45d8ff">Stack</tspan></text>
  </g>
  <text x="320" y="230" font-family="Nunito, sans-serif" font-weight="800" font-size="18" fill="#fff" text-anchor="middle" stroke="#0b0f26" stroke-width="4" paint-order="stroke">QUAD!</text>
</svg>
