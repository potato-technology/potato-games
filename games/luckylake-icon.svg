<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Lucky Lake icon: a golden fish leaping out of blue water on a fishing line, with a splash -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a8ee0"/>
      <stop offset="1" stop-color="#ffd2a0"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fc4d8"/>
      <stop offset="1" stop-color="#0d4a6a"/>
    </linearGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e08a10"/>
      <stop offset="0.45" stop-color="#ffd23a"/>
      <stop offset="1" stop-color="#fff4c0"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="50" cy="50" r="47"/></clipPath>
  </defs>
  <g clip-path="url(#disc)">
    <rect width="100" height="62" fill="url(#sky)"/>
    <rect y="60" width="100" height="40" fill="url(#water)"/>
    <path d="M0 61 Q12 57 25 61 T50 61 T75 61 T100 61" fill="none" stroke="#fff" stroke-width="2.5" stroke-opacity="0.85"/>
    <ellipse cx="52" cy="64" rx="26" ry="4.5" fill="none" stroke="#fff" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M36 64 Q38 50 44 46 Q42 56 44 64 Z M58 64 Q62 52 70 50 Q64 58 66 64 Z" fill="#e8fbff"/>
  </g>
  <!-- line from the top -->
  <path d="M90 3 L76 25" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <!-- the fish -->
  <g transform="translate(50 42) rotate(-32)">
    <path d="M-20 -3 Q-28 -10 -36 -17 Q-31 -5 -31 0 Q-31 5 -36 17 Q-28 10 -20 3 Z" fill="#ff8a1a"/>
    <path d="M10 -14 Q2 -26 -10 -13 Z" fill="#ff9a2a"/>
    <path d="M30 0 C30 -8 18 -15 4 -15 C-8 -14 -16 -6 -21 -3 L-21 3 C-16 6 -8 14 4 15 C18 15 30 8 30 0 Z" fill="url(#fish)" stroke="#a85a00" stroke-width="1.6"/>
    <path d="M16 -8 Q13 0 16 8" fill="none" stroke="#a85a00" stroke-width="1.6"/>
    <circle cx="22" cy="-3" r="3.6" fill="#fff"/>
    <circle cx="23" cy="-3" r="2.2" fill="#111"/>
    <ellipse cx="0" cy="-7" rx="10" ry="3" fill="#fff" fill-opacity="0.5"/>
  </g>
  <path d="M84 34 q0 6 6 6 q-6 0 -6 6 q0 -6 -6 -6 q6 0 6 -6z" fill="#fff"/>
  <circle cx="22" cy="44" r="2.6" fill="#e8fbff"/>
  <circle cx="76" cy="54" r="2.2" fill="#e8fbff"/>
  <circle cx="50" cy="50" r="47" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="2.5"/>
</svg>
