<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Hop Road game card: a blocky chick hops over a busy road, with a log river and trees behind -->
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3aa8e0"/>
      <stop offset="1" stop-color="#5fd0fb"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <!-- far grass -->
  <rect width="640" height="96" fill="#8fd45a"/>
  <g fill="#fff" opacity="0.06"><rect x="40" y="0" width="60" height="92"/><rect x="160" y="0" width="60" height="92"/><rect x="280" y="0" width="60" height="92"/><rect x="400" y="0" width="60" height="92"/><rect x="520" y="0" width="60" height="92"/></g>
  <rect y="88" width="640" height="10" fill="#5c9a34"/>
  <!-- river -->
  <rect y="98" width="640" height="64" fill="url(#water)"/>
  <g fill="#fff" opacity="0.3"><rect x="30" y="112" width="40" height="3"/><rect x="420" y="146" width="56" height="3"/><rect x="560" y="120" width="36" height="3"/><rect x="250" y="150" width="30" height="3"/></g>
  <rect y="98" width="640" height="5" fill="#fff" opacity="0.35"/>
  <!-- middle grass -->
  <rect y="162" width="640" height="52" fill="#86cc52"/>
  <rect y="206" width="640" height="10" fill="#5c9a34"/>
  <!-- road -->
  <rect y="216" width="640" height="84" fill="#5d6270"/>
  <g fill="#fff" opacity="0.75"><rect x="10" y="256" width="40" height="5"/><rect x="100" y="256" width="40" height="5"/><rect x="190" y="256" width="40" height="5"/><rect x="280" y="256" width="40" height="5"/><rect x="370" y="256" width="40" height="5"/><rect x="460" y="256" width="40" height="5"/><rect x="550" y="256" width="40" height="5"/></g>
  <!-- near grass -->
  <rect y="300" width="640" height="60" fill="#8fd45a"/>
  <rect y="300" width="640" height="3" fill="#fff" opacity="0.3"/>

  <!-- log on the river (box: front, top, right side) -->
  <g>
    <rect x="90" y="122" width="200" height="22" fill="#8a5530"/>
    <polygon points="90,122 290,122 300,112 100,112" fill="#c98a52"/>
    <polygon points="290,122 300,112 300,134 290,144" fill="#c98a52" opacity="0.8"/>
    <rect x="180" y="114" width="20" height="5" fill="#5fc94a"/>
    <rect x="420" y="128" width="150" height="20" fill="#8a5530"/>
    <polygon points="420,128 570,128 580,118 430,118" fill="#c98a52"/>
    <polygon points="570,128 580,118 580,138 570,148" fill="#c98a52" opacity="0.8"/>
  </g>

  <!-- trees on the far grass -->
  <g>
    <rect x="36" y="58" width="16" height="26" fill="#6e4321"/>
    <rect x="14" y="22" width="60" height="40" fill="#3fa62e"/><polygon points="14,22 74,22 86,10 26,10" fill="#5fc94a"/><polygon points="74,22 86,10 86,50 74,62" fill="#2f8a22"/>
    <rect x="560" y="52" width="14" height="30" fill="#6e4321"/>
    <rect x="540" y="10" width="54" height="46" fill="#3fa62e"/><polygon points="540,10 594,10 606,0 552,0" fill="#5fc94a"/><polygon points="594,10 606,0 606,44 594,56" fill="#2f8a22"/>
    <rect x="356" y="40" width="50" height="34" fill="#9aa3ad"/><polygon points="356,40 406,40 416,30 366,30" fill="#b9c1ca"/><polygon points="406,40 416,30 416,64 406,74" fill="#7c8590"/>
  </g>
  <!-- trees on the middle grass -->
  <g>
    <rect x="482" y="186" width="14" height="22" fill="#6e4321"/>
    <rect x="462" y="148" width="54" height="42" fill="#3fa62e"/><polygon points="462,148 516,148 528,136 474,136" fill="#5fc94a"/><polygon points="516,148 528,136 528,178 516,190" fill="#2f8a22"/>
    <rect x="470" y="118" width="38" height="30" fill="#4fb83a"/><polygon points="470,118 508,118 518,108 480,108" fill="#6fd458"/><polygon points="508,118 518,108 518,138 508,148" fill="#3a9a2a"/>
    <rect x="70" y="168" width="44" height="36" fill="#3fa62e"/><polygon points="70,168 114,168 124,158 80,158" fill="#5fc94a"/><polygon points="114,168 124,158 124,194 114,204" fill="#2f8a22"/>
  </g>

  <!-- coins -->
  <g>
    <ellipse cx="360" cy="190" rx="10" ry="12" fill="#ffd43b" stroke="#c78a00" stroke-width="2"/><rect x="358" y="183" width="4" height="14" fill="#fff3b0"/>
    <ellipse cx="200" cy="64" rx="10" ry="12" fill="#ffd43b" stroke="#c78a00" stroke-width="2"/><rect x="198" y="57" width="4" height="14" fill="#fff3b0"/>
  </g>

  <!-- red car on the road -->
  <g>
    <rect x="404" y="282" width="16" height="12" fill="#22252b"/><rect x="484" y="282" width="16" height="12" fill="#22252b"/>
    <rect x="390" y="244" width="130" height="40" fill="#d63d3d"/>
    <polygon points="390,244 520,244 532,232 402,232" fill="#ff6b6b"/>
    <polygon points="520,244 532,232 532,272 520,284" fill="#a82828"/>
    <rect x="420" y="212" width="66" height="22" fill="#e85050"/>
    <polygon points="420,212 486,212 496,202 430,202" fill="#ff8080"/>
    <polygon points="486,212 496,202 496,224 486,234" fill="#b83030"/>
    <rect x="426" y="216" width="54" height="13" fill="#9fe0ff"/>
    <rect x="390" y="254" width="8" height="10" fill="#fff6b0"/>
  </g>
  <!-- blue truck far right -->
  <g>
    <rect x="590" y="226" width="60" height="50" fill="#f1f3f5"/>
    <polygon points="590,226 650,226 650,214 600,214" fill="#ffffff"/>
    <rect x="590" y="244" width="60" height="10" fill="#4dabf7"/>
  </g>

  <!-- the chick, mid-hop, with its shadow on the road -->
  <ellipse cx="252" cy="270" rx="34" ry="9" fill="#000" opacity="0.22"/>
  <g transform="translate(222 160)">
    <!-- body -->
    <rect x="0" y="38" width="60" height="48" fill="#f2c700"/>
    <polygon points="0,38 60,38 72,28 12,28" fill="#ffe14d"/>
    <polygon points="60,38 72,28 72,76 60,86" fill="#d9a800"/>
    <!-- head -->
    <rect x="8" y="6" width="44" height="32" fill="#f2c700"/>
    <polygon points="8,6 52,6 62,-2 18,-2" fill="#ffe96b"/>
    <polygon points="52,6 62,-2 62,30 52,38" fill="#d9a800"/>
    <!-- comb -->
    <rect x="24" y="-12" width="12" height="10" fill="#e83c3c"/>
    <polygon points="24,-12 36,-12 40,-15 28,-15" fill="#ff6b6b"/>
    <!-- beak (toward you) -->
    <rect x="22" y="18" width="16" height="10" fill="#ff8c1a"/>
    <rect x="22" y="28" width="16" height="4" fill="#d96f00"/>
    <!-- eyes -->
    <rect x="13" y="13" width="7" height="8" fill="#1d1a17"/><rect x="40" y="13" width="7" height="8" fill="#1d1a17"/>
    <rect x="14" y="14" width="3" height="3" fill="#fff"/><rect x="41" y="14" width="3" height="3" fill="#fff"/>
    <!-- wings flapping -->
    <rect x="-12" y="44" width="12" height="22" fill="#e0b400" transform="rotate(-20 -6 44)"/>
    <rect x="60" y="44" width="12" height="22" fill="#e0b400" transform="rotate(20 66 44)"/>
    <!-- feet -->
    <rect x="12" y="86" width="12" height="8" fill="#ff8c1a"/><rect x="36" y="86" width="12" height="8" fill="#ff8c1a"/>
  </g>
  <!-- hop sparkles -->
  <g fill="#fff"><rect x="200" y="210" width="6" height="6"/><rect x="306" y="196" width="5" height="5"/><rect x="214" y="186" width="4" height="4"/></g>

  <rect width="640" height="360" fill="url(#vig)"/>

  <g font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" text-anchor="middle">
    <text x="320" y="347" font-size="60" fill="#000" opacity="0.35">Hop Road</text>
    <text x="320" y="341" font-size="60" stroke="#1d2a3a" stroke-width="10" stroke-linejoin="round" fill="none">Hop Road</text>
    <text x="320" y="341" font-size="60" fill="#ffcf3f">Hop <tspan fill="#6be3ff">Road</tspan></text>
  </g>
</svg>
