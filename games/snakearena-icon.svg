<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Snake Arena icon: a chunky striped snake curled in a ring, big eyes, about to gobble a glowing orb -->
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#4c9a3c"/>
      <stop offset="1" stop-color="#173a14"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fe08a"/>
      <stop offset="1" stop-color="#128a40"/>
    </linearGradient>
    <radialGradient id="head" cx="40%" cy="40%" r="65%">
      <stop offset="0" stop-color="#6ff09a"/>
      <stop offset="0.7" stop-color="#1fa652"/>
      <stop offset="1" stop-color="#0b5a2a"/>
    </radialGradient>
    <radialGradient id="orb" cx="35%" cy="32%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#ffb3f0"/>
      <stop offset="0.85" stop-color="#ff2ab0"/>
      <stop offset="1" stop-color="#a00a70"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ff7ad9" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff7ad9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
  <!-- curled body -->
  <path d="M60 30 A24 24 0 1 0 74 58" fill="none" stroke="#0a3a18" stroke-width="20" stroke-linecap="round" opacity="0.45" transform="translate(2 3)"/>
  <path d="M60 30 A24 24 0 1 0 74 58" fill="none" stroke="url(#body)" stroke-width="18" stroke-linecap="round"/>
  <path d="M60 30 A24 24 0 1 0 74 58" fill="none" stroke="#e3f53a" stroke-width="18" stroke-dasharray="6 12" stroke-dashoffset="2"/>
  <path d="M60 30 A24 24 0 1 0 74 58" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round"/>
  <!-- orb -->
  <circle cx="84" cy="22" r="14" fill="url(#glow)"/>
  <circle cx="84" cy="22" r="7" fill="url(#orb)"/>
  <!-- head -->
  <ellipse cx="68" cy="34" rx="17" ry="15" fill="url(#head)" transform="rotate(-35 68 34)"/>
  <circle cx="63" cy="29" r="7" fill="#fff" stroke="#0a3a18" stroke-width="1.2"/>
  <circle cx="75" cy="38" r="7" fill="#fff" stroke="#0a3a18" stroke-width="1.2"/>
  <circle cx="66" cy="27" r="4" fill="#15151d"/>
  <circle cx="78" cy="36" r="4" fill="#15151d"/>
  <circle cx="64.8" cy="25.6" r="1.4" fill="#fff"/>
  <circle cx="76.8" cy="34.6" r="1.4" fill="#fff"/>
  <circle cx="50" cy="50" r="47" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="2.5"/>
</svg>
