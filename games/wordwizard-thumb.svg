<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Word Wizard game card: a young wizard spells MAGIC with wooden letter tiles and blasts a fireball at a green dragon, under a twilight sky with a castle on the hill -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1240"/>
      <stop offset="0.45" stop-color="#4a2e86"/>
      <stop offset="0.8" stop-color="#c0608a"/>
      <stop offset="1" stop-color="#ffb070"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff2c0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff2c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a6a"/>
      <stop offset="1" stop-color="#22184a"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc25a"/>
      <stop offset="1" stop-color="#2a6a30"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a3086"/>
      <stop offset="0.4" stop-color="#3a6ae0"/>
      <stop offset="0.8" stop-color="#86c0ff"/>
      <stop offset="1" stop-color="#3a6ae0"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172a70"/>
      <stop offset="0.5" stop-color="#2f5fd0"/>
      <stop offset="0.85" stop-color="#7ab4ff"/>
      <stop offset="1" stop-color="#2f5fd0"/>
    </linearGradient>
    <radialGradient id="skin" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffe8d0"/>
      <stop offset="0.7" stop-color="#f6c39a"/>
      <stop offset="1" stop-color="#d8956a"/>
    </radialGradient>
    <linearGradient id="staff" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3418"/>
      <stop offset="0.5" stop-color="#a8743e"/>
      <stop offset="1" stop-color="#4a2a10"/>
    </linearGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#9af0ff"/>
      <stop offset="1" stop-color="#2a8ad8"/>
    </linearGradient>
    <radialGradient id="crystalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#bff4ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8ae8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fireball" cx="42%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#fff2a0"/>
      <stop offset="0.7" stop-color="#ff8a2a"/>
      <stop offset="1" stop-color="#e0401a"/>
    </radialGradient>
    <radialGradient id="fireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb04a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dragonBody" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#c2f59a"/>
      <stop offset="0.55" stop-color="#4fae4a"/>
      <stop offset="1" stop-color="#1b5226"/>
    </radialGradient>
    <linearGradient id="dragonDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fae4a"/>
      <stop offset="1" stop-color="#1b5226"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a8a3e"/>
      <stop offset="1" stop-color="#174a20"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4dc"/>
      <stop offset="1" stop-color="#b8a888"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b8"/>
      <stop offset="0.55" stop-color="#e8ba70"/>
      <stop offset="1" stop-color="#a8743a"/>
    </linearGradient>
    <linearGradient id="ruby" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.55" stop-color="#ff6a2a"/>
      <stop offset="1" stop-color="#9a1a0a"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f8ff"/>
      <stop offset="0.55" stop-color="#5ab8ff"/>
      <stop offset="1" stop-color="#1a4a9a"/>
    </linearGradient>
    <linearGradient id="castle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1f5a"/>
      <stop offset="1" stop-color="#1a1238"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- sky, moon and stars -->
  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="520" cy="62" r="70" fill="url(#moonGlow)"/>
  <circle cx="520" cy="62" r="26" fill="#fff6d8"/>
  <circle cx="531" cy="56" r="22" fill="#4a2e86" opacity="0.9"/>
  <g fill="#ffffff">
    <circle cx="40" cy="30" r="1.6"/><circle cx="110" cy="64" r="1.2"/><circle cx="190" cy="22" r="1.8"/>
    <circle cx="260" cy="70" r="1.1"/><circle cx="330" cy="28" r="1.5"/><circle cx="400" cy="50" r="1.2"/>
    <circle cx="450" cy="18" r="1.6"/><circle cx="600" cy="120" r="1.3"/><circle cx="610" cy="30" r="1.7"/>
    <circle cx="80" cy="110" r="1"/><circle cx="300" cy="110" r="1"/>
  </g>
  <path d="M232 46 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z" fill="#ffe680"/>

  <!-- distant castle on the hill -->
  <path d="M0 250 Q120 196 250 214 Q380 232 470 190 Q560 156 640 196 L640 360 L0 360 Z" fill="url(#hillFar)"/>
  <g fill="url(#castle)">
    <rect x="392" y="150" width="70" height="56"/>
    <rect x="382" y="128" width="20" height="78"/>
    <rect x="452" y="122" width="20" height="84"/>
    <rect x="414" y="112" width="26" height="50"/>
    <path d="M378 128 L392 104 L406 128 Z"/>
    <path d="M448 122 L462 96 L476 122 Z"/>
    <path d="M410 112 L427 82 L444 112 Z"/>
  </g>
  <g fill="#ffd27a">
    <rect x="422" y="128" width="8" height="12" rx="4"/>
    <rect x="388" y="150" width="7" height="10" rx="3.5"/>
    <rect x="459" y="146" width="7" height="10" rx="3.5"/>
    <rect x="418" y="176" width="16" height="30" rx="8" fill="#ffb060"/>
  </g>

  <!-- foreground meadow -->
  <path d="M0 286 Q160 254 320 268 Q480 282 640 258 L640 360 L0 360 Z" fill="url(#grass)"/>
  <ellipse cx="330" cy="300" rx="300" ry="26" fill="#d8b47a" opacity="0.55"/>
  <g stroke="#a6e070" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path d="M30 300 q2 -8 -2 -14"/><path d="M48 306 q2 -8 4 -14"/><path d="M600 290 q2 -8 -2 -14"/><path d="M616 296 q2 -8 4 -12"/>
    <path d="M250 330 q2 -8 -2 -14"/><path d="M420 336 q2 -8 4 -12"/>
  </g>
  <g>
    <circle cx="70" cy="318" r="4" fill="#ff9ac0"/><circle cx="70" cy="318" r="1.6" fill="#ffd27a"/>
    <circle cx="588" cy="312" r="4" fill="#ffffff"/><circle cx="588" cy="312" r="1.6" fill="#ffb02a"/>
    <circle cx="540" cy="336" r="4" fill="#c2a8ff"/><circle cx="540" cy="336" r="1.6" fill="#ffd27a"/>
  </g>

  <!-- the dragon (right) -->
  <g transform="translate(500 292)">
    <ellipse cx="10" cy="4" rx="118" ry="14" fill="#000" opacity="0.28"/>
    <!-- back wing -->
    <path d="M40 -120 L30 -200 L104 -236 Q122 -196 138 -160 Q118 -160 116 -134 Q98 -142 92 -110 Q72 -122 64 -96 Z" fill="url(#wing)"/>
    <!-- tail -->
    <path d="M60 -50 Q120 -40 140 -10 Q150 6 132 4 Q112 -20 64 -24 Z" fill="url(#dragonDark)"/>
    <path d="M128 -2 L156 -12 L146 12 Z" fill="#c2f59a"/>
    <!-- body -->
    <ellipse cx="30" cy="-72" rx="74" ry="56" fill="url(#dragonBody)"/>
    <ellipse cx="-4" cy="-56" rx="42" ry="42" fill="#f4eaa6"/>
    <g stroke="#b8aa6a" stroke-width="2.5" fill="none">
      <path d="M-34 -80 Q-4 -92 22 -78"/><path d="M-40 -62 Q-6 -74 26 -60"/><path d="M-38 -44 Q-6 -56 24 -42"/>
    </g>
    <!-- legs -->
    <rect x="-40" y="-40" width="26" height="44" rx="10" fill="url(#dragonDark)"/>
    <rect x="44" y="-40" width="26" height="44" rx="10" fill="url(#dragonDark)"/>
    <path d="M-44 2 l4 6 l4 -6 l4 6 l4 -6 l4 6 l4 -6 Z" fill="#f4ead0"/>
    <!-- neck & head -->
    <path d="M-10 -110 Q-30 -150 -66 -160 L-80 -134 Q-48 -126 -30 -90 Z" fill="url(#dragonBody)"/>
    <g transform="translate(-92 -160) rotate(-12)">
      <path d="M18 -18 Q30 -50 60 -56 Q38 -40 32 -12 Z" fill="url(#horn)"/>
      <path d="M2 -22 Q8 -56 34 -66 Q20 -46 18 -18 Z" fill="url(#horn)"/>
      <ellipse cx="10" cy="-4" rx="32" ry="26" fill="url(#dragonBody)"/>
      <rect x="-60" y="-14" width="70" height="26" rx="12" fill="url(#dragonBody)"/>
      <rect x="-58" y="10" width="58" height="14" rx="7" fill="url(#dragonDark)" transform="rotate(14 -10 12)"/>
      <ellipse cx="-30" cy="18" rx="20" ry="7" fill="#5a0a10"/>
      <ellipse cx="-52" cy="-6" rx="3.5" ry="2.5" fill="#1b5226"/>
      <!-- surprised eye -->
      <ellipse cx="2" cy="-12" rx="10" ry="10" fill="#ffffff"/>
      <circle cx="-1" cy="-11" r="4.5" fill="#1a0a0a"/>
      <circle cx="1" cy="-14" r="1.6" fill="#ffffff"/>
      <path d="M-12 -26 L14 -28 L2 -20 Z" fill="#1b5226"/>
    </g>
    <!-- near wing -->
    <path d="M10 -120 L0 -196 L70 -224 Q86 -190 100 -158 Q80 -158 78 -134 Q60 -140 54 -112 Q36 -122 30 -98 Z" fill="#4fae4a" stroke="#1b5226" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#2a7a34" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M0 -196 L100 -158"/><path d="M0 -196 L78 -134"/><path d="M0 -196 L54 -112"/>
    </g>
    <!-- spikes -->
    <g fill="#c2f59a">
      <path d="M20 -128 l8 -18 l8 18 Z"/><path d="M46 -124 l8 -16 l8 16 Z"/><path d="M70 -112 l7 -14 l7 14 Z"/>
    </g>
  </g>

  <!-- impact burst on the dragon -->
  <circle cx="462" cy="220" r="70" fill="url(#fireGlow)"/>
  <g fill="#fff2a0">
    <path d="M462 174 l6 30 l28 -14 l-18 25 l31 5 l-31 7 l18 25 l-28 -14 l-6 30 l-6 -30 l-28 14 l18 -25 l-31 -7 l31 -5 l-18 -25 l28 14 Z" opacity="0.9"/>
  </g>

  <!-- the fireball's trail from the staff -->
  <path d="M252 126 Q320 50 400 204" fill="none" stroke="#ffb04a" stroke-width="18" stroke-linecap="round" opacity="0.25" filter="url(#soft)"/>
  <g fill="#ffd27a">
    <circle cx="270" cy="104" r="5" opacity="0.6"/><circle cx="294" cy="90" r="7" opacity="0.7"/><circle cx="320" cy="88" r="8" opacity="0.8"/>
    <circle cx="346" cy="100" r="10" opacity="0.85"/><circle cx="366" cy="126" r="11" opacity="0.9"/>
  </g>
  <g fill="#ffffff">
    <path d="M284 116 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 z"/>
    <path d="M334 112 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z"/>
  </g>
  <circle cx="392" cy="176" r="46" fill="url(#fireGlow)"/>
  <circle cx="392" cy="176" r="24" fill="url(#fireball)"/>
  <path d="M374 158 Q386 144 406 150" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- damage number -->
  <g transform="translate(572 176) rotate(-8)">
    <text x="0" y="0" font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" font-size="40" fill="#ffd43b" stroke="#2a1a4a" stroke-width="7" paint-order="stroke" text-anchor="middle">24!</text>
  </g>

  <!-- the young wizard (left) -->
  <g transform="translate(140 300)">
    <ellipse cx="4" cy="0" rx="52" ry="10" fill="#000" opacity="0.3"/>
    <ellipse cx="-10" cy="-5" rx="13" ry="7" fill="#5a3418"/>
    <ellipse cx="20" cy="-5" rx="13" ry="7" fill="#5a3418"/>
    <!-- back arm -->
    <path d="M-18 -96 Q-46 -64 -40 -54 L-24 -52 Q-26 -66 -8 -90 Z" fill="#1a3086"/>
    <circle cx="-33" cy="-50" r="7" fill="#e8a070"/>
    <!-- robe -->
    <path d="M-22 -104 C-30 -70 -40 -40 -48 -12 Q-32 -2 -16 -10 Q0 -2 16 -10 Q32 -2 48 -12 C40 -40 30 -70 22 -104 Q0 -112 -22 -104 Z" fill="url(#robe)" stroke="#0e1a50" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M-48 -12 Q-32 -2 -16 -10 Q0 -2 16 -10 Q32 -2 48 -12" fill="none" stroke="#ffd34a" stroke-width="4.5"/>
    <g fill="#ffe680">
      <path d="M-20 -40 l2 5 l5 1 l-4 3 l1 5 l-4 -3 l-4 3 l1 -5 l-4 -3 l5 -1 z"/>
      <path d="M14 -28 l1.6 4 l4 1 l-3 2.6 l1 4 l-3.6 -2.4 l-3.6 2.4 l1 -4 l-3 -2.6 l4 -1 z"/>
    </g>
    <rect x="-27" y="-68" width="54" height="9" rx="4" fill="#5a3418"/>
    <rect x="-6" y="-70" width="12" height="13" rx="3" fill="#ffd34a"/>
    <path d="M-15 -103 L0 -84 L15 -103 L11 -106 L0 -92 L-11 -106 Z" fill="#ffd34a"/>
    <!-- head -->
    <ellipse cx="-5" cy="-122" rx="30" ry="27" fill="#6a3a1a"/>
    <circle cx="-26" cy="-123" r="7" fill="#e8a070"/>
    <circle cx="0" cy="-126" r="27" fill="url(#skin)"/>
    <ellipse cx="-13" cy="-117" rx="6" ry="4" fill="#ff6e6e" opacity="0.35"/>
    <ellipse cx="17" cy="-117" rx="6" ry="4" fill="#ff6e6e" opacity="0.35"/>
    <ellipse cx="-6" cy="-127" rx="6" ry="7.5" fill="#ffffff"/>
    <ellipse cx="13" cy="-127" rx="6" ry="7.5" fill="#ffffff"/>
    <circle cx="-3.5" cy="-126" r="4" fill="#2a1a40"/>
    <circle cx="15.5" cy="-126" r="4" fill="#2a1a40"/>
    <circle cx="-2" cy="-128" r="1.5" fill="#ffffff"/>
    <circle cx="17" cy="-128" r="1.5" fill="#ffffff"/>
    <path d="M-11 -141 L-2 -143 M9 -143 L18 -141" stroke="#5a2e10" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M-2 -114 Q4 -106 11 -114" fill="#7a2a1a"/>
    <path d="M-26 -136 Q-20 -128 -14 -138 Q-8 -130 -2 -140 Q6 -132 10 -142 L10 -148 L-26 -146 Z" fill="#7a4420"/>
    <!-- hat -->
    <ellipse cx="0" cy="-141" rx="48" ry="12" fill="#172a70"/>
    <ellipse cx="0" cy="-143" rx="47" ry="10" fill="url(#hat)"/>
    <path d="M-30 -142 Q-20 -198 -26 -248 Q6 -200 30 -142 Z" fill="url(#hat)"/>
    <path d="M-30 -143 Q0 -138 30 -143 L26 -155 Q0 -151 -27 -155 Z" fill="#ffd34a"/>
    <g fill="#ffe066">
      <path d="M-4 -186 l2.6 6 l6.4 0.6 l-4.8 4.2 l1.4 6.4 l-5.6 -3.4 l-5.6 3.4 l1.4 -6.4 l-4.8 -4.2 l6.4 -0.6 z"/>
      <path d="M-14 -214 l1.8 4 l4.4 0.4 l-3.3 2.9 l1 4.3 l-3.9 -2.3 l-3.9 2.3 l1 -4.3 l-3.3 -2.9 l4.4 -0.4 z"/>
      <path d="M-26 -258 l2.4 5.4 l5.8 0.6 l-4.4 3.8 l1.3 5.8 l-5.1 -3 l-5.1 3 l1.3 -5.8 l-4.4 -3.8 l5.8 -0.6 z"/>
    </g>
    <!-- staff raised toward the dragon -->
    <g transform="translate(36 -66) rotate(36)">
      <rect x="-3.5" y="-104" width="7" height="166" rx="3.5" fill="url(#staff)"/>
      <circle cx="0" cy="-124" r="44" fill="url(#crystalGlow)"/>
      <path d="M0 -144 L11 -124 L0 -106 L-11 -124 Z" fill="url(#crystal)"/>
      <path d="M0 -141 L4 -126 L-3 -129 Z" fill="#ffffff" opacity="0.8"/>
    </g>
    <path d="M14 -96 Q40 -76 40 -62 L28 -60 Q26 -72 2 -86 Z" fill="#3a6ae0"/>
    <circle cx="36" cy="-66" r="7.5" fill="#f0b080"/>
  </g>

  <!-- the spelled word: MAGIC -->
  <g font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" font-size="34" text-anchor="middle">
    <g transform="translate(208 286) rotate(-6)">
      <rect x="2" y="5" width="54" height="54" rx="10" fill="#000" opacity="0.35"/>
      <rect x="0" y="0" width="54" height="54" rx="10" fill="url(#wood)" stroke="#5a3410" stroke-opacity="0.5"/>
      <rect x="3" y="3" width="48" height="48" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
      <text x="27" y="39" fill="#4a2a10">M</text>
    </g>
    <g transform="translate(266 280) rotate(-2)">
      <rect x="2" y="5" width="54" height="54" rx="10" fill="#000" opacity="0.35"/>
      <rect x="0" y="0" width="54" height="54" rx="10" fill="url(#wood)" stroke="#5a3410" stroke-opacity="0.5"/>
      <rect x="3" y="3" width="48" height="48" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
      <text x="27" y="39" fill="#4a2a10">A</text>
    </g>
    <g transform="translate(324 278) rotate(2)">
      <circle cx="27" cy="27" r="44" fill="url(#fireGlow)" opacity="0.7"/>
      <rect x="2" y="5" width="54" height="54" rx="10" fill="#000" opacity="0.35"/>
      <rect x="0" y="0" width="54" height="54" rx="10" fill="url(#ruby)" stroke="#6a0a00" stroke-opacity="0.5"/>
      <path d="M0 10 Q0 0 10 0 L34 0 L0 34 Z" fill="#ffffff" opacity="0.28"/>
      <text x="27" y="39" fill="#ffffff" stroke="#7a1206" stroke-width="4" paint-order="stroke">G</text>
    </g>
    <g transform="translate(382 282) rotate(5)">
      <rect x="2" y="5" width="54" height="54" rx="10" fill="#000" opacity="0.35"/>
      <rect x="0" y="0" width="54" height="54" rx="10" fill="url(#wood)" stroke="#5a3410" stroke-opacity="0.5"/>
      <rect x="3" y="3" width="48" height="48" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
      <text x="27" y="39" fill="#4a2a10">I</text>
    </g>
    <g transform="translate(440 290) rotate(9)">
      <rect x="2" y="5" width="54" height="54" rx="10" fill="#000" opacity="0.35"/>
      <rect x="0" y="0" width="54" height="54" rx="10" fill="url(#ice)" stroke="#0a2a6a" stroke-opacity="0.5"/>
      <path d="M0 10 Q0 0 10 0 L34 0 L0 34 Z" fill="#ffffff" opacity="0.3"/>
      <text x="27" y="39" fill="#ffffff" stroke="#123a80" stroke-width="4" paint-order="stroke">C</text>
    </g>
  </g>
  <g fill="#ffffff">
    <path d="M200 270 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 z"/>
    <path d="M500 280 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 z"/>
    <path d="M356 262 l1.6 4.6 l4.6 1.6 l-4.6 1.6 l-1.6 4.6 l-1.6 -4.6 l-4.6 -1.6 l4.6 -1.6 z"/>
  </g>
</svg>
