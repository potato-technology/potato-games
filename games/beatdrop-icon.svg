<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Beat Drop icon: a big glowing music note over a neon highway with four coloured lanes -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#5a2a9a"/>
      <stop offset="1" stop-color="#140828"/>
    </radialGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ff8ae4"/>
      <stop offset="1" stop-color="#c02a9e"/>
    </linearGradient>
    <clipPath id="c"><circle cx="50" cy="50" r="48"/></clipPath>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
  <g clip-path="url(#c)">
    <polygon points="40,30 60,30 104,100 -4,100" fill="#0c0620"/>
    <g stroke-width="5" stroke-linecap="round">
      <line x1="40" y1="30" x2="-4" y2="100" stroke="#3df0ff"/>
      <line x1="60" y1="30" x2="104" y2="100" stroke="#ff4fd8"/>
    </g>
    <rect x="6" y="80" width="20" height="9" rx="4.5" fill="#38f29a"/>
    <rect x="28" y="80" width="20" height="9" rx="4.5" fill="#ff4f79"/>
    <rect x="52" y="80" width="20" height="9" rx="4.5" fill="#ffd23f"/>
    <rect x="74" y="80" width="20" height="9" rx="4.5" fill="#41b6ff"/>
  </g>
  <!-- music note -->
  <g transform="translate(50 46)">
    <g fill="#2a0630">
      <ellipse cx="-10" cy="16" rx="15" ry="11" transform="rotate(-20 -10 16)"/>
      <rect x="0" y="-36" width="9" height="54" rx="2"/>
      <path d="M4 -38 Q30 -30 26 -6 Q22 -18 4 -20 Z"/>
    </g>
    <g fill="url(#note)">
      <ellipse cx="-10" cy="16" rx="11.5" ry="8" transform="rotate(-20 -10 16)"/>
      <rect x="2.5" y="-33" width="4.5" height="49" rx="1.5"/>
      <path d="M6 -34 Q25 -27 23 -11 Q19 -20 6 -22 Z"/>
    </g>
    <ellipse cx="-14" cy="12.5" rx="4" ry="2.4" transform="rotate(-20 -14 12.5)" fill="#ffffff" fill-opacity="0.8"/>
  </g>
  <circle cx="50" cy="50" r="47" fill="none" stroke="#ff8ae4" stroke-opacity="0.7" stroke-width="2.5"/>
</svg>
