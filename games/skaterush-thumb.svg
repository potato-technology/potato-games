<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Skate Rush game card: a kid in a red helmet kickflips high over a glowing rail in a sunny skatepark, with S-K-A-T-E letters and coins -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb6ff"/>
      <stop offset="1" stop-color="#c9f0ff"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff8c8"/>
      <stop offset="0.5" stop-color="#ffe680" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffe680" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2895a"/>
      <stop offset="1" stop-color="#8a5a34"/>
    </linearGradient>
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a35f"/>
      <stop offset="1" stop-color="#a8713a"/>
    </linearGradient>
    <radialGradient id="letter" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#c8ffb0"/>
      <stop offset="0.6" stop-color="#7cf05a"/>
      <stop offset="1" stop-color="#2f8a18"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="540" cy="70" r="90" fill="url(#sun)"/>
  <circle cx="540" cy="70" r="32" fill="#fff6c2"/>
  <g fill="#fff" opacity="0.9">
    <ellipse cx="110" cy="70" rx="55" ry="16"/><ellipse cx="140" cy="58" rx="32" ry="16"/>
    <ellipse cx="380" cy="40" rx="44" ry="12"/><ellipse cx="404" cy="31" rx="24" ry="12"/>
  </g>
  <!-- hills and trees -->
  <path d="M0 250 Q 90 190 180 240 T 360 235 T 520 230 T 640 240 L640 300 L0 300 Z" fill="#8fd18b"/>
  <path d="M0 270 Q 120 230 240 268 T 480 262 T 640 268 L640 300 L0 300 Z" fill="#5fb35a"/>
  <g>
    <rect x="76" y="210" width="8" height="60" fill="#6b4423"/><circle cx="80" cy="200" r="26" fill="#3f9e3a"/><circle cx="64" cy="212" r="16" fill="#4fb847"/>
    <rect x="566" y="214" width="8" height="56" fill="#6b4423"/><circle cx="570" cy="204" r="24" fill="#45a840"/>
  </g>
  <!-- ground -->
  <rect x="0" y="286" width="640" height="74" fill="url(#ground)"/>
  <rect x="0" y="278" width="640" height="12" fill="#b5ada0"/>
  <rect x="0" y="280" width="640" height="7" fill="#d8d4cc"/>
  <!-- kicker ramp -->
  <path d="M40 286 L200 286 L200 230 Z" fill="url(#ramp)" stroke="#6b4423" stroke-width="3"/>
  <path d="M42 285 L200 230" stroke="#ffd43b" stroke-width="5"/>
  <!-- rail -->
  <g stroke="#495057" stroke-width="6"><path d="M330 286 V246"/><path d="M500 286 V246"/></g>
  <path d="M310 246 H520" stroke="#868e96" stroke-width="10" stroke-linecap="round"/>
  <path d="M310 243 H520" stroke="#f1f3f5" stroke-width="3" stroke-linecap="round"/>
  <!-- motion arc -->
  <path d="M200 230 Q 280 70 380 150" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round" opacity="0.85"/>
  <!-- coins -->
  <g>
    <ellipse cx="250" cy="150" rx="9" ry="11" fill="#ffd43b" stroke="#b8860b" stroke-width="2"/>
    <ellipse cx="282" cy="120" rx="9" ry="11" fill="#ffd43b" stroke="#b8860b" stroke-width="2"/>
    <ellipse cx="420" cy="208" rx="9" ry="11" fill="#ffd43b" stroke="#b8860b" stroke-width="2"/>
    <ellipse cx="450" cy="208" rx="9" ry="11" fill="#ffd43b" stroke="#b8860b" stroke-width="2"/>
  </g>
  <!-- skater mid-kickflip -->
  <g transform="translate(330 150) rotate(-8)">
    <!-- board flipping -->
    <g transform="translate(0 30) rotate(18)">
      <path d="M-42 -4 Q -36 6 -28 6 H 28 Q 36 6 42 -4 Q 36 -1 28 0 H -28 Q -36 -1 -42 -4 Z" fill="#c0392b" stroke="#3a0b06" stroke-width="2"/>
      <rect x="-28" y="1" width="56" height="3" fill="#ffd43b"/>
      <circle cx="-22" cy="12" r="6" fill="#f8f9fa" stroke="#868e96" stroke-width="2"/><circle cx="22" cy="12" r="6" fill="#f8f9fa" stroke="#868e96" stroke-width="2"/>
    </g>
    <!-- legs tucked -->
    <path d="M-4 -12 L -20 4 L -16 18" fill="none" stroke="#2b3b9c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4 -12 L 20 0 L 16 16" fill="none" stroke="#364fc7" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-26" y="14" width="18" height="8" rx="4" fill="#e9ecef"/><rect x="8" y="12" width="20" height="8" rx="4" fill="#f8f9fa"/>
    <!-- body -->
    <path d="M-8 -12 L 8 -12 L 12 -42 L -6 -44 Z" fill="#339af0" stroke="#339af0" stroke-width="9" stroke-linejoin="round"/>
    <!-- arms out -->
    <path d="M-2 -40 L -26 -52 L -42 -46" fill="none" stroke="#2b7fd0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8 -40 L 30 -52 L 46 -60" fill="none" stroke="#339af0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-42" cy="-46" r="5" fill="#f1c27d"/><circle cx="46" cy="-60" r="5" fill="#f1c27d"/>
    <!-- head and helmet -->
    <circle cx="8" cy="-60" r="14" fill="#f1c27d" stroke="#b5895a" stroke-width="1.5"/>
    <path d="M-7 -62 A 15 15 0 0 1 23 -62 Z" fill="#e03131"/>
    <ellipse cx="4" cy="-71" rx="5" ry="2.5" fill="#fff" opacity="0.5"/>
    <circle cx="15" cy="-59" r="2.2" fill="#212529"/>
    <path d="M10 -54 Q 15 -50 19 -55" fill="none" stroke="#212529" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- letters -->
  <g font-family="Fredoka, 'Arial Black', sans-serif" font-weight="900" font-size="22" text-anchor="middle">
    <circle cx="236" cy="186" r="20" fill="url(#letter)" stroke="#1f5c0e" stroke-width="2"/><text x="236" y="194" fill="#fff" stroke="#1f5c0e" stroke-width="1">S</text>
    <circle cx="470" cy="130" r="20" fill="url(#letter)" stroke="#1f5c0e" stroke-width="2"/><text x="470" y="138" fill="#fff" stroke="#1f5c0e" stroke-width="1">K</text>
  </g>
  <!-- sparks on the rail -->
  <g fill="#ffd43b"><circle cx="530" cy="240" r="3"/><circle cx="540" cy="232" r="2"/><circle cx="526" cy="228" r="2"/></g>
  <!-- title -->
  <g font-family="Fredoka, 'Arial Black', 'Trebuchet MS', sans-serif" font-weight="900" text-anchor="middle" transform="rotate(-4 320 60)">
    <text x="320" y="72" font-size="56" fill="#5a3500" stroke="#5a3500" stroke-width="10" stroke-linejoin="round">SKATE RUSH</text>
    <text x="320" y="66" font-size="56" fill="#ffb020" stroke="#3a2200" stroke-width="3" stroke-linejoin="round">SKATE <tspan fill="#7cf05a">RUSH</tspan></text>
  </g>
</svg>
