<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Tennis Ace icon: a racket and a speeding tennis ball on a blue court -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8ff0"/>
      <stop offset="1" stop-color="#2a5fb0"/>
    </linearGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#f8ffb0"/>
      <stop offset="0.6" stop-color="#d8f54a"/>
      <stop offset="1" stop-color="#8fb51a"/>
    </radialGradient>
    <clipPath id="badge"><rect x="2" y="2" width="96" height="96" rx="22"/></clipPath>
  </defs>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#bg)"/>
  <g clip-path="url(#badge)">
    <path d="M 0 74 L 100 60" stroke="#fff" stroke-width="3" opacity="0.7"/>
    <path d="M 30 0 L 18 100" stroke="#fff" stroke-width="3" opacity="0.7"/>
    <g transform="translate(40 58) rotate(-35)">
      <rect x="-4" y="16" width="8" height="30" rx="3" fill="#2b2f3a"/>
      <rect x="-4" y="22" width="8" height="2" fill="#fff"/><rect x="-4" y="28" width="8" height="2" fill="#fff"/>
      <ellipse cx="0" cy="-8" rx="17" ry="23" fill="#fff" fill-opacity="0.25" stroke="#ff5d6c" stroke-width="5"/>
      <g stroke="#fff" stroke-width="1.2" opacity="0.8">
        <line x1="-8" y1="-28" x2="-8" y2="12"/><line x1="0" y1="-31" x2="0" y2="15"/><line x1="8" y1="-28" x2="8" y2="12"/>
        <line x1="-15" y1="-16" x2="15" y2="-16"/><line x1="-16" y1="-6" x2="16" y2="-6"/><line x1="-15" y1="4" x2="15" y2="4"/>
      </g>
    </g>
    <path d="M 52 30 L 74 22" stroke="#ffd43b" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
    <circle cx="76" cy="24" r="13" fill="url(#ball)"/>
    <path d="M 68 17 A 11 11 0 0 1 70 33" fill="none" stroke="#fff" stroke-width="2.6"/>
  </g>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="2.5"/>
</svg>
