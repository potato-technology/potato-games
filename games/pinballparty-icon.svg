<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Pinball Party icon: a chrome pinball bouncing off a glowing pop bumper above a flipper -->
  <defs>
    <radialGradient id="bg" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#3a1f6a"/>
      <stop offset="1" stop-color="#0c0620"/>
    </radialGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c8d0e0"/>
      <stop offset="1" stop-color="#3a4058"/>
    </radialGradient>
    <radialGradient id="bump" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#ff7ac0"/>
      <stop offset="1" stop-color="#8a1a5a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5fae" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff5fae" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
  <circle cx="38" cy="38" r="30" fill="url(#glow)"/>
  <circle cx="38" cy="38" r="15" fill="url(#bump)"/>
  <circle cx="38" cy="38" r="15" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M22 76 L64 88 a5 5 0 0 1 -2 8 L20 86 a6 6 0 0 1 2 -10z" fill="#ffffff" stroke="#59e3ff" stroke-width="3"/>
  <g fill="#ffffff"><circle cx="58" cy="66" r="4" opacity="0.15"/><circle cx="62" cy="59" r="6" opacity="0.25"/></g>
  <circle cx="70" cy="46" r="11" fill="url(#ball)"/>
  <ellipse cx="66" cy="42" rx="3.5" ry="2.2" fill="#ffffff" transform="rotate(-30 66 42)"/>
  <circle cx="50" cy="50" r="47" fill="none" stroke="#59e3ff" stroke-opacity="0.75" stroke-width="2.5"/>
