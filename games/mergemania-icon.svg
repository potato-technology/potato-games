<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Merge Mania icon: a cracked egg tile with a little dragon peeking out -->
  <defs>
    <radialGradient id="bg" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffc06a"/>
      <stop offset="1" stop-color="#e07a1a"/>
    </radialGradient>
    <radialGradient id="egg" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#fff3de"/>
      <stop offset="1" stop-color="#dcc29a"/>
    </radialGradient>
    <radialGradient id="dr" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#b6f29e"/>
      <stop offset="1" stop-color="#3a9a3a"/>
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bg)"/>
  <rect x="4" y="4" width="92" height="40" rx="20" fill="#ffffff" opacity="0.18"/>
  <!-- dragon head -->
  <path d="M34 34 L28 18 L42 30 Z M66 34 L72 18 L58 30 Z" fill="#fff3d6" stroke="#9a7a40" stroke-width="1.5"/>
  <circle cx="50" cy="46" r="22" fill="url(#dr)" stroke="#2f7a2f" stroke-width="2.5"/>
  <circle cx="41" cy="42" r="5" fill="#2a1a14"/><circle cx="59" cy="42" r="5" fill="#2a1a14"/>
  <circle cx="42.8" cy="40" r="1.9" fill="#fff"/><circle cx="60.8" cy="40" r="1.9" fill="#fff"/>
  <!-- egg shell bottom -->
  <path d="M22 56 L30 48 L38 56 L46 48 L54 56 L62 48 L70 56 L78 50 C 80 72 66 88 50 88 C 34 88 20 72 22 56 Z" fill="url(#egg)" stroke="#a8875a" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="34" cy="70" rx="4" ry="7" fill="#ffffff" opacity="0.7" transform="rotate(20 34 70)"/>
</svg>
