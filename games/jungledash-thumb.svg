<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Jungle Dash game card: the explorer leaps over a river, grabbing coins, with a gem up high and the golden idol ahead -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fbcef"/>
      <stop offset="0.65" stop-color="#bdeeff"/>
      <stop offset="1" stop-color="#e8fbff"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.35" stop-color="#fff3b0" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6a3c"/>
      <stop offset="1" stop-color="#5e3b20"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a2ec6a"/>
      <stop offset="1" stop-color="#4fae2e"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc6f5"/>
      <stop offset="1" stop-color="#1e5ab4"/>
    </linearGradient>
    <linearGradient id="plank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d49a5c"/>
      <stop offset="1" stop-color="#8a5a2c"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc27a"/>
      <stop offset="1" stop-color="#2f8a4a"/>
    </linearGradient>
    <radialGradient id="skin" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffd9b0"/>
      <stop offset="1" stop-color="#d99a62"/>
    </radialGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ead09a"/>
      <stop offset="1" stop-color="#c9a066"/>
    </linearGradient>
    <linearGradient id="pack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8844a"/>
      <stop offset="1" stop-color="#6e4521"/>
    </linearGradient>
    <radialGradient id="coin" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.5" stop-color="#ffd43b"/>
      <stop offset="1" stop-color="#d99a0e"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.4" stop-color="#ffd43b"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2dccd"/>
      <stop offset="1" stop-color="#858072"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff0a0" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff0a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gemglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb3b3" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff3b4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shell" cx="35%" cy="25%" r="80%">
      <stop offset="0" stop-color="#9af5d6"/>
      <stop offset="0.6" stop-color="#1fae86"/>
      <stop offset="1" stop-color="#0a4a3a"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.3"/>
    </radialGradient>
    <g id="coinG">
      <circle cx="0" cy="1.5" r="11" fill="#9a6a0a"/>
      <circle cx="0" cy="0" r="11" fill="url(#coin)"/>
      <circle cx="0" cy="0" r="7" fill="none" stroke="#a8730f" stroke-opacity="0.6" stroke-width="1.6"/>
      <path d="M-4 -6 q0 3 3 3 q-3 0 -3 3 q0 -3 -3 -3 q3 0 3 -3z" fill="#fff"/>
    </g>
    <g id="palm">
      <path d="M0 0 Q8 -60 2 -120" fill="none" stroke="#3d7a52" stroke-width="7" stroke-linecap="round"/>
      <g fill="#3f8a5a">
        <ellipse cx="-24" cy="-122" rx="30" ry="8" transform="rotate(20 -24 -122)"/>
        <ellipse cx="26" cy="-124" rx="30" ry="8" transform="rotate(-20 26 -124)"/>
        <ellipse cx="-16" cy="-134" rx="26" ry="7" transform="rotate(-30 -16 -134)"/>
        <ellipse cx="18" cy="-136" rx="26" ry="7" transform="rotate(30 18 -136)"/>
        <ellipse cx="2" cy="-140" rx="8" ry="22"/>
      </g>
    </g>
  </defs>

  <!-- sky -->
  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="540" cy="70" r="110" fill="url(#sun)"/>
  <circle cx="540" cy="70" r="30" fill="#fff8d6"/>
  <g fill="#fff" opacity="0.9">
    <ellipse cx="150" cy="60" rx="40" ry="14"/><ellipse cx="180" cy="52" rx="26" ry="14"/><ellipse cx="124" cy="56" rx="20" ry="10"/>
    <ellipse cx="380" cy="40" rx="30" ry="10"/><ellipse cx="400" cy="34" rx="18" ry="9"/>
  </g>

  <!-- misty mountains and jungle -->
  <path d="M0 200 Q60 120 140 160 Q220 100 300 150 Q380 110 460 150 Q540 120 640 160 L640 280 L0 280 Z" fill="#86c2a4"/>
  <path d="M0 200 Q60 120 140 160 Q220 100 300 150 Q380 110 460 150 Q540 120 640 160 L640 280 L0 280 Z" fill="#fff" opacity="0.2"/>
  <path d="M0 240 Q80 206 160 228 Q240 200 320 226 Q400 204 480 226 Q560 206 640 228 L640 300 L0 300 Z" fill="#4f9a6a"/>
  <use href="#palm" transform="translate(60 250) scale(0.8)"/>
  <use href="#palm" transform="translate(200 244) scale(0.95)"/>
  <use href="#palm" transform="translate(430 246) scale(0.85)"/>
  <use href="#palm" transform="translate(560 250) scale(0.75)"/>

  <!-- ground on both sides of a river -->
  <rect x="236" y="300" width="148" height="60" fill="url(#water)"/>
  <path d="M236 302 Q254 296 272 302 T308 302 T344 302 T384 302" fill="none" stroke="#c8ecff" stroke-width="3"/>
  <g>
    <rect x="-10" y="272" width="250" height="100" rx="10" fill="url(#dirt)"/>
    <path d="M-10 272 L240 272 L240 286 Q228 292 216 286 Q204 292 192 286 Q180 292 168 286 Q156 292 144 286 Q132 292 120 286 Q108 292 96 286 Q84 292 72 286 Q60 292 48 286 Q36 292 24 286 Q12 292 0 286 L-10 286 Z" fill="url(#grass)"/>
    <rect x="-10" y="272" width="250" height="4" fill="#fff" opacity="0.3"/>
    <g fill="#000" opacity="0.15"><ellipse cx="40" cy="316" rx="5" ry="3"/><ellipse cx="120" cy="330" rx="6" ry="3"/><ellipse cx="190" cy="310" rx="4" ry="2.5"/><ellipse cx="80" cy="346" rx="5" ry="3"/></g>
  </g>
  <g>
    <rect x="380" y="272" width="270" height="100" rx="10" fill="url(#dirt)"/>
    <path d="M380 272 L650 272 L650 286 Q638 292 626 286 Q614 292 602 286 Q590 292 578 286 Q566 292 554 286 Q542 292 530 286 Q518 292 506 286 Q494 292 482 286 Q470 292 458 286 Q446 292 434 286 Q422 292 410 286 Q398 292 386 286 L380 286 Z" fill="url(#grass)"/>
    <rect x="380" y="272" width="270" height="4" fill="#fff" opacity="0.3"/>
    <g fill="#000" opacity="0.15"><ellipse cx="430" cy="320" rx="5" ry="3"/><ellipse cx="520" cy="336" rx="6" ry="3"/><ellipse cx="600" cy="312" rx="4" ry="2.5"/></g>
  </g>
  <g fill="#fff"><circle cx="60" cy="270" r="3"/><circle cx="64" cy="266" r="3"/><circle cx="56" cy="266" r="3"/></g>
  <circle cx="60" cy="267" r="2" fill="#f5a623"/>

  <!-- wooden plank up high with a gem -->
  <g>
    <rect x="452" y="140" width="112" height="14" rx="4" fill="url(#plank)"/>
    <rect x="456" y="141" width="104" height="3" fill="#fff" opacity="0.3"/>
    <rect x="462" y="154" width="5" height="16" fill="#000" opacity="0.2"/><rect x="549" y="154" width="5" height="16" fill="#000" opacity="0.2"/>
    <circle cx="508" cy="108" r="34" fill="url(#gemglow)"/>
    <g transform="translate(508 108) scale(1.5)">
      <path d="M0 -16 L13 -6 L8 14 L-8 14 L-13 -6 Z" fill="#8a0a16"/>
      <path d="M0 -16 L13 -6 L7 -3 L0 -9 Z" fill="#ff3b4a"/>
      <path d="M13 -6 L8 14 L4 7 L7 -3 Z" fill="#c41a29"/>
      <path d="M8 14 L-8 14 L-4 7 L4 7 Z" fill="#a8121f"/>
      <path d="M-8 14 L-13 -6 L-7 -3 L-4 7 Z" fill="#ff6b78"/>
      <path d="M-13 -6 L0 -16 L0 -9 L-7 -3 Z" fill="#ffb3b3"/>
      <path d="M0 -9 L7 -3 L4 7 L-4 7 L-7 -3 Z" fill="#ff3b4a"/>
      <path d="M-7 -3 L0 -9 L-1 -2 Z" fill="#fff" opacity="0.6"/>
    </g>
    <path d="M482 86 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#fff"/>
  </g>

  <!-- the golden idol at the end -->
  <g transform="translate(596 272)">
    <circle cx="0" cy="-60" r="56" fill="url(#glow)"/>
    <rect x="-22" y="-34" width="44" height="34" fill="url(#stone)"/>
    <rect x="-28" y="-40" width="56" height="9" fill="#cfc8b8"/>
    <rect x="-13" y="-70" width="26" height="30" rx="8" fill="url(#gold)"/>
    <circle cx="0" cy="-80" r="15" fill="url(#gold)"/>
    <circle cx="-13" cy="-90" r="6" fill="url(#gold)"/>
    <circle cx="13" cy="-90" r="6" fill="url(#gold)"/>
    <circle cx="-5" cy="-82" r="3.2" fill="#ff3b4a"/><circle cx="5" cy="-82" r="3.2" fill="#2fd36a"/>
    <path d="M-5 -75 Q0 -70 5 -75" fill="none" stroke="#8a6200" stroke-width="1.8"/>
  </g>

  <!-- a beetle walking along -->
  <g transform="translate(470 272)">
    <ellipse cx="0" cy="0" rx="18" ry="4" fill="#000" opacity="0.25"/>
    <g stroke="#2a2a2a" stroke-width="2.4"><path d="M-10 -6 L-13 0 M0 -6 L2 0 M10 -6 L12 0"/></g>
    <path d="M-20 -6 A17 13 0 0 1 14 -6 Z" fill="url(#shell)"/>
    <line x1="-3" y1="-19" x2="-3" y2="-6" stroke="#000" stroke-opacity="0.35" stroke-width="1.6"/>
    <ellipse cx="-10" cy="-14" rx="5" ry="2.5" fill="#fff" opacity="0.45" transform="rotate(-25 -10 -14)"/>
    <ellipse cx="-18" cy="-8" rx="7" ry="6" fill="#2a2a2a"/>
    <circle cx="-20" cy="-10" r="2.4" fill="#fff"/><circle cx="-20.6" cy="-10" r="1.2" fill="#111"/>
    <path d="M-20 -13 Q-25 -22 -29 -20" fill="none" stroke="#2a2a2a" stroke-width="1.4"/>
  </g>

  <!-- coins in an arc over the river -->
  <use href="#coinG" transform="translate(250 190)"/>
  <use href="#coinG" transform="translate(286 150)"/>
  <use href="#coinG" transform="translate(386 160)"/>
  <use href="#coinG" transform="translate(420 200)"/>
  <g fill="#ffe58a"><circle cx="330" cy="128" r="3"/><circle cx="342" cy="118" r="2.4"/><circle cx="318" cy="116" r="2"/></g>

  <!-- the explorer, mid jump -->
  <g transform="translate(336 236) scale(2.3)">
    <ellipse cx="0" cy="34" rx="14" ry="3.5" fill="#000" opacity="0.15"/>
    <!-- back arm and leg -->
    <rect x="-5" y="-33" width="6" height="16" rx="3" fill="#d9a066" transform="rotate(-150 -2 -33)"/>
    <rect x="-6.5" y="-17" width="7" height="15" rx="3.5" fill="#6e5228" transform="rotate(40 -3 -17)"/>
    <rect x="-14" y="-6" width="11" height="6" rx="3" fill="#4a2f18" transform="rotate(40 -3 -17)"/>
    <!-- backpack -->
    <rect x="-17" y="-39" width="12" height="21" rx="4" fill="url(#pack)"/>
    <rect x="-17" y="-31" width="12" height="3" fill="#5b3a1e"/>
    <!-- body -->
    <rect x="-8" y="-38" width="17" height="22" rx="6" fill="url(#shirt)"/>
    <rect x="-8" y="-21" width="17" height="3" fill="#5b3a1e"/>
    <circle cx="1" cy="-19.5" r="1.6" fill="#ffd43b"/>
    <line x1="-5" y1="-37" x2="3" y2="-22" stroke="#6e4521" stroke-width="2.5"/>
    <!-- front leg -->
    <rect x="0" y="-17" width="7" height="15" rx="3.5" fill="#8a6a3a" transform="rotate(-50 3 -17)"/>
    <rect x="-1" y="-6" width="11" height="6" rx="3" fill="#5b3a1e" transform="rotate(-50 3 -17)"/>
    <!-- head -->
    <rect x="-2" y="-42" width="6" height="5" fill="#d9a066"/>
    <circle cx="2" cy="-48" r="10.5" fill="url(#skin)"/>
    <path d="M-6 -40 L9 -40 L8 -36.5 L-5 -36.5 Z" fill="#d9463a"/>
    <path d="M9 -40 L15 -36 L10 -34 Z" fill="#d9463a"/>
    <circle cx="6.5" cy="-49" r="1.9" fill="#2a1a10"/>
    <circle cx="7.1" cy="-49.7" r="0.7" fill="#fff"/>
    <circle cx="9" cy="-44.5" r="2.2" fill="#ff8f8f" opacity="0.45"/>
    <path d="M3.9 -44 A2.6 2.6 0 0 0 9.1 -44 Z" fill="#7a2a1e"/>
    <!-- safari hat -->
    <ellipse cx="2" cy="-55" rx="16" ry="4.5" fill="#a8844a"/>
    <path d="M-8 -56 A10 9 0 0 1 12 -56 Z" fill="url(#hat)"/>
    <rect x="-8" y="-58" width="20" height="3" fill="#7a5a2a"/>
    <ellipse cx="-1" cy="-61" rx="4" ry="2" fill="#fff" opacity="0.35" transform="rotate(-25 -1 -61)"/>
    <!-- front arm reaching for a coin -->
    <rect x="-1" y="-33" width="6" height="16" rx="3" fill="#f1c27d" transform="rotate(-130 2 -33)"/>
    <circle cx="14" cy="-43" r="3.5" fill="#f1c27d"/>
  </g>
  <!-- speed lines -->
  <g stroke="#fff" stroke-opacity="0.75" stroke-width="3" stroke-linecap="round">
    <line x1="268" y1="226" x2="296" y2="226"/><line x1="262" y1="246" x2="294" y2="246"/><line x1="274" y1="206" x2="298" y2="206"/>
  </g>

  <!-- vines hanging from the top -->
  <g fill="none" stroke="#2f6e3f" stroke-width="3">
    <path d="M30 0 Q42 40 30 80"/><path d="M90 0 Q80 30 92 56"/><path d="M610 0 Q600 40 612 74"/>
  </g>
  <g fill="#3f8a4a">
    <ellipse cx="38" cy="20" rx="8" ry="4" transform="rotate(30 38 20)"/><ellipse cx="28" cy="40" rx="8" ry="4" transform="rotate(-30 28 40)"/><ellipse cx="38" cy="60" rx="8" ry="4" transform="rotate(30 38 60)"/>
    <ellipse cx="84" cy="22" rx="7" ry="3.5" transform="rotate(-30 84 22)"/><ellipse cx="92" cy="42" rx="7" ry="3.5" transform="rotate(30 92 42)"/>
    <ellipse cx="604" cy="24" rx="8" ry="4" transform="rotate(-30 604 24)"/><ellipse cx="614" cy="48" rx="8" ry="4" transform="rotate(30 614 48)"/>
  </g>
  <g fill="#2f6e3f">
    <ellipse cx="0" cy="-6" rx="70" ry="26"/><ellipse cx="640" cy="-6" rx="70" ry="24"/>
  </g>

  <!-- title sign -->
  <g transform="translate(20 62) rotate(-4)">
    <rect x="-2" y="4" width="232" height="112" rx="20" fill="#14451b"/>
    <rect width="228" height="108" rx="20" fill="#5fd068" stroke="#1f6b2a" stroke-width="4"/>
    <rect x="10" y="7" width="208" height="10" rx="5" fill="#fff" opacity="0.3"/>
    <path d="M-6 18 C10 4 26 6 34 -8 C22 -2 8 -4 -6 18Z" fill="#3f9a3a" stroke="#14451b" stroke-width="2.5"/>
    <path d="M232 92 C222 106 210 112 196 126 C214 124 228 112 232 92Z" fill="#3f9a3a" stroke="#14451b" stroke-width="2.5"/>
    <g font-family="'Arial Rounded MT Bold', 'Trebuchet MS', Arial, sans-serif" font-weight="900" text-anchor="middle" stroke="#0b2a0f" stroke-width="7" stroke-linejoin="round" paint-order="stroke">
      <text x="114" y="52" font-size="44" fill="#fff6c4">JUNGLE</text>
      <text x="114" y="96" font-size="44" fill="#ffd43b">DASH</text>
    </g>
  </g>

  <rect width="640" height="360" fill="url(#vignette)"/>
</svg>
