<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Moon Lander icon: a lander with its engine firing over the moon -->
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="85%">
      <stop offset="0" stop-color="#2a3a8a"/>
      <stop offset="1" stop-color="#070a1c"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e5ee"/>
      <stop offset="1" stop-color="#7a7f8e"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.4" stop-color="#ffc83a"/>
      <stop offset="1" stop-color="#ff5a14" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9821c"/>
      <stop offset="0.5" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#b07a16"/>
    </linearGradient>
    <clipPath id="c"><rect x="2" y="2" width="96" height="96" rx="24"/></clipPath>
  </defs>
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#bg)"/>
  <g clip-path="url(#c)">
    <g fill="#fff"><circle cx="16" cy="18" r="1.3"/><circle cx="80" cy="14" r="1.1"/><circle cx="88" cy="40" r="1.4"/><circle cx="24" cy="44" r="1"/></g>
    <ellipse cx="50" cy="108" rx="70" ry="30" fill="url(#moon)"/>
    <ellipse cx="30" cy="86" rx="8" ry="2.5" fill="#000" opacity="0.15"/>
    <ellipse cx="72" cy="90" rx="6" ry="2" fill="#000" opacity="0.15"/>
  </g>
  <g transform="translate(50 44)">
    <path d="M-6 16 Q0 46 6 16 Z" fill="url(#flame)"/>
    <g stroke="#c7cddb" stroke-width="3" stroke-linecap="round"><path d="M-9 6 L-16 22 M9 6 L16 22"/></g>
    <rect x="-20" y="21" width="9" height="3.5" rx="1.7" fill="#c7cddb"/>
    <rect x="11" y="21" width="9" height="3.5" rx="1.7" fill="#c7cddb"/>
    <rect x="-14" y="-2" width="28" height="13" rx="3" fill="url(#foil)"/>
    <path d="M-12 -1 V-11 Q-12 -24 0 -24 Q12 -24 12 -11 V-1 Z" fill="#f4f6fb"/>
    <circle cx="0" cy="-12" r="6.5" fill="#5fd4ff" stroke="#9aa3b8" stroke-width="2"/>
    <circle cx="-2" cy="-14" r="2" fill="#fff"/>
  </g>
  <path d="M82 60 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#8af0ff"/>
</svg>
