<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Lucky Lake game card: at golden hour an angler on a wooden dock reels in a rainbow trout that leaps
       out of the lake in a big splash, while the cut-away water below shows fish, weeds, light rays and a treasure chest -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f74c8"/>
      <stop offset="0.55" stop-color="#f6a982"/>
      <stop offset="1" stop-color="#ffe2b0"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.25" stop-color="#ffe7a8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffc77a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b8fb8"/>
      <stop offset="1" stop-color="#7f7aa6"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f9a5a"/>
      <stop offset="1" stop-color="#3f7540"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ccfc4"/>
      <stop offset="0.35" stop-color="#2c96a0"/>
      <stop offset="0.75" stop-color="#145a72"/>
      <stop offset="1" stop-color="#0a3048"/>
    </linearGradient>
    <linearGradient id="surf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9a8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd9a8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d0" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fff8d0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fbf58"/>
      <stop offset="0.12" stop-color="#a08a58"/>
      <stop offset="0.5" stop-color="#6e5a38"/>
      <stop offset="1" stop-color="#3a2e1c"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2a40" stop-opacity="0"/>
      <stop offset="1" stop-color="#06202f" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="plank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c08a4c"/>
      <stop offset="1" stop-color="#7a5228"/>
    </linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a3020"/>
      <stop offset="0.5" stop-color="#8a6440"/>
      <stop offset="1" stop-color="#3a2416"/>
    </linearGradient>
    <linearGradient id="vest" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8702a"/>
      <stop offset="1" stop-color="#ffa448"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f5a9a"/>
      <stop offset="1" stop-color="#4a7ac0"/>
    </linearGradient>
    <radialGradient id="skin" cx="60%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffe0bf"/>
      <stop offset="1" stop-color="#e0a07a"/>
    </radialGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ab866"/>
      <stop offset="1" stop-color="#5a7a32"/>
    </linearGradient>
    <!-- trout body -->
    <linearGradient id="trout" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f6a52"/>
      <stop offset="0.42" stop-color="#bfd0c4"/>
      <stop offset="0.8" stop-color="#fbfbf2"/>
      <stop offset="1" stop-color="#d0d4cc"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a8a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff5a8a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff5a8a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="troutFin" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#7a8a7a"/>
      <stop offset="1" stop-color="#b8b0a0" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="koi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8e2dc"/>
    </linearGradient>
    <linearGradient id="bass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e4a1e"/>
      <stop offset="0.45" stop-color="#7c9c4c"/>
      <stop offset="0.85" stop-color="#ece8c4"/>
      <stop offset="1" stop-color="#c8c4a0"/>
    </linearGradient>
    <linearGradient id="gill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f5a4a"/>
      <stop offset="0.45" stop-color="#6a9a74"/>
      <stop offset="0.85" stop-color="#f2a040"/>
      <stop offset="1" stop-color="#c88030"/>
    </linearGradient>
    <radialGradient id="shine" cx="40%" cy="30%" r="45%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chestLid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b87a42"/>
      <stop offset="1" stop-color="#7a4a22"/>
    </linearGradient>
    <radialGradient id="chestGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe680" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffe680" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bobRed" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ff9a8a"/>
      <stop offset="1" stop-color="#c8201a"/>
    </radialGradient>
    <path id="fishBody" d="M50 0 C50 -11 31 -24 8 -24 C-10 -23 -22 -10 -28 -6 L-28 6 C-22 10 -10 23 8 24 C31 24 50 11 50 0 Z"/>
    <path id="fishTail" d="M-26 -5 Q-36 -12 -48 -24 Q-41 -8 -41 0 Q-41 8 -48 24 Q-36 12 -26 5 Z"/>
    <clipPath id="waterClip"><rect x="0" y="190" width="640" height="170"/></clipPath>
  </defs>

  <!-- sky -->
  <rect width="640" height="200" fill="url(#sky)"/>
  <circle cx="470" cy="150" r="120" fill="url(#sun)"/>
  <circle cx="470" cy="150" r="26" fill="#fff4cc"/>
  <!-- clouds -->
  <g fill="#ffe4d0" opacity="0.92">
    <circle cx="96" cy="58" r="18"/><circle cx="120" cy="48" r="24"/><circle cx="148" cy="58" r="18"/><circle cx="124" cy="64" r="16"/>
    <circle cx="540" cy="46" r="14"/><circle cx="560" cy="38" r="19"/><circle cx="584" cy="46" r="14"/>
  </g>
  <g fill="#f6c4b0" opacity="0.8">
    <ellipse cx="124" cy="70" rx="40" ry="6"/><ellipse cx="562" cy="52" rx="34" ry="5"/>
  </g>
  <!-- birds -->
  <g fill="none" stroke="#3a3048" stroke-width="2" stroke-linecap="round">
    <path d="M250 70 q6 -6 11 0 q5 -6 11 0"/>
    <path d="M282 56 q5 -5 9 0 q4 -5 9 0"/>
  </g>
  <!-- far hills -->
  <path d="M0 192 L0 160 Q60 132 130 150 Q200 120 280 146 Q350 128 420 150 Q520 118 640 148 L640 192 Z" fill="url(#hillFar)"/>
  <path d="M180 192 Q220 160 280 172 Q330 158 380 174 Q440 160 520 176 Q580 166 640 172 L640 192 Z" fill="url(#hillNear)"/>
  <!-- trees on the far shore -->
  <g>
    <circle cx="300" cy="168" r="11" fill="#4f8a3a"/><circle cx="312" cy="164" r="13" fill="#5aa046"/><circle cx="326" cy="170" r="10" fill="#3f7a34"/>
    <circle cx="560" cy="170" r="10" fill="#4f8a3a"/><circle cx="574" cy="164" r="13" fill="#5aa046"/><circle cx="588" cy="170" r="10" fill="#3f7a34"/>
  </g>

  <!-- water body -->
  <path d="M0 360 L0 190 Q40 186 80 190 T160 190 T240 190 T320 190 T400 190 T480 190 T560 190 T640 190 L640 360 Z" fill="url(#water)"/>
  <rect x="0" y="188" width="640" height="26" fill="url(#surf)"/>
  <!-- light rays -->
  <g clip-path="url(#waterClip)">
    <path d="M250 190 L285 190 L380 360 L330 360 Z" fill="url(#ray)"/>
    <path d="M360 190 L400 190 L500 360 L445 360 Z" fill="url(#ray)"/>
    <path d="M470 190 L500 190 L600 360 L560 360 Z" fill="url(#ray)"/>
    <path d="M560 190 L590 190 L680 360 L640 360 Z" fill="url(#ray)" opacity="0.7"/>
  </g>
  <!-- lakebed -->
  <path d="M0 360 L0 168 Q40 166 80 182 Q160 214 240 262 Q330 316 420 330 Q520 342 640 340 L640 360 Z" fill="url(#bed)"/>
  <path d="M90 186 Q160 214 240 262 Q330 316 420 330 Q520 342 640 340" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
  <g fill="#000" fill-opacity="0.13">
    <ellipse cx="140" cy="226" rx="4" ry="3"/><ellipse cx="210" cy="270" rx="5" ry="3"/><ellipse cx="300" cy="312" rx="4" ry="2.5"/><ellipse cx="380" cy="336" rx="5" ry="3"/><ellipse cx="520" cy="350" rx="4" ry="2.5"/><ellipse cx="180" cy="290" rx="3" ry="2"/>
  </g>
  <g fill="#fff" fill-opacity="0.1">
    <ellipse cx="170" cy="246" rx="4" ry="2.5"/><ellipse cx="260" cy="296" rx="3" ry="2"/><ellipse cx="460" cy="342" rx="4" ry="2.5"/>
  </g>
  <!-- rock -->
  <path d="M330 320 Q342 296 366 300 Q386 302 392 326 Z" fill="#6a6a62"/>
  <path d="M340 316 Q348 302 362 304" fill="none" stroke="#9a9a90" stroke-width="3" stroke-linecap="round"/>

  <!-- weeds -->
  <g fill="none" stroke-linecap="round">
    <path d="M220 258 Q212 228 222 200 Q230 186 226 176" stroke="#3f8a3a" stroke-width="4"/>
    <path d="M232 262 Q240 236 232 214" stroke="#5aa842" stroke-width="3"/>
    <path d="M300 310 Q292 280 304 254 Q312 236 306 220" stroke="#2f7a36" stroke-width="5"/>
    <path d="M590 340 Q600 300 588 270 Q580 250 590 232" stroke="#3f8a3a" stroke-width="5"/>
    <path d="M604 342 Q612 316 606 296" stroke="#5aa842" stroke-width="3"/>
  </g>
  <g fill="#5aa842">
    <ellipse cx="214" cy="228" rx="8" ry="3" transform="rotate(-25 214 228)"/>
    <ellipse cx="228" cy="206" rx="8" ry="3" transform="rotate(25 228 206)"/>
    <ellipse cx="296" cy="276" rx="9" ry="3.2" transform="rotate(-25 296 276)"/>
    <ellipse cx="312" cy="250" rx="9" ry="3.2" transform="rotate(25 312 250)"/>
    <ellipse cx="596" cy="300" rx="9" ry="3.2" transform="rotate(25 596 300)"/>
    <ellipse cx="582" cy="272" rx="9" ry="3.2" transform="rotate(-25 582 272)"/>
  </g>

  <!-- treasure chest on the bottom -->
  <circle cx="500" cy="328" r="36" fill="url(#chestGlow)"/>
  <g transform="translate(500 330) rotate(-6)">
    <rect x="-22" y="-4" width="44" height="20" rx="3" fill="#6a3c1c"/>
    <path d="M-22 -4 Q-22 -20 0 -20 Q22 -20 22 -4 Z" fill="url(#chestLid)"/>
    <rect x="-16" y="-18" width="4" height="34" fill="#ffcc33"/>
    <rect x="12" y="-18" width="4" height="34" fill="#ffcc33"/>
    <rect x="-22" y="-6" width="44" height="3.5" fill="#ffcc33"/>
    <rect x="-4" y="-8" width="8" height="10" rx="2" fill="#ffe680"/>
  </g>
  <path d="M486 296 q0 6 6 6 q-6 0 -6 6 q0 -6 -6 -6 q6 0 6 -6z" fill="#fff6c0"/>
  <path d="M518 304 q0 4 4 4 q-4 0 -4 4 q0 -4 -4 -4 q4 0 4 -4z" fill="#fff6c0"/>

  <!-- swimming fish -->
  <g transform="translate(420 250) scale(0.62)">
    <use href="#fishTail" fill="#ffe2d0"/>
    <path d="M14 -24 Q2 -38 -14 -22 Z" fill="#ffe2d0"/>
    <use href="#fishBody" fill="url(#koi)"/>
    <ellipse cx="22" cy="-10" rx="14" ry="10" fill="#ff6a20"/>
    <ellipse cx="-8" cy="-6" rx="11" ry="12" fill="#ff7a30"/>
    <ellipse cx="6" cy="10" rx="8" ry="6" fill="#ff8a40"/>
    <ellipse cx="-2" cy="-16" rx="4" ry="6" fill="#1a1a22"/>
    <use href="#fishBody" fill="url(#shine)"/>
    <circle cx="38" cy="-4" r="3.6" fill="#fff"/><circle cx="39" cy="-4" r="2.2" fill="#111"/>
    <path d="M48 4 q8 4 10 12" fill="none" stroke="#e0b8a0" stroke-width="1.6"/>
  </g>
  <g transform="translate(560 282) scale(-0.5 0.5)">
    <use href="#fishTail" fill="#56703a"/>
    <path d="M24 -22 L18 -36 L12 -24 L6 -38 L0 -24 L-6 -34 L-12 -20 Z" fill="#56703a"/>
    <use href="#fishBody" fill="url(#bass)"/>
    <path d="M44 -2 Q10 -4 -26 0" stroke="#2e4a1e" stroke-opacity="0.55" stroke-width="7" fill="none" stroke-dasharray="9 3"/>
    <use href="#fishBody" fill="url(#shine)"/>
    <circle cx="38" cy="-5" r="3.6" fill="#f2e090"/><circle cx="39" cy="-5" r="2.2" fill="#111"/>
    <path d="M50 3 Q42 7 32 4" fill="none" stroke="#2a1a10" stroke-width="1.6"/>
  </g>
  <g transform="translate(270 230) scale(0.42)">
    <path d="M-26 -8 Q-40 -22 -46 -18 Q-42 0 -46 18 Q-40 22 -26 8 Z" fill="#3b5f55"/>
    <path d="M30 -26 L22 -44 L14 -28 L6 -44 L-2 -28 L-10 -40 L-18 -24 Z" fill="#3b5f55"/>
    <path d="M50 0 C50 -20 30 -34 6 -34 C-14 -32 -24 -16 -28 -8 L-28 8 C-24 16 -14 32 6 34 C30 34 50 20 50 0 Z" fill="url(#gill)"/>
    <ellipse cx="22" cy="-2" rx="5" ry="7" fill="#1a2440"/>
    <circle cx="36" cy="-6" r="4.4" fill="#fff"/><circle cx="37" cy="-6" r="2.6" fill="#111"/>
  </g>
  <!-- bubbles -->
  <g fill="none" stroke="#e8fbff" stroke-opacity="0.7" stroke-width="1.2">
    <circle cx="452" cy="232" r="3"/><circle cx="458" cy="218" r="2"/><circle cx="450" cy="206" r="2.5"/>
    <circle cx="612" cy="250" r="3"/><circle cx="606" cy="232" r="2"/>
  </g>
  <!-- depth darkening -->
  <rect x="0" y="190" width="640" height="170" fill="url(#deep)"/>

  <!-- surface shine -->
  <path d="M0 190 Q40 186 80 190 T160 190 T240 190 T320 190 T400 190 T480 190 T560 190 T640 190" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
  <g stroke="#fff3c8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8">
    <line x1="452" y1="198" x2="488" y2="198"/><line x1="458" y1="206" x2="482" y2="206"/><line x1="462" y1="214" x2="478" y2="214"/>
  </g>

  <!-- dock -->
  <rect x="34" y="186" width="10" height="70" fill="url(#post)"/>
  <rect x="120" y="186" width="10" height="80" fill="url(#post)"/>
  <rect x="0" y="168" width="196" height="12" fill="url(#plank)"/>
  <g stroke="#3a2010" stroke-opacity="0.4">
    <line x1="22" y1="168" x2="22" y2="180"/><line x1="44" y1="168" x2="44" y2="180"/><line x1="66" y1="168" x2="66" y2="180"/><line x1="88" y1="168" x2="88" y2="180"/><line x1="110" y1="168" x2="110" y2="180"/><line x1="132" y1="168" x2="132" y2="180"/><line x1="154" y1="168" x2="154" y2="180"/><line x1="176" y1="168" x2="176" y2="180"/>
  </g>
  <rect x="0" y="180" width="196" height="4" fill="#000" fill-opacity="0.25"/>
  <rect x="186" y="150" width="10" height="34" fill="url(#post)"/>
  <ellipse cx="191" cy="150" rx="5" ry="2" fill="#a8845a"/>
  <!-- bucket and tackle box -->
  <path d="M60 148 L82 148 L79 168 L63 168 Z" fill="#8aa0b0"/>
  <path d="M61 148 a10 9 0 0 1 20 0" fill="none" stroke="#3a4a54" stroke-width="1.5"/>
  <rect x="94" y="154" width="26" height="14" rx="3" fill="#2f9a56"/>
  <rect x="104" y="151" width="6" height="3" fill="#c8d0d0"/>

  <!-- angler sitting at the end of the dock -->
  <g>
    <path d="M150 162 L172 163 L178 190" fill="none" stroke="#2c3a5c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M150 162 L168 162 L170 186" fill="none" stroke="#34446a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="182" cy="193" rx="8" ry="5" fill="#5a3a22"/>
    <ellipse cx="174" cy="190" rx="8" ry="5" fill="#4a2e1a"/>
    <path d="M154 136 Q166 148 176 140" fill="none" stroke="#2f5a9a" stroke-width="7" stroke-linecap="round"/>
    <rect x="140" y="124" width="26" height="40" rx="10" fill="url(#shirt)" transform="rotate(-8 152 164)"/>
    <rect x="140" y="127" width="26" height="28" rx="8" fill="url(#vest)" transform="rotate(-8 152 164)"/>
    <rect x="141" y="142" width="26" height="3" fill="#f4f4f4" transform="rotate(-8 152 164)"/>
    <circle cx="150" cy="110" r="14" fill="url(#skin)"/>
    <circle cx="143" cy="112" r="3.4" fill="#e8a884"/>
    <circle cx="158" cy="107" r="2" fill="#1d1a17"/>
    <path d="M154 115 q4 4 8 0" fill="none" stroke="#7a3a2a" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="155" cy="114" r="2.6" fill="#ff8080" fill-opacity="0.35"/>
    <rect x="137" y="86" width="25" height="15" rx="7" fill="url(#hat)"/>
    <rect x="137" y="96" width="25" height="4" fill="#4a6326"/>
    <ellipse cx="150" cy="101" rx="20" ry="4.6" fill="#6b8a3a"/>
    <path d="M140 94 L130 84 L143 90 Z" fill="#ff5a8a"/>
  </g>
  <!-- rod, bent by the fish -->
  <path d="M166 160 Q230 40 330 64" fill="none" stroke="#3a2a1c" stroke-width="5" stroke-linecap="round" stroke-dasharray="40 400"/>
  <path d="M166 160 Q230 40 330 64" fill="none" stroke="#b07a3e" stroke-width="3" stroke-linecap="round"/>
  <circle cx="186" cy="132" r="7" fill="#c8ccd2"/>
  <circle cx="186" cy="132" r="3" fill="#6a7480"/>
  <path d="M172 138 Q180 128 192 122" fill="none" stroke="#3a6ab0" stroke-width="7" stroke-linecap="round"/>
  <circle cx="190" cy="124" r="5" fill="#f2c29a"/>
  <!-- tight line to the leaping fish -->
  <path d="M330 64 L456 116" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.4"/>

  <!-- splash -->
  <g fill="#e8fbff">
    <path d="M396 192 Q402 160 412 150 Q408 170 414 192 Z" fill-opacity="0.85"/>
    <path d="M420 192 Q424 150 440 136 Q430 168 436 192 Z" fill-opacity="0.9"/>
    <path d="M444 192 Q456 162 470 158 Q458 176 460 192 Z" fill-opacity="0.85"/>
    <path d="M466 192 Q480 172 494 172 Q480 184 480 192 Z" fill-opacity="0.75"/>
    <circle cx="400" cy="140" r="3"/><circle cx="392" cy="158" r="2.4"/><circle cx="484" cy="148" r="2.6"/><circle cx="498" cy="164" r="2"/><circle cx="430" cy="124" r="2.2"/><circle cx="470" cy="134" r="2.4"/>
  </g>
  <ellipse cx="444" cy="192" rx="62" ry="7" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2"/>
  <ellipse cx="444" cy="192" rx="88" ry="10" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- the leaping rainbow trout -->
  <g transform="translate(440 128) rotate(-28) scale(1.55)">
    <use href="#fishTail" fill="url(#troutFin)" transform="rotate(14 -28 0)"/>
    <path d="M18 -23 Q8 -40 -10 -22 Z" fill="#8a9a8a"/>
    <path d="M-6 22 Q-12 34 -20 18 Z" fill="#a0a090"/>
    <path d="M14 22 Q10 32 2 22 Z" fill="#a0a090"/>
    <use href="#fishBody" fill="url(#trout)"/>
    <path d="M48 2 C30 -6 0 -6 -28 -2 L-28 6 C0 8 30 10 48 6 Z" fill="url(#pink)"/>
    <g fill="#2a3a2e" fill-opacity="0.6">
      <circle cx="20" cy="-14" r="1.4"/><circle cx="8" cy="-17" r="1.3"/><circle cx="-4" cy="-12" r="1.4"/><circle cx="-14" cy="-8" r="1.2"/><circle cx="14" cy="-8" r="1.2"/><circle cx="2" cy="-6" r="1.3"/><circle cx="-18" cy="-2" r="1.1"/><circle cx="26" cy="-6" r="1.1"/><circle cx="-8" cy="4" r="1.1"/>
    </g>
    <use href="#fishBody" fill="url(#shine)"/>
    <path d="M28 -12 Q24 0 28 12" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="1.4"/>
    <ellipse cx="22" cy="6" rx="7" ry="3.6" fill="#a8a090" transform="rotate(30 22 6)"/>
    <circle cx="38" cy="-4" r="4" fill="#f2e090"/>
    <circle cx="39" cy="-4" r="2.4" fill="#111"/>
    <circle cx="37.6" cy="-5.4" r="0.9" fill="#fff"/>
    <path d="M50 2 Q46 6 40 5" fill="none" stroke="#3a1a1a" stroke-width="1.4"/>
    <use href="#fishBody" fill="none" stroke="#2a4a3a" stroke-opacity="0.5" stroke-width="1"/>
  </g>
  <!-- droplets around the fish -->
  <g fill="#e8fbff">
    <circle cx="512" cy="96" r="3"/><circle cx="526" cy="112" r="2.2"/><circle cx="376" cy="104" r="2.6"/><circle cx="364" cy="124" r="2"/><circle cx="500" cy="76" r="2"/>
  </g>
