<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Jet Pup game card: a puppy with a jetpack zooming past a zapper in a bright lab -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f6f4"/>
      <stop offset="1" stop-color="#bfe2de"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ec6ff"/>
      <stop offset="1" stop-color="#d8f3ff"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8796a6"/>
      <stop offset="1" stop-color="#5d6876"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6cd72"/>
      <stop offset="1" stop-color="#c98e2c"/>
    </linearGradient>
    <radialGradient id="head" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffe0a0"/>
      <stop offset="1" stop-color="#e8b04a"/>
    </radialGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8221e"/>
      <stop offset="0.5" stop-color="#ff5a4e"/>
      <stop offset="1" stop-color="#8a1a16"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.45" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#ff4d5e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="node" cx="35%" cy="35%" r="65%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.45" stop-color="#c9ced8"/>
      <stop offset="1" stop-color="#5b6170"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9be7ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#9be7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="1" stop-color="#f0a81e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.5" stop-color="#ffc23c"/>
      <stop offset="1" stop-color="#ff9a1f"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="0.65" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.3"/>
    </radialGradient>
    <g id="coinG"><circle r="11" cy="1.5" fill="#b07c00"/><circle r="10" fill="url(#coin)"/><circle r="6.5" fill="none" stroke="#c98a00" stroke-width="1.8"/></g>
  </defs>

  <!-- wall with windows -->
  <rect width="640" height="360" fill="url(#wall)"/>
  <rect x="40" y="80" width="200" height="150" rx="14" fill="url(#sky)"/>
  <rect x="380" y="80" width="200" height="150" rx="14" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.95"><circle cx="95" cy="130" r="16"/><circle cx="115" cy="122" r="20"/><circle cx="138" cy="132" r="14"/><rect x="95" y="130" width="44" height="12"/><circle cx="470" cy="118" r="13"/><circle cx="488" cy="112" r="17"/><circle cx="506" cy="120" r="12"/><rect x="470" y="118" width="36" height="10"/></g>
  <path d="M40 210 Q 100 186 160 200 T 240 196 L240 230 L40 230 Z" fill="#9fd39a"/>
  <path d="M380 205 Q 440 190 500 202 T 580 198 L580 230 L380 230 Z" fill="#9fd39a"/>
  <g fill="none" stroke="#4d9f98" stroke-width="7"><rect x="40" y="80" width="200" height="150" rx="14"/><rect x="380" y="80" width="200" height="150" rx="14"/></g>
  <g stroke="#4d9f98" stroke-width="4"><line x1="140" y1="80" x2="140" y2="230"/><line x1="40" y1="160" x2="240" y2="160"/><line x1="480" y1="80" x2="480" y2="230"/><line x1="380" y1="160" x2="580" y2="160"/></g>
  <rect x="268" y="78" width="84" height="190" rx="10" fill="#cfece8"/>
  <!-- ceiling -->
  <rect width="640" height="40" fill="#3f4d5d"/>
  <rect y="40" width="640" height="12" fill="#55657a"/>
  <g fill="#7fe7d8"><rect x="40" y="46" width="40" height="5" rx="2.5"/><rect x="160" y="46" width="40" height="5" rx="2.5"/><rect x="280" y="46" width="40" height="5" rx="2.5"/><rect x="400" y="46" width="40" height="5" rx="2.5"/><rect x="520" y="46" width="40" height="5" rx="2.5"/></g>
  <!-- floor -->
  <rect y="300" width="640" height="60" fill="url(#floor)"/>
  <rect y="300" width="640" height="4" fill="#b0bccb"/>
  <rect y="282" width="640" height="18" fill="#9fc3bf"/>
  <rect y="282" width="640" height="3" fill="#7fe7d8"/>

  <!-- zapper -->
  <circle cx="430" cy="110" r="34" fill="url(#glow)"/>
  <circle cx="530" cy="250" r="34" fill="url(#glow)"/>
  <line x1="430" y1="110" x2="530" y2="250" stroke="#9be7ff" stroke-opacity="0.35" stroke-width="22" stroke-linecap="round"/>
  <path d="M430 110 L 446 128 L 444 142 L 462 152 L 466 170 L 484 182 L 486 200 L 504 210 L 510 230 L 530 250" fill="none" stroke="#9be7ff" stroke-width="6" stroke-linejoin="round"/>
  <path d="M430 110 L 446 128 L 444 142 L 462 152 L 466 170 L 484 182 L 486 200 L 504 210 L 510 230 L 530 250" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="430" cy="110" r="16" fill="url(#node)" stroke="#3a3f4b" stroke-width="2.5"/><circle cx="430" cy="110" r="6" fill="#4fb8ff"/>
  <circle cx="530" cy="250" r="16" fill="url(#node)" stroke="#3a3f4b" stroke-width="2.5"/><circle cx="530" cy="250" r="6" fill="#4fb8ff"/>

  <!-- rocket warning + rocket -->
  <g transform="translate(608 196)">
    <path d="M0 -20 L 18 13 L -18 13 Z" fill="#ff4d5e" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    <text x="0" y="9" font-family="Fredoka, Arial, sans-serif" font-weight="800" font-size="20" fill="#fff" text-anchor="middle">!</text>
  </g>

  <!-- coin trail -->
  <use href="#coinG" x="300" y="150"/><use href="#coinG" x="330" y="140"/><use href="#coinG" x="360" y="136"/><use href="#coinG" x="390" y="138"/>
  <use href="#coinG" x="560" y="120"/><use href="#coinG" x="586" y="112"/>

  <!-- flame trail -->
  <g opacity="0.95">
    <circle cx="96" cy="292" r="8" fill="#ff8a2b" opacity="0.5"/><circle cx="116" cy="284" r="10" fill="#ffb020" opacity="0.6"/><circle cx="138" cy="276" r="12" fill="#ffd43b" opacity="0.75"/>
  </g>
  <!-- the pup -->
  <g transform="translate(200 238) rotate(-12) scale(2.0)">
    <path d="M -26 14 Q -18 46 -10 14 Z" fill="url(#flame)"/>
    <path d="M -16 14 Q -8 42 0 14 Z" fill="url(#flame)"/>
    <rect x="-29" y="-20" width="14" height="32" rx="6" fill="url(#tank)" stroke="#5a1210" stroke-width="1"/>
    <rect x="-22" y="-18" width="13" height="30" rx="6" fill="url(#tank)"/>
    <rect x="-26" y="-16" width="3" height="18" fill="#fff" opacity="0.45"/>
    <rect x="-28" y="10" width="8" height="5" fill="#5b6170"/><rect x="-20" y="10" width="8" height="5" fill="#5b6170"/>
    <!-- legs -->
    <g fill="#c98e2c"><rect x="-13" y="12" width="7" height="12" rx="3.5" transform="rotate(30 -10 12)"/><rect x="6" y="12" width="7" height="12" rx="3.5" transform="rotate(35 9 12)"/></g>
    <!-- tail -->
    <path d="M -17 -2 Q -26 -12 -22 -20" fill="none" stroke="#e8b04a" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="0" cy="4" rx="20" ry="14" fill="url(#fur)"/>
    <ellipse cx="4" cy="10" rx="12" ry="6" fill="#f8dc9c"/>
    <path d="M -14 -8 L -4 14" stroke="#3a3f4b" stroke-width="3"/>
    <g fill="#c98e2c"><rect x="-6" y="13" width="7" height="11" rx="3.5" transform="rotate(40 -3 13)"/><rect x="12" y="12" width="7" height="11" rx="3.5" transform="rotate(45 15 12)"/></g>
    <rect x="10" y="-15" width="6" height="18" rx="3" fill="#e8413c" transform="rotate(28 13 -6)"/>
    <circle cx="16" cy="2" r="3.2" fill="#ffd43b"/>
    <!-- head -->
    <g transform="translate(16 -14)">
      <circle r="14" fill="url(#head)"/>
      <ellipse cx="11" cy="4" rx="9" ry="6.5" fill="#f8dc9c"/>
      <ellipse cx="18" cy="1" rx="3.6" ry="3" fill="#3a2418"/>
      <path d="M 9.5 6.5 A 3.5 3.5 0 0 0 16 7.5" fill="none" stroke="#7a4a20" stroke-width="1.4"/>
      <rect x="10" y="8" width="5" height="7" rx="2.5" fill="#ff7a8a"/>
      <circle cx="6" cy="-3" r="4.2" fill="#2b2b2b"/><circle cx="7.4" cy="-4.6" r="1.5" fill="#fff"/>
      <circle cx="1" cy="4" r="3" fill="#ff7878" opacity="0.35"/>
      <ellipse cx="-9" cy="0" rx="5.5" ry="11" fill="#b97b25" transform="rotate(25 -9 0)"/>
      <!-- goggles -->
      <path d="M -13 -5 A 14.5 14.5 0 0 1 6 -14" fill="none" stroke="#6b4423" stroke-width="3"/>
      <circle cx="4" cy="-12" r="4.5" fill="#6b4423"/><circle cx="4" cy="-12" r="3.2" fill="#9be7ff"/>
    </g>
  </g>
  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"><line x1="40" y1="170" x2="96" y2="170"/><line x1="30" y1="196" x2="78" y2="196"/><line x1="52" y1="222" x2="92" y2="222"/></g>

  <rect width="640" height="360" fill="url(#vig)"/>
  <g font-family="Fredoka, 'Trebuchet MS', Arial, sans-serif" font-weight="700" text-anchor="middle">
    <text x="320" y="104" font-size="80" fill="#8a4a00" stroke="#8a4a00" stroke-width="14" stroke-linejoin="round">JET PUP</text>
    <text x="320" y="98" font-size="80" fill="url(#title)" stroke="#fff" stroke-width="2.5" stroke-linejoin="round">JET PUP</text>
  </g>
</svg>
