<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Bullseye game card: a hooded archer draws a bow on a sunny fairground while an arrow thunks into the gold of a big target, with balloons, flags and tents behind -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa8f5"/>
      <stop offset="1" stop-color="#d8f0ff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ad66e"/>
      <stop offset="1" stop-color="#3f8a36"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.35" stop-color="#fff0b0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff0b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a0"/>
      <stop offset="1" stop-color="#ffbe1a"/>
    </linearGradient>
    <radialGradient id="bal1" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.25" stop-color="#e8453c"/><stop offset="1" stop-color="#8a1a14"/></radialGradient>
    <radialGradient id="bal2" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.25" stop-color="#3aa0e8"/><stop offset="1" stop-color="#14507a"/></radialGradient>
    <radialGradient id="bal3" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.25" stop-color="#ffcf3f"/><stop offset="1" stop-color="#a07c00"/></radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="110" cy="70" r="90" fill="url(#sun)"/>
  <circle cx="110" cy="70" r="26" fill="#fff6c8"/>
  <g fill="#ffffff" opacity="0.9">
    <path d="M220 70 a22 22 0 0 1 40 -8 a18 18 0 0 1 30 10 a14 14 0 0 1 4 26 h-78 a14 14 0 0 1 4 -28z"/>
    <path d="M500 40 a18 18 0 0 1 32 -6 a14 14 0 0 1 24 8 a11 11 0 0 1 3 21 h-62 a11 11 0 0 1 3 -23z"/>
  </g>
  <!-- hills -->
  <path d="M0 250 Q80 205 170 228 T340 220 T520 214 T640 226 V360 H0z" fill="#8fc6a0"/>
  <!-- tents -->
  <g>
    <path d="M300 250 L332 196 L364 250z" fill="#e8453c"/><path d="M332 196 L322 250 L342 250z" fill="#fff" opacity="0.8"/>
    <path d="M360 250 L388 204 L416 250z" fill="#3aa0e8"/><path d="M388 204 L379 250 L397 250z" fill="#fff" opacity="0.8"/>
    <path d="M332 196 V186 l12 4 -12 4" fill="#ffcf3f"/>
  </g>
  <!-- bunting -->
  <path d="M180 150 Q330 190 480 150" stroke="#5a3a1a" stroke-width="1.5" fill="none"/>
  <g>
    <path d="M200 156 l10 2 -6 12z" fill="#e8453c"/><path d="M230 164 l10 2 -6 12z" fill="#ffcf3f"/><path d="M262 170 l10 1 -5 12z" fill="#3aa0e8"/>
    <path d="M296 174 l10 0 -5 12z" fill="#6fe08a"/><path d="M330 175 l10 0 -5 12z" fill="#e8453c"/><path d="M364 174 l10 0 -5 12z" fill="#ffcf3f"/>
    <path d="M398 170 l10 -1 -5 12z" fill="#3aa0e8"/><path d="M430 164 l10 -2 -4 12z" fill="#6fe08a"/><path d="M458 156 l10 -2 -4 12z" fill="#e8453c"/>
  </g>
  <!-- trees -->
  <g>
    <rect x="252" y="214" width="9" height="46" fill="#6a4a2a"/>
    <circle cx="256" cy="204" r="26" fill="#4f9a4e"/><circle cx="240" cy="218" r="17" fill="#4f9a4e"/><circle cx="273" cy="216" r="18" fill="#4f9a4e"/>
    <circle cx="248" cy="196" r="12" fill="#ffffff" opacity="0.12"/>
  </g>
  <!-- ground -->
  <rect x="0" y="258" width="640" height="102" fill="url(#grass)"/>
  <path d="M120 258 L180 258 L240 360 L170 360z M300 258 L360 258 L440 360 L370 360z M480 258 L540 258 L640 360 L570 360z" fill="#ffffff" opacity="0.1"/>
  <!-- flag -->
  <line x1="470" y1="262" x2="470" y2="176" stroke="#eee" stroke-width="3"/>
  <path d="M470 178 Q490 172 506 182 Q490 190 470 194z" fill="#e8453c"/>
  <!-- balloons -->
  <g>
    <path d="M410 120 q4 18 -2 36" stroke="#fff" stroke-width="1.2" fill="none"/>
    <ellipse cx="410" cy="100" rx="17" ry="21" fill="url(#bal2)"/>
    <path d="M378 76 q-4 18 2 36" stroke="#fff" stroke-width="1.2" fill="none"/>
    <ellipse cx="378" cy="58" rx="15" ry="19" fill="url(#bal1)"/>
    <path d="M440 70 q5 16 0 30" stroke="#fff" stroke-width="1.2" fill="none"/>
    <ellipse cx="440" cy="52" rx="14" ry="18" fill="url(#bal3)"/>
    <path d="M440 46 l2 4 4.5 0.6 -3.3 3 0.8 4.4 -4 -2.2 -4 2.2 0.8 -4.4 -3.3 -3 4.5 -0.6z" fill="#fff8d0"/>
  </g>
  <!-- target -->
  <g transform="translate(560 196)">
    <path d="M-30 58 L-10 4 M34 58 L8 4" stroke="#7a5230" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="0" cy="66" rx="52" ry="7" fill="#000" opacity="0.18"/>
    <ellipse cx="9" cy="0" rx="42" ry="88" fill="#c99a5a"/>
    <ellipse cx="0" cy="0" rx="38" ry="84" fill="#ffffff" stroke="#bbb"/>
    <ellipse cx="0" cy="0" rx="30.4" ry="67.2" fill="#2a2a33"/>
    <ellipse cx="0" cy="0" rx="22.8" ry="50.4" fill="#3aa0e8"/>
    <ellipse cx="0" cy="0" rx="15.2" ry="33.6" fill="#e8453c"/>
    <ellipse cx="0" cy="0" rx="7.6" ry="16.8" fill="#ffcf3f"/>
    <ellipse cx="0" cy="0" rx="38" ry="84" fill="url(#sheen)"/>
  </g>
  <!-- arrows in the gold -->
  <g stroke-linecap="round">
    <line x1="472" y1="204" x2="558" y2="198" stroke="#c98a4a" stroke-width="4"/>
    <path d="M472 204 l-12 -9 h8 l14 8z M472 204 l-12 9 h8 l14 -8z" fill="#e8453c"/>
    <line x1="486" y1="176" x2="560" y2="188" stroke="#c98a4a" stroke-width="3.5" opacity="0.9"/>
    <path d="M486 176 l-11 -10 h7 l13 9z M486 176 l-9 9 h7 l11 -8z" fill="#ffcf3f"/>
  </g>
  <!-- impact sparkle -->
  <g fill="#fff6a8">
    <path d="M560 168 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
    <path d="M592 214 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
  </g>
  <!-- archer -->
  <g transform="translate(250 262)">
    <ellipse cx="4" cy="0" rx="40" ry="6" fill="#000" opacity="0.2"/>
    <!-- quiver -->
    <g transform="translate(-16 -112) rotate(-20)">
      <rect x="-7" y="-26" width="14" height="46" rx="4" fill="#7a4a22"/>
      <ellipse cx="-3" cy="-30" rx="2.5" ry="7" fill="#e8453c"/><ellipse cx="3" cy="-30" rx="2.5" ry="7" fill="#e8453c"/>
    </g>
    <!-- legs -->
    <path d="M-2 -78 L-18 -4 M6 -78 L22 -4" stroke="#3a3048" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="-15" cy="-3" rx="10" ry="4.5" fill="#5a3a1a"/><ellipse cx="26" cy="-3" rx="10" ry="4.5" fill="#5a3a1a"/>
    <!-- tunic -->
    <path d="M-16 -74 L-14 -130 L18 -130 L21 -74z" fill="#5aa84e"/>
    <rect x="-16" y="-92" width="37" height="6" fill="#2a5a2a"/>
    <!-- head + hood -->
    <circle cx="4" cy="-144" r="12" fill="#ffd6b0"/>
    <path d="M-11 -140 A14 14 0 1 1 18 -150 L4 -158 Q-6 -160 -11 -150 L-30 -138 L-12 -134z" fill="#3f8f45"/>
    <path d="M-6 -156 Q-18 -176 -28 -172" stroke="#ffcf3f" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="10" cy="-145" r="2" fill="#1d1d26"/>
    <circle cx="8" cy="-138" r="3" fill="#ff9a8a" opacity="0.6"/>
    <!-- bow arm -->
    <path d="M8 -128 L56 -134" stroke="#5aa84e" stroke-width="8" stroke-linecap="round"/>
    <circle cx="57" cy="-134" r="4.5" fill="#ffd6b0"/>
    <!-- bow -->
    <path d="M44 -196 Q86 -134 46 -72" stroke="#7a3f22" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <path d="M44 -196 Q86 -134 46 -72" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" fill="none"/>
    <!-- string drawn back -->
    <path d="M44 -196 L-2 -132 L46 -72" stroke="#f5f0e0" stroke-width="1.6" fill="none"/>
    <!-- draw arm -->
    <path d="M0 -128 L-14 -122 L-2 -132" stroke="#4a8a3e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="-2" cy="-132" r="4" fill="#ffd6b0"/>
    <!-- nocked arrow -->
    <line x1="-4" y1="-132" x2="74" y2="-136" stroke="#c98a4a" stroke-width="3" stroke-linecap="round"/>
    <path d="M80 -136 l-8 -4 v8z" fill="#c0c6d6"/>
    <path d="M-4 -132 l-8 -6 h6 l10 6z M-4 -132 l-8 6 h6 l10 -6z" fill="#e8453c"/>
  </g>
  <!-- aim guide dots -->
  <g fill="#ffffff">
    <circle cx="346" cy="124" r="3.2" opacity="0.85"/><circle cx="370" cy="122" r="3" opacity="0.7"/><circle cx="394" cy="122" r="2.7" opacity="0.55"/><circle cx="418" cy="124" r="2.4" opacity="0.4"/><circle cx="442" cy="127" r="2" opacity="0.25"/>
  </g>
  <!-- title -->
  <g font-family="Fredoka, 'Trebuchet MS', Arial, sans-serif" font-weight="700" text-anchor="middle">
    <text x="174" y="330" font-size="66" fill="#5a2c0c">BULLSEYE</text>
    <text x="170" y="324" font-size="66" fill="url(#gold)" stroke="#a0521c" stroke-width="3.5" paint-order="stroke">BULLSEYE</text>
  </g>
  <g transform="translate(560 40)">
    <rect x="-66" y="-18" width="132" height="34" rx="17" fill="#2a351d" opacity="0.8"/>
    <text x="0" y="6" text-anchor="middle" font-family="Fredoka, 'Trebuchet MS', Arial, sans-serif" font-weight="700" font-size="20" fill="#ffcf3f">10 POINTS!</text>
  </g>
</svg>
