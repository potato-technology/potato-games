<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Sky Stack icon: a stack of bright 3D blocks against a sunset-to-space sky with a star on top -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1a52"/>
      <stop offset="0.6" stop-color="#3a6fd0"/>
      <stop offset="1" stop-color="#9fdcff"/>
    </linearGradient>
    <clipPath id="c"><circle cx="50" cy="50" r="48"/></clipPath>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
  <g clip-path="url(#c)">
    <g fill="#fff"><circle cx="20" cy="22" r="1.3"/><circle cx="78" cy="18" r="1.1"/><circle cx="84" cy="36" r="1"/><circle cx="14" cy="40" r="1"/></g>
    <ellipse cx="80" cy="74" rx="20" ry="7" fill="#fff" opacity="0.85"/>
    <ellipse cx="18" cy="80" rx="18" ry="6" fill="#fff" opacity="0.85"/>
    <!-- blocks -->
    <g stroke="#000" stroke-opacity="0.2" stroke-width="0.8">
      <polygon points="74,82 80,77 80,90 74,95" fill="#c0461f"/>
      <rect x="26" y="82" width="48" height="13" fill="#ff7a3c"/>
      <polygon points="73,69 79,64 79,77 73,82" fill="#c27c10"/>
      <rect x="27" y="69" width="46" height="13" fill="#ffb21f"/>
      <polygon points="73,56 79,51 79,64 73,69" fill="#2f9a3f"/>
      <rect x="29" y="56" width="44" height="13" fill="#4fd65f"/>
      <polygon points="72,43 78,38 78,51 72,56" fill="#2a5ab8"/>
      <rect x="30" y="43" width="42" height="13" fill="#4a8cf0"/>
      <polygon points="30,43 36,38 78,38 72,43" fill="#a8c8ff"/>
    </g>
    <g fill="#fff" opacity="0.3"><rect x="26" y="82" width="48" height="2"/><rect x="27" y="69" width="46" height="2"/><rect x="29" y="56" width="44" height="2"/><rect x="30" y="43" width="42" height="2"/></g>
    <!-- swinging block -->
    <line x1="50" y1="0" x2="54" y2="16" stroke="#e8ecff" stroke-width="1.6"/>
    <g transform="rotate(-6 54 24)">
      <polygon points="76,18 82,13 82,26 76,31" fill="#a8235a"/>
      <polygon points="34,18 40,13 82,13 76,18" fill="#ffb3d0"/>
      <rect x="34" y="18" width="42" height="13" fill="#ff5c9a" stroke="#000" stroke-opacity="0.2" stroke-width="0.8"/>
    </g>
  </g>
  <path d="M20 30 l2 4.6 4.6 2 -4.6 2 -2 4.6 -2 -4.6 -4.6 -2 4.6 -2z" fill="#ffd43b"/>
  <circle cx="50" cy="50" r="47" fill="none" stroke="#7ad8ff" stroke-opacity="0.75" stroke-width="2.5"/>
</svg>
