<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Sunny Acres icon: a red barn on green grass with a big yellow sun behind it -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cd0ff"/>
      <stop offset="0.62" stop-color="#c8ecff"/>
      <stop offset="0.63" stop-color="#7cc94e"/>
      <stop offset="1" stop-color="#3f8a2a"/>
    </linearGradient>
    <radialGradient id="sun" cx="40%" cy="38%" r="65%">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.6" stop-color="#ffd84a"/>
      <stop offset="1" stop-color="#ffaa1f"/>
    </radialGradient>
    <linearGradient id="barn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d23a2c"/>
      <stop offset="0.5" stop-color="#ee5240"/>
      <stop offset="1" stop-color="#b42e24"/>
    </linearGradient>
    <clipPath id="c"><circle cx="50" cy="50" r="48"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="100" height="100" fill="url(#bg)"/>
    <circle cx="70" cy="26" r="17" fill="url(#sun)"/>
    <g stroke="#ffd84a" stroke-width="4" stroke-linecap="round">
      <line x1="70" y1="3" x2="70" y2="-1"/><line x1="90" y1="14" x2="94" y2="11"/><line x1="94" y1="30" x2="98" y2="31"/>
    </g>
    <!-- barn -->
    <polygon points="20,82 72,82 72,52 64,38 46,28 28,38 20,52" fill="url(#barn)"/>
    <polyline points="20,82 20,52 28,38 46,28 64,38 72,52 72,82" fill="none" stroke="#fff6ea" stroke-width="4" stroke-linejoin="round"/>
    <rect x="33" y="58" width="26" height="24" fill="#8e2018"/>
    <g stroke="#fff6ea" stroke-width="3.2" fill="none">
      <rect x="33" y="58" width="26" height="24"/>
      <line x1="33" y1="58" x2="59" y2="82"/><line x1="59" y1="58" x2="33" y2="82"/>
    </g>
    <rect x="40" y="38" width="12" height="11" fill="#5a1a12" stroke="#fff6ea" stroke-width="2.5"/>
    <rect y="82" width="100" height="18" fill="#4f9a32"/>
    <path d="M6 88 l2 -6 l2 6 M84 90 l2 -6 l2 6 M76 86 l2 -5 l2 5" stroke="#9be06a" stroke-width="2" fill="none"/>
  </g>
  <circle cx="50" cy="50" r="47" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="2.5"/>
</svg>
