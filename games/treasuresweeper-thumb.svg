<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Treasure Sweeper game card: a sandy island grid with numbers, flags, a crab, a parrot and an open treasure chest -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2cc6dc"/>
      <stop offset="1" stop-color="#0f7fae"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbd889"/>
      <stop offset="1" stop-color="#e0a94f"/>
    </linearGradient>
    <radialGradient id="crab" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ff9a72"/>
      <stop offset="1" stop-color="#f0603e"/>
    </radialGradient>
    <linearGradient id="chest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b0682e"/>
      <stop offset="1" stop-color="#7a3e14"/>
    </linearGradient>
    <radialGradient id="coin" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fff3a3"/>
      <stop offset="0.6" stop-color="#ffc93d"/>
      <stop offset="1" stop-color="#c48a00"/>
    </radialGradient>
    <g id="t">
      <rect x="1.5" y="4" width="37" height="37" rx="8" fill="#b9853f"/>
      <rect x="1.5" y="1.5" width="37" height="36" rx="8" fill="url(#tile)"/>
      <path d="M9 5 H31" stroke="#fff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="d"><rect x="0" y="0" width="40" height="40" fill="#f7e4b8"/></g>
    <g id="flag">
      <ellipse cx="21" cy="34" rx="7" ry="2.5" fill="#000" opacity="0.25"/>
      <path d="M15 34 V9" stroke="#6b3f1f" stroke-width="3" stroke-linecap="round"/>
      <path d="M15 9 Q22 7 31 10 L31 22 Q22 19 15 22 Z" fill="#e8453c" stroke="#9b1f19" stroke-width="1"/>
      <circle cx="23" cy="15.5" r="2.8" fill="#fff"/>
    </g>
  </defs>
  <rect width="640" height="360" fill="url(#sea)"/>
  <g stroke="#fff" stroke-opacity="0.18" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M20 70 q14 -8 28 0 M90 300 q14 -8 28 0 M560 60 q14 -8 28 0 M600 250 q14 -8 28 0 M40 200 q14 -8 28 0 M520 330 q14 -8 28 0"/>
  </g>

  <!-- island -->
  <g transform="translate(300 190)">
    <ellipse cx="0" cy="12" rx="236" ry="146" fill="#7ee4dc"/>
    <ellipse cx="0" cy="6" rx="212" ry="128" fill="#fff" opacity="0.5"/>
    <ellipse cx="0" cy="4" rx="200" ry="118" fill="#ffe9b0"/>
    <g transform="translate(-160 -96)">
      <rect x="0" y="0" width="320" height="200" rx="26" fill="#cf9a4c"/>
      <!-- row 0 -->
      <use href="#t" x="0" y="0"/><use href="#t" x="40" y="0"/><use href="#t" x="80" y="0"/><use href="#d" x="120" y="0"/><use href="#d" x="160" y="0"/><use href="#d" x="200" y="0"/><use href="#t" x="240" y="0"/><use href="#t" x="280" y="0"/>
      <!-- row 1 -->
      <use href="#t" x="0" y="40"/><use href="#t" x="40" y="40"/><use href="#d" x="80" y="40"/><use href="#d" x="120" y="40"/><use href="#d" x="160" y="40"/><use href="#d" x="200" y="40"/><use href="#d" x="240" y="40"/><use href="#t" x="280" y="40"/>
      <!-- row 2 -->
      <use href="#t" x="0" y="80"/><use href="#d" x="40" y="80"/><use href="#d" x="80" y="80"/><use href="#d" x="120" y="80"/><use href="#d" x="160" y="80"/><use href="#d" x="200" y="80"/><use href="#d" x="240" y="80"/><use href="#t" x="280" y="80"/>
      <!-- row 3 -->
      <use href="#t" x="0" y="120"/><use href="#d" x="40" y="120"/><use href="#d" x="80" y="120"/><use href="#t" x="120" y="120"/><use href="#d" x="160" y="120"/><use href="#d" x="200" y="120"/><use href="#t" x="240" y="120"/><use href="#t" x="280" y="120"/>
      <!-- row 4 -->
      <use href="#t" x="0" y="160"/><use href="#t" x="40" y="160"/><use href="#t" x="80" y="160"/><use href="#t" x="120" y="160"/><use href="#t" x="160" y="160"/><use href="#t" x="200" y="160"/><use href="#t" x="240" y="160"/><use href="#t" x="280" y="160"/>
      <g font-family="'Fredoka', 'Arial Rounded MT Bold', 'Trebuchet MS', Arial, sans-serif" font-weight="900" font-size="28" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
        <text x="140" y="30" fill="#1f6fd1">1</text><text x="220" y="30" fill="#23933a">2</text>
        <text x="100" y="70" fill="#1f6fd1">1</text><text x="260" y="70" fill="#e0352f">3</text>
        <text x="60" y="110" fill="#23933a">2</text><text x="260" y="110" fill="#1f6fd1">1</text>
        <text x="60" y="150" fill="#1f6fd1">1</text><text x="100" y="150" fill="#e0352f">3</text><text x="180" y="150" fill="#23933a">2</text><text x="220" y="150" fill="#1f6fd1">1</text>
      </g>
      <use href="#flag" x="240" y="0"/>
      <use href="#flag" x="120" y="120"/>
      <use href="#flag" x="0" y="80"/>
      <!-- crab popping out -->
      <g transform="translate(300 182)">
        <ellipse cx="0" cy="14" rx="24" ry="6" fill="#000" opacity="0.2"/>
        <g stroke="#9a2a14" stroke-width="3" stroke-linecap="round" fill="none">
          <path d="M-12 4 Q-24 2 -26 12 M-12 9 Q-22 10 -24 18 M12 4 Q24 2 26 12 M12 9 Q22 10 24 18"/>
          <path d="M-16 -4 L-26 -14 M16 -4 L26 -14"/>
        </g>
        <ellipse cx="-28" cy="-18" rx="8" ry="7" fill="#f0603e" stroke="#9a2a14" stroke-width="2"/>
        <ellipse cx="28" cy="-18" rx="8" ry="7" fill="#f0603e" stroke="#9a2a14" stroke-width="2"/>
        <ellipse cx="0" cy="2" rx="20" ry="14" fill="url(#crab)" stroke="#9a2a14" stroke-width="2.5"/>
        <path d="M-6 -10 L-7 -18 M6 -10 L7 -18" stroke="#9a2a14" stroke-width="2.5"/>
        <circle cx="-7" cy="-21" r="5" fill="#fff" stroke="#9a2a14" stroke-width="1.5"/><circle cx="7" cy="-21" r="5" fill="#fff" stroke="#9a2a14" stroke-width="1.5"/>
        <circle cx="-6" cy="-21" r="2.5" fill="#2a1a12"/><circle cx="8" cy="-21" r="2.5" fill="#2a1a12"/>
        <path d="M-5 4 Q0 9 5 4" stroke="#5a1608" stroke-width="2" fill="none" stroke-linecap="round"/>
        <ellipse cx="-12" cy="4" rx="3" ry="2" fill="#ffb0a0"/><ellipse cx="12" cy="4" rx="3" ry="2" fill="#ffb0a0"/>
      </g>
    </g>
  </g>

  <!-- treasure chest, bottom left -->
  <g transform="translate(96 268)">
    <ellipse cx="0" cy="40" rx="62" ry="12" fill="#000" opacity="0.25"/>
    <path d="M-50 -40 Q0 -78 50 -40 L50 -20 L-50 -20 Z" fill="#9a5a26" stroke="#4a2208" stroke-width="3" transform="rotate(-18 -50 -20)"/>
    <ellipse cx="0" cy="-12" rx="46" ry="12" fill="#ffd84a"/>
    <circle cx="-26" cy="-18" r="9" fill="url(#coin)" stroke="#8a5a00" stroke-width="1.5"/>
    <circle cx="-6" cy="-22" r="9" fill="url(#coin)" stroke="#8a5a00" stroke-width="1.5"/>
    <circle cx="14" cy="-18" r="9" fill="url(#coin)" stroke="#8a5a00" stroke-width="1.5"/>
    <path d="M28 -30 L38 -22 L28 -8 L18 -22 Z" fill="#38b6ff" stroke="#123f8a" stroke-width="1.5"/>
    <rect x="-50" y="-14" width="100" height="52" rx="7" fill="url(#chest)" stroke="#4a2208" stroke-width="3"/>
    <rect x="-40" y="-14" width="8" height="52" fill="#ffc93d"/><rect x="32" y="-14" width="8" height="52" fill="#ffc93d"/>
    <rect x="-8" y="-8" width="16" height="18" rx="3" fill="#ffc93d" stroke="#8a5a00" stroke-width="2"/>
    <g fill="#fff6c8"><path d="M-46 -54 l3 -8 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 z"/><path d="M40 -60 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 z"/></g>
  </g>

  <!-- parrot, right -->
  <g transform="translate(560 214)">
    <path d="M-6 30 L-22 76 L8 74 L12 30 Z" fill="#2b7fe0"/>
    <path d="M0 36 L-10 72 L4 70 Z" fill="#ffc23d"/>
    <ellipse cx="0" cy="12" rx="24" ry="32" fill="#e8453c" stroke="#8a1a12" stroke-width="3" transform="rotate(10)"/>
    <ellipse cx="10" cy="16" rx="14" ry="26" fill="#2b7fe0" stroke="#164a8a" stroke-width="2.5" transform="rotate(10 10 16)"/>
    <ellipse cx="8" cy="2" rx="10" ry="12" fill="#ffc23d"/>
    <ellipse cx="-2" cy="-26" rx="21" ry="20" fill="#e8453c" stroke="#8a1a12" stroke-width="3"/>
    <ellipse cx="-8" cy="-26" rx="9" ry="8" fill="#fff"/>
    <ellipse cx="-9" cy="-26" rx="4.5" ry="5" fill="#2a1a12"/>
    <circle cx="-8" cy="-28" r="1.5" fill="#fff"/>
    <path d="M-18 -29 Q-40 -26 -30 -10 Q-25 -18 -16 -18 Z" fill="#ffe2a8" stroke="#7a5a2a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M-6 44 V54 M6 44 V54" stroke="#8a6a5a" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="0" cy="66" rx="40" ry="10" fill="#7ee4dc"/><path d="M-30 64 Q-26 46 -6 48 Q8 40 22 50 Q34 52 32 64 Z" fill="#8f8780" stroke="#4a423c" stroke-width="2.5"/><ellipse cx="-10" cy="52" rx="7" ry="3" fill="#fff" opacity="0.3"/>
  </g>
  <!-- title -->
  <g font-family="'Fredoka', 'Arial Rounded MT Bold', 'Trebuchet MS', Arial, sans-serif" font-weight="900" text-anchor="middle">
    <text x="320" y="64" font-size="62" textLength="520" lengthAdjust="spacingAndGlyphs" fill="#0a3f52" opacity="0.45" transform="translate(0 6)">Treasure Sweeper</text>
    <text x="320" y="64" font-size="62" textLength="520" lengthAdjust="spacingAndGlyphs" fill="none" stroke="#fff" stroke-width="12" stroke-linejoin="round">Treasure Sweeper</text>
    <text x="320" y="64" font-size="62" textLength="520" lengthAdjust="spacingAndGlyphs" fill="#ffcf3d" stroke="#7a3a08" stroke-width="3" stroke-linejoin="round">Treasure <tspan fill="#3fd0e6" stroke="#0a4f60">Sweeper</tspan></text>
  </g>
</svg>
