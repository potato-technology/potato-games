<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Tow Rush game card: a yellow tow truck hauling a car through the city, police lights behind -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9e5e"/>
      <stop offset="0.55" stop-color="#ffd08a"/>
      <stop offset="1" stop-color="#ffe9c4"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4d55"/>
      <stop offset="1" stop-color="#2a2c31"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="0.6" stop-color="#f4c20d"/>
      <stop offset="1" stop-color="#b98f00"/>
    </linearGradient>
    <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b838e"/>
      <stop offset="1" stop-color="#3a3f47"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa9f0"/>
      <stop offset="1" stop-color="#1f5fa8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe9f7"/>
      <stop offset="1" stop-color="#5b87a8"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f4f7"/>
      <stop offset="0.5" stop-color="#9aa3ae"/>
      <stop offset="1" stop-color="#d5dae0"/>
    </linearGradient>
    <radialGradient id="redglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff3b3b" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff3b3b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3b7bff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#3b7bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb000" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <!-- sunset sky and city -->
  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="470" cy="150" r="44" fill="#fff2c4" opacity="0.9"/>
  <g fill="#6a5a7a">
    <rect x="0" y="110" width="70" height="150"/><rect x="74" y="80" width="56" height="180"/><rect x="134" y="130" width="80" height="130"/>
    <rect x="220" y="96" width="50" height="164"/><rect x="276" y="140" width="70" height="120"/><rect x="352" y="70" width="60" height="190"/>
    <rect x="418" y="120" width="74" height="140"/><rect x="498" y="90" width="58" height="170"/><rect x="560" y="134" width="80" height="126"/>
  </g>
  <g fill="#ffd67a" opacity="0.85">
    <rect x="86" y="96" width="8" height="10"/><rect x="104" y="96" width="8" height="10"/><rect x="86" y="120" width="8" height="10"/><rect x="104" y="144" width="8" height="10"/>
    <rect x="232" y="112" width="8" height="10"/><rect x="250" y="136" width="8" height="10"/><rect x="364" y="88" width="8" height="10"/><rect x="384" y="88" width="8" height="10"/>
    <rect x="364" y="112" width="8" height="10"/><rect x="384" y="136" width="8" height="10"/><rect x="510" y="108" width="8" height="10"/><rect x="530" y="132" width="8" height="10"/>
    <rect x="16" y="128" width="8" height="10"/><rect x="434" y="140" width="8" height="10"/><rect x="580" y="150" width="8" height="10"/>
  </g>

  <!-- road -->
  <rect x="0" y="250" width="640" height="110" fill="url(#road)"/>
  <rect x="0" y="246" width="640" height="8" fill="#b6b1a7"/>
  <g fill="#e8c547"><rect x="0" y="300" width="640" height="4"/><rect x="0" y="307" width="640" height="4"/></g>
  <g fill="#fff" opacity="0.5"><rect x="20" y="340" width="60" height="4"/><rect x="140" y="340" width="60" height="4"/><rect x="260" y="340" width="60" height="4"/><rect x="380" y="340" width="60" height="4"/><rect x="500" y="340" width="60" height="4"/></g>
  <!-- speed lines -->
  <g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.45">
    <line x1="20" y1="214" x2="90" y2="214"/><line x1="40" y1="236" x2="130" y2="236"/><line x1="10" y1="276" x2="70" y2="276"/>
  </g>

  <!-- police car chasing in the distance -->
  <g transform="translate(70 236)">
    <ellipse cx="34" cy="38" rx="44" ry="6" fill="#000" opacity="0.3"/>
    <path d="M0 22 Q2 10 16 8 L26 0 L50 0 L62 10 Q72 12 72 24 L72 32 L0 32 Z" fill="#f4f6f8"/>
    <rect x="0" y="22" width="72" height="10" fill="#1c2230"/>
    <path d="M29 3 L47 3 L56 11 L24 11 Z" fill="url(#glass)"/>
    <circle cx="16" cy="33" r="7" fill="#111"/><circle cx="56" cy="33" r="7" fill="#111"/>
    <rect x="28" y="-6" width="9" height="6" rx="2" fill="#ff3b3b"/><rect x="38" y="-6" width="9" height="6" rx="2" fill="#3b7bff"/>
    <circle cx="30" cy="-3" r="22" fill="url(#redglow)"/><circle cx="46" cy="-3" r="22" fill="url(#blueglow)"/>
  </g>

  <!-- the tow truck -->
  <g transform="translate(250 176)">
    <ellipse cx="150" cy="122" rx="190" ry="12" fill="#000" opacity="0.35"/>
    <!-- towed car, front wheels lifted -->
    <g transform="translate(-30 52) rotate(-9 90 40)">
      <path d="M0 40 Q2 22 24 20 L44 4 L104 4 L128 22 Q150 24 152 44 L152 58 L0 58 Z" fill="url(#car)"/>
      <path d="M50 9 L100 9 L118 23 L40 23 Z" fill="url(#glass)"/>
      <line x1="76" y1="9" x2="76" y2="23" stroke="#1f5fa8" stroke-width="4"/>
      <rect x="0" y="44" width="152" height="5" fill="#fff" opacity="0.25"/>
      <circle cx="32" cy="60" r="15" fill="#151515"/><circle cx="32" cy="60" r="6" fill="#9aa3ae"/>
      <circle cx="122" cy="60" r="15" fill="#151515"/><circle cx="122" cy="60" r="6" fill="#9aa3ae"/>
      <rect x="146" y="40" width="8" height="8" rx="2" fill="#fff8d8"/>
    </g>
    <!-- tow arm and chain -->
    <path d="M132 86 L200 54" stroke="#22252a" stroke-width="10" stroke-linecap="round"/>
    <path d="M132 86 L200 54" stroke="#9aa3ae" stroke-width="3" stroke-linecap="round"/>
    <circle cx="128" cy="88" r="7" fill="#c9a227"/>
    <!-- flatbed -->
    <rect x="160" y="62" width="150" height="36" rx="4" fill="url(#bed)"/>
    <path d="M168 68 L176 92 M184 68 L192 92 M200 68 L208 92 M216 68 L224 92 M232 68 L240 92 M248 68 L256 92 M264 68 L272 92 M280 68 L288 92" stroke="#fff" stroke-opacity="0.12" stroke-width="2"/>
    <rect x="160" y="60" width="150" height="6" fill="#d9a400"/>
    <!-- cab -->
    <path d="M300 98 L300 40 Q302 22 322 20 L360 20 Q378 22 388 44 L398 58 Q410 60 410 74 L410 98 Z" fill="url(#cab)"/>
    <path d="M330 28 L360 28 Q370 30 376 44 L384 56 L330 56 Z" fill="url(#glass)"/>
    <path d="M336 30 L346 30 L334 52 L330 52 Z" fill="#fff" opacity="0.4"/>
    <rect x="300" y="72" width="110" height="5" fill="#fff" opacity="0.3"/>
    <text x="350" y="92" text-anchor="middle" font-family="'Arial Black', 'Trebuchet MS', Arial, sans-serif" font-weight="900" font-size="15" fill="#5a4100">TOW</text>
    <rect x="404" y="80" width="12" height="16" rx="3" fill="url(#chrome)"/>
    <rect x="402" y="62" width="10" height="8" rx="2" fill="#fff8d8"/>
    <circle cx="430" cy="66" r="22" fill="#fff8d8" opacity="0.25"/>
    <rect x="300" y="12" width="8" height="34" rx="3" fill="url(#chrome)"/>
    <!-- light bar -->
    <rect x="318" y="10" width="48" height="10" rx="4" fill="#333"/>
    <rect x="320" y="11" width="20" height="8" rx="3" fill="#ffb000"/><rect x="344" y="11" width="20" height="8" rx="3" fill="#ffd25a"/>
    <circle cx="330" cy="15" r="30" fill="url(#amber)"/>
    <!-- wheels -->
    <circle cx="200" cy="100" r="19" fill="#151515"/><circle cx="200" cy="100" r="8" fill="#9aa3ae"/>
    <circle cx="246" cy="100" r="19" fill="#151515"/><circle cx="246" cy="100" r="8" fill="#9aa3ae"/>
    <circle cx="370" cy="100" r="19" fill="#151515"/><circle cx="370" cy="100" r="8" fill="#9aa3ae"/>
  </g>

  <!-- title -->
  <g transform="translate(24 24) rotate(-4)">
    <rect width="190" height="56" rx="14" fill="#8a6a00"/>
    <rect y="-4" width="190" height="56" rx="14" fill="#f4c20d"/>
    <text x="95" y="34" text-anchor="middle" font-family="'Arial Black', 'Trebuchet MS', Arial, sans-serif" font-weight="900" font-size="30" fill="#222">TOW RUSH</text>
  </g>

  <rect width="640" height="360" fill="url(#vignette)"/>
</svg>
