<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Goal Rush icon: a soccer ball zooming into a goal net on green grass -->
  <defs>
    <radialGradient id="bg" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#5fd86f"/>
      <stop offset="1" stop-color="#1f7a30"/>
    </radialGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d0d8"/>
    </radialGradient>
    <pattern id="net" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M0 0 L9 9 M9 0 L0 9" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.3"/>
    </pattern>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bg)"/>
  <path d="M30 20 H 90 V 64 H 30 Z" fill="url(#net)"/>
  <path d="M30 64 V 20 H 90" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M8 84 Q 26 70 40 62" stroke="#ffd43b" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8"/>
  <g transform="translate(50 58)">
    <circle r="17" fill="url(#ball)" stroke="#222" stroke-width="2"/>
    <path d="M0 -7 L6.7 -2.2 L4.1 5.7 L-4.1 5.7 L-6.7 -2.2 Z" fill="#26262c"/>
    <path d="M-15 -7 L-9 -11 M15 -7 L9 -11 M-10 12 L-6 15 M10 12 L6 15" stroke="#26262c" stroke-width="3.5"/>
    <circle cx="-6" cy="-7" r="3.5" fill="#fff" opacity="0.9"/>
  </g>
</svg>
