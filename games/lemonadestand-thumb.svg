<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Lemonade Stand game card: a striped lemonade stand on a sunny street with a happy customer holding a cup -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb8ff"/>
      <stop offset="1" stop-color="#d4f0ff"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbd0"/>
      <stop offset="0.45" stop-color="#ffe680" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffe680" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0b46a"/>
      <stop offset="1" stop-color="#c47d3a"/>
    </linearGradient>
    <linearGradient id="walk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eae5d8"/>
      <stop offset="1" stop-color="#d2cab6"/>
    </linearGradient>
    <linearGradient id="lem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff38a"/>
      <stop offset="1" stop-color="#ffd21a"/>
    </linearGradient>
    <radialGradient id="lemon" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff6a0"/>
      <stop offset="0.6" stop-color="#ffd400"/>
      <stop offset="1" stop-color="#d9a400"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="540" cy="62" r="70" fill="url(#sun)"/>
  <circle cx="540" cy="62" r="26" fill="#fff6b0"/>
  <g fill="#fff" opacity="0.92">
    <ellipse cx="110" cy="52" rx="44" ry="13"/><ellipse cx="132" cy="42" rx="26" ry="13"/><ellipse cx="90" cy="46" rx="20" ry="11"/>
    <ellipse cx="380" cy="34" rx="36" ry="11"/><ellipse cx="398" cy="26" rx="22" ry="11"/>
  </g>
  <!-- hot air balloon -->
  <g transform="translate(456 64)">
    <path d="M0 26 C-28 18 -30 -30 0 -32 C30 -30 28 18 0 26 Z" fill="#ff6f9a"/>
    <path d="M0 26 C-12 18 -12 -30 0 -32 C12 -30 12 18 0 26 Z" fill="#ffd43b"/>
    <path d="M-5 26 V36 M5 26 V36" stroke="#7a5030" stroke-width="1.2"/>
    <rect x="-7" y="36" width="14" height="9" rx="2" fill="#a0662e"/>
  </g>

  <!-- houses -->
  <g>
    <rect x="-10" y="150" width="120" height="90" fill="#ffb4a0"/>
    <path d="M-20 152 L50 104 L120 152 Z" fill="#c0504a"/>
    <rect x="14" y="170" width="24" height="20" fill="#bfe6ff" stroke="#fff" stroke-width="2"/>
    <rect x="70" y="170" width="24" height="20" fill="#bfe6ff" stroke="#fff" stroke-width="2"/>
    <rect x="42" y="204" width="20" height="36" fill="#8a5a3a"/>
    <rect x="500" y="146" width="150" height="94" fill="#c8f0c0"/>
    <path d="M490 148 L575 98 L660 148 Z" fill="#3a8a6a"/>
    <rect x="522" y="168" width="24" height="20" fill="#bfe6ff" stroke="#fff" stroke-width="2"/>
    <rect x="596" y="168" width="24" height="20" fill="#bfe6ff" stroke="#fff" stroke-width="2"/>
  </g>
  <g>
    <rect x="132" y="190" width="8" height="50" fill="#8a5a3a"/>
    <circle cx="136" cy="176" r="24" fill="#4fae5a"/><circle cx="122" cy="188" r="16" fill="#45a050"/><circle cx="150" cy="186" r="17" fill="#58bc66"/>
    <rect x="474" y="190" width="8" height="50" fill="#8a5a3a"/>
    <circle cx="478" cy="176" r="24" fill="#4fae5a"/><circle cx="464" cy="188" r="16" fill="#45a050"/><circle cx="492" cy="186" r="17" fill="#58bc66"/>
  </g>
  <!-- road and sidewalk -->
  <rect y="238" width="640" height="34" fill="#5a6070"/>
  <g fill="#ffd43b"><rect x="10" y="253" width="30" height="4"/><rect x="90" y="253" width="30" height="4"/><rect x="170" y="253" width="30" height="4"/><rect x="250" y="253" width="30" height="4"/><rect x="330" y="253" width="30" height="4"/><rect x="410" y="253" width="30" height="4"/><rect x="490" y="253" width="30" height="4"/><rect x="570" y="253" width="30" height="4"/></g>
  <rect y="272" width="640" height="6" fill="#c8ccd4"/>
  <rect y="278" width="640" height="82" fill="url(#walk)"/>

  <!-- stand -->
  <ellipse cx="320" cy="300" rx="128" ry="10" fill="#000" opacity="0.15"/>
  <rect x="222" y="120" width="10" height="176" fill="#b57530"/>
  <rect x="408" y="120" width="10" height="176" fill="#b57530"/>
  <!-- seller -->
  <g transform="translate(300 214)">
    <rect x="-20" y="-40" width="40" height="46" rx="12" fill="#ff6f9a"/>
    <rect x="-13" y="-26" width="26" height="30" rx="6" fill="#fff"/>
    <path d="M18 -32 L34 -50" stroke="#ffd9b8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="-60" r="20" fill="#ffd9b8"/>
    <path d="M-20 -62 A20 20 0 0 1 20 -62 Z" fill="#c84a2a"/>
    <ellipse cx="0" cy="-74" rx="30" ry="7" fill="#f2d27a"/>
    <rect x="-16" y="-92" width="32" height="18" rx="6" fill="#f2d27a"/>
    <rect x="-16" y="-80" width="32" height="5" fill="#ff6f9a"/>
    <circle cx="-7" cy="-60" r="2.6" fill="#3b2a10"/><circle cx="7" cy="-60" r="2.6" fill="#3b2a10"/>
    <path d="M-6 -53 Q0 -47 6 -53" fill="none" stroke="#3b2a10" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="-12" cy="-53" r="3.5" fill="#ff8a8a" opacity="0.5"/><circle cx="12" cy="-53" r="3.5" fill="#ff8a8a" opacity="0.5"/>
  </g>
  <!-- counter -->
  <rect x="216" y="206" width="208" height="92" fill="url(#wood)"/>
  <path d="M216 229 H424 M216 252 H424 M216 275 H424" stroke="#a86a2a" stroke-width="2"/>
  <rect x="230" y="216" width="180" height="56" rx="9" fill="#ffd43b" stroke="#c99a00" stroke-width="3"/>
  <text x="320" y="246" text-anchor="middle" font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" font-size="24" fill="#fff" stroke="#b37d00" stroke-width="4" paint-order="stroke">Lemonade</text>
  <text x="320" y="266" text-anchor="middle" font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" font-size="14" fill="#fff" stroke="#b37d00" stroke-width="3" paint-order="stroke">50¢ a cup</text>
  <rect x="208" y="198" width="224" height="13" rx="4" fill="#f6c88a"/>
  <!-- pitcher and cups -->
  <g transform="translate(366 198)">
    <path d="M-17 -54 H17 L15 0 H-15 Z" fill="#dff2ff" opacity="0.7"/>
    <path d="M-16 -38 H16 L15 0 H-15 Z" fill="url(#lem)"/>
    <g fill="#fff" opacity="0.85"><rect x="-10" y="-34" width="7" height="7"/><rect x="2" y="-30" width="7" height="7"/></g>
    <path d="M-17 -54 L-15 0 H15 L17 -54" fill="none" stroke="#7a9ab0" stroke-width="2"/>
    <path d="M17 -46 Q32 -40 16 -16" fill="none" stroke="#7a9ab0" stroke-width="2.5"/>
    <circle cx="-30" cy="-12" r="11" fill="url(#lemon)"/>
  </g>
  <g fill="#ff6f9a"><path d="M240 198 h20 l-2 -20 h-16z"/><path d="M240 192 h20 l-2 -20 h-16z" fill="#ff8fb0"/></g>
  <!-- awning -->
  <g>
    <path d="M200 98 H440 L444 126 H196 Z" fill="#ffd43b"/>
    <path d="M230 98 H260 L262 126 H232 Z M290 98 H320 L321 126 H291 Z M350 98 H380 L381 126 H351 Z M410 98 H440 L442 126 H412 Z" fill="#fff"/>
    <g fill="#ffd43b"><circle cx="215" cy="126" r="15"/><circle cx="335" cy="126" r="15"/><circle cx="275" cy="126" r="15"/><circle cx="395" cy="126" r="15"/></g>
    <g fill="#fff"><circle cx="245" cy="126" r="15"/><circle cx="305" cy="126" r="15"/><circle cx="365" cy="126" r="15"/><circle cx="425" cy="126" r="15"/></g>
  </g>
  <!-- sign -->
  <rect x="236" y="56" width="168" height="36" rx="10" fill="#fff8e0" stroke="#ffcc1a" stroke-width="4"/>
  <text x="320" y="81" text-anchor="middle" font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" font-size="18" fill="#b37d00">FRESH DRINKS</text>

  <!-- happy customer with a cup -->
  <g transform="translate(486 318)">
    <ellipse cx="0" cy="0" rx="18" ry="4" fill="#000" opacity="0.15"/>
    <path d="M-5 -36 L-8 -3 M5 -36 L8 -3" stroke="#3a4a7a" stroke-width="8" stroke-linecap="round"/>
    <rect x="-12" y="-72" width="24" height="40" rx="9" fill="#4fa8ff"/>
    <path d="M-10 -66 L-14 -42" stroke="#d9a06b" stroke-width="6" stroke-linecap="round"/>
    <path d="M10 -66 L22 -60" stroke="#d9a06b" stroke-width="6" stroke-linecap="round"/>
    <path d="M18 -76 h14 l-2 18 h-10z" fill="#fff"/>
    <rect x="19" y="-72" width="12" height="5" fill="#ffd21a"/>
    <path d="M27 -76 L31 -86" stroke="#ff6f9a" stroke-width="2"/>
    <circle cx="0" cy="-86" r="13" fill="#d9a06b"/>
    <path d="M-13 -88 A13 13 0 0 1 13 -88 Z" fill="#2b1a10"/>
    <circle cx="-4" cy="-87" r="1.8" fill="#2a1a10"/><circle cx="5" cy="-87" r="1.8" fill="#2a1a10"/>
    <path d="M-3 -81 Q1 -77 5 -81" fill="none" stroke="#2a1a10" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <!-- speech bubble with a heart -->
  <g transform="translate(500 186)">
    <rect x="-24" y="-20" width="48" height="36" rx="12" fill="#fff" stroke="#59d18a" stroke-width="3"/>
    <path d="M-6 16 l6 9 l6 -9z" fill="#fff"/>
    <path d="M0 10 C-18 -2 -8 -16 0 -6 C8 -16 18 -2 0 10 Z" fill="#ff4f86"/>
  </g>
  <!-- coins popping -->
  <g>
    <circle cx="176" cy="150" r="11" fill="#ffd43b" stroke="#c99a00" stroke-width="2"/>
    <circle cx="176" cy="150" r="6" fill="none" stroke="#c99a00" stroke-width="1.5"/>
    <circle cx="160" cy="176" r="8" fill="#ffd43b" stroke="#c99a00" stroke-width="2"/>
    <text x="150" y="128" font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" font-size="18" fill="#1d8a4f" stroke="#fff" stroke-width="4" paint-order="stroke">+$0.50</text>
  </g>

  <!-- title -->
  <g font-family="Fredoka, 'Trebuchet MS', Arial Rounded MT Bold, sans-serif" font-weight="700" font-size="56" text-anchor="middle">
    <text x="320" y="346" fill="#ffd43b" stroke="#8a5a00" stroke-width="10" stroke-linejoin="round" paint-order="stroke">Lemonade <tspan fill="#ff6f9a">Stand</tspan></text>
  </g>
</svg>
