<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Puck Blast icon: a red mallet hitting a puck -->
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#5ad8ff"/>
      <stop offset="1" stop-color="#1a6fae"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a95"/>
      <stop offset="0.5" stop-color="#ff4757"/>
      <stop offset="1" stop-color="#a51d2b"/>
    </linearGradient>
    <radialGradient id="knob" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#ffc2c8"/>
      <stop offset="0.6" stop-color="#ff4757"/>
      <stop offset="1" stop-color="#a51d2b"/>
    </radialGradient>
    <radialGradient id="puck" cx="35%" cy="30%" r="80%">
