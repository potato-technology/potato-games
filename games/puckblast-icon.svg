  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
  <circle cx="50" cy="50" r="46" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="2.5"/>
  <path d="M44 56 L80 34 L84 42 Z" fill="#fff" opacity="0.55"/>
  <circle cx="76" cy="36" r="11" fill="url(#puck)" stroke="#6a7080" stroke-width="2"/>
  <ellipse cx="72" cy="32" rx="4" ry="1.8" fill="#fff" opacity="0.45" transform="rotate(-30 72 32)"/>
  <g transform="translate(38 62)">
    <ellipse cx="3" cy="4" rx="24" ry="23" fill="#000" opacity="0.25"/>
    <circle r="23" fill="url(#red)" stroke="#6a1018" stroke-width="2"/>
    <circle r="16" fill="#c42a3a"/>
    <circle cy="-1" r="10" fill="url(#knob)" stroke="#6a1018" stroke-width="1.5"/>
    <ellipse cx="-3.5" cy="-5" rx="3.5" ry="2" fill="#fff" opacity="0.7" transform="rotate(-28 -3.5 -5)"/>
