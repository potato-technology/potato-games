<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Kart Kings game card: karts racing around a curve, seen from above -->
  <defs>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86d662"/>
      <stop offset="1" stop-color="#5aa83a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.5" stop-color="#ffc93c"/>
      <stop offset="1" stop-color="#ff9a1f"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a70"/>
      <stop offset="0.5" stop-color="#e8413c"/>
      <stop offset="1" stop-color="#a8221e"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb6ff"/>
      <stop offset="0.5" stop-color="#2f7de1"/>
      <stop offset="1" stop-color="#1a4f99"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9be38a"/>
      <stop offset="0.5" stop-color="#4cc94a"/>
      <stop offset="1" stop-color="#2a7f2a"/>
    </linearGradient>
    <radialGradient id="helmetY" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fff6c0"/>
      <stop offset="0.6" stop-color="#ffd43b"/>
      <stop offset="1" stop-color="#b8860b"/>
    </radialGradient>
    <radialGradient id="helmetP" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffd0e6"/>
      <stop offset="0.6" stop-color="#ff6fb5"/>
      <stop offset="1" stop-color="#b03a78"/>
    </radialGradient>
    <radialGradient id="helmetB" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#d4f6ff"/>
      <stop offset="0.6" stop-color="#5fd4ff"/>
      <stop offset="1" stop-color="#1f7fae"/>
    </radialGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7ad9"/>
      <stop offset="0.5" stop-color="#ffd43b"/>
      <stop offset="1" stop-color="#4fc3ff"/>
    </linearGradient>
    <radialGradient id="tree" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#a5e27a"/>
      <stop offset="0.5" stop-color="#47a043"/>
      <stop offset="1" stop-color="#2c6e2c"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
    <pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#fff"/>
      <rect width="10" height="10" fill="#1b1c22"/>
      <rect x="10" y="10" width="10" height="10" fill="#1b1c22"/>
    </pattern>
    <g id="wheel"><rect x="-8" y="-5" width="16" height="10" rx="3" fill="#1b1c22"/><rect x="-3" y="-2" width="6" height="4" rx="1" fill="#c9ced8"/></g>
  </defs>

  <rect width="640" height="360" fill="url(#grass)"/>
  <!-- grass tufts -->
  <g fill="#9de56f" opacity="0.6">
    <ellipse cx="60" cy="50" rx="26" ry="12"/><ellipse cx="560" cy="300" rx="30" ry="12"/><ellipse cx="380" cy="40" rx="20" ry="9"/><ellipse cx="120" cy="320" rx="24" ry="10"/>
  </g>
  <!-- the track: a big sweeping curve -->
  <path d="M -40 300 C 120 300 180 150 330 150 S 560 70 700 110" fill="none" stroke="#4a8a33" stroke-width="196" stroke-linecap="round"/>
  <path d="M -40 300 C 120 300 180 150 330 150 S 560 70 700 110" fill="none" stroke="#ffffff" stroke-width="176"/>
  <path d="M -40 300 C 120 300 180 150 330 150 S 560 70 700 110" fill="none" stroke="#e8413c" stroke-width="176" stroke-dasharray="26 26"/>
  <path d="M -40 300 C 120 300 180 150 330 150 S 560 70 700 110" fill="none" stroke="#5d606e" stroke-width="160"/>
  <path d="M -40 300 C 120 300 180 150 330 150 S 560 70 700 110" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="150"/>
  <path d="M -40 300 C 120 300 180 150 330 150 S 560 70 700 110" fill="none" stroke="#5d606e" stroke-width="144"/>
  <path d="M -40 300 C 120 300 180 150 330 150 S 560 70 700 110" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="5" stroke-dasharray="30 36"/>
  <!-- skid marks -->
  <path d="M 150 262 C 200 230 230 200 270 190" fill="none" stroke="#2a2b33" stroke-opacity="0.35" stroke-width="5"/>
  <path d="M 160 280 C 210 248 240 216 280 206" fill="none" stroke="#2a2b33" stroke-opacity="0.35" stroke-width="5"/>
  <!-- start line -->
  <g transform="translate(470 118) rotate(-18)"><rect x="-10" y="-72" width="20" height="144" fill="url(#checker)"/></g>

  <!-- trees -->
  <g>
    <ellipse cx="88" cy="96" rx="44" ry="38" fill="#000" opacity="0.2"/>
    <circle cx="80" cy="86" r="40" fill="url(#tree)"/>
    <circle cx="70" cy="72" r="10" fill="#fff" opacity="0.18"/>
    <circle cx="72" cy="98" r="4" fill="#e8413c"/><circle cx="96" cy="78" r="4" fill="#e8413c"/><circle cx="64" cy="80" r="4" fill="#e8413c"/>
  </g>
  <!-- flowers -->
  <g fill="#fff">
    <circle cx="300" cy="300" r="4"/><circle cx="312" cy="306" r="4"/><circle cx="292" cy="312" r="4"/><circle cx="420" cy="290" r="4"/><circle cx="432" cy="282" r="4"/>
  </g>
  <g fill="#ffe04f"><circle cx="300" cy="300" r="1.8"/><circle cx="312" cy="306" r="1.8"/><circle cx="292" cy="312" r="1.8"/><circle cx="420" cy="290" r="1.8"/><circle cx="432" cy="282" r="1.8"/></g>

  <!-- item box -->
  <g transform="translate(395 110) rotate(40)">
    <rect x="-17" y="-17" width="34" height="34" rx="8" fill="url(#box)" stroke="#fff" stroke-width="3"/>
    <rect x="-13" y="-13" width="26" height="9" rx="4" fill="#fff" opacity="0.4"/>
  </g>
  <text x="395" y="119" font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" font-size="24" fill="#fff" stroke="#4a1f6a" stroke-width="3" paint-order="stroke" text-anchor="middle">?</text>

  <!-- boost sparks behind the lead kart -->
  <g opacity="0.9">
    <circle cx="232" cy="208" r="9" fill="#ff5fd2" opacity="0.7"/><circle cx="242" cy="230" r="8" fill="#ff5fd2" opacity="0.7"/>
    <path d="M 226 200 l -22 10" stroke="#ff9cf3" stroke-width="3" stroke-linecap="round"/>
    <path d="M 236 236 l -24 6" stroke="#ff9cf3" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- kart: blue (behind) -->
  <g transform="translate(135 262) rotate(-28) scale(1.5)">
    <ellipse cx="4" cy="6" rx="26" ry="17" fill="#000" opacity="0.25"/>
    <use href="#wheel" x="13" y="-13"/><use href="#wheel" x="13" y="13"/><use href="#wheel" x="-13" y="-14"/><use href="#wheel" x="-13" y="14"/>
    <path d="M25 0 Q24 -8 12 -9 L-6 -11 Q-17 -11 -18 -6 L-18 6 Q-17 11 -6 11 L12 9 Q24 8 25 0 Z" fill="url(#blue)" stroke="#141826" stroke-width="1.6"/>
    <rect x="-24" y="-15" width="5" height="30" rx="2" fill="#1a3f78"/>
    <ellipse cx="6" cy="-6" rx="10" ry="2.6" fill="#fff" opacity="0.3"/>
    <circle cx="-4" cy="0" r="8.6" fill="url(#helmetB)" stroke="#000" stroke-opacity="0.4"/>
    <path d="M 4.2 -6.9 A 8.6 8.6 0 0 1 4.2 6.9 L 2.5 3.5 A 4.3 4.3 0 0 0 2.5 -3.5 Z" fill="#1d2840"/>
    <path d="M -1 -4 L 3 4" stroke="#ffb627" stroke-width="2.5"/>
  </g>
  <!-- kart: green -->
  <g transform="translate(205 268) rotate(-38) scale(1.5)">
    <ellipse cx="4" cy="6" rx="26" ry="17" fill="#000" opacity="0.25"/>
    <use href="#wheel" x="13" y="-13"/><use href="#wheel" x="13" y="13"/><use href="#wheel" x="-13" y="-14"/><use href="#wheel" x="-13" y="14"/>
    <ellipse cx="1" cy="0" rx="22" ry="14" fill="url(#green)" stroke="#141826" stroke-width="1.6"/>
    <circle cx="-13" cy="-7" r="2.6" fill="#1b2a1b" opacity="0.5"/><circle cx="12" cy="6" r="2.6" fill="#1b2a1b" opacity="0.5"/>
    <ellipse cx="6" cy="-6" rx="10" ry="2.6" fill="#fff" opacity="0.3"/>
    <ellipse cx="-13" cy="-4" rx="9" ry="3" fill="#f3e9e2" transform="rotate(12 -13 -4)"/>
    <ellipse cx="-13" cy="4" rx="9" ry="3" fill="#f3e9e2" transform="rotate(-12 -13 4)"/>
    <circle cx="-4" cy="0" r="8.6" fill="url(#helmetP)" stroke="#000" stroke-opacity="0.4"/>
    <path d="M 4.2 -6.9 A 8.6 8.6 0 0 1 4.2 6.9 L 2.5 3.5 A 4.3 4.3 0 0 0 2.5 -3.5 Z" fill="#1d2840"/>
  </g>
  <!-- kart: red, leading with a boost -->
  <g transform="translate(275 196) rotate(-22) scale(1.75)">
    <ellipse cx="-34" cy="-6" rx="14" ry="5" fill="#ffd43b"/><ellipse cx="-34" cy="6" rx="14" ry="5" fill="#ffd43b"/>
    <ellipse cx="-30" cy="-6" rx="8" ry="3" fill="#fff"/><ellipse cx="-30" cy="6" rx="8" ry="3" fill="#fff"/>
    <ellipse cx="4" cy="6" rx="26" ry="17" fill="#000" opacity="0.25"/>
    <use href="#wheel" x="13" y="-13"/><use href="#wheel" x="13" y="13"/><use href="#wheel" x="-13" y="-14"/><use href="#wheel" x="-13" y="14"/>
    <path d="M25 0 Q24 -8 12 -9 L-6 -11 Q-17 -11 -18 -6 L-18 6 Q-17 11 -6 11 L12 9 Q24 8 25 0 Z" fill="url(#red)" stroke="#141826" stroke-width="1.6"/>
    <rect x="14" y="-3" width="9" height="6" rx="3" fill="#ffd43b"/>
    <rect x="-24" y="-15" width="5" height="30" rx="2" fill="#6e1512"/>
    <rect x="-23.5" y="-14" width="2" height="28" rx="1" fill="#ffd43b"/>
    <ellipse cx="6" cy="-6" rx="10" ry="2.6" fill="#fff" opacity="0.3"/>
    <path d="M -4 -5 L -11 -13 L -12 -5 Z" fill="#f07b2f" stroke="#000" stroke-opacity="0.4" stroke-width="0.8"/>
    <path d="M -4 5 L -11 13 L -12 5 Z" fill="#f07b2f" stroke="#000" stroke-opacity="0.4" stroke-width="0.8"/>
    <circle cx="-4" cy="0" r="8.6" fill="url(#helmetY)" stroke="#000" stroke-opacity="0.4"/>
    <rect x="-11.7" y="-1.2" width="12" height="2.4" fill="#fff" opacity="0.85"/>
    <path d="M 4.2 -6.9 A 8.6 8.6 0 0 1 4.2 6.9 L 2.5 3.5 A 4.3 4.3 0 0 0 2.5 -3.5 Z" fill="#1d2840"/>
  </g>
  <!-- coins -->
  <g stroke="#a06a00" stroke-width="2">
    <ellipse cx="340" cy="178" rx="8" ry="11" fill="#ffd43b"/>
    <ellipse cx="368" cy="172" rx="5" ry="11" fill="#ffd43b"/>
    <ellipse cx="392" cy="168" rx="8" ry="11" fill="#ffd43b"/>
  </g>

  <rect width="640" height="360" fill="url(#vig)"/>
  <!-- title -->
  <g font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" text-anchor="middle">
    <text x="436" y="322" font-size="70" fill="#3b2400" opacity="0.55" transform="translate(0 6)">Kart Kings</text>
    <text x="436" y="322" font-size="70" fill="url(#title)" stroke="#5a2a00" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Kart Kings</text>
  </g>
  <!-- crown -->
  <g transform="translate(588 248) rotate(16)">
    <path d="M -26 14 L -28 -14 L -13 0 L 0 -20 L 13 0 L 28 -14 L 26 14 Z" fill="url(#title)" stroke="#5a2a00" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="0" cy="4" r="4.5" fill="#e8413c"/><circle cx="-15" cy="7" r="3" fill="#2f7de1"/><circle cx="15" cy="7" r="3" fill="#4cc94a"/>
  </g>
</svg>
