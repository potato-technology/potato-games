<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Powder Peak game card: a snowboarder flying off a kicker in front of snowy mountains -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7fd6"/>
      <stop offset="0.6" stop-color="#8fcbff"/>
      <stop offset="1" stop-color="#ffe3c8"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset="0.5" stop-color="#fff1b8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff1b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9c3ec"/>
      <stop offset="1" stop-color="#8eaee0"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f9fd6"/>
      <stop offset="1" stop-color="#6684c0"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d4e4fa"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5d73"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a7a"/>
      <stop offset="1" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="goggle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.5" stop-color="#ff8ac0"/>
      <stop offset="1" stop-color="#7fdcff"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6ecff"/>
    </linearGradient>
    <linearGradient id="title2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9aa8"/>
      <stop offset="1" stop-color="#ff4d66"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="0.65" stop-color="#001" stop-opacity="0"/>
      <stop offset="1" stop-color="#001" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="520" cy="78" r="80" fill="url(#sun)"/>
  <circle cx="520" cy="78" r="28" fill="#fff8de"/>
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="120" cy="52" rx="46" ry="13"/><ellipse cx="104" cy="44" rx="22" ry="14"/><ellipse cx="136" cy="40" rx="26" ry="17"/>
    <ellipse cx="380" cy="34" rx="38" ry="11"/><ellipse cx="396" cy="27" rx="20" ry="13"/>
  </g>
  <!-- far mountains -->
  <path d="M0 230 L60 150 L110 190 L190 92 L260 176 L320 120 L390 186 L470 80 L560 170 L640 120 L640 260 L0 260Z" fill="url(#far)"/>
  <path d="M190 92 L214 122 L204 120 L196 132 L186 118 L174 112Z M470 80 L497 112 L485 110 L475 124 L464 108 L452 104Z M320 120 L338 142 L326 140 L318 150 L310 136Z" fill="#f4f8ff"/>
  <!-- near ridge -->
  <path d="M0 270 L80 200 L150 240 L240 170 L330 236 L420 196 L520 250 L640 210 L640 300 L0 300Z" fill="url(#near)"/>
  <path d="M240 170 L262 190 L250 188 L242 198 L232 186 L220 184Z M80 200 L96 214 L86 213 L78 222 L70 210Z" fill="#ffffff"/>
  <!-- pine band -->
  <g>
    <path d="M0 290 L640 290 L640 300 L0 300Z" fill="#e9f2ff"/>
    <g fill="#236848">
      <path d="M10 296 L22 252 L34 296Z"/><path d="M36 296 L50 244 L64 296Z"/><path d="M64 296 L76 258 L88 296Z"/><path d="M500 296 L514 246 L528 296Z"/><path d="M528 296 L540 258 L552 296Z"/><path d="M552 296 L568 240 L584 296Z"/><path d="M586 296 L598 254 L610 296Z"/><path d="M612 296 L626 248 L640 296Z"/>
    </g>
    <g fill="#ffffff">
      <path d="M17 270 L22 252 L27 270Z"/><path d="M44 266 L50 244 L56 266Z"/><path d="M509 266 L514 246 L519 266Z"/><path d="M562 262 L568 240 L574 262Z"/><path d="M621 268 L626 248 L631 268Z"/>
    </g>
  </g>
  <!-- foreground slope with kicker -->
  <path d="M0 300 Q200 286 330 310 Q470 336 640 316 L640 360 L0 360Z" fill="url(#snow)"/>
  <path d="M300 312 L400 296 L410 316 Q360 320 300 318Z" fill="#cfe0f6"/>
  <path d="M300 312 L400 296 L402 302 L304 316Z" fill="#ffffff"/>
  <rect x="396" y="296" width="8" height="20" fill="#ffb020"/>
  <!-- snow spray trail from the kicker -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="410" cy="282" r="9"/><circle cx="426" cy="262" r="8"/><circle cx="440" cy="240" r="7"/><circle cx="452" cy="220" r="6"/><circle cx="462" cy="202" r="5"/>
  </g>
  <!-- slalom flags -->
  <g>
    <rect x="96" y="290" width="3" height="40" fill="#e8eef8"/><path d="M99 290 Q112 296 122 294 L122 304 Q112 306 99 302Z" fill="#ef4444"/>
    <rect x="186" y="294" width="3" height="40" fill="#e8eef8"/><path d="M186 294 Q173 300 163 298 L163 308 Q173 310 186 306Z" fill="#3b82f6"/>
  </g>
  <!-- rider in the air, grabbing the board -->
  <g transform="translate(486 168) rotate(-18)">
    <ellipse cx="0" cy="64" rx="44" ry="7" fill="#0a1a3a" opacity="0.08"/>
    <rect x="-48" y="26" width="96" height="20" rx="10" fill="url(#board)" stroke="#8a2034" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="-36" y="34" width="72" height="3" rx="1.5" fill="#fff" opacity="0.7"/>
    <rect x="-28" y="24" width="16" height="10" rx="3" fill="#2a2f45"/><rect x="12" y="24" width="16" height="10" rx="3" fill="#2a2f45"/>
    <path d="M-20 26 L-12 4 M20 26 L12 4" stroke="#2a3350" stroke-width="10" stroke-linecap="round"/>
    <rect x="-20" y="-30" width="40" height="36" rx="13" fill="url(#jacket)" stroke="#7a1414" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="-20" y="-12" width="40" height="5" fill="#ffffff" opacity="0.85"/>
    <path d="M-16 -20 L-34 -36 M16 -16 L26 22" stroke="#d64545" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-36" cy="-38" r="6" fill="#2a2f45"/><circle cx="27" cy="24" r="6" fill="#2a2f45"/>
    <circle cx="0" cy="-46" r="17" fill="#f2c49b"/>
    <path d="M-18 -50 A18 18 0 0 1 18 -50 Z" fill="#c62828"/>
    <rect x="-18" y="-54" width="36" height="7" fill="#ffffff"/>
    <circle cx="0" cy="-70" r="7" fill="#ffffff"/>
    <rect x="-15" y="-49" width="30" height="11" rx="5" fill="#26324f"/>
    <rect x="-13" y="-47.5" width="26" height="8" rx="4" fill="url(#goggle)"/>
    <path d="M-5 -32 Q0 -27 5 -32" stroke="#7a3a2a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M-8 -26 Q-24 -22 -40 -30" stroke="#ffd43b" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <g fill="#ffffff" opacity="0.9">
    <circle cx="40" cy="120" r="2.5"/><circle cx="160" cy="160" r="2"/><circle cx="260" cy="70" r="2.5"/><circle cx="330" cy="140" r="2"/><circle cx="600" cy="150" r="2.5"/><circle cx="420" cy="100" r="2"/><circle cx="580" cy="230" r="2"/>
  </g>

  <!-- title -->
  <g font-family="Fredoka, 'Trebuchet MS', Arial, sans-serif" font-weight="700">
    <text x="30" y="110" font-size="78" fill="#0c2a5a" opacity="0.35" transform="translate(4 6)">Powder</text>
    <text x="30" y="110" font-size="78" fill="url(#title)" stroke="#2c5aa0" stroke-width="5" paint-order="stroke" stroke-linejoin="round">Powder</text>
    <text x="30" y="188" font-size="78" fill="#5a0a1a" opacity="0.35" transform="translate(4 6)">Peak</text>
    <text x="30" y="188" font-size="78" fill="url(#title2)" stroke="#9a1f36" stroke-width="5" paint-order="stroke" stroke-linejoin="round">Peak</text>
    <text x="34" y="222" font-size="19" fill="#ffffff" stroke="#2c5aa0" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Carve, flip and outrun the avalanche!</text>
  </g>
  <rect width="640" height="360" fill="url(#vig)"/>
</svg>
