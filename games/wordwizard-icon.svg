<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Word Wizard icon: a wooden letter tile with a big W, wearing a starry blue wizard hat -->
  <defs>
    <radialGradient id="bg" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#6a4ac8"/>
      <stop offset="1" stop-color="#1e1446"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b8"/>
      <stop offset="0.55" stop-color="#e8ba70"/>
      <stop offset="1" stop-color="#a8743a"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172a70"/>
      <stop offset="0.55" stop-color="#2f5fd0"/>
      <stop offset="0.9" stop-color="#7ab4ff"/>
      <stop offset="1" stop-color="#2f5fd0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe680" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffe680" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
  <circle cx="50" cy="60" r="40" fill="url(#glow)"/>
  <!-- tile -->
  <rect x="19" y="38" width="62" height="56" rx="12" fill="#000" opacity="0.35"/>
  <rect x="18" y="34" width="62" height="56" rx="12" fill="url(#wood)" stroke="#5a3410" stroke-width="2"/>
  <rect x="22" y="38" width="54" height="48" rx="9" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
  <text x="49" y="80" text-anchor="middle" font-family="Fredoka, 'Trebuchet MS', Arial, sans-serif" font-weight="700" font-size="40" fill="#4a2a10">W</text>
  <!-- hat -->
  <ellipse cx="50" cy="36" rx="30" ry="7" fill="#172a70"/>
  <path d="M30 35 Q38 14 40 2 Q56 16 70 35 Z" fill="url(#hat)"/>
  <path d="M30 35 Q50 39 70 35 L67 29 Q50 32 33 29 Z" fill="#ffd34a"/>
  <path d="M51 13 l2 4.6 l5 0.5 l-3.8 3.3 l1.1 4.9 l-4.3 -2.6 l-4.3 2.6 l1.1 -4.9 l-3.8 -3.3 l5 -0.5 z" fill="#ffe066"/>
  <path d="M84 20 l1.8 5 l5 1.8 l-5 1.8 l-1.8 5 l-1.8 -5 l-5 -1.8 l5 -1.8 z" fill="#ffffff"/>
</svg>
