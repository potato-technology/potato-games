<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Goblin Gate icon: a castle tower with a goblin peeking around it -->
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#9be36a"/>
      <stop offset="1" stop-color="#3f8a2a"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eee8da"/>
      <stop offset="0.5" stop-color="#c2baa8"/>
      <stop offset="1" stop-color="#8a8476"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a8fe0"/>
      <stop offset="1" stop-color="#22448a"/>
    </linearGradient>
    <radialGradient id="gob" cx="60%" cy="35%" r="70%">
      <stop offset="0" stop-color="#c2f290"/>
      <stop offset="0.65" stop-color="#6fb23a"/>
      <stop offset="1" stop-color="#467f24"/>
    </radialGradient>
    <clipPath id="badge"><circle cx="50" cy="50" r="47"/></clipPath>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
  <g clip-path="url(#badge)">
    <ellipse cx="50" cy="94" rx="40" ry="10" fill="#2f6e1e" opacity="0.6"/>
    <!-- tower -->
    <rect x="30" y="40" width="36" height="58" fill="url(#stone)"/>
    <g fill="#ddd6c6"><rect x="27" y="34" width="9" height="9"/><rect x="38" y="34" width="9" height="9"/><rect x="49" y="34" width="9" height="9"/><rect x="60" y="34" width="9" height="9"/></g>
    <g stroke="#5a5448" stroke-opacity="0.3" stroke-width="1"><path d="M30 52h36M30 64h36M30 76h36M30 88h36M42 40v12M54 52v12M42 64v12M54 76v12"/></g>
    <path d="M40 98 L40 80 Q40 70 48 70 Q56 70 56 80 L56 98 Z" fill="#1a120c"/>
    <g stroke="#4a4a50" stroke-width="1.8"><path d="M40 82h16M40 89h16M45 72v26M51 72v26"/></g>
    <path d="M24 36 L48 6 L72 36 Z" fill="url(#roof)"/>
    <path d="M24 36 L48 6 L40 36 Z" fill="#fff" opacity="0.22"/>
    <line x1="48" y1="7" x2="48" y2="-4" stroke="#5b4632" stroke-width="2"/>
    <path d="M48 -3 Q56 -4 62 0 Q56 4 48 4 Z" fill="#ffc145"/>
  </g>
  <!-- goblin peeking from the side -->
  <g transform="translate(72 66)">
    <path d="M-2 -6 L-14 -16 L-4 1 Z" fill="#6fb23a"/>
    <path d="M10 -9 L24 -18 L13 -1 Z" fill="#6fb23a"/>
    <ellipse cx="5" cy="-4" rx="12" ry="11" fill="url(#gob)"/>
    <ellipse cx="9" cy="-6" rx="3.2" ry="3.6" fill="#fff7c2"/><circle cx="10" cy="-6" r="1.7" fill="#1a1206"/>
    <ellipse cx="2" cy="-6" rx="3" ry="3.4" fill="#fff7c2"/><circle cx="3" cy="-6" r="1.6" fill="#1a1206"/>
    <ellipse cx="12" cy="-1" rx="3" ry="2.3" fill="#467f24"/>
    <path d="M3 3 Q8 8 13 3 Q8 5 3 3 Z" fill="#3a1a10"/>
  </g>
  <circle cx="50" cy="50" r="47" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="2.5"/>
