<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Sumo Bots game card: two little robots clash on a floating sky platform -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fa6ff"/>
      <stop offset="0.6" stop-color="#a8dcff"/>
      <stop offset="1" stop-color="#fff0d2"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset="0.35" stop-color="#fff2c0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff2c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="top" cx="0.42" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff0c8"/>
      <stop offset="0.6" stop-color="#f4d9a3"/>
      <stop offset="1" stop-color="#d6ab6c"/>
    </radialGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b4225"/>
      <stop offset="0.35" stop-color="#a06a3c"/>
      <stop offset="0.6" stop-color="#b47a48"/>
      <stop offset="1" stop-color="#6b4225"/>
    </linearGradient>
    <linearGradient id="under" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d3f34"/>
      <stop offset="0.45" stop-color="#8a7764"/>
      <stop offset="1" stop-color="#4d3f34"/>
    </linearGradient>
    <radialGradient id="red" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffc2b8"/>
      <stop offset="0.4" stop-color="#ff5a4e"/>
      <stop offset="1" stop-color="#9c2018"/>
    </radialGradient>
    <radialGradient id="blue" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#cfe9ff"/>
      <stop offset="0.4" stop-color="#4aa8ff"/>
      <stop offset="1" stop-color="#1c5a9e"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a96a8"/>
      <stop offset="0.5" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#8a96a8"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d8eeff"/>
    </linearGradient>
    <linearGradient id="title2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a7e"/>
      <stop offset="1" stop-color="#ff4a3e"/>
    </linearGradient>
    <radialGradient id="flash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#ffe680" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd447" stop-opacity="0"/>
    </radialGradient>
    <g id="cloud">
      <circle cx="-40" cy="8" r="26" fill="#dcecfb"/><circle cx="-10" cy="-4" r="34" fill="#dcecfb"/><circle cx="28" cy="2" r="30" fill="#dcecfb"/><circle cx="56" cy="12" r="20" fill="#dcecfb"/>
      <circle cx="-40" cy="2" r="24" fill="#fff"/><circle cx="-10" cy="-10" r="32" fill="#fff"/><circle cx="28" cy="-4" r="28" fill="#fff"/><circle cx="56" cy="6" r="18" fill="#fff"/>
    </g>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="560" cy="64" r="90" fill="url(#sun)"/>
  <circle cx="560" cy="64" r="26" fill="#fffbe8"/>

  <!-- distant floating islands -->
  <g opacity="0.9">
    <path d="M70 120 Q100 170 112 186 Q124 168 150 120 Z" fill="#9b8466"/>
    <ellipse cx="110" cy="120" rx="42" ry="10" fill="#7cc456"/>
    <circle cx="96" cy="106" r="13" fill="#4f9e3c"/><circle cx="118" cy="102" r="16" fill="#5fb046"/>
    <path d="M520 168 Q540 200 548 212 Q558 198 576 168 Z" fill="#9b8466"/>
    <ellipse cx="548" cy="168" rx="30" ry="7" fill="#7cc456"/>
    <circle cx="552" cy="156" r="11" fill="#5fb046"/>
  </g>

  <!-- clouds below -->
  <use href="#cloud" transform="translate(70 318) scale(1.3)"/>
  <use href="#cloud" transform="translate(580 300) scale(1.2)"/>
  <use href="#cloud" transform="translate(330 352) scale(1.6)"/>

  <!-- the platform -->
  <path d="M152 236 C160 300 260 340 320 352 C380 340 480 300 488 236 Z" fill="url(#under)"/>
  <path d="M190 280 Q320 330 450 280" fill="none" stroke="#000" stroke-opacity="0.15" stroke-width="3"/>
  <path d="M220 310 Q320 345 420 310" fill="none" stroke="#000" stroke-opacity="0.12" stroke-width="3"/>
  <path d="M152 214 A168 72 0 0 0 488 214 L488 236 A168 72 0 0 1 152 236 Z" fill="url(#side)" stroke="#3a2412" stroke-opacity="0.5" stroke-width="2"/>
  <g stroke="#000" stroke-opacity="0.2" stroke-width="2">
    <line x1="190" y1="250" x2="190" y2="268"/><line x1="240" y1="265" x2="240" y2="283"/><line x1="295" y1="272" x2="295" y2="290"/><line x1="350" y1="272" x2="350" y2="290"/><line x1="405" y1="266" x2="405" y2="284"/><line x1="452" y1="252" x2="452" y2="270"/>
  </g>
  <path d="M200 262 q-4 18 2 30 M260 278 q4 16 -2 26 M420 276 q-3 14 2 24" fill="none" stroke="#4f8f3a" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="320" cy="214" rx="168" ry="72" fill="url(#top)"/>
  <ellipse cx="320" cy="214" rx="152" ry="64" fill="none" stroke="#e8cb85" stroke-width="9"/>
  <ellipse cx="320" cy="214" rx="152" ry="64" fill="none" stroke="#b98a3e" stroke-width="2" stroke-dasharray="3 6"/>
  <ellipse cx="320" cy="214" rx="80" ry="34" fill="none" stroke="#b98a3e" stroke-opacity="0.45" stroke-width="2"/>
  <path d="M152 214 A168 72 0 0 1 488 214" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2"/>

  <!-- shadows -->
  <ellipse cx="262" cy="230" rx="42" ry="16" fill="#000" opacity="0.25"/>
  <ellipse cx="384" cy="226" rx="42" ry="16" fill="#000" opacity="0.25"/>

  <!-- speed lines behind the red bot -->
  <g stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="160" y1="182" x2="205" y2="186"/><line x1="150" y1="202" x2="205" y2="204"/><line x1="166" y1="222" x2="208" y2="220"/>
  </g>

  <!-- red robot (dashing right) -->
  <g transform="translate(262 222)">
    <rect x="-36" y="-12" width="54" height="16" rx="7" fill="#16181f"/>
    <rect x="-36" y="-17" width="54" height="16" rx="7" fill="#3a3e4a" stroke="#0d0e13" stroke-width="2"/>
    <path d="M18 -22 L40 -16 L40 6 L18 12 Z" fill="#8a6410"/>
    <path d="M18 -28 L40 -22 L40 0 L18 6 Z" fill="#ffd447" stroke="#1c2030" stroke-width="2"/>
    <circle cx="-2" cy="-44" r="34" fill="url(#red)" stroke="#6e1612" stroke-width="3"/>
    <path d="M-34 -36 Q-2 -22 30 -36" fill="none" stroke="#c7372d" stroke-width="5"/>
    <ellipse cx="-14" cy="-62" rx="10" ry="5" fill="#fff" opacity="0.5" transform="rotate(-35 -14 -62)"/>
    <rect x="-2" y="-58" width="34" height="24" rx="9" fill="#121826" stroke="#6e1612" stroke-width="2"/>
    <path d="M4 -51 L14 -47 L13 -41 L5 -42 Z M20 -47 L30 -51 L29 -42 L21 -41 Z" fill="#ff6b4a"/>
    <line x1="-4" y1="-77" x2="-8" y2="-96" stroke="#3b3f48" stroke-width="3"/>
    <circle cx="-8" cy="-99" r="6" fill="#ff5a4e"/>
    <circle cx="-34" cy="-38" r="7" fill="#d6dde8" stroke="#3b3f48" stroke-width="2"/>
  </g>

  <!-- blue robot (blocking, knocked back) -->
  <g transform="translate(386 218) rotate(8)">
    <rect x="-18" y="-12" width="54" height="16" rx="7" fill="#16181f"/>
    <rect x="-18" y="-17" width="54" height="16" rx="7" fill="#3a3e4a" stroke="#0d0e13" stroke-width="2"/>
    <circle cx="4" cy="-44" r="34" fill="url(#blue)" stroke="#123a66" stroke-width="3"/>
    <path d="M-28 -36 Q4 -22 36 -36" fill="none" stroke="#2f7fd0" stroke-width="5"/>
    <ellipse cx="-8" cy="-62" rx="10" ry="5" fill="#fff" opacity="0.5" transform="rotate(-35 -8 -62)"/>
    <rect x="-26" y="-58" width="32" height="24" rx="9" fill="#121826" stroke="#123a66" stroke-width="2"/>
    <g stroke="#ffe066" stroke-width="2.5" fill="none"><circle cx="-17" cy="-46" r="5"/><circle cx="-3" cy="-46" r="5"/></g>
    <circle cx="-17" cy="-46" r="1.8" fill="#ffe066"/><circle cx="-3" cy="-46" r="1.8" fill="#ffe066"/>
    <path d="M18 -82 l0 -14 M10 -96 h16" stroke="#3b3f48" stroke-width="3"/>
    <ellipse cx="18" cy="-98" rx="18" ry="4" fill="#ffd447"/>
    <circle cx="36" cy="-60" r="7" fill="#d6dde8" stroke="#3b3f48" stroke-width="2" transform="rotate(-30 36 -60)"/>
    <ellipse cx="44" cy="-82" rx="4" ry="6" fill="#7fd8ff"/>
  </g>

  <!-- impact -->
  <circle cx="322" cy="196" r="44" fill="url(#flash)"/>
  <g fill="#ffd447" stroke="#fff" stroke-width="2" stroke-linejoin="round">
    <path d="M322 160 L330 184 L356 178 L338 196 L356 214 L330 208 L322 232 L314 208 L288 214 L306 196 L288 178 L314 184 Z"/>
  </g>
  <g stroke="#fff" stroke-width="3" stroke-linecap="round">
    <line x1="350" y1="160" x2="362" y2="146"/><line x1="296" y1="160" x2="286" y2="146"/><line x1="360" y1="226" x2="374" y2="236"/>
  </g>

  <!-- title -->
  <g font-family="Fredoka, 'Trebuchet MS', Arial, sans-serif" font-weight="700" font-size="74" text-anchor="middle" stroke-linejoin="round">
    <text x="320" y="96" fill="#0d3f66" stroke="#0d3f66" stroke-width="14">SUMO BOTS</text>
    <text x="320" y="90" fill="#1478b8" stroke="#1478b8" stroke-width="10">SUMO BOTS</text>
    <text x="320" y="88"><tspan fill="url(#title)">SUMO </tspan><tspan fill="url(#title2)">BOTS</tspan></text>
  </g>
</svg>
