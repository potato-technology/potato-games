<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Idle Kingdom game card: a storybook castle on a green hill showers gold coins, with a windmill, a dragon, a golden goose and a floating sky castle -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a9cff"/>
      <stop offset="1" stop-color="#cfeeff"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86d675"/>
      <stop offset="1" stop-color="#3f9a45"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9c968a"/>
      <stop offset="0.4" stop-color="#d6d0c4"/>
      <stop offset="1" stop-color="#8f897d"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e05a50"/>
      <stop offset="1" stop-color="#a8322b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff3b0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd43b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coin" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.5" stop-color="#ffd43b"/>
      <stop offset="1" stop-color="#c98f00"/>
    </radialGradient>
    <symbol id="c" viewBox="-10 -10 20 20" overflow="visible"><circle r="9" fill="url(#coin)" stroke="#9a6a00" stroke-width="1.5"/><circle r="5" fill="none" stroke="#c98f00" stroke-width="1.2"/></symbol>
    <symbol id="tw" viewBox="0 0 40 120" overflow="visible">
      <rect x="4" y="40" width="32" height="80" fill="url(#wall)" stroke="#6f695e" stroke-width="1.5"/>
      <path d="M0 42 L20 0 L40 42 Z" fill="url(#roof)" stroke="#7a2520" stroke-width="1.5"/>
      <rect x="15" y="60" width="10" height="16" rx="5" fill="#3a2a1a"/><rect x="17" y="63" width="6" height="8" fill="#ffd96a"/>
    </symbol>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="92" cy="80" r="70" fill="url(#glow)"/>
  <circle cx="92" cy="80" r="30" fill="#fff2b3"/>
  <!-- clouds + sky castle -->
  <g fill="#fff">
    <ellipse cx="520" cy="96" rx="70" ry="16"/><ellipse cx="490" cy="86" rx="34" ry="14"/><ellipse cx="552" cy="84" rx="38" ry="15"/>
    <ellipse cx="250" cy="50" rx="44" ry="11" opacity="0.9"/><ellipse cx="272" cy="42" rx="24" ry="10" opacity="0.9"/>
  </g>
  <g>
    <rect x="496" y="52" width="50" height="34" fill="#e7f5ff"/>
    <rect x="486" y="36" width="14" height="50" fill="#d0ebff"/><rect x="542" y="36" width="14" height="50" fill="#d0ebff"/>
    <path d="M482 38 L493 18 L504 38 Z" fill="#4dabf7"/><path d="M538 38 L549 18 L560 38 Z" fill="#4dabf7"/><path d="M506 52 L521 30 L536 52 Z" fill="#339af0"/>
  </g>
  <!-- mountains -->
  <path d="M380 260 L470 150 L520 190 L570 120 L640 200 L640 270 Z" fill="#7d8fae"/>
  <path d="M556 138 L570 120 L586 140 L576 146 L570 136 L562 146 Z" fill="#fff"/>
  <path d="M0 250 L70 170 L150 240 Z" fill="#8a9bb8"/>
  <!-- dragon -->
  <g transform="translate(600 150) scale(-1 1)">
    <ellipse cx="0" cy="0" rx="18" ry="8" fill="#40c057"/>
    <path d="M-4 -4 L-20 -30 L8 -6 Z" fill="#2f9e44"/>
    <ellipse cx="18" cy="-6" rx="8" ry="6" fill="#40c057"/>
    <path d="M-16 0 Q -30 4 -36 -4" stroke="#40c057" stroke-width="4" fill="none"/>
    <circle cx="21" cy="-7" r="1.6" fill="#212529"/>
    <path d="M26 -6 L44 -12 L44 2 Z" fill="#ff922b" opacity="0.9"/>
  </g>
  <!-- hills -->
  <path d="M0 270 Q 160 220 320 255 T 640 250 L640 360 L0 360 Z" fill="url(#hill)"/>
  <path d="M0 300 Q 200 280 360 300 T 640 296 L640 360 L0 360 Z" fill="#4fae4f" opacity="0.6"/>
  <!-- road -->
  <path d="M320 262 Q 330 310 300 360" stroke="#d9b77a" stroke-width="22" fill="none" stroke-linecap="round"/>
  <!-- fields + windmill -->
  <g transform="translate(70 312) skewX(-30) scale(1 0.5)"><rect x="-30" y="-30" width="60" height="60" fill="#e9c46a"/><rect x="40" y="-30" width="60" height="60" fill="#d4a73f"/></g>
  <g transform="translate(150 288)">
    <path d="M-12 0 L-8 -50 L8 -50 L12 0 Z" fill="#efe1c4" stroke="#b8a27d" stroke-width="1.5"/>
    <path d="M-10 -50 L0 -64 L10 -50 Z" fill="#c0504d"/>
    <g transform="translate(0 -48) rotate(20)" fill="#f8f0e3" stroke="#c9b38f" stroke-width="1">
      <rect x="-3" y="-38" width="6" height="36"/><rect x="-3" y="2" width="6" height="36"/><rect x="-38" y="-3" width="36" height="6"/><rect x="2" y="-3" width="36" height="6"/>
    </g>
    <circle cx="0" cy="-48" r="3.5" fill="#6b4423"/>
  </g>
  <!-- houses -->
  <g>
    <rect x="420" y="268" width="36" height="28" fill="#f1d7a7"/><path d="M414 268 L438 248 L462 268 Z" fill="#c0504d"/><rect x="433" y="282" width="10" height="14" fill="#5c3b1e"/>
    <rect x="466" y="276" width="32" height="24" fill="#e8d1a0"/><path d="M461 276 L482 258 L503 276 Z" fill="#3b5bdb"/>
  </g>
  <!-- castle -->
  <g transform="translate(320 250)">
    <ellipse cx="0" cy="6" rx="130" ry="14" fill="#000" opacity="0.18"/>
    <rect x="-120" y="-50" width="240" height="52" fill="url(#wall)" stroke="#6f695e" stroke-width="1.5"/>
    <g fill="#c9c2b5"><rect x="-120" y="-58" width="9" height="9"/><rect x="-100" y="-58" width="9" height="9"/><rect x="-80" y="-58" width="9" height="9"/><rect x="60" y="-58" width="9" height="9"/><rect x="80" y="-58" width="9" height="9"/><rect x="100" y="-58" width="9" height="9"/></g>
    <use href="#tw" x="-140" y="-120" width="40" height="120"/>
    <use href="#tw" x="100" y="-120" width="40" height="120"/>
    <use href="#tw" x="-82" y="-160" width="44" height="132"/>
    <use href="#tw" x="38" y="-160" width="44" height="132"/>
    <use href="#tw" x="-34" y="-208" width="68" height="190"/>
    <path d="M0 -208 V -232" stroke="#5c4a32" stroke-width="2.5"/>
    <path d="M0 -232 Q 12 -236 24 -230 L 24 -220 Q 12 -226 0 -222 Z" fill="#e03131"/>
    <rect x="-18" y="-44" width="36" height="46" rx="18" fill="#5c3b1e"/>
    <path d="M-12 -100 H12 V-74 L0 -80 L-12 -74 Z" fill="#e03131" stroke="#7a1c1c" stroke-width="1"/>
    <path d="M-6 -88 V-95 L-3 -91 L0 -97 L3 -91 L6 -95 V-88 Z" fill="#ffd43b"/>
  </g>
  <!-- coin shower -->
  <circle cx="320" cy="150" r="110" fill="url(#glow)" opacity="0.55"/>
  <g>
    <use href="#c" x="236" y="128" width="20" height="20"/><use href="#c" x="214" y="166" width="18" height="18"/><use href="#c" x="260" y="96" width="22" height="22"/>
    <use href="#c" x="390" y="110" width="22" height="22"/><use href="#c" x="414" y="150" width="18" height="18"/><use href="#c" x="372" y="78" width="16" height="16"/>
    <use href="#c" x="196" y="210" width="16" height="16"/><use href="#c" x="436" y="196" width="16" height="16"/><use href="#c" x="300" y="70" width="14" height="14"/>
  </g>
  <!-- golden goose -->
  <g transform="translate(140 130)">
    <circle r="30" fill="url(#glow)"/>
    <ellipse cx="0" cy="0" rx="16" ry="9" fill="#ffd43b" stroke="#c98f00" stroke-width="1"/>
    <path d="M10 -4 Q 18 -16 24 -18" stroke="#ffd43b" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="25" cy="-18" r="5" fill="#ffe066"/><path d="M29 -19 L37 -16 L29 -14 Z" fill="#ff922b"/>
    <path d="M-4 -4 L-14 -24 L8 -6 Z" fill="#ffe066" stroke="#c98f00" stroke-width="1"/>
  </g>
  <!-- title -->
  <g font-family="Fredoka, 'Arial Black', 'Trebuchet MS', sans-serif" font-weight="900" text-anchor="middle">
    <text x="320" y="346" font-size="52" fill="#6b4a00" stroke="#6b4a00" stroke-width="10" stroke-linejoin="round">IDLE KINGDOM</text>
    <text x="320" y="340" font-size="52" fill="#ffd43b" stroke="#4a3200" stroke-width="3" stroke-linejoin="round">IDLE KINGDOM</text>
  </g>
</svg>
