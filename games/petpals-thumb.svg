<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Pet Pals game card: a puppy, a kitten and a bunny in a cozy room -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4e6"/>
      <stop offset="1" stop-color="#ffe2c8"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a06a"/>
      <stop offset="1" stop-color="#b07842"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ccfff"/>
      <stop offset="1" stop-color="#d4f0ff"/>
    </linearGradient>
    <radialGradient id="pup" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#ffe0b0"/>
      <stop offset="0.6" stop-color="#eab36c"/>
      <stop offset="1" stop-color="#c88a48"/>
    </radialGradient>
    <radialGradient id="kit" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#ffd6a8"/>
      <stop offset="0.6" stop-color="#f6a650"/>
      <stop offset="1" stop-color="#d0782a"/>
    </radialGradient>
    <radialGradient id="bun" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f6f2ee"/>
      <stop offset="1" stop-color="#dcd0c8"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa0c4"/>
      <stop offset="1" stop-color="#ff5f98"/>
    </linearGradient>
    <symbol id="heart" viewBox="-12 -12 24 24"><path d="M0 8 C-14 -2 -7 -13 0 -5 C7 -13 14 -2 0 8 Z"/></symbol>
  </defs>

  <rect width="640" height="360" fill="url(#wall)"/>
  <g fill="#ffd2e0" opacity="0.55">
    <circle cx="40" cy="40" r="6"/><circle cx="120" cy="80" r="6"/><circle cx="560" cy="40" r="6"/><circle cx="610" cy="110" r="6"/><circle cx="480" cy="90" r="6"/>
  </g>
  <!-- window -->
  <rect x="452" y="104" width="150" height="116" rx="12" fill="#ffffff"/>
  <rect x="462" y="114" width="130" height="96" rx="7" fill="url(#sky)"/>
  <circle cx="568" cy="136" r="13" fill="#fff3a8"/>
  <path d="M462 210 Q510 182 548 196 Q572 188 592 194 L592 210 Z" fill="#7ccf6a"/>
  <rect x="524" y="114" width="5" height="96" fill="#fff"/><rect x="462" y="160" width="130" height="5" fill="#fff"/>
  <!-- floor and rug -->
  <rect y="262" width="640" height="98" fill="url(#floor)"/>
  <rect y="256" width="640" height="9" fill="#fff"/>
  <g stroke="#8a5428" stroke-opacity="0.25" stroke-width="2">
    <line x1="0" y1="292" x2="640" y2="292"/><line x1="0" y1="326" x2="640" y2="326"/>
    <line x1="120" y1="265" x2="120" y2="292"/><line x1="380" y1="265" x2="380" y2="292"/><line x1="240" y1="292" x2="240" y2="326"/><line x1="520" y1="292" x2="520" y2="326"/>
  </g>
  <ellipse cx="320" cy="330" rx="240" ry="30" fill="#ff9ab8"/>
  <ellipse cx="320" cy="330" rx="190" ry="22" fill="#ffd0de"/>
  <ellipse cx="320" cy="330" rx="130" ry="14" fill="#ff9ab8"/>

  <!-- title -->
  <g text-anchor="middle" font-family="Fredoka, 'Trebuchet MS', Arial, sans-serif" font-weight="700">
    <text x="214" y="88" font-size="70" fill="#c83a72">Pet Pals</text>
    <text x="214" y="82" font-size="70" fill="url(#title)" stroke="#fff" stroke-width="4" paint-order="stroke">Pet Pals</text>
  </g>
  <use href="#heart" x="350" y="20" width="30" height="30" fill="#ff7aa8"/>
  <use href="#heart" x="384" y="48" width="20" height="20" fill="#ffb0c8"/>

  <!-- bunny (left) -->
  <g transform="translate(150 330)" stroke="#8c7c74" stroke-width="3.5" stroke-linejoin="round">
    <ellipse cx="0" cy="2" rx="52" ry="9" fill="#5a3020" opacity="0.15" stroke="none"/>
    <circle cx="38" cy="-20" r="13" fill="#fff"/>
    <ellipse cx="-27" cy="-6" rx="18" ry="9" fill="#ece4de"/><ellipse cx="27" cy="-6" rx="18" ry="9" fill="#ece4de"/>
    <ellipse cx="0" cy="-42" rx="40" ry="38" fill="url(#bun)"/>
    <ellipse cx="0" cy="-34" rx="23" ry="24" fill="#fff" stroke="none"/>
    <g transform="translate(-16 -132) rotate(-8)"><ellipse rx="13" ry="38" fill="url(#bun)"/><ellipse rx="6" ry="27" fill="#ffc2d4" stroke="none"/></g>
    <g transform="translate(16 -132) rotate(8)"><ellipse rx="13" ry="38" fill="url(#bun)"/><ellipse rx="6" ry="27" fill="#ffc2d4" stroke="none"/></g>
    <ellipse cx="0" cy="-104" rx="43" ry="41" fill="url(#bun)"/>
    <ellipse cx="-8" cy="-88" rx="12" ry="10" fill="#fff" stroke="none"/><ellipse cx="8" cy="-88" rx="12" ry="10" fill="#fff" stroke="none"/>
    <g stroke="none">
      <ellipse cx="-20" cy="-108" rx="8.5" ry="10.5" fill="#2a1a20"/><ellipse cx="20" cy="-108" rx="8.5" ry="10.5" fill="#2a1a20"/>
      <circle cx="-17" cy="-112" r="3.2" fill="#fff"/><circle cx="23" cy="-112" r="3.2" fill="#fff"/>
      <ellipse cx="-31" cy="-94" rx="8" ry="5" fill="#ff7896" opacity="0.45"/><ellipse cx="31" cy="-94" rx="8" ry="5" fill="#ff7896" opacity="0.45"/>
      <ellipse cx="0" cy="-95" rx="5" ry="3.5" fill="#ff8aa8"/>
      <rect x="-4" y="-88" width="8" height="6" fill="#fff"/>
    </g>
    <ellipse cx="-17" cy="-10" rx="12" ry="9" fill="#f6f2ee"/><ellipse cx="17" cy="-10" rx="12" ry="9" fill="#f6f2ee"/>
  </g>

  <!-- puppy (middle, happy) -->
  <g transform="translate(322 334)" stroke="#7a4a24" stroke-width="3.5" stroke-linejoin="round">
    <ellipse cx="0" cy="2" rx="58" ry="10" fill="#5a3020" opacity="0.15" stroke="none"/>
    <path d="M34 -32 Q56 -40 58 -70" fill="none" stroke="#7a4a24" stroke-width="16" stroke-linecap="round"/>
    <path d="M34 -32 Q56 -40 58 -70" fill="none" stroke="#eab36c" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="-29" cy="-6" rx="19" ry="9" fill="#d89a58"/><ellipse cx="29" cy="-6" rx="19" ry="9" fill="#d89a58"/>
    <ellipse cx="0" cy="-44" rx="42" ry="40" fill="url(#pup)"/>
    <ellipse cx="0" cy="-36" rx="24" ry="26" fill="#fff1d8" stroke="none"/>
    <rect x="-30" y="-80" width="60" height="10" rx="5" fill="#e8384f"/>
    <circle cx="0" cy="-66" r="6" fill="#ffd84a"/>
    <ellipse cx="0" cy="-114" rx="50" ry="45" fill="url(#pup)"/>
    <g transform="translate(-46 -128) rotate(22)"><ellipse cx="0" cy="22" rx="15" ry="31" fill="#b8783a"/></g>
    <g transform="translate(46 -128) rotate(-22)"><ellipse cx="0" cy="22" rx="15" ry="31" fill="#b8783a"/></g>
    <ellipse cx="0" cy="-96" rx="25" ry="18" fill="#fff1d8" stroke="none"/>
    <g stroke="#2a1a20" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M-29 -118 A8 8 0 0 1 -13 -118"/><path d="M13 -118 A8 8 0 0 1 29 -118"/>
    </g>
    <g stroke="none">
      <ellipse cx="-34" cy="-102" rx="9" ry="5" fill="#ff7896" opacity="0.45"/><ellipse cx="34" cy="-102" rx="9" ry="5" fill="#ff7896" opacity="0.45"/>
      <ellipse cx="0" cy="-104" rx="8" ry="6" fill="#2a1a20"/>
      <ellipse cx="0" cy="-90" rx="9" ry="8" fill="#8a2a3a"/>
      <ellipse cx="3" cy="-84" rx="5" ry="7" fill="#ff7a8a"/>
    </g>
    <ellipse cx="-18" cy="-10" rx="13" ry="9.5" fill="#eab36c"/><ellipse cx="18" cy="-10" rx="13" ry="9.5" fill="#eab36c"/>
  </g>

  <!-- kitten (right) -->
  <g transform="translate(496 334)" stroke="#8a4a18" stroke-width="3.5" stroke-linejoin="round">
    <ellipse cx="0" cy="2" rx="52" ry="9" fill="#5a3020" opacity="0.15" stroke="none"/>
    <path d="M32 -22 C70 -24 46 -70 66 -96" fill="none" stroke="#8a4a18" stroke-width="15" stroke-linecap="round"/>
    <path d="M32 -22 C70 -24 46 -70 66 -96" fill="none" stroke="#f6a650" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="-27" cy="-6" rx="18" ry="9" fill="#e8964a"/><ellipse cx="27" cy="-6" rx="18" ry="9" fill="#e8964a"/>
    <ellipse cx="0" cy="-42" rx="40" ry="38" fill="url(#kit)"/>
    <ellipse cx="0" cy="-34" rx="23" ry="24" fill="#fff0dc" stroke="none"/>
    <path d="M-28 -74 L28 -74 L0 -64 Z" fill="#4a6bff" stroke="#2f4ad0"/>
    <path d="M-42 -112 L-36 -152 L-10 -136 Z" fill="#f6a650"/><path d="M42 -112 L36 -152 L10 -136 Z" fill="#f6a650"/>
    <path d="M-36 -118 L-33 -142 L-18 -132 Z" fill="#ffb6c8" stroke="none"/><path d="M36 -118 L33 -142 L18 -132 Z" fill="#ffb6c8" stroke="none"/>
    <ellipse cx="0" cy="-104" rx="48" ry="40" fill="url(#kit)"/>
    <g stroke="#c46a20" stroke-width="4" stroke-linecap="round"><line x1="-10" y1="-142" x2="-8" y2="-130"/><line x1="0" y1="-144" x2="0" y2="-131"/><line x1="10" y1="-142" x2="8" y2="-130"/></g>
    <ellipse cx="0" cy="-90" rx="19" ry="12" fill="#fff0dc" stroke="none"/>
    <g stroke="none">
      <ellipse cx="-20" cy="-108" rx="8.5" ry="10.5" fill="#2a1a20"/><ellipse cx="20" cy="-108" rx="8.5" ry="10.5" fill="#2a1a20"/>
      <circle cx="-17" cy="-112" r="3.2" fill="#fff"/><circle cx="23" cy="-112" r="3.2" fill="#fff"/>
      <ellipse cx="-32" cy="-94" rx="8" ry="5" fill="#ff7896" opacity="0.45"/><ellipse cx="32" cy="-94" rx="8" ry="5" fill="#ff7896" opacity="0.45"/>
      <path d="M-5 -97 L5 -97 L0 -92 Z" fill="#ff8aa8"/>
    </g>
    <g stroke="#5a3a2a" stroke-opacity="0.5" stroke-width="1.6"><line x1="-18" y1="-92" x2="-44" y2="-96"/><line x1="-18" y1="-88" x2="-44" y2="-86"/><line x1="18" y1="-92" x2="44" y2="-96"/><line x1="18" y1="-88" x2="44" y2="-86"/></g>
    <path d="M-6 -88 A5 5 0 0 0 0 -86 A5 5 0 0 0 6 -88" fill="none" stroke="#2a1a20" stroke-width="2.6" stroke-linecap="round"/>
    <ellipse cx="-17" cy="-10" rx="12" ry="9" fill="#f6a650"/><ellipse cx="17" cy="-10" rx="12" ry="9" fill="#f6a650"/>
  </g>

  <!-- floating hearts and a ball -->
  <use href="#heart" x="236" y="150" width="22" height="22" fill="#ff7aa8"/>
  <use href="#heart" x="408" y="132" width="18" height="18" fill="#ff9ab8"/>
  <use href="#heart" x="90" y="150" width="16" height="16" fill="#ffb0c8"/>
  <g transform="translate(590 318)">
    <circle r="16" fill="#e8384f" stroke="#a51d2b" stroke-width="2.5"/>
    <path d="M-12 -10 A16 16 0 0 1 -12 10" fill="none" stroke="#fff" stroke-width="3.5"/>
    <path d="M12 -10 A16 16 0 0 0 12 10" fill="none" stroke="#fff" stroke-width="3.5"/>
    <ellipse cx="-5" cy="-7" rx="4" ry="2.4" fill="#fff" opacity="0.6"/>
  </g>
</svg>
