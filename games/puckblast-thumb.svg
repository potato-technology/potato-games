<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Puck Blast game card: a slap shot zooming across an air hockey table -->
  <defs>
    <radialGradient id="room" cx="50%" cy="55%" r="75%">
      <stop offset="0" stop-color="#1f2c58"/>
      <stop offset="1" stop-color="#060a18"/>
    </radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a68aa"/>
      <stop offset="1" stop-color="#18244a"/>
    </linearGradient>
    <linearGradient id="surf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6fbff"/>
      <stop offset="1" stop-color="#c3dbf4"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd84a" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffd84a" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a95"/>
      <stop offset="0.5" stop-color="#ff4757"/>
      <stop offset="1" stop-color="#a51d2b"/>
    </linearGradient>
    <radialGradient id="redknob" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#ffc2c8"/>
      <stop offset="0.6" stop-color="#ff4757"/>
      <stop offset="1" stop-color="#a51d2b"/>
    </radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ccaff"/>
      <stop offset="0.5" stop-color="#3fa3ff"/>
      <stop offset="1" stop-color="#1b56a6"/>
    </linearGradient>
    <radialGradient id="blueknob" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#d0eaff"/>
      <stop offset="0.6" stop-color="#3fa3ff"/>
      <stop offset="1" stop-color="#1b56a6"/>
    </radialGradient>
    <radialGradient id="puck" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#5a6070"/>
      <stop offset="1" stop-color="#1c1f28"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cdeeff"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="640" height="360" fill="url(#room)"/>
  <g transform="translate(22 30) scale(0.93)">
  <!-- table -->
  <rect x="26" y="66" width="588" height="278" rx="62" fill="#000" opacity="0.45" filter="url(#soft)"/>
  <rect x="20" y="56" width="600" height="284" rx="60" fill="url(#rail)"/>
  <rect x="22" y="58" width="596" height="280" rx="58" fill="none" stroke="#8aa8ec" stroke-width="2.5" opacity="0.7"/>
  <rect x="40" y="74" width="560" height="248" rx="42" fill="url(#surf)"/>
  <g fill="#2f6fd6" opacity="0.16">
    <circle cx="60" cy="90" r="1.5"/><circle cx="80" cy="90" r="1.5"/><circle cx="100" cy="90" r="1.5"/><circle cx="560" cy="300" r="1.5"/><circle cx="580" cy="300" r="1.5"/>
  </g>
  <line x1="320" y1="74" x2="320" y2="322" stroke="#e8464f" stroke-width="4"/>
  <circle cx="320" cy="198" r="44" fill="none" stroke="#e8464f" stroke-width="3.5"/>
  <circle cx="320" cy="198" r="6" fill="#e8464f"/>
  <path d="M40 128 A70 70 0 0 1 40 268" fill="none" stroke="#2f6fd6" stroke-width="3.5"/>
  <path d="M600 128 A70 70 0 0 0 600 268" fill="none" stroke="#2f6fd6" stroke-width="3.5"/>
  <line x1="180" y1="74" x2="180" y2="322" stroke="#2f6fd6" stroke-width="3" opacity="0.45"/>
  <line x1="460" y1="74" x2="460" y2="322" stroke="#2f6fd6" stroke-width="3" opacity="0.45"/>
  <rect x="22" y="146" width="20" height="104" rx="8" fill="#0a0a10"/>
  <rect x="598" y="146" width="20" height="104" rx="8" fill="#0a0a10"/>

  <!-- the puck flying into the goal with a slap-shot trail -->
  <path d="M250 262 L548 208 L552 232 Z" fill="url(#trail)"/>
  <g fill="#ffd84a">
    <path d="M300 226 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 Z"/>
    <path d="M420 246 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 Z" opacity="0.8"/>
  </g>
  <circle cx="556" cy="220" r="30" fill="#fff4b0" opacity="0.35"/>
  <ellipse cx="559" cy="224" rx="17" ry="16" fill="#000" opacity="0.3"/>
  <circle cx="556" cy="220" r="16" fill="url(#puck)" stroke="#5a6070" stroke-width="2.5"/>
  <circle cx="556" cy="220" r="10" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>
  <ellipse cx="550" cy="214" rx="6" ry="2.6" fill="#fff" opacity="0.4" transform="rotate(-30 550 214)"/>

  <!-- red mallet (you) -->
  <g transform="translate(206 270)">
    <ellipse cx="4" cy="6" rx="36" ry="34" fill="#000" opacity="0.3"/>
    <circle r="34" fill="url(#red)" stroke="#6a1018" stroke-width="2"/>
    <circle r="24" fill="#c42a3a"/>
    <circle cy="2" r="15" fill="#000" opacity="0.25"/>
    <circle cy="-1" r="14" fill="url(#redknob)" stroke="#6a1018" stroke-width="1.5"/>
    <ellipse cx="-5" cy="-7" rx="5" ry="3" fill="#fff" opacity="0.65" transform="rotate(-28 -5 -7)"/>
  </g>
  <!-- speed lines behind the red mallet -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="140" y1="292" x2="164" y2="288"/>
    <line x1="132" y1="270" x2="160" y2="268"/>
    <line x1="142" y1="250" x2="164" y2="250"/>
  </g>
  <!-- blue mallet diving to save -->
  <g transform="translate(520 130)">
    <ellipse cx="4" cy="6" rx="36" ry="34" fill="#000" opacity="0.3"/>
    <circle r="34" fill="url(#blue)" stroke="#0e2c5a" stroke-width="2"/>
    <circle r="24" fill="#2470c4"/>
    <circle cy="2" r="15" fill="#000" opacity="0.25"/>
    <circle cy="-1" r="14" fill="url(#blueknob)" stroke="#0e2c5a" stroke-width="1.5"/>
    <ellipse cx="-5" cy="-7" rx="5" ry="3" fill="#fff" opacity="0.65" transform="rotate(-28 -5 -7)"/>
  </g>

  </g>
  <!-- title -->
  <g text-anchor="middle" font-family="Fredoka, 'Trebuchet MS', Arial, sans-serif" font-weight="700">
    <text x="320" y="66" font-size="60" fill="#8a1a30">Puck Blast</text>
    <text x="320" y="62" font-size="60" fill="#ff4f6d">Puck Blast</text>
    <text x="320" y="58" font-size="60" fill="url(#title)" stroke="#0e2c5a" stroke-width="3" paint-order="stroke">Puck Blast</text>
  </g>
</svg>
