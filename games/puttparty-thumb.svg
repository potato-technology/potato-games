<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Putt Party game card: a sunny mini golf hole in perspective. A golf ball zooms along a sparkly
       trail toward the cup and its red flag, past a red-roofed windmill and a bouncy mushroom bumper.
       A palm tree and a ringed planet peek in from the sides to hint at the pirate and space courses. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc4ff"/>
      <stop offset="1" stop-color="#c8f1ff"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd46a"/>
      <stop offset="1" stop-color="#5da845"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa446"/>
      <stop offset="1" stop-color="#2f6e2c"/>
    </linearGradient>
    <linearGradient id="turf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fe06a"/>
      <stop offset="1" stop-color="#5cbc45"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4efe2"/>
      <stop offset="1" stop-color="#a99f8c"/>
    </linearGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e6ebf0"/>
      <stop offset="1" stop-color="#8f99a3"/>
    </radialGradient>
    <radialGradient id="hole" cx="50%" cy="65%" r="60%">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#2a2a2a"/>
    </radialGradient>
    <linearGradient id="flag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a4a"/>
      <stop offset="0.5" stop-color="#e8352a"/>
      <stop offset="1" stop-color="#b8201a"/>
    </linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a7b0b8"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff6e2"/>
      <stop offset="1" stop-color="#d9c49c"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a5a"/>
      <stop offset="1" stop-color="#a8301c"/>
    </linearGradient>
    <radialGradient id="shroom" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ff9a8a"/>
      <stop offset="0.6" stop-color="#e8352a"/>
      <stop offset="1" stop-color="#8a1810"/>
    </radialGradient>
    <radialGradient id="planet" cx="35%" cy="35%" r="75%">
      <stop offset="0" stop-color="#ffe0b0"/>
      <stop offset="0.5" stop-color="#ff9a5a"/>
      <stop offset="1" stop-color="#8a3a2a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff7c2" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff7c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2a0"/>
      <stop offset="1" stop-color="#ffb800"/>
    </linearGradient>
    <clipPath id="fairClip">
      <path d="M248 168 L410 168 Q452 168 474 196 L612 360 L28 360 L176 198 Q196 168 248 168 Z"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- sky, clouds and a far-away planet -->
  <rect width="640" height="360" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="300" cy="52" rx="46" ry="16"/><ellipse cx="330" cy="42" rx="30" ry="18"/><ellipse cx="275" cy="46" rx="24" ry="14"/>
    <ellipse cx="88" cy="40" rx="34" ry="11"/><ellipse cx="110" cy="33" rx="22" ry="13"/>
  </g>
  <circle cx="584" cy="44" r="34" fill="#ffffff" opacity="0.25"/>
  <circle cx="584" cy="44" r="24" fill="url(#planet)"/>
  <path d="M552 54 Q584 34 618 34" fill="none" stroke="#fff2dc" stroke-width="4" stroke-linecap="round" opacity="0.85"/>

  <!-- rolling hills and ground -->
  <path d="M0 140 Q90 100 190 132 Q290 96 400 128 Q500 100 640 126 L640 360 L0 360 Z" fill="url(#hillFar)"/>
  <path d="M0 160 Q160 140 320 158 Q480 140 640 156 L640 360 L0 360 Z" fill="url(#ground)"/>

  <!-- palm tree on the right hill -->
  <path d="M600 160 Q596 120 610 92" fill="none" stroke="#8a5a2c" stroke-width="7" stroke-linecap="round"/>
  <g fill="#2f9a3a">
    <path d="M610 92 Q640 84 646 104 Q632 92 610 92 Z"/>
    <path d="M610 92 Q596 70 572 78 Q594 80 610 92 Z"/>
    <path d="M610 92 Q622 66 640 70 Q622 74 610 92 Z"/>
    <path d="M610 92 Q580 92 568 110 Q588 96 610 92 Z"/>
  </g>
  <circle cx="610" cy="94" r="4" fill="#6a3f18"/>

  <!-- windmill at the back of the hole -->
  <ellipse cx="128" cy="178" rx="48" ry="10" fill="#1f4d1c" opacity="0.45"/>
  <path d="M102 176 L112 96 L144 96 L154 176 Z" fill="url(#tower)" stroke="#8a6a40" stroke-width="2"/>
  <path d="M120 176 L120 152 Q128 142 136 152 L136 176 Z" fill="#5a3a1e"/>
  <rect x="122" y="112" width="12" height="14" rx="2" fill="#7ab8e0" stroke="#8a6a40" stroke-width="1.5"/>
  <path d="M104 98 L128 62 L152 98 Z" fill="url(#roof)" stroke="#7a2010" stroke-width="2"/>
  <g transform="translate(128 84) rotate(18)">
    <g fill="#fff8e8" stroke="#7a5028" stroke-width="2">
      <rect x="4" y="-7" width="62" height="14"/>
      <rect x="-66" y="-7" width="62" height="14"/>
      <rect x="-7" y="4" width="14" height="62"/>
      <rect x="-7" y="-66" width="14" height="62"/>
    </g>
    <g stroke="#7a5028" stroke-width="1.4">
      <path d="M18 -7 V7 M32 -7 V7 M46 -7 V7 M-18 -7 V7 M-32 -7 V7 M-46 -7 V7 M-7 18 H7 M-7 32 H7 M-7 46 H7 M-7 -18 H7 M-7 -32 H7 M-7 -46 H7"/>
    </g>
    <circle r="8" fill="#7a2010"/>
    <circle r="3" fill="#ffd36b"/>
  </g>

  <!-- the fairway: stone border, then striped turf -->
  <path d="M248 168 L410 168 Q452 168 474 196 L612 360 L28 360 L176 198 Q196 168 248 168 Z" fill="none" stroke="#5e584c" stroke-width="22" stroke-linejoin="round"/>
  <path d="M248 168 L410 168 Q452 168 474 196 L612 360 L28 360 L176 198 Q196 168 248 168 Z" fill="none" stroke="url(#stone)" stroke-width="17" stroke-linejoin="round"/>
  <g stroke="#8a8270" stroke-width="1.6">
    <path d="M232 160 L234 176 M282 160 L282 176 M334 160 L334 176 M386 160 L386 176 M436 168 L428 184"/>
    <path d="M168 200 L180 210 M138 236 L150 246 M106 272 L120 282 M72 310 L86 320 M44 344 L58 354"/>
    <path d="M488 204 L474 214 M516 238 L502 248 M546 274 L532 284 M576 312 L562 322 M602 344 L588 354"/>
  </g>
  <path d="M248 168 L410 168 Q452 168 474 196 L612 360 L28 360 L176 198 Q196 168 248 168 Z" fill="url(#turf)"/>
  <g clip-path="url(#fairClip)">
    <path d="M0 186 H640 V196 H0 Z M0 210 H640 V224 H0 Z M0 242 H640 V260 H0 Z M0 284 H640 V306 H0 Z M0 334 H640 V360 H0 Z" fill="#ffffff" opacity="0.1"/>
    <path d="M28 360 L176 198 Q196 168 248 168" fill="none" stroke="#1f5a1c" stroke-width="18" opacity="0.25" filter="url(#soft)"/>
    <path d="M410 168 Q452 168 474 196 L612 360" fill="none" stroke="#1f5a1c" stroke-width="18" opacity="0.25" filter="url(#soft)"/>
    <!-- a sand trap at the back -->
    <ellipse cx="236" cy="196" rx="44" ry="11" fill="#c9a660"/>
    <ellipse cx="236" cy="195" rx="40" ry="9" fill="#f6e2a6"/>
  </g>

  <!-- mushroom bumper -->
  <ellipse cx="418" cy="230" rx="30" ry="9" fill="#1f4d1c" opacity="0.35"/>
  <ellipse cx="414" cy="220" rx="28" ry="16" fill="url(#shroom)"/>
  <ellipse cx="404" cy="214" rx="6" ry="3.5" fill="#fff6e8"/>
  <ellipse cx="424" cy="211" rx="4.5" ry="2.6" fill="#fff6e8"/>
  <ellipse cx="418" cy="224" rx="5.5" ry="3" fill="#fff6e8"/>
  <path d="M396 214 Q408 204 424 205" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.55" stroke-linecap="round"/>

  <!-- the cup and flag -->
  <ellipse cx="456" cy="300" rx="40" ry="13" fill="#ffffff" opacity="0.12"/>
  <ellipse cx="456" cy="300" rx="27" ry="9.5" fill="url(#hole)" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M458 300 L520 318" stroke="#1f4d1c" stroke-width="5" opacity="0.25" stroke-linecap="round"/>
  <rect x="453.5" y="128" width="5" height="172" rx="2" fill="url(#pole)"/>
  <circle cx="456" cy="128" r="5" fill="#ffd43b"/>
  <path d="M458 132 Q490 124 512 140 Q530 152 548 146 Q530 168 506 164 Q484 160 458 172 Z" fill="url(#flag)"/>
  <path d="M458 132 Q490 124 512 140 Q500 140 488 146 Q474 150 458 150 Z" fill="#ffffff" opacity="0.18"/>

  <!-- sparkly aim trail and the ball -->
  <g fill="#ffffff">
    <circle cx="150" cy="330" r="3" opacity="0.35"/>
    <circle cx="178" cy="324" r="3.5" opacity="0.45"/>
    <circle cx="208" cy="318" r="4" opacity="0.6"/>
    <circle cx="240" cy="312" r="4.5" opacity="0.75"/>
  </g>
  <path d="M248 300 Q290 296 318 296" fill="none" stroke="#fff7c2" stroke-width="10" stroke-linecap="round" opacity="0.45"/>
  <circle cx="330" cy="296" r="40" fill="url(#glow)"/>
  <ellipse cx="336" cy="318" rx="22" ry="7" fill="#1f4d1c" opacity="0.4"/>
  <circle cx="330" cy="294" r="22" fill="url(#ball)"/>
  <g fill="#000000" opacity="0.08">
    <circle cx="336" cy="300" r="2.4"/><circle cx="326" cy="304" r="2.4"/><circle cx="340" cy="290" r="2.4"/><circle cx="320" cy="296" r="2.2"/><circle cx="332" cy="310" r="2"/>
  </g>
  <ellipse cx="322" cy="284" rx="7" ry="4.5" fill="#ffffff" transform="rotate(-30 322 284)"/>
  <path d="M276 276 q0 8 8 8 q-8 0 -8 8 q0 -8 -8 -8 q8 0 8 -8z" fill="#fff7c2"/>
  <path d="M296 322 q0 6 6 6 q-6 0 -6 6 q0 -6 -6 -6 q6 0 6 -6z" fill="#ffffff"/>
  <path d="M372 270 q0 5 5 5 q-5 0 -5 5 q0 -5 -5 -5 q5 0 5 -5z" fill="#ffffff"/>

  <!-- flowers and bushes along the sides -->
  <g>
    <circle cx="20" cy="250" r="22" fill="#3f8f37"/><circle cx="40" cy="238" r="18" fill="#4fa443"/><circle cx="30" cy="232" r="10" fill="#7cc95a"/>
    <circle cx="26" cy="244" r="3" fill="#ff7eb6"/><circle cx="42" cy="232" r="3" fill="#ffffff"/><circle cx="14" cy="236" r="3" fill="#ffd23f"/>
    <circle cx="630" cy="230" r="24" fill="#3f8f37"/><circle cx="612" cy="216" r="17" fill="#4fa443"/><circle cx="618" cy="210" r="8" fill="#7cc95a"/>
    <circle cx="616" cy="222" r="3" fill="#ffffff"/><circle cx="630" cy="214" r="3" fill="#ff7eb6"/>
  </g>
  <g>
    <g fill="#ff7eb6"><circle cx="70" cy="200" r="3.5"/><circle cx="76" cy="200" r="3.5"/><circle cx="73" cy="195" r="3.5"/><circle cx="73" cy="205" r="3.5"/></g><circle cx="73" cy="200" r="2.4" fill="#ffcf3a"/>
    <g fill="#ffffff"><circle cx="540" cy="196" r="3.5"/><circle cx="546" cy="196" r="3.5"/><circle cx="543" cy="191" r="3.5"/><circle cx="543" cy="201" r="3.5"/></g><circle cx="543" cy="196" r="2.4" fill="#ffcf3a"/>
    <g fill="#c792ff"><circle cx="560" cy="226" r="3.5"/><circle cx="566" cy="226" r="3.5"/><circle cx="563" cy="221" r="3.5"/><circle cx="563" cy="231" r="3.5"/></g><circle cx="563" cy="226" r="2.4" fill="#ffcf3a"/>
  </g>

  <!-- three stars -->
  <g stroke="#b8860b" stroke-width="2" stroke-linejoin="round">
    <path transform="translate(488 74) scale(0.9)" d="M0 -20 L5.9 -8.1 L19 -6.2 L9.5 3.1 L11.8 16.2 L0 10 L-11.8 16.2 L-9.5 3.1 L-19 -6.2 L-5.9 -8.1 Z" fill="url(#star)"/>
    <path transform="translate(530 58) scale(1.15)" d="M0 -20 L5.9 -8.1 L19 -6.2 L9.5 3.1 L11.8 16.2 L0 10 L-11.8 16.2 L-9.5 3.1 L-19 -6.2 L-5.9 -8.1 Z" fill="url(#star)"/>
    <path transform="translate(572 82) scale(0.9)" d="M0 -20 L5.9 -8.1 L19 -6.2 L9.5 3.1 L11.8 16.2 L0 10 L-11.8 16.2 L-9.5 3.1 L-19 -6.2 L-5.9 -8.1 Z" fill="url(#star)"/>
  </g>
</svg>
