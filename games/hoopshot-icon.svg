<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Hoop Shot icon: a basketball dropping into an orange rim with a white net -->
  <defs>
    <radialGradient id="bg" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#2f3d7a"/>
      <stop offset="1" stop-color="#0d1230"/>
    </radialGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffb070"/>
      <stop offset="0.45" stop-color="#f07a22"/>
      <stop offset="1" stop-color="#a03e08"/>
    </radialGradient>
    <clipPath id="clip"><circle cx="0" cy="0" r="25"/></clipPath>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
  <!-- back of the rim -->
  <path d="M18 63 A32 8 0 0 1 82 63" fill="none" stroke="#a8300c" stroke-width="5"/>
  <!-- ball -->
  <g transform="translate(50 37) rotate(-20)">
    <circle cx="0" cy="0" r="25" fill="url(#ball)"/>
    <g clip-path="url(#clip)" stroke="#2a1306" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M0 -25 V25 M-25 0 H25"/>
      <path d="M-16 -20 Q -2 0 -16 20"/>
      <path d="M16 -20 Q 2 0 16 20"/>
    </g>
  </g>
  <ellipse cx="41" cy="27" rx="6" ry="3.5" fill="#fff" opacity="0.5" transform="rotate(-35 41 27)"/>
  <!-- net -->
  <g stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 66 L32 92 M36 70 L40 93 M50 71 L50 94 M64 70 L60 93 M80 66 L68 92"/>
    <path d="M20 66 L40 93 M36 70 L50 94 M64 70 L50 94 M80 66 L60 93"/>
    <path d="M27 80 L73 80"/>
  </g>
  <!-- front of the rim -->
  <path d="M18 63 A32 8 0 0 0 82 63" fill="none" stroke="#7a1e06" stroke-width="8"/>
  <path d="M18 63 A32 8 0 0 0 82 63" fill="none" stroke="#ff5a1f" stroke-width="5"/>
  <circle cx="50" cy="50" r="47" fill="none" stroke="#ff8a2a" stroke-opacity="0.7" stroke-width="2.5"/>
</svg>
