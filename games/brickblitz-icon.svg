<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Brick Blitz icon: glossy candy bricks, one smashed, a glowing ball and a neon paddle -->
  <defs>
    <radialGradient id="bg" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#4a1a8a"/>
      <stop offset="1" stop-color="#0d0424"/>
    </radialGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc4ea"/><stop offset="0.45" stop-color="#ff4fd8"/><stop offset="1" stop-color="#99207e"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6b8"/><stop offset="0.45" stop-color="#ffc93d"/><stop offset="1" stop-color="#a87400"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8fffb"/><stop offset="0.45" stop-color="#2fe3d6"/><stop offset="1" stop-color="#0a7a72"/></linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0.1"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#9ff9ff" stop-opacity="0.95"/><stop offset="1" stop-color="#3ef2ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#3ef2ff" stop-opacity="0"/><stop offset="1" stop-color="#3ef2ff" stop-opacity="0.9"/></linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff4fd8"/><stop offset="0.2" stop-color="#2a1d6a"/><stop offset="0.8" stop-color="#2a1d6a"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
  <!-- bricks -->
  <rect x="13" y="17" width="35" height="17" rx="5" fill="url(#pink)" stroke="#3a0636" stroke-width="1.5"/>
  <rect x="16" y="19" width="29" height="6" rx="3" fill="url(#gloss)"/>
  <rect x="52" y="17" width="35" height="17" rx="5" fill="url(#gold)" stroke="#4a2a00" stroke-width="1.5"/>
  <rect x="55" y="19" width="29" height="6" rx="3" fill="url(#gloss)"/>
  <rect x="13" y="37" width="35" height="17" rx="5" fill="url(#cyan)" stroke="#063a36" stroke-width="1.5"/>
  <rect x="16" y="39" width="29" height="6" rx="3" fill="url(#gloss)"/>
  <!-- shards of the smashed brick -->
  <rect x="58" y="38" width="8" height="5" rx="1" fill="#ff4fd8" transform="rotate(-25 62 40)"/>
  <rect x="76" y="40" width="8" height="5" rx="1" fill="#ffd93d" transform="rotate(30 80 42)"/>
  <rect x="82" y="52" width="6" height="4" rx="1" fill="#fff" transform="rotate(10 85 54)"/>
  <!-- trail, ball, paddle -->
  <path d="M40 78 Q50 66 66 52" stroke="url(#trail)" stroke-width="9" stroke-linecap="round" fill="none"/>
  <circle cx="67" cy="51" r="16" fill="url(#glow)"/>
  <circle cx="67" cy="51" r="7.5" fill="#ffffff" stroke="#3ab8d8" stroke-width="1.5"/>
  <circle cx="64.5" cy="48.5" r="2.2" fill="#e8fbff"/>
  <rect x="22" y="76" width="48" height="11" rx="5.5" fill="url(#pad)" stroke="#3ef2ff" stroke-width="2"/>
  <rect x="28" y="80.5" width="36" height="2" rx="1" fill="#9ff9ff"/>
  <circle cx="50" cy="50" r="47" fill="none" stroke="#ff4fd8" stroke-opacity="0.75" stroke-width="2.5"/>
</svg>
