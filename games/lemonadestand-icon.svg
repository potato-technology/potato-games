<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Lemonade Stand icon: a glass of lemonade with a lemon slice and a straw -->
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#8fd2ff"/>
      <stop offset="1" stop-color="#2f8fe0"/>
    </radialGradient>
    <linearGradient id="drink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff38a"/>
      <stop offset="1" stop-color="#ffc400"/>
    </linearGradient>
    <radialGradient id="slice" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff9c0"/>
      <stop offset="0.8" stop-color="#ffe14d"/>
      <stop offset="1" stop-color="#e0a800"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#bg)"/>
  <!-- awning stripes along the top -->
  <path d="M2 26 V20 Q2 2 24 2 H76 Q98 2 98 20 V26 Z" fill="#ffd43b"/>
  <path d="M26 2 H38 V26 H26 Z M50 2 H62 V26 H50 Z M74 2 H86 V26 H74 Z" fill="#fff"/>
  <g fill="#ffd43b"><circle cx="14" cy="26" r="6"/><circle cx="44" cy="26" r="6"/><circle cx="68" cy="26" r="6"/><circle cx="92" cy="26" r="6"/></g>
  <g fill="#fff"><circle cx="32" cy="26" r="6"/><circle cx="56" cy="26" r="6"/><circle cx="80" cy="26" r="6"/></g>
  <!-- straw -->
  <path d="M56 46 L66 18" stroke="#ff6f9a" stroke-width="5" stroke-linecap="round"/>
  <!-- glass -->
  <path d="M30 40 H70 L65 88 H35 Z" fill="#e6f6ff" opacity="0.6"/>
  <path d="M31.5 50 H68.5 L65 88 H35 Z" fill="url(#drink)"/>
  <g fill="#fff" opacity="0.85"><rect x="38" y="56" width="9" height="9" rx="2"/><rect x="52" y="62" width="9" height="9" rx="2"/><rect x="43" y="72" width="8" height="8" rx="2"/></g>
  <path d="M30 40 L35 88 H65 L70 40" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="36" y="46" width="4" height="36" rx="2" fill="#fff" opacity="0.5"/>
  <!-- lemon slice on the rim -->
  <circle cx="70" cy="44" r="13" fill="url(#slice)" stroke="#e0a800" stroke-width="2"/>
  <g stroke="#fff6c0" stroke-width="1.6"><path d="M70 33 V55 M59 44 H81 M62 36 L78 52 M78 36 L62 52"/></g>
</svg>
