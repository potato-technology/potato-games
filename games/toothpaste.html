<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Toothpaste Pro – Squeeze the Perfect Stripe | Potato Games</title>
  <meta name="description" content="A juicy timing game! Toothbrushes slide past on a bathroom conveyor belt and you squeeze the tube at just the right moment to lay a perfect stripe of toothpaste. 25 levels in four bathrooms, a Dentist Rush boss, Endless mode, daily challenges and a shop full of tubes, flavours and brushes.">
  <link rel="icon" href="toothpaste-icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1c2a4d; --muted: #5d6b8c; --line: #d6e4f0;
      --mint: #25cfb2; --mint-d: #0f8f79; --pink: #ff5d8f; --pink-d: #c4306a;
      --sky: #3d9bff; --sky-d: #1f5fc0; --gold: #ffc53d; --gold-d: #c98a00;
      --cjk: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK KR', 'Noto Sans CJK JP', 'Noto Sans CJK SC', sans-serif;
      --display: 'Fredoka', 'Trebuchet MS', system-ui, var(--cjk);
      --body: 'Nunito', system-ui, var(--cjk);
    }
    * { box-sizing: border-box; }
    html:lang(ko) body { word-break: keep-all; }
    html, body { margin: 0; height: 100%; }
    body { background: #0f1b33; color: var(--ink); font-family: var(--body); overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
    kbd { display: inline-block; padding: 0 7px; border-radius: 7px; background: #fff; border: 1.5px solid #c6d4e4; border-bottom-width: 3px; color: var(--ink); font: 800 13px var(--body); line-height: 20px; }

    .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 14px; background: radial-gradient(ellipse at center, rgba(14, 28, 60, 0.38), rgba(8, 16, 40, 0.66)); z-index: 5; animation: fadeIn 0.25s ease; }
    .overlay[hidden] { display: none; }
    @keyframes fadeIn { from { background-color: transparent; } }
    @keyframes cardIn { from { transform: translateY(22px) scale(0.95); } to { transform: none; } }
    .card { position: relative; width: min(560px, 100%); max-height: 100%; overflow-y: auto; padding: 22px 24px; border-radius: 28px; background: linear-gradient(180deg, #ffffff 0%, #effbf8 100%); border: 3px solid #fff; box-shadow: 0 24px 60px rgba(5, 20, 60, 0.5), inset 0 -6px 0 rgba(37, 207, 178, 0.18); text-align: center; animation: cardIn 0.38s cubic-bezier(0.2, 1.3, 0.4, 1); scrollbar-width: thin; }
    .card.wide { width: min(780px, 100%); }
    .card h2 { margin: 0 0 4px; font: 700 34px var(--display); color: var(--ink); }
    .card p { color: var(--muted); margin: 6px 0 14px; line-height: 1.45; font-weight: 700; }
    .card > .close ~ h2 { padding: 0 40px; }
    .close { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: #e8f1f8; color: var(--ink); font: 700 20px var(--display); cursor: pointer; }

    .btn { padding: 12px 24px; border: 0; border-radius: 16px; color: #fff; font: 700 20px var(--display); cursor: pointer; letter-spacing: 0.3px; background: linear-gradient(180deg, #43e3c7, #17b096); box-shadow: 0 5px 0 var(--mint-d), 0 10px 18px rgba(16, 140, 120, 0.3); text-shadow: 0 2px 0 rgba(0, 0, 0, 0.18); transition: transform 0.08s, filter 0.15s; }
    .btn:hover { filter: brightness(1.06); }
    .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--mint-d); }
    .btn.big { font-size: 26px; padding: 14px 30px; }
    .btn.pink { background: linear-gradient(180deg, #ff83aa, #f2457e); box-shadow: 0 5px 0 var(--pink-d), 0 10px 18px rgba(200, 50, 110, 0.3); }
    .btn.blue { background: linear-gradient(180deg, #66b3ff, #2f83ea); box-shadow: 0 5px 0 var(--sky-d), 0 10px 18px rgba(30, 90, 200, 0.3); }
    .btn.gold { background: linear-gradient(180deg, #ffd96b, #f5ab12); color: #5a3a00; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5); box-shadow: 0 5px 0 var(--gold-d), 0 10px 18px rgba(200, 140, 0, 0.3); }
    .btn.ghost { background: #fff; color: var(--ink); text-shadow: none; box-shadow: 0 5px 0 #c3d2e2, 0 10px 18px rgba(20, 40, 80, 0.12); }
    .btn:disabled { background: #e4ebf2; color: #9aa8bd; box-shadow: 0 4px 0 #c9d4e0; cursor: default; text-shadow: none; }
    .btn.sm { font-size: 16px; padding: 8px 14px; border-radius: 12px; }
    .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
    .row .btn { flex: 1 1 140px; }

    .pills { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 10px 0 6px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 13px; border-radius: 999px; background: #fff; border: 2px solid var(--line); font: 700 16px var(--display); color: var(--ink); }
    .pill.star { color: #b07700; }
    .pill.fire { color: #e2531f; }
    .coin { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c2, #ffd43b 45%, #d9940a); box-shadow: inset 0 0 0 2px rgba(160, 100, 0, 0.35); vertical-align: -3px; }

    /* title */
    #title { justify-content: flex-start; padding-left: max(14px, 6vw); background: linear-gradient(90deg, rgba(8, 20, 50, 0.58), rgba(8, 20, 50, 0.12) 62%, rgba(8, 20, 50, 0)); }
    #title .card { width: min(470px, 100%); }
    .logo { margin: 2px 0 0; font: 700 62px/0.92 var(--display); letter-spacing: 0.5px; position: relative; }
    #title .logo { padding: 0 34px; }
    .logo.long { font-size: 50px; }
    .logo .paste { display: inline-block; background: repeating-linear-gradient(180deg, #ffffff 0 11px, #ff5d8f 11px 17px, #ffffff 17px 27px, #3d9bff 27px 33px); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 3px #19337a; filter: drop-shadow(0 5px 0 #19337a) drop-shadow(0 10px 12px rgba(20, 50, 120, 0.35)); padding: 0 4px; }
    .logo .pro { display: inline-block; margin-left: 4px; padding: 4px 14px 6px; border-radius: 14px; font: 700 34px var(--display); color: #5a3a00; background: linear-gradient(180deg, #ffe58a, #f5ab12); box-shadow: 0 4px 0 #b77d00, inset 0 2px 0 rgba(255, 255, 255, 0.7); transform: rotate(-7deg) translateY(-6px); vertical-align: middle; }
    .tag { font: 700 18px var(--display); color: var(--mint-d); margin-top: 10px; }
    .menu { display: grid; gap: 4px; margin-top: 8px; }
    .menu .btn.big { width: 100%; }
    .hint { font-size: 14px; }
    .mutebtn { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: #fff; cursor: pointer; font-size: 18px; }

    /* level map */
    .world { margin: 12px 0; padding: 12px 12px 14px; border-radius: 20px; text-align: left; color: #fff; position: relative; overflow: hidden; }
    .world h3 { margin: 0 0 8px; font: 700 21px var(--display); display: flex; justify-content: space-between; align-items: center; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.2); }
    .world h3 small { font: 800 14px var(--body); background: rgba(0, 0, 0, 0.18); padding: 3px 10px; border-radius: 999px; }
    .w-kids { background: linear-gradient(135deg, #5ec8ff, #3d8bff); }
    .w-hotel { background: linear-gradient(135deg, #2b6b78, #183c4a); }
    .w-space { background: linear-gradient(135deg, #4b3fa8, #1d2353); }
    .w-dentist { background: linear-gradient(135deg, #2fd3a8, #149279); }
    .lvls { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
    .lv { position: relative; padding: 8px 4px 6px; border-radius: 14px; border: 0; background: rgba(255, 255, 255, 0.95); color: var(--ink); cursor: pointer; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.18); font-family: var(--body); }
    .lv b { display: block; font: 700 24px/1 var(--display); }
    .lv .nm { display: block; font: 800 10.5px/1.15 var(--body); color: var(--muted); margin-top: 3px; min-height: 24px; hyphens: auto; -webkit-hyphens: auto; overflow-wrap: anywhere; }
    .lv .st { font-size: 14px; letter-spacing: 1px; color: #cfd8e3; }
    .lv .st i { font-style: normal; color: #f2a900; }
    .lv.next { box-shadow: 0 4px 0 rgba(0, 0, 0, 0.18), 0 0 0 3px #ffe066; animation: nudge 1.4s ease-in-out infinite; }
    @keyframes nudge { 50% { transform: translateY(-3px); } }
    .lv.locked { opacity: 0.45; cursor: default; }
    .lv.boss { background: linear-gradient(180deg, #fff6d0, #ffe08a); }

    /* intro */
    .wtag { display: inline-block; padding: 4px 14px; border-radius: 999px; color: #fff; font: 700 14px var(--display); letter-spacing: 0.5px; }
    .news { margin: 12px 0; padding: 12px 14px; border-radius: 16px; background: #fff7d9; border: 2px dashed #ffcf4d; text-align: left; }
    .news b { font: 700 18px var(--display); color: #b36b00; display: block; }
    .news span { color: #6b5a33; font-weight: 700; font-size: 15px; }
    .goals { display: flex; gap: 8px; justify-content: center; margin: 10px 0; flex-wrap: wrap; }
    .goals div { padding: 6px 12px; border-radius: 12px; background: #eef5fb; font-weight: 800; font-size: 14px; }
    .goals i { font-style: normal; color: #f2a900; }
    .twists { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 8px 0; }
    .twists span { padding: 5px 12px; border-radius: 999px; background: linear-gradient(180deg, #ff83aa, #f2457e); color: #fff; font: 700 14px var(--display); }

    /* results */
    .bigstars { font-size: 60px; letter-spacing: 8px; margin: 2px 0; color: #dfe6ee; line-height: 1.1; }
    .bigstars span { display: inline-block; }
    .bigstars span.on { color: #ffc53d; text-shadow: 0 4px 0 #c98a00; }
    @keyframes pop { 0% { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.35); } 100% { transform: scale(1); } }
    .card .score-big { font: 700 44px var(--display); color: var(--ink); margin: 0; }
    .newbest { display: inline-block; padding: 3px 12px; border-radius: 999px; background: var(--pink); color: #fff; font: 700 14px var(--display); }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0 8px; }
    .stats div { padding: 8px 4px; border-radius: 14px; background: #eef5fb; }
    .stats span { display: block; font-size: 12px; font-weight: 800; color: var(--muted); }
    .stats b { font: 700 22px var(--display); }
    .stats .g-perfect b { color: #e0398a; } .stats .g-great b { color: #1f9fd6; } .stats .g-ok b { color: #3aa35b; } .stats .g-miss b { color: #8a96ab; }
    .reward { font: 700 19px var(--display); color: #a86f00; margin: 8px 0 2px; }
    .resnote { font-weight: 800; color: var(--muted); min-height: 20px; }

    /* shop */
    .tabs { display: flex; gap: 6px; justify-content: center; margin: 10px 0; flex-wrap: wrap; }
    .tab { padding: 8px 16px; border-radius: 12px; border: 2px solid var(--line); background: #fff; color: var(--muted); font: 700 16px var(--display); cursor: pointer; }
    .tab.on { border-color: var(--mint); background: #e3fbf6; color: var(--ink); }
    .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .item { background: #fff; border: 2px solid var(--line); border-radius: 18px; padding: 8px 8px 10px; display: flex; flex-direction: column; gap: 6px; }
    .item.eq { border-color: var(--mint); box-shadow: 0 0 0 3px rgba(37, 207, 178, 0.2); }
    .item canvas { width: 100%; height: 92px; border-radius: 12px; background: linear-gradient(180deg, #eaf6ff, #d5ecfb); cursor: default; }
    .item b { font: 700 16px var(--display); }
    .item small { color: var(--muted); font-weight: 700; font-size: 12.5px; line-height: 1.3; min-height: 32px; }
    .pips { display: flex; gap: 4px; justify-content: center; }
    .pips i { width: 16px; height: 8px; border-radius: 4px; background: #dfe7ef; }
    .pips i.on { background: var(--mint); }

    /* hud buttons */
    .hudbtn { position: fixed; top: 12px; right: 12px; width: 48px; height: 48px; border-radius: 16px; border: 3px solid #fff; background: linear-gradient(180deg, #ffffff, #e2eef8); color: var(--ink); font: 700 20px var(--display); cursor: pointer; z-index: 3; box-shadow: 0 4px 0 rgba(20, 40, 80, 0.25), 0 8px 16px rgba(0, 0, 0, 0.18); }
    .hudbtn[hidden], .refill[hidden] { display: none; }
    .refill { position: fixed; z-index: 3; padding: 10px 18px; border-radius: 18px; border: 3px solid #fff; font: 700 19px var(--display); color: #fff; cursor: pointer; background: linear-gradient(180deg, #ff9a52, #ff6a2b); box-shadow: 0 5px 0 #c24611, 0 10px 18px rgba(0, 0, 0, 0.2); transform: translate(-50%, 0); white-space: nowrap; }
    .refill.urgent { animation: wiggle 0.6s ease-in-out infinite; }
    .refill.busy { filter: grayscale(0.6) brightness(0.95); }
    .refill kbd { margin-left: 4px; }
    @keyframes wiggle { 0%, 100% { transform: translate(-50%, 0) rotate(0); } 25% { transform: translate(-50%, -3px) rotate(-4deg); } 75% { transform: translate(-50%, -3px) rotate(4deg); } }
    #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); padding: 10px 18px; border-radius: 14px; background: rgba(20, 30, 60, 0.92); color: #fff; font: 700 16px var(--display); z-index: 9; pointer-events: none; transition: opacity 0.3s; opacity: 0; }
    #toast.on { opacity: 1; }

    @media (max-width: 560px) {
      .logo { font-size: 48px; }
      .logo.long { font-size: 40px; }
      .logo .pro { font-size: 26px; }
      .card { padding: 18px 16px; border-radius: 24px; }
      .card h2 { font-size: 28px; }
      .btn { font-size: 18px; padding: 11px 16px; }
      .btn.big { font-size: 22px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .bigstars { font-size: 50px; }
    }
    @media (max-aspect-ratio: 1/1) {
      #title { justify-content: center; align-items: flex-end; padding-left: 14px; padding-bottom: 18px; background: linear-gradient(0deg, rgba(8, 20, 50, 0.62), rgba(8, 20, 50, 0.1) 60%, rgba(8, 20, 50, 0)); }
    }
    @media (max-height: 520px) {
      .logo { font-size: 44px; }
      .logo.long { font-size: 38px; }
      .card { padding: 14px 18px; }
      .menu .btn.big { padding: 10px; font-size: 20px; }
      .row { margin-top: 8px; }
      .tag { margin-top: 4px; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <button id="pauseBtn" class="hudbtn" hidden aria-label="Pause">❚❚</button>
  <button id="refillBtn" class="refill" hidden>Refill<kbd>R</kbd></button>
  <div id="title" class="overlay" hidden></div>
  <div id="map" class="overlay" hidden></div>
  <div id="intro" class="overlay" hidden></div>
  <div id="results" class="overlay" hidden></div>
  <div id="pause" class="overlay" hidden></div>
  <div id="shop" class="overlay" hidden></div>
  <div id="toast"></div>
  <pre id="selftest" hidden></pre>
  <script src="potato-sdk.js"></script>
  <script>
  (() => {
    'use strict';
    // =====================================================================
    // Toothpaste Pro: squeeze a perfect stripe onto every toothbrush.
    // =====================================================================

    // ---- languages: every row is [en, ko, ja, zh, es, fr, de, pt] ----
    const LANG_I = Math.max(0, ['en', 'ko', 'ja', 'zh', 'es', 'fr', 'de', 'pt'].indexOf(Potato.lang));
    const FF = Potato.font;
    const I18N = {
      // worlds
      w_kids: ["Kids' Bathroom", '어린이 욕실', 'キッズバスルーム', '儿童浴室', 'Baño de los niños', 'Salle de bain des enfants', 'Kinderbad', 'Banheiro das crianças'],
      w_hotel: ['Grand Hotel', '그랜드 호텔', 'グランドホテル', '豪华酒店', 'Gran Hotel', 'Grand Hôtel', 'Grandhotel', 'Grande Hotel'],
      w_space: ['Space Station', '우주 정거장', '宇宙ステーション', '太空站', 'Estación espacial', 'Station spatiale', 'Raumstation', 'Estação espacial'],
      w_dentist: ["Dentist's Office", '치과', '歯医者さん', '牙医诊所', 'Consultorio del dentista', 'Cabinet du dentiste', 'Zahnarztpraxis', 'Consultório do dentista'],
      // "what's new" cards
      n_basics: ['How to squeeze', '짜는 방법', 'しぼりかた', '怎么挤牙膏', 'Cómo apretar', 'Comment presser', 'So wird gedrückt', 'Como apertar'],
      n_basics2: ['Hold to squeeze the tube and let go to stop. Start when the green laser dot reaches the bristles, and stop when it leaves them.', '꾹 누르고 있으면 튜브를 짜고, 손을 떼면 멈춰요. 초록색 레이저 점이 칫솔모에 닿으면 짜기 시작하고, 칫솔모를 벗어나면 멈춰요.', '押しているあいだチューブをしぼって、はなすと止まるよ。緑のレーザーの点がブラシの毛にとどいたらスタート、毛からはなれたらストップ！', '按住就会挤牙膏，松开就停。绿色激光点碰到刷毛时开始挤，离开刷毛时停下。', 'Mantén pulsado para apretar el tubo y suelta para parar. Empieza cuando el punto láser verde llegue a las cerdas y para cuando salga de ellas.', 'Maintiens appuyé pour presser le tube et lâche pour arrêter. Commence quand le point laser vert atteint les poils, et arrête quand il en sort.', 'Halte gedrückt, um die Tube zu drücken, und lass los, um aufzuhören. Fang an, wenn der grüne Laserpunkt die Borsten erreicht, und hör auf, wenn er sie verlässt.', 'Segure para apertar o tubo e solte para parar. Comece quando o ponto de laser verde chegar às cerdas e pare quando ele sair delas.'],
      n_kid: ['Tiny brushes', '꼬마 칫솔', 'ちいさな歯ブラシ', '迷你牙刷', 'Cepillos diminutos', 'Toutes petites brosses', 'Mini-Bürsten', 'Escovas minúsculas'],
      n_kid2: ['Little kid brushes have short heads, so keep your squeezes quick!', '어린이 칫솔은 머리가 짧아요. 짧고 빠르게 짜요!', '子ども用の歯ブラシは頭がみじかいよ。すばやくしぼろう！', '儿童牙刷的刷头很短，挤的时候要快！', 'Los cepillos de niños tienen la cabeza cortita, ¡así que aprieta rapidito!', 'Les brosses pour enfants ont une toute petite tête, alors presse vite !', 'Kinderbürsten haben kurze Köpfe, also drück nur ganz kurz!', 'Escovas infantis têm a cabeça curtinha, então aperte rapidinho!'],
      n_gold: ['Golden brushes', '황금 칫솔', '金の歯ブラシ', '黄金牙刷', 'Cepillos dorados', 'Brosses dorées', 'Goldene Bürsten', 'Escovas douradas'],
      n_gold2: ['Shiny gold brushes are worth 3× points and bonus coins if you get a Perfect.', '반짝이는 황금 칫솔에 퍼펙트를 내면 점수 3배에 보너스 코인까지!', 'ピカピカの金の歯ブラシでパーフェクトを出すと、ポイント3倍＋ボーナスコイン！', '闪亮的黄金牙刷拿到“完美”可得3倍分数，还有额外金币！', 'Los cepillos dorados valen 3× puntos y monedas extra si consigues un Perfecto.', 'Les brosses dorées rapportent 3× plus de points et des pièces bonus si tu fais un Parfait.', 'Glänzende Goldbürsten bringen 3× Punkte und Bonus-Münzen, wenn du ein Perfekt schaffst.', 'Escovas douradas valem 3× pontos e moedas bônus se você fizer um Perfeito.'],
      n_wobble: ['Wobbly brushes', '흔들 칫솔', 'ゆらゆら歯ブラシ', '摇摆牙刷', 'Cepillos bailarines', 'Brosses gigotantes', 'Wackelbürsten', 'Escovas balançantes'],
      n_wobble2: ['Some brushes jiggle and hop on the belt. Watch the laser dot, not the belt!', '어떤 칫솔은 벨트 위에서 흔들흔들 깡충깡충 뛰어요. 벨트 말고 레이저 점을 봐요!', 'ベルトの上でゆれたりはねたりする歯ブラシがいるよ。ベルトじゃなくてレーザーの点を見よう！', '有些牙刷会在传送带上晃来晃去、蹦蹦跳跳。看激光点，别看传送带！', 'Algunos cepillos se tambalean y saltan en la cinta. ¡Mira el punto láser, no la cinta!', 'Certaines brosses gigotent et sautillent sur le tapis. Regarde le point laser, pas le tapis !', 'Manche Bürsten wackeln und hüpfen auf dem Band. Schau auf den Laserpunkt, nicht aufs Band!', 'Algumas escovas balançam e pulam na esteira. Olhe o ponto de laser, não a esteira!'],
      n_speed: ['Speeding belt', '빨라지는 벨트', 'スピードアップベルト', '加速传送带', 'Cinta acelerada', 'Tapis qui accélère', 'Schnelles Band', 'Esteira acelerada'],
      n_speed2: ['The belt gets faster and faster as the level goes on.', '레벨이 진행될수록 벨트가 점점 빨라져요.', 'レベルが進むと、ベルトがどんどん速くなるよ。', '关卡越往后，传送带就越来越快。', 'La cinta va cada vez más rápido a medida que avanza el nivel.', 'Le tapis va de plus en plus vite au fil du niveau.', 'Das Band wird im Laufe des Levels immer schneller.', 'A esteira fica cada vez mais rápida conforme a fase avança.'],
      n_pea: ['Pea-sized dabs', '완두콩만큼 조금', 'まめつぶサイズ', '豌豆大小', 'Del tamaño de un guisante', 'Gros comme un petit pois', 'Erbsengroß', 'Do tamanho de uma ervilha'],
      n_pea2: ['Brushes with a pea flag only want a tiny dab right in the middle of the bristles. Just a quick tap!', '완두콩 깃발이 꽂힌 칫솔은 칫솔모 한가운데에 아주 조금만 원해요. 톡 한 번만!', 'まめの旗がついた歯ブラシは、毛のまんなかにちょこっとだけほしいんだ。サッとタップ！', '插着豌豆小旗的牙刷，只要在刷毛正中间挤一小点。轻轻点一下就好！', 'Los cepillos con banderita de guisante solo quieren un puntito justo en el centro de las cerdas. ¡Un toque rápido!', 'Les brosses avec un drapeau petit pois veulent juste une noisette au milieu des poils. Une toute petite pression !', 'Bürsten mit Erbsen-Fähnchen wollen nur einen winzigen Klecks genau in der Mitte der Borsten. Nur kurz tippen!', 'Escovas com bandeirinha de ervilha só querem um pinguinho bem no meio das cerdas. Só um toque rápido!'],
      n_giant: ['Giant brushes', '거대 칫솔', 'きょだい歯ブラシ', '巨型牙刷', 'Cepillos gigantes', 'Brosses géantes', 'Riesenbürsten', 'Escovas gigantes'],
      n_giant2: ['Huge brushes need a long, steady squeeze.', '엄청 큰 칫솔은 길고 꾸준하게 짜야 해요.', 'おっきな歯ブラシは、長〜くじっくりしぼろう。', '超大的牙刷需要又长又稳地挤。', 'Los cepillos enormes necesitan un apretón largo y constante.', 'Les brosses énormes demandent une longue pression bien régulière.', 'Riesige Bürsten brauchen einen langen, ruhigen Druck.', 'Escovas enormes precisam de uma apertada longa e firme.'],
      n_tube: ['Running low', '치약이 줄어들어요', 'チューブがへってきた', '牙膏快没了', 'Se acaba la pasta', 'Ça se vide', 'Fast leer', 'Acabando a pasta'],
      n_tube2: ['This tube can run out! Watch the meter, then press R or tap Refill in the gaps between brushes.', '이 튜브는 바닥날 수 있어요! 게이지를 보다가 칫솔 사이 빈틈에 R 키를 누르거나 리필을 탭해요.', 'このチューブは空っぽになるよ！メーターを見て、歯ブラシのすきまにRキーか「つめかえ」をタップしよう。', '这管牙膏会用完！留意计量条，在牙刷之间的空当按R键或点击“补充”。', '¡Este tubo se puede vaciar! Vigila el medidor y pulsa R o toca Rellenar en los huecos entre cepillos.', 'Ce tube peut se vider ! Surveille la jauge, puis appuie sur R ou touche Recharger entre deux brosses.', 'Diese Tube kann leer werden! Behalte die Anzeige im Blick und drück R oder tippe auf Nachfüllen, wenn gerade keine Bürste kommt.', 'Este tubo pode acabar! Fique de olho no medidor e aperte R ou toque em Recarregar nos espaços entre as escovas.'],
      n_double: ['Double-sided', '양쪽 칫솔', '両はし歯ブラシ', '双头牙刷', 'De doble cabeza', 'Double tête', 'Doppelkopf', 'Dupla face'],
      n_double2: ['Bristles on BOTH ends: squeeze, stop, then squeeze again!', '양쪽 끝에 다 칫솔모가 있어요. 짜고, 멈추고, 또 짜요!', '両はしに毛があるよ。しぼって、止めて、またしぼって！', '两头都有刷毛：挤、停，再挤一次！', 'Cerdas en AMBOS extremos: ¡aprieta, para y vuelve a apretar!', 'Des poils aux DEUX bouts : presse, arrête, puis presse encore !', 'Borsten an BEIDEN Enden: drücken, stoppen, nochmal drücken!', 'Cerdas nas DUAS pontas: aperte, pare e aperte de novo!'],
      n_move: ['Moving tube', '움직이는 튜브', 'うごくチューブ', '移动的牙膏管', 'Tubo móvil', 'Tube mobile', 'Wandernde Tube', 'Tubo que se mexe'],
      n_move2: ['The tube slides along its rail, so the timing keeps changing.', '튜브가 레일을 따라 움직여서 타이밍이 계속 바뀌어요.', 'チューブがレールの上をうごくから、タイミングがどんどん変わるよ。', '牙膏管会沿着轨道滑动，所以时机一直在变。', 'El tubo se desliza por su riel, así que el momento justo va cambiando.', 'Le tube glisse sur son rail, alors le bon moment change tout le temps.', 'Die Tube gleitet auf ihrer Schiene hin und her, deshalb ändert sich das Timing ständig.', 'O tubo desliza no trilho, então o tempo certo vive mudando.'],
      n_zeroG: ['Zero gravity', '무중력', '無重力', '零重力', 'Gravedad cero', 'Apesanteur', 'Schwerelos', 'Gravidade zero'],
      n_zeroG2: ['In space, paste floats down slowly. Squeeze early! The laser shows where it will land.', '우주에서는 치약이 둥실둥실 천천히 내려와요. 일찍 짜요! 레이저가 떨어질 곳을 알려줘요.', '宇宙では歯みがき粉がふわ〜っとゆっくり落ちるよ。早めにしぼろう！レーザーが落ちる場所を教えてくれるよ。', '在太空里，牙膏会慢慢飘下来。要提前挤！激光会显示它落在哪里。', 'En el espacio, la pasta baja flotando despacito. ¡Aprieta antes! El láser te muestra dónde caerá.', "Dans l'espace, le dentifrice descend tout doucement. Presse en avance ! Le laser montre où il va tomber.", 'Im Weltall schwebt die Zahnpasta langsam nach unten. Drück früher! Der Laser zeigt, wo sie landet.', 'No espaço, a pasta desce flutuando devagar. Aperte antes! O laser mostra onde ela vai cair.'],
      n_electric: ['Electric brushes', '전동 칫솔', '電動歯ブラシ', '电动牙刷', 'Cepillos eléctricos', 'Brosses électriques', 'Elektrobürsten', 'Escovas elétricas'],
      n_electric2: ['Spinning heads want a neat stripe. Squeeze too much and they fling paste onto the screen!', '빙글빙글 도는 칫솔은 깔끔한 한 줄을 좋아해요. 너무 많이 짜면 치약이 화면으로 튀어요!', 'くるくる回る頭には、きれいな一本線を。しぼりすぎると画面に歯みがき粉が飛んでくるよ！', '旋转的刷头要一条整齐的牙膏。挤太多的话，牙膏会被甩到屏幕上！', 'Las cabezas giratorias quieren una raya limpita. ¡Si aprietas demasiado, lanzan pasta a la pantalla!', "Les têtes qui tournent veulent un trait bien net. Si tu presses trop, elles projettent du dentifrice sur l'écran !", 'Drehende Köpfe wollen einen sauberen Streifen. Drückst du zu viel, schleudern sie Zahnpasta auf den Bildschirm!', 'Cabeças giratórias querem uma listra caprichada. Se apertar demais, elas jogam pasta na tela!'],
      n_germ: ['Germy brushes', '세균 칫솔', 'ばい菌歯ブラシ', '细菌牙刷', 'Cepillos con gérmenes', 'Brosses à microbes', 'Keimbürsten', 'Escovas com germes'],
      n_germ2: ['Yuck! Never squirt on brushes covered in germs. Let them pass for a bonus.', '으악! 세균투성이 칫솔에는 절대 짜지 마요. 그냥 보내면 보너스!', 'うえっ！ばい菌だらけの歯ブラシには絶対しぼらないで。見送ればボーナス！', '好恶心！千万别往满是细菌的牙刷上挤。让它们过去就有奖励。', '¡Puaj! Nunca eches pasta en cepillos llenos de gérmenes. Déjalos pasar y ganarás un bonus.', 'Beurk ! Ne mets jamais de dentifrice sur les brosses pleines de microbes. Laisse-les passer pour un bonus.', 'Igitt! Spritz nie auf Bürsten voller Keime. Lass sie vorbeifahren und kassier einen Bonus.', 'Eca! Nunca coloque pasta em escovas cheias de germes. Deixe passar para ganhar bônus.'],
      n_boss: ['Dentist Rush', '치과 대소동', '歯医者さんラッシュ', '牙医大作战', 'Lío en el dentista', 'Panique chez le dentiste', 'Zahnarzt-Alarm', 'Correria no dentista'],
      n_boss2: ['Captain Plaque is attacking the dentist! Every good stripe zaps him. He throws germs, speeds up the belt and tugs on your tube.', '플라크 선장이 치과를 공격하고 있어요! 멋진 한 줄을 짤 때마다 선장에게 찌릿! 선장은 세균을 던지고, 벨트를 빠르게 하고, 튜브를 잡아당겨요.', 'キャプテン・プラークが歯医者さんをおそってる！うまくしぼるたびにビリッと攻撃。あいてはばい菌を投げたり、ベルトを速くしたり、チューブを引っぱったりしてくるよ。', '牙菌斑船长在攻击牙医！每挤出一条漂亮的牙膏就能电他一下。他会扔细菌、加快传送带，还会拽你的牙膏管。', '¡El Capitán Sarro ataca al dentista! Cada buena raya le da un chispazo. Él lanza gérmenes, acelera la cinta y tira de tu tubo.', 'Le Capitaine Plaque attaque le dentiste ! Chaque beau trait lui envoie une décharge. Il lance des microbes, accélère le tapis et tire sur ton tube.', "Käpt'n Plaque greift den Zahnarzt an! Jeder gute Streifen verpasst ihm einen Zap. Er wirft Keime, macht das Band schneller und zerrt an deiner Tube.", 'O Capitão Placa está atacando o dentista! Cada listra boa dá um choque nele. Ele joga germes, acelera a esteira e puxa seu tubo.'],

        boost: 0, tug: 0, endless: o.kind === 'endless' ? { count: 0 } : null,
        boss: lv.boss ? makeBoss() : null, autopilot: o.kind === 'demo' || !!o.autopilot, apSkill: o.kind === 'demo' ? 0.82 : 1,
        themeNext: null, themeFade: 0, lenient: lenientFor(o.kind, lv), readyT: o.kind === 'demo' ? 0 : 1.5,

    }

    function nextSpec() {
      if (run.queue) return run.spawned < run.queue.length ? run.queue[run.spawned] : null;
      if (run.endless) return endlessSpec();
      if (run.boss) return rollSpec(run.boss.phase === 2 ? Object.assign({}, run.lv, { germ: 0.08 }) : run.lv, run.rng, run.spawned + 1);
      return rollSpec(run.lv, Math.random, run.spawned + 1);
    }
    function endlessSpec() {
      const n = run.endless.count++;
      const ti = Math.floor(n / 12) % 4;
      if (n > 0 && n % 12 === 0) { run.themeNext = WORLDS[ti]; run.themeFade = 1; }
      if (n === 12) { run.flags.tube = true; announce('Tube can run out now!', 'Refill with R or the button'); }
      if (n >= 26) run.flags.move = (n % 30) >= 26 || (n % 30) < 4 ? true : run.flags.move && (n % 30) < 4;
      const lvx = {
        mix: { normal: 1, kid: n >= 3 ? 0.6 : 0, giant: n >= 10 ? 0.4 : 0, double: n >= 14 ? 0.4 : 0, electric: n >= 18 ? 0.5 : 0 },
        wob: n >= 6 ? 0.25 : 0, pea: n >= 8 ? 0.18 : 0, gold: n >= 4 ? 0.12 : 0, germ: n >= 22 ? 0.18 : 0,
        gap: [Math.max(150, 260 - n * 3), Math.max(200, 320 - n * 3)],

    }
    function targetSpeed() {
      const lv = run.lv;
      let v;
      if (run.endless) v = 160 + Math.min(220, run.endless.count * 3.4);
      else if (run.boss) v = run.boss.phase === 2 ? 245 : 210;
      else if (run.total === Infinity) v = lv.sp[0];
      else v = lerp(lv.sp[0], lv.sp[1], clamp(run.judgedCount / Math.max(1, run.total - 1), 0, 1));

    }
    const phys = () => (run.flags.zeroG ? ZG : NG);
    function fallTime(gap) { const P = phys(); return (-P.vy0 + Math.sqrt(P.vy0 * P.vy0 + 2 * P.g * Math.max(0, gap))) / P.g; }
    const nozzleX = () => L.cx + run.tube.off;
    function wobAt(b, t) {
      if (!b.wob) return [0, 0, 0];
      const p = t * b.wob.f + b.wob.ph;
      return [Math.sin(p) * b.wob.A, -Math.abs(Math.sin(p * 2)) * 7, Math.cos(p * 2) * 0.024];
    }
    function inRegion(b, cx, tol) { for (const r of b.G.regions) if (cx >= r[0] - tol && cx <= r[1] + tol) return true; return false; }
    function surfaceTop(b, cx) {
      const G = b.G;
      if (inRegion(b, cx, 0)) return -(G.plate + G.bh);

    function regionCenterX(b) { const r = b.G.regions[b.G.regions.length > 1 ? (b.flip ? 0 : 1) : 0]; return brushWorldX(b, (r[0] + r[1]) / 2); }

    // ---------------------------------------------------------------------
    // Simulation (fixed 120 Hz steps, so timing never depends on frame rate)
    // ---------------------------------------------------------------------
    const STEP = 1 / 120;
    let acc = 0;
    const input = { held: false, pointers: new Set(), space: false };
    function updHeld() { input.held = input.pointers.size > 0 || input.space; }
    function releaseAll() { input.pointers.clear(); input.space = false; updHeld(); }

    function step(h) {
      const R = run;
      R.t += h;
      if (R.readyT > 0) R.readyT -= h;
      // belt speed eases toward its target
      const tv = targetSpeed();
      R.speed += (tv - R.speed) * Math.min(1, h * 2.5);
      const v = R.speed;
      R.beltOff = (R.beltOff || 0) + v * h;
      R.boost = Math.max(0, R.boost - h);
      R.tug = Math.max(0, R.tug - h);
      R.fever = Math.max(0, R.fever - h);
      R.shake = Math.max(0, R.shake - h * 30);
      R.flash = Math.max(0, R.flash - h * 2.5);
      R.comboPop = Math.max(0, R.comboPop - h * 3);
      if (R.themeFade > 0) {
        const before = R.themeFade;
        R.themeFade = Math.max(0, R.themeFade - h * 1.1);
        if (before > 0.5 && R.themeFade <= 0.5 && R.themeNext) { R.theme = R.themeNext; R.themeNext = null; R.flags.zeroG = R.theme === 'space'; }
      }

      // tube rail movement
      const T = R.tube;
      const moveOn = R.flags.move || R.tug > 0;
      T.moveAmt += ((moveOn ? 1 : 0) - T.moveAmt) * Math.min(1, h * 1.5);
      const A = Math.min(170, L.ww * 0.17);
      const newOff = Math.sin(R.t * 0.95) * A * T.moveAmt;
      T.vx = (newOff - T.off) / h; T.off = newOff;
      if (T.refill > 0) { T.refill += h; if (T.refill >= T.refillDur) { T.refill = 0; T.amt = 1; T.jig = 1; if (R.kind !== 'demo') SFX.plop(); } }
      T.emptyWarn = Math.max(0, T.emptyWarn - h);

      // spawn brushes
      if (!R.pending && R.spawned < R.total && !R.ending && !(R.boss && R.boss.defeated)) R.pending = nextSpec();
      if (R.pending) {
        const last = R.brushes[R.brushes.length - 1];
        const len = GEOM[R.pending.type].len;
        if (!last && R.spawned === 0) {
          const b = makeBrush(R.pending, L.cx - len - v * 2.4);
          if (R.kind === 'demo') b.x = L.cx - len - 40;
          R.brushes.push(b); R.spawned++; R.pending = null;
        } else if (!last || last.x - R.pending.gap >= -20) {
          const x = last ? last.x - R.pending.gap - len : -len - 20;
          R.brushes.push(makeBrush(R.pending, x)); R.spawned++; R.pending = null;
        }
      }

      // move brushes
      for (const b of R.brushes) {
        b.x += v * h; b.age += h;
        const w = wobAt(b, R.t); b.dx = w[0]; b.dy = w[1]; b.ang = w[2];
        b.spin += h * 22; b.moodT += h; b.blink -= h;
        if (b.blink < -0.12) b.blink = rnd(1.5, 4);
      }

      // squeezing
      let want;
      if (R.autopilot) want = autopilotWant();
      else want = input.held && mode === 'play' && !R.ending;
      if (R.readyT > 0.6 && R.kind !== 'demo') want = false;
      const canFlow = T.refill === 0 && (!R.flags.tube || T.amt > 0);
      let flowing = want && canFlow;
      T.sputter = false;
      if (flowing && R.flags.tube) {
        T.amt = Math.max(0, T.amt - h / T.cap);

      }
      if (want && !canFlow && R.flags.tube && T.refill === 0 && T.amt <= 0 && T.emptyWarn <= 0 && R.kind !== 'demo') {
        T.emptyWarn = 1.4; SFX.empty(); popup('EMPTY!', 'Refill the tube', nozzleX(), L.nozzleY - 40, 'empty');
      }
      if (R.autopilot && R.flags.tube && T.refill === 0 && T.amt < 0.28 && !want && !brushNear(1.1)) startRefill(true);
      // squeeze spring (visual)
      const qt = want && T.refill === 0 ? (canFlow ? 1 : 0.6) : 0;
      T.qv += ((qt - T.q) * 420 - T.qv * 22) * h; T.q += T.qv * h;
      T.jig = Math.max(0, T.jig - h * 2.2);
      if (flowing && !R.flowing) { R.stroke++; if (R.kind !== 'demo' && !T.sputter) squeezeStart(); }
      if (!flowing && R.flowing && !T.sputter) squeezeStop();
      if (!want && sq) squeezeStop();
      if (flowing && sq) squeezePitch(R.flags.tube ? T.amt : 1);
      R.flowing = flowing;
      if (flowing) {
        R.drops.push({ x: nozzleX() + rnd(-0.25, 0.25), y: L.nozzleY + 2, vx: R.flags.zeroG ? 0 : T.vx * 0.9, vy: phys().vy0, s: R.stroke, th: PASTE_TH * (T.sputter ? 0.82 : 1), c: R.dropCount++, fv: R.fever > 0 });
      }

      // drops fall and land
      const P = phys();
      for (let i = R.drops.length - 1; i >= 0; i--) {
        const d = R.drops[i];
        d.vy += P.g * h; d.x += d.vx * h; d.y += d.vy * h;
        let landed = false;
        for (const b of R.brushes) {
          if (b.judged) continue;
          const x0 = b.x + b.dx;
          if (d.x < x0 - 4 || d.x > x0 + b.len + 4) continue;
          const px = d.x - x0 - b.len / 2, py = d.y - (L.beltY + b.dy);
          const c = Math.cos(b.ang), s = Math.sin(b.ang);
          const lx = px * c + py * s + b.len / 2, ly = -px * s + py * c;
          const cx = b.flip ? b.len - lx : lx;
          if (cx < 0 || cx > b.len) continue;
          const bin = clamp(Math.round(cx / 3), 0, b.top.length - 1);
          const stack = stackUnder(b, bin, d.s);
          const top = surfaceTop(b, cx) - stack;
          if (ly >= top) { deposit(b, d, cx, top, bin); landed = true; break; }
        }
        if (!landed && d.y >= L.beltY - 3) { beltBlob(d); landed = true; }
        if (landed) R.drops.splice(i, 1);
      }

      // belt blobs ride along
      for (let i = R.blobs.length - 1; i >= 0; i--) { const bl = R.blobs[i]; bl.x += v * h; if (bl.x > L.ww + 40) R.blobs.splice(i, 1); }
      if (R.blobs.length > 700) R.blobs.splice(0, R.blobs.length - 700);

      // judge brushes that have fully passed the nozzle
      const nozMax = L.cx + (R.flags.move || R.tug > 0 || T.moveAmt > 0.01 ? Math.min(170, L.ww * 0.17) : 0) + 34 + (R.flags.zeroG ? 40 : 0);
      for (const b of R.brushes) {
        if (!b.judged && b.x - (b.wob ? b.wob.A + 2 : 0) > nozMax) judge(b);
      }
      for (let i = R.brushes.length - 1; i >= 0; i--) if (R.brushes[i].x > L.ww + 60 && R.brushes[i].judged) R.brushes.splice(i, 1);

      // boss, projectiles, effects
      if (R.boss) bossUpdate(h);
      for (let i = R.projectiles.length - 1; i >= 0; i--) {

        p.t += h / p.dur;
        if (p.t >= 1) {

          if (p.b && !p.b.judged && !p.b.samples.length) {
            p.b.germ = true; p.b.pea = false; p.b.gold = false; p.b.germs = makeGerms(p.b.G);
            burst(regionCenterX(p.b), L.beltY - 40, 16, { colors: ['#7bd94a', '#a2d93f', '#5ccf6a'], speed: 160, size: 5, grav: 500 });

      }
      for (let i = R.parts.length - 1; i >= 0; i--) {
        const p = R.parts[i];
        p.vy += (p.grav || 0) * h; p.vx *= 1 - (p.drag || 0) * h; p.vy *= 1 - (p.drag || 0) * h;

      if (R.parts.length > 900) R.parts.splice(0, R.parts.length - 900);
      for (let i = R.pops.length - 1; i >= 0; i--) { const p = R.pops[i]; p.t += h; if (p.t > p.dur) R.pops.splice(i, 1); }
      for (let i = R.splats.length - 1; i >= 0; i--) { const s = R.splats[i]; s.t += h; s.y += s.vy * h; s.vy += 4 * h; if (s.t > s.dur) R.splats.splice(i, 1); }

          R.ending -= h;
          if (R.ending <= 0) finishRun();
        } else if (R.hearts <= 0) {
          R.ending = 1.1;
        } else if (R.boss && R.boss.defeated > 2.3) {
          R.ending = 0.2;
        } else if (!R.boss && R.spawned >= R.total && R.brushes.every((b) => b.judged) && R.drops.length === 0) {

        }

    }

    function brushNear(secs) {
      const nx = nozzleX(), reach = run.speed * secs;

        for (const r of b.G.regions) {
          const a = brushWorldX(b, r[0]), z = brushWorldX(b, r[1]);
          const lo = Math.min(a, z), hi = Math.max(a, z);

        }

      return false;
    }

    function stackUnder(b, bin, s) { // paste from older strokes sits underneath newer ones

      if (cell) for (const e of cell) if (e.s < s && e.h > h) h = e.h;
      return h;
    }
    function deposit(b, d, cx, top, bin) {
      const under = stackUnder(b, bin, d.s), cell = b.stack[bin] || (b.stack[bin] = []);
      let mine = cell.find((e) => e.s === d.s); if (!mine) { mine = { s: d.s, h: 0 }; cell.push(mine); }
      mine.h = Math.max(mine.h, under + d.th * 0.72); b.top[bin] = Math.max(b.top[bin], mine.h);
      const first = b.lastStroke !== d.s;

      const on = inRegion(b, cx, 0) ? 'b' : 'h';
      b.samples.push({ x: cx, y: top, th: d.th, s: d.s, seg, on, c: d.c, fv: d.fv });

        for (let i = 0; i < 4; i++) run.parts.push({ kind: 'drop', x: wx, y: L.beltY + b.dy + top, vx: rnd(-70, 70), vy: rnd(-120, -40), grav: 700, life: 1, dur: rnd(0.3, 0.5), size: rnd(2, 3.5), color: pasteFor(d.fv).base, rot: 0 });

      if (b.germ && !b.germHit) {

    }

    // ---------------------------------------------------------------------
    // Judging

    function judge(b) {
      const G = b.G;
      const len = run.lenient + (run.fever > 0 ? 0.05 : 0);
      let grade, q = 0, reason = '';
      if (b.germ) {
        if (b.bristleLen + b.offLen > 0) { grade = 'yuck'; reason = 'Germy brush!'; }
        else { grade = 'skip'; reason = 'Germs dodged'; }
      } else if (b.samples.length === 0) {
        grade = 'miss'; reason = 'No paste!'; q = -1;
      } else {
        const tol = 5;
        let covered = 0, total = 0, spill = b.beltSpill;
        for (const r of G.regions) {
          const n = Math.max(1, Math.round((r[1] - r[0]) / 2));
          const hit = new Uint8Array(n);
          for (const sm of b.samples) {
            const a = sm.x - sm.seg / 2 - 1.5, z = sm.x + sm.seg / 2 + 1.5;
            if (z < r[0] || a > r[1]) continue;
            const i0 = Math.max(0, Math.floor((a - r[0]) / 2)), i1 = Math.min(n - 1, Math.floor((z - r[0]) / 2));
            for (let i = i0; i <= i1; i++) hit[i] = 1;
          }
          for (let i = 0; i < n; i++) covered += hit[i];
          total += n;
        }
        let handle = 0;
        for (const sm of b.samples) if (!inRegion(b, sm.x, tol)) { spill += sm.seg; handle += sm.seg; }
        const rl = G.rl;
        const coverage = covered / total;
        if (b.flung) spill += rl * 0.45;
        if (b.pea) {
          const r = G.regions[0], c = (r[0] + r[1]) / 2, half = (r[1] - r[0]) / 2;
          let e0 = Infinity, e1 = -Infinity;
          for (const sm of b.samples) if (inRegion(b, sm.x, tol)) { e0 = Math.min(e0, sm.x - sm.seg / 2); e1 = Math.max(e1, sm.x + sm.seg / 2); }
          const T = 24;
          if (e1 < e0) { q = -1; reason = 'Missed the bristles'; }

            const dl = e1 - e0 + 6, m = (e0 + e1) / 2;

          }

          else if (coverage < 0.86) reason = 'Bare bristles';
        }

        if (grade === 'perfect') reason = '';
      }
      if (params.has('dbg') && grade !== 'perfect' && grade !== 'skip') console.log('JUDGE ' + JSON.stringify({ type: b.type, pea: b.pea, wob: !!b.wob, grade, q: +q.toFixed(2), reason, bl: Math.round(b.bristleLen), off: Math.round(b.offLen), belt: Math.round(b.beltSpill), reg: G.regions, xs: b.samples.filter((_, i) => i % 2 === 0).map((m) => Math.round(m.x) + (m.on === 'b' ? '' : 'h') + ':' + m.s).join(','), flip: b.flip }));
      applyGrade(b, grade, q, reason);
    }

    const GRADE = {
      perfect: { label: 'PERFECT!', pts: 100, c1: '#ff7ad9', c2: '#ff3d7f' },
      great: { label: 'GREAT!', pts: 70, c1: '#6fe3ff', c2: '#2a8cff' },
      ok: { label: 'OK', pts: 40, c1: '#b6f27a', c2: '#3bb04d' },
      miss: { label: 'MISS', pts: 0, c1: '#d5dce6', c2: '#8b97aa' },
      skip: { label: 'NICE SKIP!', pts: 60, c1: '#b6f27a', c2: '#2fb67a' },
      yuck: { label: 'YUCK!', pts: 0, c1: '#c8f06a', c2: '#5f9e1f' },
      empty: { label: '', pts: 0, c1: '#ffd27a', c2: '#ff7a2b' },
    };
    const comboMult = () => 1 + Math.min(2, Math.floor(run.combo / 5) * 0.5);

    function applyGrade(b, grade, q, reason) {
      const R = run;
      b.judged = { grade, q, reason, t: R.t };
      b.mood = grade; b.moodT = 0;
      R.judgedCount++;
      const G = GRADE[grade];
      const wx = clamp(b.x + b.dx + b.len / 2, 80, L.ww - 80);
      if (R.kind === 'demo') {
        popup(G.label, '', wx, L.beltY - 95, grade, 0.8);
        if (grade === 'perfect') burst(regionCenterX(b), L.beltY - 50, 12, { colors: ['#ffffff', '#ffe066', '#7fe7ff'], speed: 200, size: 4, kind: 'star', grav: 200 });
        return;
      }
      const maxB = b.germ ? 60 : 100;
      R.stats[grade]++;

    // ---------------------------------------------------------------------
    // Autopilot (title demo + testing)
    // ---------------------------------------------------------------------
    function predictLanding() {
      // March a paste drop squeezed right now through time (same physics as step) and
      // return the first brush surface it would hit.
      const R = run, nx = nozzleX(), P = phys();
      const y0 = L.nozzleY + 2, vx = R.flags.zeroG ? 0 : R.tube.vx * 0.9;
      let tallest = 0;
      for (const b of R.brushes) if (!b.judged) tallest = Math.max(tallest, b.G.plate + b.G.bh + 40);
      if (!tallest) return null;
      const tAt = (dist) => (-P.vy0 + Math.sqrt(P.vy0 * P.vy0 + 2 * P.g * Math.max(0, dist))) / P.g;
      const t0 = tAt(L.beltY - tallest - y0), t1 = tAt(L.beltY - y0);
      for (let t = t0; t <= t1 + STEP; t += STEP) {
        const y = y0 + P.vy0 * t + 0.5 * P.g * t * t, x = nx + vx * t;
        for (const b of R.brushes) {
          if (b.judged) continue;
          const w = wobAt(b, R.t + t);
          const lx = x - (b.x + R.speed * t + w[0]);
          if (lx < 0 || lx > b.len) continue;
          const cx = b.flip ? b.len - lx : lx;
          const bin = clamp(Math.round(cx / 3), 0, b.top.length - 1);
          if (y >= L.beltY + w[1] + surfaceTop(b, cx) - b.top[bin]) return { b, cx, lx, tf: t };
        }
      }
      return null;
    }
    function autopilotWant() {
      const R = run;
      if (R.readyT > 0.6 && R.kind !== 'demo') return false;
      const p = predictLanding();
      if (!p) return false;
      const b = p.b, cx = p.cx;
      if (b.germ) return false;
      if (!b.ap) { const e = (1 - R.apSkill) * 0.4 * R.speed; b.ap = { e0: e * rnd(-1, 1), e1: e * rnd(-1, 1) }; }
      if (b.pea) { const r = b.G.regions[0], c = (r[0] + r[1]) / 2; return Math.abs(cx - c) < 9 + b.ap.e0 * 0.2; }
      const m = R.flowing ? -1 : 3; // hysteresis so the autopilot never flickers at an edge
      for (const r of b.G.regions) {
        const a = r[0] + m + b.ap.e0, z = r[1] - m + b.ap.e1;

      return false;
    }

    // =====================================================================
    // Looks: paste, brushes, tube

    const FEVER_PASTE = { base: '#ffffff', edge: '#c3b5f0', stripes: ['#ff4d4d', '#ffad1f', '#36c45a', '#3d8bff', '#a64dff'], glitter: true };
    function pasteFor(fv) { return fv ? FEVER_PASTE : getItem(PASTES, save.eq.paste); }
    function brushSkin(b) {

      const sk = getItem(BRUSHES, save.eq.brush);
      if (sk.pat === 'none') return Object.assign({ pat: 'none' }, CLASSIC[b.hue % CLASSIC.length]);
      return sk;
    }

    function calcNormals(pts) {
      const out = [];
      for (let i = 0; i < pts.length; i++) {
        const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
        let tx = b.x - a.x, ty = b.y - a.y;
        const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
        let nx = -ty, ny = tx;
        if (nx * -0.45 + ny * -0.9 < 0) { nx = -nx; ny = -ny; }
        out.push({ x: nx, y: ny });
      }
      return out;
    }
    function strokePts(pts, N, off) {
      g.beginPath();
      for (let i = 0; i < pts.length; i++) {
        const x = pts[i].x + N[i].x * off, y = pts[i].y + N[i].y * off;
        if (i) g.lineTo(x, y); else g.moveTo(x, y);
      }
    }
    // A glossy, striped rope of toothpaste through the centre points pts.
    function drawRibbon(pts, th, P, o) {
      if (!pts.length) return;
      o = o || {};
      if (pts.length === 1) pts = [pts[0], { x: pts[0].x + 1, y: pts[0].y }];
      const N = calcNormals(pts);
      g.lineCap = 'round'; g.lineJoin = 'round';
      if (o.shadow !== false) {
        g.save(); g.translate(1.5, th * 0.38);
        strokePts(pts, N, 0); g.strokeStyle = 'rgba(15,25,50,0.22)'; g.lineWidth = th * 1.02; g.stroke();
        g.restore();
      }
      strokePts(pts, N, 0); g.strokeStyle = P.edge; g.lineWidth = th + 2.4; g.stroke();
      strokePts(pts, N, 0); g.strokeStyle = P.base; g.lineWidth = th; g.stroke();
      // soft shade on the far side
      strokePts(pts, N, -th * 0.28); g.strokeStyle = P.gel ? 'rgba(10,30,80,0.2)' : 'rgba(30,45,80,0.17)'; g.lineWidth = th * 0.42; g.stroke();

        for (let i = 0; i < st.length; i++) { strokePts(pts, N, th * (0.34 - i * step)); g.strokeStyle = st[i]; g.lineWidth = th * 0.15; g.stroke(); }
      } else if (st.length) {
        strokePts(pts, N, th * 0.2); g.strokeStyle = st[0]; g.lineWidth = th * 0.17; g.stroke();
        if (st[1]) { strokePts(pts, N, -th * 0.12); g.strokeStyle = st[1]; g.lineWidth = th * 0.15; g.stroke(); }
      }

      strokePts(pts, N, th * 0.3); g.strokeStyle = 'rgba(255,255,255,0.92)'; g.lineWidth = th * 0.12; g.stroke();

          const tw = Math.sin(tt * 6 + i) * 0.5 + 0.5;
          const off = (h - 0.5) * th * 0.6;
          sparkle(pts[i].x + N[i].x * off, pts[i].y + N[i].y * off, 1.5 + tw * 2.2, i % 3 ? '#ffffff' : '#ffe9a0', 0.5 + tw * 0.5);

    // The little curled tip that real toothpaste leaves when you stop squeezing.
    function drawCurl(pts, th, P) {

    function simplify(pts, minD) {

    let inflight = new Set();

    function drawPaste(b, t) {

        gr.raw.push(sm);

        const raw = gr.raw;

    function brushPath(b) {

      g.quadraticCurveTo(x0, -h0, x0 + h0 * 0.5, -h0);

    function drawTufts(x0, x1, base, bh, sk, seed, scale) {

      let btns;
      if (info.kind === 'level') btns = hasNext ? `<button class="btn big" data-act="next">${t('next')}</button><div class="row"><button class="btn blue" data-act="retry">${t('retry')}</button><button class="btn ghost" data-act="map">${t('levels')}</button></div>` : info.cleared ? `<button class="btn big" data-act="map">${t('levels')} ▶</button><div class="row"><button class="btn blue" data-act="retry">${t('again')}</button><button class="btn gold" data-act="shop">${t('m_shop')}</button></div>` : `<button class="btn big" data-act="retry">${t('try_again')}</button><div class="row"><button class="btn ghost" data-act="map">${t('levels')}</button><button class="btn gold" data-act="shop">${t('m_shop')}</button></div>`;
      else btns = `<button class="btn big" data-act="retry">${t('again')}</button><div class="row"><button class="btn ghost" data-act="back">${t('menu')}</button><button class="btn gold" data-act="shop">${t('m_shop')}</button></div>`;
      $('results').innerHTML = `<div class="card">
        <h2>${title}</h2>${starsHtml}
        <p class="score-big">${info.score.toLocaleString('en-US')}</p>
        ${info.newBest ? `<span class="newbest">${t('new_best')}</span>` : ''}
        <div class="stats">
          <div class="g-perfect"><span>${t('s_perfect')}</span><b>${S.perfect}</b></div>
          <div class="g-great"><span>${S.skip ? t('s_great_skip') : t('s_great')}</span><b>${S.great + S.skip}</b></div>
          <div class="g-ok"><span>${t('s_ok')}</span><b>${S.ok}</b></div>
          <div class="g-miss"><span>${t('s_miss')}</span><b>${S.miss + S.yuck}</b></div>
        </div>
        <p>${t('res_line', { c: info.bestCombo, a: Math.round(info.accu * 100) })}</p>
        <div class="reward"><i class="coin"></i> ${t('res_coins', { n: info.coins })}${info.spuds ? t('res_spuds', { n: info.spuds }) : ''}</div>
        ${info.bonus ? `<div class="resnote" style="color:#e2531f">${info.bonus}</div>` : ''}
        <div class="resnote">${tip}</div>
        <div class="menu">${btns}</div></div>`;
      show('results');
      if (info.kind !== 'endless') {
        for (let k = 0; k < info.stars; k++) setTimeout(() => SFX.star(k), 280 + k * 280);
        // star pop driven by rAF so it always finishes
        const spans = [...$('results').querySelectorAll('.bigstars span.on')];
        const t0 = performance.now();
        const anim = (now) => {
          let busy = false;
          spans.forEach((sp, k) => {
            const p = clamp((now - t0 - 150 - k * 280) / 450, 0, 1);
            if (p < 1) busy = true;
            const s = p <= 0 ? 0 : p < 0.7 ? easeOut(p / 0.7) * 1.35 : 1.35 - (p - 0.7) / 0.3 * 0.35;
            sp.style.transform = `scale(${s.toFixed(3)}) rotate(${((1 - p) * -40).toFixed(1)}deg)`;
          });
          if (busy && mode === 'results') setTimeout(() => anim(performance.now()), 16);
        };
        spans.forEach((sp) => (sp.style.transform = 'scale(0)'));
        setTimeout(() => anim(performance.now()), 16);
      }
    }

    // ---- shop ----
    let shopTab = 'tube', pasteOverride = null, skinOverride = null;
    const _pasteFor = pasteFor;
    pasteFor = (fv) => (pasteOverride && !fv ? pasteOverride : _pasteFor(fv));
    const _brushSkin = brushSkin;
    brushSkin = (b) => (skinOverride && !b.gold ? (skinOverride.pat === 'none' ? Object.assign({ pat: 'none' }, CLASSIC[b.hue % CLASSIC.length]) : skinOverride) : _brushSkin(b));
    function showShop(tab) {
      if (mode === 'play' || mode === 'paused') return;
      mode = 'shop'; hudButtons(false); ensureDemo();
      shopTab = tab || shopTab;
      const tabs = [['tube', t('t_tube')], ['paste', t('t_paste')], ['brush', t('t_brush')], ['up', t('t_up')]];
      let html = `<div class="card wide"><button class="close" data-act="back" aria-label="${t('aria_back')}">✕</button><h2>${t('shop')}</h2>
        <div class="pills"><span class="pill"><i class="coin"></i>${save.coins.toLocaleString('en-US')}</span></div>
        <div class="tabs">${tabs.map(([k, n]) => `<button class="tab ${k === shopTab ? 'on' : ''}" data-act="tab" data-tab="${k}">${n}</button>`).join('')}</div><div class="items">`;
      if (shopTab === 'up') {
        for (const u of UPGRADES) {
          const lvl = save.up[u.id] || 0, max = u.costs.length, cost = u.costs[lvl];
          html += `<div class="item ${lvl >= max ? 'eq' : ''}"><canvas data-prev="up:${u.id}" width="300" height="184"></canvas><b>${t('up_' + u.id)}</b><small>${t('upd_' + u.id)}</small>
            <div class="pips">${u.costs.map((c, i) => `<i class="${i < lvl ? 'on' : ''}"></i>`).join('')}</div>
            ${lvl >= max ? `<button class="btn sm ghost" disabled>${t('maxed')}</button>` : `<button class="btn sm gold" data-act="upgrade" data-id="${u.id}" ${save.coins < cost ? 'disabled' : ''}><i class="coin"></i> ${cost}</button>`}</div>`;
        }
      } else {
        for (const it of SHOP_TABS[shopTab]) {
          const owned = save.owned[shopTab].includes(it.id), eq = save.eq[shopTab] === it.id;
          html += `<div class="item ${eq ? 'eq' : ''}"><canvas data-prev="${shopTab}:${it.id}" width="300" height="184"></canvas><b>${itemName(shopTab, it)}</b><small>${itemDesc(shopTab, it)}</small>
            ${eq ? `<button class="btn sm ghost" disabled>${t('equipped')}</button>` : owned ? `<button class="btn sm" data-act="buy" data-kind="${shopTab}" data-id="${it.id}">${t('use')}</button>` : `<button class="btn sm gold" data-act="buy" data-kind="${shopTab}" data-id="${it.id}" ${save.coins < it.price ? 'disabled' : ''}><i class="coin"></i> ${it.price}</button>`}</div>`;
        }
      }
      $('shop').innerHTML = html + '</div></div>';
      show('shop');
      $('shop').querySelectorAll('canvas[data-prev]').forEach(drawPreview);
    }
    function drawPreview(cv) {
      const [kind, id] = cv.dataset.prev.split(':');
      const pc = cv.getContext('2d');
      const prev = g; g = pc;
      try {
        g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
        if (kind === 'tube') {
          g.setTransform(0.98, 0, 0, 0.98, 0, 0);
          const sk = getItem(TUBES, id);
          g.translate(150 / 0.98 - 134, 184 / 0.98 / 2 + 4); g.rotate(Math.PI / 2);
          drawTube(0, 0, sk, 1, 0, performance.now() / 1000, { noShadow: true, empty: true });
        } else if (kind === 'paste' || kind === 'brush') {
          const b = makeBrush({ type: 'normal', hue: 0 }, 0);
          b.mood = 'perfect'; b.judged = { grade: 'perfect' };
          if (kind === 'paste') pasteOverride = getItem(PASTES, id); else skinOverride = getItem(BRUSHES, id);
          const r = b.G.regions[0];
          for (let x = r[0] + 2; x <= r[1] - 1; x += 2) b.samples.push({ x, y: -(b.G.plate + b.G.bh), th: PASTE_TH, s: -9, seg: 2, on: 'b', c: x });
          if (kind === 'paste') { g.setTransform(2.5, 0, 0, 2.5, 150 - 228 * 2.5, 92 + 36 * 2.5); }
          else { g.setTransform(1.02, 0, 0, 1.02, 0, 0); g.translate(150, 112); g.rotate(-0.26); g.translate(-135, 12); }
          drawBrushBody(b, brushSkin(b), 0);
          drawPaste(b, performance.now() / 1000);
        } else if (kind === 'up') {
          g.setTransform(1, 0, 0, 1, 0, 0);
          const icons = { cap: '🧴', swap: '⚡', heart: '🦷', fever: '🌈' };
          g.font = '112px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
          g.fillText(icons[id] || '★', 150, 100);
        }
      } catch (e) { console.error(e); }
      pasteOverride = null; skinOverride = null;
      g = prev;
    }
    function buy(kind, id) {
      const list = SHOP_TABS[kind]; if (!list) return;
      const it = getItem(list, id);
      if (save.owned[kind].includes(id)) { save.eq[kind] = id; persist(); return showShop(kind); }
      if (save.coins < it.price) { toast(t('no_coins')); SFX.empty(); return; }
      save.coins -= it.price; save.owned[kind].push(id); save.eq[kind] = id; persist();
      SFX.buy(); toast(t('unlocked', { name: itemName(kind, it) }));
      showShop(kind);
    }
    function buyUpgrade(id) {
      const u = UPGRADES.find((x) => x.id === id); if (!u) return;
      const lvl = save.up[id] || 0; if (lvl >= u.costs.length) return;
      const cost = u.costs[lvl];
      if (save.coins < cost) { toast(t('no_coins')); SFX.empty(); return; }
      save.coins -= cost; save.up[id] = lvl + 1; persist();
      SFX.buy(); toast(t('upgraded', { name: t('up_' + u.id) }));
      showShop('up');
    }

    function act(a, ds) {
      switch (a) {
        case 'play': return showMap();
        case 'endless': return showEndlessIntro();
        case 'daily': return showDailyIntro();
        case 'shop': return showShop(ds.tab);
        case 'tab': return showShop(ds.tab);
        case 'exit': return Potato.exit();
        case 'mute': return setMute(!save.mute);
        case 'back': startDemo(); return showTitle();
        case 'map': startDemo(); return showMap();
        case 'level': return showIntro(+ds.i);
        case 'start': return beginPlay();
        case 'next': return showIntro(Math.min(LEVELS.length - 1, (run ? run.li : 0) + 1));
        case 'retry': return retry();
        case 'resume': return resume();
        case 'quit': return quit();
        case 'buy': return buy(ds.kind, ds.id);
        case 'upgrade': return buyUpgrade(ds.id);
      }
    }
    document.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]');
      if (!b || b.disabled) return;
      audioInit(); SFX.click();
      act(b.dataset.act, b.dataset);
      if (b.blur) b.blur();
    });

    // =====================================================================
    // Input
    // =====================================================================
    function placeRefill() {
      const b = $('refillBtn'); if (!b) return;
      b.style.left = Math.round((L.portrait ? L.cx : L.cx + Math.min(L.ww * 0.3, 380)) * L.s) + 'px';
      b.style.top = Math.round(Math.min(L.wh - 56 / L.s, L.beltY + 60) * L.s) + 'px';
    }
    function updateRefillBtn() {
      const b = $('refillBtn');
      const on = mode === 'play' && !!run && run.kind !== 'demo' && run.flags.tube && !run.done;
      if (b.hidden === on) b.hidden = !on;
      if (on) { const T = run.tube; b.classList.toggle('urgent', T.amt < 0.25 && T.refill === 0); b.classList.toggle('busy', T.refill > 0); }
    }
    canvas.addEventListener('pointerdown', (e) => {
      audioInit();
      if (mode !== 'play') return;
      e.preventDefault();
      input.pointers.add(e.pointerId);
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      updHeld();
    });
    const up = (e) => { input.pointers.delete(e.pointerId); updHeld(); };
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
    canvas.addEventListener('lostpointercapture', up);
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    $('refillBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); audioInit(); startRefill(); });
    $('pauseBtn').addEventListener('click', (e) => { e.stopPropagation(); audioInit(); pauseGame(); $('pauseBtn').blur(); });
    window.addEventListener('keydown', (e) => {
      const k = e.key;
      if (e.code === 'Space' || k === ' ') {
        e.preventDefault();
        audioInit();
        if (mode === 'play') { input.space = true; updHeld(); }
        else if (!e.repeat && mode === 'intro') beginPlay();
        return;
      }
      if (e.repeat) return;
      const onButton = document.activeElement && document.activeElement.tagName === 'BUTTON';
      if (k === 'Enter' && !onButton) {
        if (mode === 'intro') beginPlay();
        else if (mode === 'results') { const b = $('results').querySelector('.btn'); if (b) b.click(); }
        else if (mode === 'paused') resume();
      } else if (k === 'p' || k === 'P' || k === 'Escape') {
        if (mode === 'play') pauseGame();
        else if (mode === 'paused') resume();
        else if (k === 'Escape') { if (mode === 'intro' || mode === 'shop' || mode === 'results') { startDemo(); showMap(); } else if (mode === 'map') showTitle(); }
      } else if (k === 'm' || k === 'M') { audioInit(); setMute(!save.mute); }
      else if (k === 'r' || k === 'R') { if (mode === 'play') startRefill(); }
    });
    window.addEventListener('keyup', (e) => { if (e.code === 'Space' || e.key === ' ') { input.space = false; updHeld(); } });
    window.addEventListener('blur', () => { releaseAll(); pauseGame(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) { releaseAll(); pauseGame(); } });
    window.addEventListener('resize', resize);

    // =====================================================================
    // Debug / test hooks:  ToothpastePro.startLevel(5, true); ToothpastePro.step(10)
    // =====================================================================
    function startKind(kind, i) {
      if (kind === 'level') showIntro(i); else if (kind === 'daily') showDailyIntro(); else if (kind === 'endless') showEndlessIntro();
      beginPlay();
    }
    function simulate(kind, i, skill, maxSec) {
      const saved = JSON.stringify(save);
      dry = true;
      startKind(kind, i);
      run.autopilot = true; run.apSkill = skill == null ? 1 : skill;
      const n = Math.round((maxSec || 400) / STEP);
      for (let k = 0; k < n && !run.done; k++) step(STEP);
      dry = false;
      const res = lastResult && run.done ? lastResult : { unfinished: true, t: run.t, hearts: run.hearts };
      save = migrate(JSON.parse(saved));
      return res;
    }
    window.ToothpastePro = {
      get state() { return { mode, run, save, L }; },
      levels: LEVELS,
      startLevel(i, auto) { startKind('level', i); if (auto) run.autopilot = true; return run; },
      startEndless(auto) { startKind('endless'); if (auto) run.autopilot = true; return run; },
      startDaily(auto) { startKind('daily'); if (auto) run.autopilot = true; return run; },
      startBoss(auto) { return this.startLevel(BOSS_LEVEL, auto); },
      step(sec) { const n = Math.round(sec / STEP); for (let k = 0; k < n && run && !run.done; k++) step(STEP); },
      hold(on) { input.space = !!on; updHeld(); },
      autopilot(on, skill) { if (run) { run.autopilot = on !== false; if (skill != null) run.apSkill = skill; } },
      refill: () => startRefill(),
      simulate, showShop, showMap, showTitle, finish: () => finishRun(), pause: pauseGame,
      setCoins(n) { save.coins = n; persist(); },
    };

    // =====================================================================
    // Boot
    // =====================================================================
    resize();
    startDemo();
    showTitle();
    (function handleParams() {
      if (params.has('coins')) save.coins = +params.get('coins') || 0;
      if (params.has('stars')) { const n = +params.get('stars'); for (let i = 0; i < Math.min(n, LEVELS.length); i++) save.stars[i] = 3; }
      if (params.has('buy')) for (const pair of params.get('buy').split(',')) { const [k, id] = pair.split(':'); if (save.owned[k] && !save.owned[k].includes(id)) save.owned[k].push(id); if (save.owned[k]) save.eq[k] = id; }
      const scene = params.get('scene');
      const skill = params.has('skill') ? +params.get('skill') : 1;
      const ff = +params.get('t') || 0;
      if (params.has('level') || params.get('mode')) {
        const m = params.get('mode');
        if (m === 'endless') startKind('endless'); else if (m === 'daily') startKind('daily'); else startKind('level', clamp((+params.get('level') || 1) - 1, 0, LEVELS.length - 1));
        if (params.has('auto')) { run.autopilot = true; run.apSkill = skill; }
        for (let k = 0; k < Math.round(ff / STEP) && !run.done; k++) step(STEP);
        if (params.has('fever')) { run.fever = run.feverMax; }
        if (params.has('autoOff')) run.autopilot = false;
        if (scene === 'pause') pauseGame();
        if (params.has('stop')) { mode = 'paused'; show(null); }
        if (params.has('dump')) {
          const pre = $('selftest');
          pre.textContent = JSON.stringify(run.brushes.map((b) => ({ type: b.type, x: Math.round(b.x), flip: b.flip, judged: b.judged, n: b.samples.length, s: b.samples.filter((_, i) => i % 6 === 0).map((m) => [Math.round(m.x), Math.round(m.y), m.s]) })));
        }
      } else if (scene === 'shop') showShop(params.get('tab') || 'tube');
      else if (scene === 'map') showMap();
      else if (scene === 'intro') showIntro(clamp((+params.get('i') || 1) - 1, 0, LEVELS.length - 1));
      else if (ff) { for (let k = 0; k < Math.round(ff / STEP); k++) step(STEP); }
      if (params.has('selftest')) {
        const out = [];
        const lv0 = +params.get('from') || 0, lv1 = +params.get('to') || LEVELS.length;
        for (let i = lv0; i < lv1; i++) {
          const a = simulate('level', i, 1), b = simulate('level', i, +params.get('selftest') || 0.85);
          const st = (x) => x.stats ? `P${x.stats.perfect} G${x.stats.great} O${x.stats.ok} M${x.stats.miss} S${x.stats.skip} Y${x.stats.yuck}` : JSON.stringify(x);
          out.push(`${i + 1} ${LEVELS[i].name}: pro ${a.stars}★ ${Math.round((a.accu || 0) * 100)}% h${a.hearts} ${st(a)} ${JSON.stringify(a.reasons)} | kid ${b.stars}★ ${Math.round((b.accu || 0) * 100)}% h${b.hearts} ${st(b)} ${JSON.stringify(b.reasons)}`);
        }
        const e = simulate('endless', 0, 0.9, 900);
        out.push('endless(0.9): ' + e.score + ' ' + JSON.stringify(e.stats));
        const pre = $('selftest'); pre.hidden = false; pre.textContent = out.join('\n');
        pre.style.cssText = 'position:fixed;inset:0;margin:0;padding:10px;background:#fff;color:#000;font:12px monospace;z-index:99;overflow:auto;white-space:pre-wrap';
        showTitle();
      }
    })();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
