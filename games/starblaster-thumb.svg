<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Star Blaster game card: a blue star fighter blasts glowing bolts at a squadron of purple alien swoopers in a colorful nebula, with a ringed planet, an explosion and floating crystals -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0b0a3a"/>
      <stop offset="0.55" stop-color="#140a40"/>
      <stop offset="1" stop-color="#050822"/>
    </linearGradient>
    <radialGradient id="nebA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7a2aff" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#5a2ad0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#3a1aa0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#16b8ff" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#1a6aff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1a4aff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebC" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff3fc8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ff3fc8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff3fc8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="32%" cy="30%" r="80%">
      <stop offset="0" stop-color="#d8e4ff"/>
      <stop offset="0.45" stop-color="#6a7ef0"/>
      <stop offset="1" stop-color="#14154a"/>
    </radialGradient>
    <radialGradient id="night" cx="25%" cy="22%" r="85%">
      <stop offset="0.3" stop-color="#000010" stop-opacity="0"/>
      <stop offset="1" stop-color="#000010" stop-opacity="0.95"/>
    </radialGradient>
    <radialGradient id="atm" cx="50%" cy="50%" r="50%">
      <stop offset="0.62" stop-color="#7aa8ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7aa8ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pclip"><circle cx="560" cy="64" r="96"/></clipPath>
    <clipPath id="ringFront"><rect x="380" y="64" width="300" height="200" transform="rotate(-14 560 64)"/></clipPath>
    <radialGradient id="glowW" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#bff0ff" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#6ad7ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6ad7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e8fff0" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#7dffb0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7dffb0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowFire" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbe0" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#ffd43b" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#ff7a2a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff3fc8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff9af0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wingL" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#6aa8ff"/>
      <stop offset="1" stop-color="#1d3a8a"/>
    </linearGradient>
    <linearGradient id="wingR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f2ff"/>
      <stop offset="0.45" stop-color="#4a88e8"/>
      <stop offset="1" stop-color="#14306a"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d3a8a"/>
      <stop offset="0.28" stop-color="#6aa8ff"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#6aa8ff"/>
      <stop offset="1" stop-color="#1d3a8a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fdff"/>
      <stop offset="0.35" stop-color="#6ad7ff"/>
      <stop offset="1" stop-color="#0a1f4a"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#6ad7ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6ad7ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="manta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c1470"/>
      <stop offset="0.45" stop-color="#8a5cff"/>
      <stop offset="1" stop-color="#22105a"/>
    </linearGradient>
    <radialGradient id="mantaBody" cx="40%" cy="30%" r="70%">
      <stop offset="0" stop-color="#e8dcff"/>
      <stop offset="0.5" stop-color="#8a5cff"/>
      <stop offset="1" stop-color="#2c1470"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ffe14a"/>
      <stop offset="1" stop-color="#ffe14a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbS" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#7dffb0"/>
      <stop offset="1" stop-color="#0a6a3a"/>
    </radialGradient>
    <linearGradient id="cry" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0fdff"/>
      <stop offset="0.5" stop-color="#38d8ff"/>
      <stop offset="1" stop-color="#0a5a8a"/>
    </linearGradient>
    <linearGradient id="cryPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe0ff"/>
      <stop offset="0.5" stop-color="#ff6ae8"/>
      <stop offset="1" stop-color="#8a1a8a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
    <g id="swooper">
      <circle r="34" fill="url(#glowPink)" opacity="0.35"/>
      <path d="M0 -12 C14 -19 27 -9 27 5 C20 2 14 7 9 17 L0 11 L-9 17 C-14 7 -20 2 -27 5 C-27 -9 -14 -19 0 -12 Z" fill="url(#manta)"/>
      <path d="M4 -8 Q16 -12 25 3 M-4 -8 Q-16 -12 -25 3 M5 0 Q12 2 14 9 M-5 0 Q-12 2 -14 9" fill="none" stroke="#d9c4ff" stroke-opacity="0.55" stroke-width="1.2"/>
      <ellipse cx="0" cy="-1" rx="8" ry="13" fill="url(#mantaBody)"/>
      <circle cx="0" cy="7" r="7" fill="url(#eye)"/>
      <circle cx="0" cy="7" r="2.6" fill="#ffe14a"/>
      <circle cx="-0.8" cy="6.2" r="1" fill="#fff"/>
      <circle cx="25" cy="4" r="2" fill="#ff5ad8"/>
      <circle cx="-25" cy="4" r="2" fill="#ff5ad8"/>
      <ellipse cx="-3" cy="-7" rx="2.5" ry="4" fill="#fff" opacity="0.35" transform="rotate(17 -3 -7)"/>
    </g>
    <g id="bolt">
      <rect x="-7" y="-20" width="14" height="40" rx="7" fill="url(#glowGreen)" opacity="0.8"/>
      <rect x="-3" y="-13" width="6" height="26" rx="3" fill="#7dffb0"/>
      <rect x="-1.5" y="-11" width="3" height="20" rx="1.5" fill="#fff"/>
    </g>
    <g id="ebul">
      <circle r="15" fill="url(#glowPink)" opacity="0.8"/>
      <circle r="7" fill="#ff4fd8"/>
      <circle r="4.6" fill="#fff"/>
    </g>
    <g id="crystal">
      <path d="M0 -9 L6 -3 L0 9 L-6 -3 Z" fill="#38d8ff"/>
      <path d="M0 -9 L-6 -3 L0 -2 Z" fill="#e0fdff"/>
      <path d="M0 -9 L6 -3 L0 -2 Z" fill="#7ae8ff"/>
      <path d="M6 -3 L0 9 L0 -2 Z" fill="#0a5a8a"/>
      <path d="M0 -9 L6 -3 L0 9 L-6 -3 Z" fill="none" stroke="#fff" stroke-opacity="0.8" stroke-width="0.8"/>
    </g>
  </defs>

  <!-- space -->
  <rect width="640" height="360" fill="url(#sky)"/>
  <ellipse cx="170" cy="120" rx="260" ry="150" fill="url(#nebA)"/>
  <ellipse cx="420" cy="250" rx="280" ry="140" fill="url(#nebB)"/>
  <ellipse cx="330" cy="40" rx="200" ry="100" fill="url(#nebC)"/>
  <ellipse cx="40" cy="320" rx="180" ry="90" fill="url(#nebC)" opacity="0.6"/>
  <g fill="#02030f" opacity="0.45" filter="url(#soft)">
    <ellipse cx="260" cy="190" rx="120" ry="26" transform="rotate(-18 260 190)"/>
    <ellipse cx="520" cy="300" rx="110" ry="22" transform="rotate(12 520 300)"/>
  </g>
  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="22" cy="30" r="1.2"/><circle cx="64" cy="88" r="0.9"/><circle cx="110" cy="20" r="1.5"/><circle cx="150" cy="70" r="0.8"/>
    <circle cx="200" cy="130" r="1.1"/><circle cx="246" cy="22" r="0.9"/><circle cx="300" cy="96" r="1.3"/><circle cx="352" cy="150" r="0.8"/>
    <circle cx="390" cy="30" r="1.1"/><circle cx="430" cy="110" r="0.9"/><circle cx="468" cy="190" r="1.4"/><circle cx="610" cy="200" r="1"/>
    <circle cx="590" cy="290" r="1.3"/><circle cx="540" cy="340" r="0.9"/><circle cx="470" cy="300" r="0.8"/><circle cx="420" cy="342" r="1.2"/>
    <circle cx="90" cy="200" r="1"/><circle cx="40" cy="250" r="1.4"/><circle cx="130" cy="300" r="0.8"/><circle cx="16" cy="160" r="0.9"/>
    <circle cx="330" cy="230" r="0.9"/><circle cx="380" cy="270" r="1.1"/><circle cx="512" cy="230" r="0.8"/><circle cx="626" cy="140" r="1.2"/>
    <circle cx="180" cy="340" r="1"/><circle cx="70" cy="140" r="0.7"/><circle cx="276" cy="320" r="0.8"/><circle cx="356" cy="64" r="0.7"/>
  </g>
  <g fill="#ffffff">
    <path d="M110 12 Q110 20 118 20 Q110 20 110 28 Q110 20 102 20 Q110 20 110 12Z" opacity="0.9"/>
    <path d="M468 182 Q468 190 476 190 Q468 190 468 198 Q468 190 460 190 Q468 190 468 182Z" opacity="0.8"/>
    <path d="M40 242 Q40 250 48 250 Q40 250 40 258 Q40 250 32 250 Q40 250 40 242Z" opacity="0.8"/>
  </g>

  <!-- ringed planet -->
  <circle cx="560" cy="64" r="132" fill="url(#atm)"/>
  <g transform="rotate(-14 560 64)" fill="none">
    <ellipse cx="560" cy="64" rx="168" ry="36" stroke="#cfd8ff" stroke-opacity="0.4" stroke-width="12"/>
    <ellipse cx="560" cy="64" rx="190" ry="41" stroke="#cfd8ff" stroke-opacity="0.25" stroke-width="7"/>
  </g>
  <circle cx="560" cy="64" r="96" fill="url(#planet)"/>
  <g clip-path="url(#pclip)" opacity="0.35">
    <path d="M460 30 Q560 18 660 34 L660 46 Q560 30 460 42Z" fill="#9aa8ff"/>
    <path d="M460 70 Q560 60 660 74 L660 86 Q560 72 460 84Z" fill="#1e1f6a"/>
    <path d="M460 104 Q560 96 660 108 L660 118 Q560 106 460 116Z" fill="#9aa8ff"/>
  </g>
  <circle cx="560" cy="64" r="96" fill="url(#night)"/>
  <path d="M470 50 A95 95 0 0 1 540 -28" fill="none" stroke="#bfe0ff" stroke-opacity="0.7" stroke-width="3"/>
  <g transform="rotate(-14 560 64)" fill="none" clip-path="url(#ringFront)">
    <ellipse cx="560" cy="64" rx="168" ry="36" stroke="#e0e8ff" stroke-opacity="0.55" stroke-width="12"/>
    <ellipse cx="560" cy="64" rx="190" ry="41" stroke="#cfd8ff" stroke-opacity="0.32" stroke-width="7"/>
  </g>

  <!-- enemy bullets -->
  <use href="#ebul" x="300" y="150"/>
  <use href="#ebul" x="470" y="170"/>
  <use href="#ebul" x="430" y="236"/>

  <!-- swooper squadron -->
  <use href="#swooper" transform="translate(250 64) rotate(12) scale(1.35)"/>
  <use href="#swooper" transform="translate(340 92) rotate(4) scale(1.45)"/>
  <use href="#swooper" transform="translate(452 110) rotate(-10) scale(1.3)"/>

  <!-- explosion -->
  <g transform="translate(172 108)">
    <circle r="70" fill="url(#glowFire)" opacity="0.9"/>
    <circle r="58" fill="none" stroke="#ffe9a0" stroke-opacity="0.45" stroke-width="1.6"/>
    <g filter="url(#soft)" opacity="0.9">
      <circle cx="-10" cy="-6" r="20" fill="#ff8a3a"/><circle cx="14" cy="4" r="16" fill="#ff5ab0"/><circle cx="0" cy="14" r="14" fill="#ffb43a"/>
    </g>
    <circle cx="-6" cy="-4" r="16" fill="#ffd43b" opacity="0.9"/>
    <circle cx="8" cy="6" r="12" fill="#ffb43a" opacity="0.85"/>
    <g stroke="#fff6d0" stroke-width="2" stroke-linecap="round" opacity="0.9">
      <path d="M4 -26 L7 -40"/><path d="M24 -14 L38 -22"/><path d="M28 12 L40 18"/><path d="M-4 28 L-6 38"/><path d="M-24 16 L-34 24"/><path d="M-28 -12 L-44 -16"/><path d="M-12 -28 L-18 -42"/>
    </g>
    <g fill="#8a5cff" stroke="#d9c4ff" stroke-width="0.8">
      <path d="M30 -38 l8 -3 l3 7 l-8 3z"/><path d="M-44 -30 l7 -5 l4 6 l-7 4z"/><path d="M-30 40 l6 2 l-2 7 l-6 -2z"/><path d="M44 30 l5 -4 l4 5 l-5 3z"/>
    </g>
    <circle r="11" fill="#fffbe8"/>
  </g>

  <!-- player bolts -->
  <use href="#bolt" x="300" y="200" transform="rotate(10 300 200)"/>
  <use href="#bolt" x="318" y="202" transform="rotate(10 318 202)"/>
  <use href="#bolt" x="320" y="150" transform="rotate(10 320 150)"/>
  <use href="#bolt" x="338" y="152" transform="rotate(10 338 152)"/>
  <use href="#bolt" x="262" y="190" transform="rotate(-6 262 190)"/>
  <use href="#bolt" x="360" y="196" transform="rotate(24 360 196)"/>

  <!-- crystals & power-up -->
  <circle cx="122" cy="200" r="16" fill="url(#glowBlue)" opacity="0.6"/>
  <use href="#crystal" transform="translate(122 200) scale(1.3)"/>
  <use href="#crystal" transform="translate(150 172) scale(0.9)"/>
  <circle cx="100" cy="164" r="18" fill="url(#glowPink)" opacity="0.5"/>
  <g transform="translate(100 164) scale(1.5)">
    <path d="M0 -9 L6 -3 L0 9 L-6 -3 Z" fill="url(#cryPink)"/>
    <path d="M0 -9 L-6 -3 L0 -2 Z" fill="#ffe0ff"/>
    <path d="M0 -9 L6 -3 L0 9 L-6 -3 Z" fill="none" stroke="#fff" stroke-opacity="0.8" stroke-width="0.7"/>
  </g>
  <g transform="translate(470 258)">
    <circle r="40" fill="url(#glowGreen)" opacity="0.55"/>
    <circle r="19" fill="url(#orbS)" stroke="#fff" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" font-size="23" fill="#fff" stroke="#0a6a3a" stroke-width="3" paint-order="stroke">S</text>
    <ellipse cx="-7" cy="-9" rx="6" ry="3.4" fill="#fff" opacity="0.55" transform="rotate(-28 -7 -9)"/>
  </g>

  <!-- the star fighter -->
  <g transform="translate(300 286) rotate(10) scale(2.05)">
    <ellipse cx="0" cy="34" rx="16" ry="30" fill="url(#glowBlue)" opacity="0.8"/>
    <path d="M-8.5 22 Q-5 52 -1.5 22 Z" fill="url(#flame)"/>
    <path d="M1.5 22 Q5 52 8.5 22 Z" fill="url(#flame)"/>
    <path d="M-2 -8 L-25 11 L-28 22 L-9 18 L-3 14 Z" fill="url(#wingL)"/>
    <path d="M2 -8 L25 11 L28 22 L9 18 L3 14 Z" fill="url(#wingR)"/>
    <path d="M-15 7 L-23 13 L-24 17 L-14 12 Z" fill="#ff5a6a"/>
    <path d="M15 7 L23 13 L24 17 L14 12 Z" fill="#ff5a6a"/>
    <path d="M-3 -6 L-24 11 M3 -6 L24 11" stroke="#fff" stroke-opacity="0.6" stroke-width="1.1"/>
    <circle cx="-26" cy="20" r="1.8" fill="#ff5a6a"/><circle cx="26" cy="20" r="1.8" fill="#ff5a6a"/>
    <path d="M0 -31 C6 -24 9 -8 9 6 L7 22 L-7 22 L-9 6 C-9 -8 -6 -24 0 -31 Z" fill="url(#hull)"/>
    <path d="M0 -31 L3.5 -24 L-3.5 -24 Z" fill="#ff5a6a"/>
    <path d="M-7 8 L7 8 M-6 14 L6 14" stroke="#1d3a8a" stroke-opacity="0.6" stroke-width="1"/>
    <ellipse cx="0" cy="-10" rx="4.6" ry="8.5" fill="url(#glass)"/>
    <ellipse cx="-1.5" cy="-13" rx="1.4" ry="3.5" fill="#fff" opacity="0.8" transform="rotate(-11 -1.5 -13)"/>
    <rect x="-8.5" y="18" width="7" height="7" rx="2" fill="#1a1e2c"/>
    <rect x="1.5" y="18" width="7" height="7" rx="2" fill="#1a1e2c"/>
    <circle cx="0" cy="0" r="2.4" fill="#fff"/>
  </g>
  <circle cx="306" cy="250" r="30" fill="url(#glowGreen)" opacity="0.45"/>
  <!-- logo badge -->
  <g>
    <rect x="16" y="296" width="220" height="50" rx="14" fill="#0b1634" stroke="#7ad7ff" stroke-width="3"/>
    <text x="126" y="332" text-anchor="middle" font-family="'Trebuchet MS', 'Arial Black', Arial, sans-serif" font-weight="900" font-size="28" fill="#1a4a8a">STAR BLASTER</text>
    <text x="126" y="329" text-anchor="middle" font-family="'Trebuchet MS', 'Arial Black', Arial, sans-serif" font-weight="900" font-size="28" fill="#e8f8ff">STAR BLASTER</text>
  </g>
</svg>
