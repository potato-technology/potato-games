<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Jungle Dash icon: the explorer in a safari hat, with jungle leaves behind -->
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#7fe0a0"/>
      <stop offset="1" stop-color="#1f7a4a"/>
    </radialGradient>
    <radialGradient id="skin" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffd9b0"/>
      <stop offset="1" stop-color="#e2a76f"/>
    </radialGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc27a"/>
      <stop offset="1" stop-color="#2f8a4a"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d6a0"/>
      <stop offset="1" stop-color="#c49a5c"/>
    </linearGradient>
    <clipPath id="badge"><circle cx="50" cy="50" r="47"/></clipPath>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
  <g clip-path="url(#badge)">
    <!-- leaves -->
    <g fill="#2f8a4a">
      <ellipse cx="14" cy="30" rx="22" ry="8" transform="rotate(30 14 30)"/>
      <ellipse cx="86" cy="26" rx="22" ry="8" transform="rotate(-30 86 26)"/>
      <ellipse cx="10" cy="62" rx="20" ry="7" transform="rotate(-20 10 62)"/>
      <ellipse cx="90" cy="64" rx="20" ry="7" transform="rotate(20 90 64)"/>
    </g>
    <!-- body with backpack straps -->
    <path d="M14 104 Q16 72 40 70 L60 70 Q84 72 86 104 Z" fill="url(#shirt)"/>
    <path d="M36 72 L46 104 M64 72 L54 104" stroke="#6e4521" stroke-width="5"/>
    <path d="M38 70 L62 70 L60 76 L40 76 Z" fill="#d9463a"/>
    <!-- head -->
    <rect x="44" y="60" width="12" height="12" rx="4" fill="#d89a62"/>
    <circle cx="50" cy="48" r="19" fill="url(#skin)"/>
    <circle cx="31.5" cy="50" r="4" fill="#e2a76f"/><circle cx="68.5" cy="50" r="4" fill="#e2a76f"/>
    <circle cx="43" cy="49" r="2.8" fill="#1d1a17"/><circle cx="57" cy="49" r="2.8" fill="#1d1a17"/>
    <circle cx="44" cy="48" r="1" fill="#fff"/><circle cx="58" cy="48" r="1" fill="#fff"/>
    <circle cx="38" cy="56" r="3.2" fill="#ff8f8f" opacity="0.45"/><circle cx="62" cy="56" r="3.2" fill="#ff8f8f" opacity="0.45"/>
    <path d="M43 56 Q50 63 57 56 Z" fill="#7a2a1e"/>
    <!-- safari hat -->
    <ellipse cx="50" cy="35" rx="31" ry="8" fill="#a8844a"/>
    <path d="M32 36 A18 17 0 0 1 68 36 Z" fill="url(#hat)"/>
    <rect x="32" y="31" width="36" height="5" fill="#7a5a2a"/>
    <ellipse cx="44" cy="25" rx="7" ry="3" fill="#fff" opacity="0.35" transform="rotate(-20 44 25)"/>
  </g>
  <circle cx="50" cy="50" r="47" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="2.5"/>
</svg>
