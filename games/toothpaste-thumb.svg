  </g>
  <ellipse cx="314" cy="283" rx="5" ry="3" fill="#ff7aa5" opacity="0.6"/><ellipse cx="362" cy="283" rx="5" ry="3" fill="#ff7aa5" opacity="0.6"/>
  <!-- bristles -->
