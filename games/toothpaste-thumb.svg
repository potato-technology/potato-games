<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Toothpaste Pro game card: a glossy tube squeezing a perfect striped stripe onto a happy toothbrush -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="1" stop-color="#ffe6a3"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2f6ff"/>
      <stop offset="0.6" stop-color="#bfe9fd"/>
      <stop offset="1" stop-color="#b0e0f8"/>
    </linearGradient>
    <pattern id="tiles" x="0" y="0" width="44" height="44" patternUnits="userSpaceOnUse">
      <rect width="44" height="44" fill="#eefaff"/>
      <rect x="1.5" y="1.5" width="41" height="41" rx="5" fill="url(#tile)"/>
      <rect x="6" y="6" width="14" height="2.5" rx="1.2" fill="#ffffff" opacity="0.6"/>
    </pattern>
    <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d4ff"/>
      <stop offset="0.25" stop-color="#4aa3ff"/>
      <stop offset="0.75" stop-color="#1f63c4"/>
      <stop offset="1" stop-color="#15478f"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f4ff"/>
      <stop offset="1" stop-color="#9fcbf0"/>
    </linearGradient>
    <linearGradient id="tuft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d5e3f2"/>
    </linearGradient>
    <linearGradient id="tuftB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe2ff"/>
      <stop offset="1" stop-color="#6fb2ef"/>
    </linearGradient>
    <linearGradient id="tubeBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aab6c6"/>
      <stop offset="0.12" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f2f5f9"/>
      <stop offset="0.85" stop-color="#dfe5ee"/>
      <stop offset="1" stop-color="#9aa6b8"/>
    </linearGradient>
    <linearGradient id="tubeBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b438f"/>
      <stop offset="0.15" stop-color="#2f6fe0"/>
      <stop offset="0.32" stop-color="#6aa0ff"/>
      <stop offset="0.55" stop-color="#2f6fe0"/>
      <stop offset="1" stop-color="#183c84"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a6b2c3"/>
      <stop offset="0.25" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#8f9cb0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#ff5d8f"/>
      <stop offset="0.52" stop-color="#ff5d8f"/>
      <stop offset="0.52" stop-color="#ffffff"/>
      <stop offset="0.68" stop-color="#ffffff"/>
      <stop offset="0.68" stop-color="#3d9bff"/>
      <stop offset="0.82" stop-color="#3d9bff"/>
      <stop offset="0.82" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf2ff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe98f"/>
      <stop offset="1" stop-color="#f5a812"/>
