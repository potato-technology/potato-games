      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.9" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.75"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbe0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fffbe0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset="0.65" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b2347" stop-opacity="0.28"/>
    </radialGradient>
    <linearGradient id="duck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a6"/>
      <stop offset="1" stop-color="#f5b800"/>
    </linearGradient>
  </defs>

