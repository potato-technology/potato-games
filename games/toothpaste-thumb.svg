    <path transform="translate(300 186) scale(1.35)" d="M0 -16 L4.7 -6.5 L15.2 -4.9 L7.6 2.5 L9.4 13 L0 8 L-9.4 13 L-7.6 2.5 L-15.2 -4.9 L-4.7 -6.5 Z" fill="url(#gold)"/>
    <path transform="translate(338 196) scale(1.1)" d="M0 -16 L4.7 -6.5 L15.2 -4.9 L7.6 2.5 L9.4 13 L0 8 L-9.4 13 L-7.6 2.5 L-15.2 -4.9 L-4.7 -6.5 Z" fill="url(#gold)"/>
