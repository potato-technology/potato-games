  <!-- conveyor belt + counter -->
  <rect x="0" y="292" width="640" height="68" fill="url(#counter)"/>
  <rect x="0" y="282" width="640" height="18" fill="url(#belt)"/>
  <g stroke="#5a6886" stroke-width="3">
    <path d="M14 283 l-6 16 M40 283 l-6 16 M66 283 l-6 16 M92 283 l-6 16 M118 283 l-6 16 M144 283 l-6 16 M170 283 l-6 16 M196 283 l-6 16 M222 283 l-6 16 M248 283 l-6 16 M274 283 l-6 16 M300 283 l-6 16 M326 283 l-6 16 M352 283 l-6 16 M378 283 l-6 16 M404 283 l-6 16 M430 283 l-6 16 M456 283 l-6 16 M482 283 l-6 16 M508 283 l-6 16 M534 283 l-6 16 M560 283 l-6 16 M586 283 l-6 16 M612 283 l-6 16 M638 283 l-6 16"/>
