    <path d="M18 -140 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z" fill="#e63950"/>
    <rect x="-34" y="-146" width="7" height="96" rx="3.5" fill="#ffffff" opacity="0.65"/>
    <!-- crimped end -->
