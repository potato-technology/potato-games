    <path d="M-24 -18 q-10 -14 2 -12 l4 10 z" fill="#f5b800"/>
    <circle cx="12" cy="-34" r="13" fill="url(#duck)"/>
    <path d="M23 -36 q12 2 9 7 q-5 3 -10 -1 z" fill="#ff8a3d"/>
    <circle cx="15" cy="-37" r="2.3" fill="#1c2a4d"/>
