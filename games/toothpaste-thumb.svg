    <path d="M-24 -40 Q-46 -44 -46 -64 L-42 -96 Q-34 -104 -46 -114 L-52 -150 L52 -150 L46 -114 Q34 -104 42 -96 L46 -64 Q46 -44 24 -40 Z" fill="url(#tubeBody)" stroke="#5d6b84" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M-46 -64 L-43 -92 Q-20 -80 0 -92 Q20 -104 43 -92 L46 -64 Q46 -44 24 -40 L-24 -40 Q-46 -44 -46 -64 Z" fill="url(#tubeBand)"/>
    <path d="M-43 -92 Q-20 -80 0 -92 Q20 -104 43 -92" stroke="#e63950" stroke-width="5" fill="none"/>
