  <path d="M52 290 q-16 0 -16 -16 q0 -16 16 -16 h332 q22 0 30 8 q10 10 26 10 h158 q12 0 12 7 v0 q0 7 -12 7 h-536 z" fill="url(#handle)" stroke="#123a78" stroke-width="2"/>
  <rect x="66" y="262" width="150" height="20" rx="10" fill="url(#grip)"/>
  <g fill="#7fb4e6"><rect x="80" y="265" width="3" height="14"/><rect x="92" y="265" width="3" height="14"/><rect x="104" y="265" width="3" height="14"/><rect x="116" y="265" width="3" height="14"/><rect x="128" y="265" width="3" height="14"/><rect x="140" y="265" width="3" height="14"/><rect x="152" y="265" width="3" height="14"/><rect x="164" y="265" width="3" height="14"/><rect x="176" y="265" width="3" height="14"/><rect x="188" y="265" width="3" height="14"/><rect x="200" y="265" width="3" height="14"/></g>
  <rect x="58" y="261" width="320" height="4" rx="2" fill="#ffffff" opacity="0.55"/>
