    <circle cx="42" cy="62" r="5"/><circle cx="86" cy="62" r="5"/><circle cx="130" cy="62" r="5"/><circle cx="174" cy="62" r="5"/><circle cx="218" cy="62" r="5"/><circle cx="262" cy="62" r="5"/><circle cx="306" cy="62" r="5"/><circle cx="350" cy="62" r="5"/><circle cx="394" cy="62" r="5"/><circle cx="438" cy="62" r="5"/><circle cx="482" cy="62" r="5"/><circle cx="526" cy="62" r="5"/><circle cx="570" cy="62" r="5"/><circle cx="614" cy="62" r="5"/>
    <circle cx="20" cy="106" r="5"/><circle cx="64" cy="106" r="5"/><circle cx="108" cy="106" r="5"/><circle cx="152" cy="106" r="5"/><circle cx="196" cy="106" r="5"/><circle cx="240" cy="106" r="5"/><circle cx="284" cy="106" r="5"/><circle cx="328" cy="106" r="5"/><circle cx="372" cy="106" r="5"/><circle cx="416" cy="106" r="5"/><circle cx="460" cy="106" r="5"/><circle cx="504" cy="106" r="5"/><circle cx="548" cy="106" r="5"/><circle cx="592" cy="106" r="5"/>
  </g>
  <rect x="0" y="132" width="640" height="170" fill="url(#tiles)"/>
  <!-- scalloped trim -->
  <g fill="#5ec8ff">
    <path d="M0 132 a15 13 0 0 0 30 0 a15 13 0 0 0 30 0 a15 13 0 0 0 30 0 a15 13 0 0 0 30 0 a15 13 0 0 0 30 0 a15 13 0 0 0 30 0 a15 13 0 0 0 30 0 a15 13 0 0 0 30 0 a15 13 0 0 0 30 0 a15 13 0 0 0 30 0 a15 13 0 0 0 30 0 a15 13 0 0 0 30 0 a15 13 0 0 0 30 0 a15 13 0 0 0 30 0 a15 13 0 0 0 30 0 a15 13 0 0 0 30 0 a15 13 0 0 0 30 0 a15 13 0 0 0 30 0 a15 13 0 0 0 30 0 a15 13 0 0 0 30 0 a15 13 0 0 0 30 0 a15 13 0 0 0 30 0 Z"/>
  </g>
  <rect x="0" y="124" width="640" height="12" rx="6" fill="#3aa8e8"/>
  <rect x="0" y="124" width="640" height="5" rx="2.5" fill="#9be2ff"/>

  <!-- rubber duck on a little shelf -->
