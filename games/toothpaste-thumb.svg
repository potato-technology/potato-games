  </g>

  <!-- floating bubbles -->
  <g stroke="#ffffff" stroke-width="1.6" fill="url(#bubble)">
    <circle cx="352" cy="232" r="13"/><circle cx="378" cy="196" r="7"/><circle cx="34" cy="226" r="10"/>
    <circle cx="612" cy="210" r="11"/><circle cx="590" cy="176" r="6"/><circle cx="160" cy="176" r="8"/>
