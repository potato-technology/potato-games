    <rect x="-8" y="-8" width="16" height="10" rx="3.5" fill="url(#cap)"/>
    <g transform="translate(21 -28) rotate(70)"><rect x="-3" y="-2" width="24" height="11" rx="5" fill="url(#cap)" stroke="#5d6b84" stroke-opacity="0.45" stroke-width="1.2"/></g>
  </g>

  <!-- three gold stars -->
  <g stroke="#b77d00" stroke-width="2.5" stroke-linejoin="round">
