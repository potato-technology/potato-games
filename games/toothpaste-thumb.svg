    <rect x="446" y="236" width="10" height="38" rx="5" fill="url(#tuft)"/><rect x="459" y="234" width="10" height="40" rx="5" fill="url(#tuft)"/><rect x="472" y="236" width="10" height="38" rx="5" fill="url(#tuftB)"/><rect x="485" y="235" width="10" height="39" rx="5" fill="url(#tuft)"/><rect x="498" y="236" width="10" height="38" rx="5" fill="url(#tuft)"/><rect x="511" y="234" width="10" height="40" rx="5" fill="url(#tuftB)"/><rect x="524" y="236" width="10" height="38" rx="5" fill="url(#tuft)"/><rect x="537" y="235" width="10" height="39" rx="5" fill="url(#tuft)"/><rect x="550" y="236" width="10" height="38" rx="5" fill="url(#tuftB)"/><rect x="563" y="234" width="10" height="40" rx="5" fill="url(#tuft)"/><rect x="576" y="236" width="10" height="38" rx="5" fill="url(#tuft)"/><rect x="589" y="235" width="10" height="39" rx="5" fill="url(#tuftB)"/>
    <g fill="#ffffff" opacity="0.85"><rect x="449" y="240" width="2.4" height="14"/><rect x="462" y="238" width="2.4" height="14"/><rect x="488" y="239" width="2.4" height="14"/><rect x="501" y="240" width="2.4" height="14"/><rect x="527" y="240" width="2.4" height="14"/><rect x="540" y="239" width="2.4" height="14"/><rect x="566" y="238" width="2.4" height="14"/><rect x="579" y="240" width="2.4" height="14"/></g>
  </g>

  <!-- the perfect stripe of paste -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M458 223 q12 -4 24 0 t24 0 t24 0 t24 0 t24 0 q8 -3 14 -1" stroke="#0d1a33" stroke-opacity="0.2" stroke-width="22" transform="translate(2 6)"/>
    <path d="M458 223 q12 -4 24 0 t24 0 t24 0 t24 0 t24 0 q8 -3 14 -1" stroke="#b4c8dc" stroke-width="25"/>
    <path d="M458 223 q12 -4 24 0 t24 0 t24 0 t24 0 t24 0 q8 -3 14 -1" stroke="#f8fbff" stroke-width="21"/>
    <path d="M458 227 q12 -4 24 0 t24 0 t24 0 t24 0 t24 0 q8 -3 14 -1" stroke="#c7d6e8" stroke-width="7"/>
    <path d="M458 219 q12 -4 24 0 t24 0 t24 0 t24 0 t24 0 q8 -3 14 -1" stroke="#2f8cff" stroke-width="3.6"/>
    <path d="M458 225 q12 -4 24 0 t24 0 t24 0 t24 0 t24 0 q8 -3 14 -1" stroke="#ff4d6d" stroke-width="3.6"/>
    <path d="M458 216 q12 -4 24 0 t24 0 t24 0 t24 0 t24 0 q8 -3 14 -1" stroke="#ffffff" stroke-width="2.6"/>
