    <g stroke="#9aa6b8" stroke-width="1.4"><path d="M-48 -163 v12 M-40 -163 v12 M-32 -163 v12 M-24 -163 v12 M-16 -163 v12 M-8 -163 v12 M0 -163 v12 M8 -163 v12 M16 -163 v12 M24 -163 v12 M32 -163 v12 M40 -163 v12 M48 -163 v12"/></g>
