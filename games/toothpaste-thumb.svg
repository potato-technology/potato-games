    <path d="M459 160 q-2 34 -2 62" stroke="#f8fbff" stroke-width="18"/>
    <path d="M463 162 q-2 32 -2 58" stroke="#ff4d6d" stroke-width="3.4"/>
    <path d="M454 162 q-2 32 -2 58" stroke="#2f8cff" stroke-width="3.4"/>
    <path d="M451 166 q-1 28 -1 50" stroke="#ffffff" stroke-width="2.4"/>
  </g>

