<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Kart Kings icon: a red kart seen from above with a gold crown -->
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#8fe06a"/>
      <stop offset="1" stop-color="#3f8f30"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a70"/>
      <stop offset="0.5" stop-color="#e8413c"/>
      <stop offset="1" stop-color="#a8221e"/>
    </linearGradient>
    <radialGradient id="helmet" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fff6c0"/>
      <stop offset="0.6" stop-color="#ffd43b"/>
      <stop offset="1" stop-color="#b8860b"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
