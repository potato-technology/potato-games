  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
  <g clip-path="url(#badge)">
    <path d="M -10 78 Q 50 40 110 70" fill="none" stroke="#5d606e" stroke-width="34"/>
    <path d="M -10 78 Q 50 40 110 70" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="7 8"/>
  </g>
  <g transform="translate(50 56) rotate(-20) scale(1.35)">
