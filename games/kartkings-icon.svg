    <rect x="5" y="-18" width="14" height="8" rx="3" fill="#1b1c22"/><rect x="5" y="10" width="14" height="8" rx="3" fill="#1b1c22"/>
    <rect x="-21" y="-19" width="15" height="9" rx="3" fill="#1b1c22"/><rect x="-21" y="10" width="15" height="9" rx="3" fill="#1b1c22"/>
    <path d="M25 0 Q24 -8 12 -9 L-6 -11 Q-17 -11 -18 -6 L-18 6 Q-17 11 -6 11 L12 9 Q24 8 25 0 Z" fill="url(#red)" stroke="#141826" stroke-width="1.6"/>
    <rect x="-24" y="-15" width="5" height="30" rx="2" fill="#6e1512"/>
