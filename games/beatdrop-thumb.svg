<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Beat Drop game card: a neon concert stage with a glowing 4-lane note highway running into a striped sun,
       colourful note gems sliding toward the hit line, a PERFECT burst, spotlights, lasers, LED equalizers and a cheering crowd. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07041a"/>
      <stop offset="0.6" stop-color="#1a0c3a"/>
      <stop offset="1" stop-color="#2a1250"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e1658"/>
      <stop offset="0.5" stop-color="#160a2c"/>
      <stop offset="1" stop-color="#06030c"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7c8"/>
      <stop offset="0.45" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff4f9a"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff8a5a" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#ff4f9a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8a3cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sunClip"><circle cx="320" cy="118" r="96"/></clipPath>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1048" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#0c0620" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#08041a"/>
    </linearGradient>
    <linearGradient id="roadFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0518" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0a0518" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3df0ff" stop-opacity="0.5"/><stop offset="1" stop-color="#3df0ff" stop-opacity="0"/></linearGradient>
    <linearGradient id="beamP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4fd8" stop-opacity="0.5"/><stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/></linearGradient>
    <linearGradient id="beamY" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd23f" stop-opacity="0.45"/><stop offset="1" stop-color="#ffd23f" stop-opacity="0"/></linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2fff0"/><stop offset="0.45" stop-color="#38f29a"/><stop offset="1" stop-color="#0a7a48"/></linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe0e8"/><stop offset="0.45" stop-color="#ff4f79"/><stop offset="1" stop-color="#9a0f35"/></linearGradient>
    <linearGradient id="gYellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8d8"/><stop offset="0.45" stop-color="#ffd23f"/><stop offset="1" stop-color="#a87a00"/></linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0f4ff"/><stop offset="0.45" stop-color="#41b6ff"/><stop offset="1" stop-color="#0b4f8a"/></linearGradient>
    <linearGradient id="tail" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#41b6ff" stop-opacity="0.95"/><stop offset="1" stop-color="#41b6ff" stop-opacity="0.3"/></linearGradient>
    <radialGradient id="burst" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#9dffd0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#38f29a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ffc2f0"/>
      <stop offset="0.7" stop-color="#ff5fd2"/>
      <stop offset="1" stop-color="#9a3cff"/>
    </linearGradient>
    <linearGradient id="truss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a5670"/><stop offset="1" stop-color="#1c1a26"/></linearGradient>
    <radialGradient id="cone" cx="40%" cy="40%" r="60%"><stop offset="0" stop-color="#6a6480"/><stop offset="0.5" stop-color="#2a2638"/><stop offset="1" stop-color="#0c0a12"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <g id="gem">
      <rect x="-30" y="-11" width="60" height="22" rx="11"/>
    </g>
  </defs>

  <!-- back wall and floor -->
  <rect width="640" height="230" fill="url(#wall)"/>
  <rect y="214" width="640" height="146" fill="url(#floor)"/>
  <g stroke="#a078ff" stroke-opacity="0.1" stroke-width="1.2">
    <line x1="320" y1="214" x2="-260" y2="360"/><line x1="320" y1="214" x2="-60" y2="360"/><line x1="320" y1="214" x2="700" y2="360"/><line x1="320" y1="214" x2="900" y2="360"/>
  </g>
  <rect y="212" width="640" height="4" fill="#ffffff" fill-opacity="0.08"/>

  <!-- sun -->
  <circle cx="320" cy="118" r="190" fill="url(#sunGlow)"/>
  <g clip-path="url(#sunClip)">
    <rect x="224" y="22" width="192" height="192" fill="url(#sun)"/>
    <ellipse cx="290" cy="70" rx="50" ry="34" fill="#ffffff" fill-opacity="0.3"/>
    <g fill="#2a0f2e">
      <rect x="220" y="128" width="200" height="3"/>
      <rect x="220" y="142" width="200" height="4.5"/>
      <rect x="220" y="157" width="200" height="6"/>
      <rect x="220" y="173" width="200" height="7.5"/>
      <rect x="220" y="190" width="200" height="9"/>
    </g>
  </g>
  <circle cx="320" cy="118" r="110" fill="none" stroke="#ffb347" stroke-opacity="0.35" stroke-width="2.5"/>
  <circle cx="320" cy="118" r="134" fill="none" stroke="#ff7ae0" stroke-opacity="0.15" stroke-width="2"/>

  <!-- LED equalizer walls -->
  <g>
    <rect x="16" y="96" width="186" height="110" rx="9" fill="#06030f" stroke="#2d2058" stroke-width="2.5"/>
    <rect x="438" y="96" width="186" height="110" rx="9" fill="#06030f" stroke="#2d2058" stroke-width="2.5"/>
    <g id="eqL">
      <g fill="#ff5f9e">
        <rect x="24" y="186" width="15" height="8"/><rect x="24" y="175" width="15" height="8"/><rect x="24" y="164" width="15" height="8"/>
        <rect x="42" y="186" width="15" height="8"/><rect x="42" y="175" width="15" height="8"/><rect x="42" y="164" width="15" height="8"/><rect x="42" y="153" width="15" height="8"/>
        <rect x="60" y="186" width="15" height="8"/><rect x="60" y="175" width="15" height="8"/>
        <rect x="78" y="186" width="15" height="8"/><rect x="78" y="175" width="15" height="8"/><rect x="78" y="164" width="15" height="8"/><rect x="78" y="153" width="15" height="8"/>
        <rect x="96" y="186" width="15" height="8"/><rect x="96" y="175" width="15" height="8"/><rect x="96" y="164" width="15" height="8"/><rect x="96" y="153" width="15" height="8"/>
        <rect x="114" y="186" width="15" height="8"/><rect x="114" y="175" width="15" height="8"/><rect x="114" y="164" width="15" height="8"/>
        <rect x="132" y="186" width="15" height="8"/><rect x="132" y="175" width="15" height="8"/><rect x="132" y="164" width="15" height="8"/><rect x="132" y="153" width="15" height="8"/>
        <rect x="150" y="186" width="15" height="8"/><rect x="150" y="175" width="15" height="8"/><rect x="150" y="164" width="15" height="8"/>
        <rect x="168" y="186" width="15" height="8"/><rect x="168" y="175" width="15" height="8"/><rect x="168" y="164" width="15" height="8"/><rect x="168" y="153" width="15" height="8"/>
      </g>
      <g fill="#ffe14f">
        <rect x="42" y="142" width="15" height="8"/><rect x="42" y="131" width="15" height="8"/>
        <rect x="78" y="142" width="15" height="8"/>
        <rect x="96" y="142" width="15" height="8"/><rect x="96" y="131" width="15" height="8"/><rect x="96" y="120" width="15" height="8"/>
        <rect x="132" y="142" width="15" height="8"/>
        <rect x="168" y="142" width="15" height="8"/><rect x="168" y="131" width="15" height="8"/>
      </g>
      <g fill="#ffffff">
        <rect x="24" y="158" width="15" height="2.5"/><rect x="42" y="125" width="15" height="2.5"/><rect x="60" y="169" width="15" height="2.5"/><rect x="78" y="136" width="15" height="2.5"/>
        <rect x="96" y="113" width="15" height="2.5"/><rect x="114" y="158" width="15" height="2.5"/><rect x="132" y="136" width="15" height="2.5"/><rect x="150" y="158" width="15" height="2.5"/><rect x="168" y="125" width="15" height="2.5"/>
      </g>
    </g>
    <use href="#eqL" transform="translate(640 0) scale(-1 1)"/>
  </g>

  <!-- speakers -->
  <g>
    <rect x="0" y="128" width="40" height="64" rx="5" fill="#1c1828" stroke="#3a3250" stroke-width="2"/>
    <circle cx="20" cy="166" r="15" fill="url(#cone)"/><circle cx="20" cy="140" r="5" fill="#05030a"/>
    <rect x="600" y="128" width="40" height="64" rx="5" fill="#1c1828" stroke="#3a3250" stroke-width="2"/>
    <circle cx="620" cy="166" r="15" fill="url(#cone)"/><circle cx="620" cy="140" r="5" fill="#05030a"/>
  </g>

  <!-- truss, lamps, beams and lasers -->
  <rect y="6" width="640" height="5" fill="url(#truss)"/>
  <rect y="24" width="640" height="5" fill="url(#truss)"/>
  <path d="M0 9 L10 26 L20 9 L30 26 L40 9 L50 26 L60 9 L70 26 L80 9 L90 26 L100 9 L110 26 L120 9 L130 26 L140 9 L150 26 L160 9 L170 26 L180 9 L190 26 L200 9 L210 26 L220 9 L230 26 L240 9 L250 26 L260 9 L270 26 L280 9 L290 26 L300 9 L310 26 L320 9 L330 26 L340 9 L350 26 L360 9 L370 26 L380 9 L390 26 L400 9 L410 26 L420 9 L430 26 L440 9 L450 26 L460 9 L470 26 L480 9 L490 26 L500 9 L510 26 L520 9 L530 26 L540 9 L550 26 L560 9 L570 26 L580 9 L590 26 L600 9 L610 26 L620 9 L630 26 L640 9" fill="none" stroke="#3e3a52" stroke-width="2"/>
  <g>
    <polygon points="62,36 70,36 200,340 70,340" fill="url(#beamC)"/>
    <polygon points="150,36 158,36 330,300 230,320" fill="url(#beamY)"/>
    <polygon points="482,36 490,36 410,320 310,300" fill="url(#beamP)"/>
    <polygon points="570,36 578,36 570,340 440,340" fill="url(#beamC)"/>
  </g>
  <g stroke-linecap="round">
    <g stroke-opacity="0.25" stroke-width="6" filter="url(#glow)">
      <line x1="160" y1="30" x2="-20" y2="250" stroke="#ff4fd8"/><line x1="160" y1="30" x2="40" y2="330" stroke="#3df0ff"/>
      <line x1="480" y1="30" x2="660" y2="250" stroke="#ff4fd8"/><line x1="480" y1="30" x2="600" y2="330" stroke="#3df0ff"/>
    </g>
    <g stroke-width="1.6">
      <line x1="160" y1="30" x2="-20" y2="250" stroke="#ff9ae8"/><line x1="160" y1="30" x2="40" y2="330" stroke="#9af6ff"/>
      <line x1="480" y1="30" x2="660" y2="250" stroke="#ff9ae8"/><line x1="480" y1="30" x2="600" y2="330" stroke="#9af6ff"/>
    </g>
  </g>
  <g>
    <rect x="55" y="22" width="22" height="16" rx="4" fill="#2a2638"/><circle cx="66" cy="36" r="6" fill="#3df0ff"/><circle cx="66" cy="36" r="2.6" fill="#fff"/>
    <rect x="143" y="22" width="22" height="16" rx="4" fill="#2a2638"/><circle cx="154" cy="36" r="6" fill="#ffd23f"/><circle cx="154" cy="36" r="2.6" fill="#fff"/>
    <rect x="475" y="22" width="22" height="16" rx="4" fill="#2a2638"/><circle cx="486" cy="36" r="6" fill="#ff4fd8"/><circle cx="486" cy="36" r="2.6" fill="#fff"/>
    <rect x="563" y="22" width="22" height="16" rx="4" fill="#2a2638"/><circle cx="574" cy="36" r="6" fill="#3df0ff"/><circle cx="574" cy="36" r="2.6" fill="#fff"/>
  </g>

  <!-- dancers -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <g stroke="#ffb347" stroke-opacity="0.6" stroke-width="10">
      <path d="M100 252 L108 226 L112 200 M108 226 L118 252 M112 200 L111 172 M111 178 L94 162 L86 140 M111 178 L128 190 L142 178"/>
      <path d="M540 252 L532 226 L528 200 M532 226 L522 252 M528 200 L529 172 M529 178 L546 162 L554 140 M529 178 L512 166 L500 150"/>
    </g>
    <g stroke="#0b0618" stroke-width="6.5">
      <path d="M100 252 L108 226 L112 200 M108 226 L118 252 M112 200 L111 172 M111 178 L94 162 L86 140 M111 178 L128 190 L142 178"/>
      <path d="M540 252 L532 226 L528 200 M532 226 L522 252 M528 200 L529 172 M529 178 L546 162 L554 140 M529 178 L512 166 L500 150"/>
    </g>
  </g>
  <circle cx="111" cy="160" r="10" fill="#0b0618" stroke="#ffb347" stroke-opacity="0.7" stroke-width="2.5"/>
  <circle cx="529" cy="160" r="10" fill="#0b0618" stroke="#ff5f9e" stroke-opacity="0.7" stroke-width="2.5"/>
  <circle cx="86" cy="140" r="3.5" fill="#ffe14f"/><circle cx="142" cy="178" r="3.5" fill="#ffe14f"/>
  <circle cx="554" cy="140" r="3.5" fill="#ff9ae8"/><circle cx="500" cy="150" r="3.5" fill="#ff9ae8"/>

  <!-- the note highway: top y=118 (x 286..354), bottom y=360 (x 110..530), hit line y=300 -->
  <polygon points="286,118 354,118 530,360 110,360" fill="url(#road)"/>
  <g opacity="0.12">
    <polygon points="286,118 303,118 197.5,360 110,360" fill="#38f29a"/>
    <polygon points="303,118 320,118 320,360 197.5,360" fill="#ff4f79"/>
    <polygon points="320,118 337,118 442.5,360 320,360" fill="#ffd23f"/>
    <polygon points="337,118 354,118 530,360 442.5,360" fill="#41b6ff"/>
  </g>
  <g stroke="#a0c8ff" stroke-opacity="0.25" stroke-width="1.2">
    <line x1="303" y1="118" x2="197.5" y2="360"/><line x1="320" y1="118" x2="320" y2="360"/><line x1="337" y1="118" x2="442.5" y2="360"/>
  </g>
  <g stroke="#a0c8ff" stroke-linecap="round">
    <line x1="293" y1="140" x2="347" y2="140" stroke-opacity="0.2" stroke-width="1"/>
    <line x1="278" y1="164" x2="362" y2="164" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="257" y1="196" x2="383" y2="196" stroke-opacity="0.2" stroke-width="1.4"/>
    <line x1="226" y1="240" x2="414" y2="240" stroke-opacity="0.45" stroke-width="2.6"/>
  </g>
  <polygon points="280,118 360,118 366,150 274,150" fill="url(#roadFade)"/>
  <!-- glowing rails -->
  <g stroke-linecap="round">
    <line x1="286" y1="118" x2="110" y2="360" stroke="#3df0ff" stroke-width="12" stroke-opacity="0.35" filter="url(#glow)"/>
    <line x1="354" y1="118" x2="530" y2="360" stroke="#ff4fd8" stroke-width="12" stroke-opacity="0.35" filter="url(#glow)"/>
    <line x1="286" y1="118" x2="110" y2="360" stroke="#3df0ff" stroke-width="3.5"/>
    <line x1="354" y1="118" x2="530" y2="360" stroke="#ff4fd8" stroke-width="3.5"/>
    <line x1="286" y1="118" x2="110" y2="360" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.8"/>
    <line x1="354" y1="118" x2="530" y2="360" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.8"/>
  </g>

  <!-- notes coming down -->
  <polygon points="464,300 482,300 410,158 401,158" fill="url(#tail)"/>
  <line x1="473" y1="300" x2="405.5" y2="158" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
  <g transform="translate(405.5 158) scale(0.5)"><use href="#gem" fill="url(#gBlue)" stroke="#06223a" stroke-width="3"/><rect x="-24" y="-8" width="48" height="6" rx="3" fill="#fff" fill-opacity="0.5"/></g>
  <g transform="translate(298 140) scale(0.42)"><use href="#gem" fill="url(#gYellow)" stroke="#3a2a00" stroke-width="3"/></g>
  <g transform="translate(354 196) scale(0.62)"><use href="#gem" fill="url(#gYellow)" stroke="#3a2a00" stroke-width="3"/><rect x="-24" y="-8" width="48" height="6" rx="3" fill="#fff" fill-opacity="0.55"/><ellipse cx="0" cy="0" rx="9" ry="6" fill="#fff" fill-opacity="0.8"/></g>
  <g transform="translate(276 240) scale(0.82)"><use href="#gem" fill="url(#gRed)" stroke="#3a0614" stroke-width="3"/><rect x="-24" y="-8" width="48" height="6" rx="3" fill="#fff" fill-opacity="0.55"/><ellipse cx="0" cy="0" rx="9" ry="6" fill="#fff" fill-opacity="0.8"/></g>

  <!-- hit line and receptors -->
  <rect x="150" y="288" width="340" height="24" fill="#ffffff" fill-opacity="0.08"/>
  <line x1="158" y1="300" x2="482" y2="300" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2.5"/>
  <g fill="#0c0620" fill-opacity="0.8" stroke-width="3">
    <rect x="166" y="288" width="68" height="24" rx="12" stroke="#38f29a"/>
    <rect x="248" y="288" width="68" height="24" rx="12" stroke="#ff4f79"/>
    <rect x="324" y="288" width="68" height="24" rx="12" stroke="#ffd23f"/>
    <rect x="406" y="288" width="68" height="24" rx="12" stroke="#41b6ff" fill="#41b6ff" fill-opacity="0.45"/>
  </g>
  <!-- the blue long note being held, and a PERFECT burst on green -->
  <g transform="translate(440 300) scale(1.05)"><use href="#gem" fill="url(#gBlue)" stroke="#06223a" stroke-width="3"/><rect x="-24" y="-8" width="48" height="6" rx="3" fill="#fff" fill-opacity="0.55"/></g>
  <circle cx="200" cy="300" r="70" fill="url(#burst)"/>
  <ellipse cx="200" cy="300" rx="62" ry="24" fill="none" stroke="#9dffd0" stroke-width="4" stroke-opacity="0.9"/>
  <ellipse cx="200" cy="300" rx="88" ry="34" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M200 254 L207 293 L246 300 L207 307 L200 346 L193 307 L154 300 L193 293 Z" fill="#ffffff"/>
  <g stroke="#9dffd0" stroke-width="3" stroke-linecap="round">
    <line x1="148" y1="276" x2="134" y2="268"/><line x1="252" y1="276" x2="266" y2="268"/><line x1="200" y1="246" x2="200" y2="232"/><line x1="160" y1="256" x2="150" y2="244"/><line x1="240" y1="256" x2="250" y2="244"/>
  </g>
  <text x="200" y="232" text-anchor="middle" font-family="'Arial Rounded MT Bold', 'Trebuchet MS', Arial, sans-serif" font-weight="900" font-size="15" fill="#7dfcff" stroke="#0a0518" stroke-width="4" paint-order="stroke">PERFECT</text>

  <!-- crowd -->
  <g fill="#05020b">
    <path d="M0 360 L0 330 Q8 318 22 318 Q36 318 40 330 L44 360 Z"/><circle cx="22" cy="306" r="12"/>
    <path d="M52 360 L56 334 Q62 324 74 324 Q86 324 90 334 L94 360 Z"/><circle cx="73" cy="312" r="11"/>
    <path d="M540 360 L544 334 Q550 324 562 324 Q574 324 578 334 L582 360 Z"/><circle cx="561" cy="312" r="11"/>
    <path d="M592 360 L596 330 Q604 318 618 318 Q632 318 636 330 L640 360 Z"/><circle cx="616" cy="306" r="12"/>
    <path d="M18 300 L8 262 M30 300 L40 264" stroke="#05020b" stroke-width="7" stroke-linecap="round"/>
    <path d="M610 300 L600 262 M622 300 L632 264" stroke="#05020b" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g stroke-linecap="round">
    <line x1="40" y1="264" x2="44" y2="240" stroke="#38f29a" stroke-width="9" stroke-opacity="0.35"/><line x1="40" y1="264" x2="44" y2="240" stroke="#7dffc0" stroke-width="3.5"/>
    <line x1="600" y1="262" x2="596" y2="238" stroke="#ff4fd8" stroke-width="9" stroke-opacity="0.35"/><line x1="600" y1="262" x2="596" y2="238" stroke="#ff9ae8" stroke-width="3.5"/>
  </g>

  <!-- title -->
  <g font-family="'Arial Rounded MT Bold', 'Trebuchet MS', Arial, sans-serif" font-weight="900" text-anchor="middle">
    <text x="320" y="92" font-size="66" fill="#ff4fd8" fill-opacity="0.55" filter="url(#soft)">BEAT DROP</text>
    <text x="320" y="92" font-size="66" fill="url(#title)" stroke="#2a0838" stroke-width="10" stroke-linejoin="round" paint-order="stroke" letter-spacing="1">BEAT DROP</text>
  </g>
  <g fill="#ffffff">
    <path d="M118 66 L118 38 L136 34 L136 60" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="113" cy="67" rx="7" ry="5.5" transform="rotate(-20 113 67)"/><ellipse cx="131" cy="61" rx="7" ry="5.5" transform="rotate(-20 131 61)"/>
    <path d="M520 40 L520 64" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/><path d="M520 40 Q532 44 532 54" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="514" cy="65" rx="7" ry="5.5" transform="rotate(-20 514 65)"/>
  </g>
</svg>
