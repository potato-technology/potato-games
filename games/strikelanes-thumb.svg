<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Strike Lanes game card: a glossy red ball rolls down a neon-lit wooden lane into a rack of pins exploding in a STRIKE burst -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140a2e"/>
      <stop offset="1" stop-color="#2d1550"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d3a2"/>
      <stop offset="0.5" stop-color="#e2b071"/>
      <stop offset="1" stop-color="#c98f52"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="gutter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2f55"/>
      <stop offset="1" stop-color="#1d1730"/>
    </linearGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ff9a9a"/>
      <stop offset="0.5" stop-color="#d62f3f"/>
      <stop offset="1" stop-color="#5a0b16"/>
    </radialGradient>
    <radialGradient id="burst" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c2" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#ffd43b" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff4f8b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfd5df"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a4acba"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <symbol id="p" viewBox="0 0 20 60" overflow="visible">
      <path d="M10 0 C14 0 15 5 14 10 C13 15 12 17 12 20 C12 24 19 30 18 42 C17.5 50 15 56 14 60 L6 60 C5 56 2.5 50 2 42 C1 30 8 24 8 20 C8 17 7 15 6 10 C5 5 6 0 10 0 Z" fill="url(#pin)" stroke="#5a5070" stroke-width="1"/>
      <rect x="7.2" y="15" width="5.6" height="2.2" fill="#e03131"/>
      <rect x="7.4" y="18.6" width="5.2" height="2.2" fill="#e03131"/>
    </symbol>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <!-- neon rays behind -->
  <g opacity="0.35">
    <path d="M320 140 L80 0 L180 0 Z" fill="#ff4f8b"/>
    <path d="M320 140 L280 0 L360 0 Z" fill="#4fe3ff"/>
    <path d="M320 140 L460 0 L560 0 Z" fill="#ff4f8b"/>
    <path d="M320 140 L0 60 L0 130 Z" fill="#4fe3ff"/>
    <path d="M320 140 L640 60 L640 130 Z" fill="#4fe3ff"/>
  </g>
  <!-- stars -->
  <g fill="#fff" opacity="0.7">
    <circle cx="60" cy="40" r="1.5"/><circle cx="130" cy="90" r="1"/><circle cx="560" cy="50" r="1.6"/><circle cx="600" cy="110" r="1"/><circle cx="500" cy="20" r="1.2"/><circle cx="30" cy="120" r="1"/>
  </g>
  <!-- neighbor lanes and floor -->
  <path d="M0 360 L0 230 L250 150 L390 150 L640 230 L640 360 Z" fill="#241a3d"/>
  <!-- gutters -->
  <path d="M60 360 L262 150 L378 150 L580 360 Z" fill="url(#gutter)"/>
  <!-- lane -->
  <path d="M110 360 L274 150 L366 150 L530 360 Z" fill="url(#lane)"/>
  <g stroke="#8a5a30" stroke-opacity="0.25" stroke-width="1">
    <path d="M151 360 L283 150"/><path d="M192 360 L292 150"/><path d="M233 360 L301 150"/><path d="M274 360 L311 150"/><path d="M315 360 L320 150"/>
    <path d="M356 360 L329 150"/><path d="M397 360 L338 150"/><path d="M438 360 L348 150"/><path d="M479 360 L357 150"/>
  </g>
  <path d="M110 360 L274 150 L366 150 L530 360 Z" fill="url(#sheen)"/>
  <!-- arrows -->
  <g fill="#6b3418">
    <path d="M250 262 l6 -14 l6 14 z"/><path d="M285 252 l5 -14 l5 14 z"/><path d="M315 246 l5 -14 l5 14 z"/><path d="M345 252 l5 -14 l5 14 z"/><path d="M378 262 l6 -14 l6 14 z"/>
  </g>
  <!-- neon edges -->
  <g filter="url(#glow)" stroke-width="3">
    <path d="M110 360 L274 150" stroke="#ff4f8b"/>
    <path d="M530 360 L366 150" stroke="#4fe3ff"/>
  </g>
  <!-- strike burst -->
  <circle cx="320" cy="140" r="120" fill="url(#burst)"/>
  <g fill="#ffd43b">
    <path d="M320 70 l8 40 l-16 0 z" transform="rotate(-20 320 140)"/>
    <path d="M320 70 l8 40 l-16 0 z" transform="rotate(25 320 140)"/>
    <path d="M320 70 l8 40 l-16 0 z" transform="rotate(70 320 140)"/>
    <path d="M320 70 l8 40 l-16 0 z" transform="rotate(-65 320 140)"/>
  </g>
  <!-- flying pins -->
  <use href="#p" x="245" y="80" width="22" height="66" transform="rotate(-50 256 113)"/>
  <use href="#p" x="372" y="70" width="22" height="66" transform="rotate(40 383 103)"/>
  <use href="#p" x="300" y="60" width="20" height="60" transform="rotate(-15 310 90)"/>
  <use href="#p" x="330" y="96" width="20" height="60" transform="rotate(70 340 126)"/>
  <use href="#p" x="400" y="120" width="18" height="54" transform="rotate(95 409 147)"/>
  <use href="#p" x="216" y="122" width="18" height="54" transform="rotate(-85 225 149)"/>
  <use href="#p" x="282" y="108" width="20" height="60" transform="rotate(-30 292 138)"/>
  <!-- confetti -->
  <g>
    <rect x="200" y="70" width="8" height="4" fill="#4fe3ff" transform="rotate(30 204 72)"/>
    <rect x="430" y="80" width="8" height="4" fill="#ff4f8b" transform="rotate(-20 434 82)"/>
    <rect x="260" y="40" width="8" height="4" fill="#3ee08f" transform="rotate(60 264 42)"/>
    <rect x="390" y="40" width="8" height="4" fill="#ffd43b" transform="rotate(10 394 42)"/>
    <rect x="460" y="130" width="8" height="4" fill="#b197fc" transform="rotate(45 464 132)"/>
    <rect x="170" y="140" width="8" height="4" fill="#ffd43b" transform="rotate(-40 174 142)"/>
  </g>
  <!-- the ball -->
  <ellipse cx="352" cy="338" rx="62" ry="12" fill="#000" opacity="0.35"/>
  <circle cx="352" cy="282" r="58" fill="url(#ball)" stroke="#3a0610" stroke-width="2.5"/>
  <g fill="#1a0a12">
    <ellipse cx="338" cy="262" rx="7" ry="6"/><ellipse cx="362" cy="258" rx="7" ry="6"/><ellipse cx="352" cy="282" rx="8" ry="7"/>
  </g>
  <ellipse cx="330" cy="254" rx="20" ry="12" fill="#fff" opacity="0.5" transform="rotate(-30 330 254)"/>
  <!-- motion lines -->
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round">
    <path d="M300 330 L285 352"/><path d="M405 330 L420 352"/><path d="M352 345 L352 358"/>
  </g>
  <!-- title -->
  <g font-family="Fredoka, 'Arial Black', 'Trebuchet MS', sans-serif" font-weight="900" text-anchor="middle">
    <text x="320" y="62" font-size="54" fill="#5a0b2b" stroke="#5a0b2b" stroke-width="10" stroke-linejoin="round">STRIKE LANES</text>
    <text x="320" y="56" font-size="54" fill="#ff4f8b" stroke="#2b0414" stroke-width="3" stroke-linejoin="round">STRIKE <tspan fill="#4fe3ff">LANES</tspan></text>
  </g>
</svg>
