    <path d="M 20 70 Q 30 106 40 70 Z" fill="url(#flame)"/>
    <rect x="18" y="44" width="22" height="30" rx="8" fill="#e8413c" stroke="#7a1612" stroke-width="2"/>
    <ellipse cx="34" cy="40" rx="10" ry="18" fill="#b97b25" transform="rotate(-25 34 40)"/>
    <circle cx="56" cy="52" r="27" fill="url(#head)"/>
    <ellipse cx="72" cy="62" rx="15" ry="11" fill="#f8dc9c"/>
    <ellipse cx="83" cy="57" rx="6" ry="5" fill="#3a2418"/>
    <path d="M 68 68 A 6 6 0 0 0 79 69" fill="none" stroke="#7a4a20" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="69" y="70" width="8" height="10" rx="4" fill="#ff7a8a"/>
    <circle cx="62" cy="47" r="6.5" fill="#2b2b2b"/><circle cx="64.5" cy="44.5" r="2.3" fill="#fff"/>
    <path d="M 33 40 A 27 27 0 0 1 72 30" fill="none" stroke="#6b4423" stroke-width="5"/>
    <circle cx="63" cy="28" r="8" fill="#6b4423"/><circle cx="63" cy="28" r="5.5" fill="#9be7ff"/>
    <circle cx="49" cy="28" r="8" fill="#6b4423"/><circle cx="49" cy="28" r="5.5" fill="#9be7ff"/>
