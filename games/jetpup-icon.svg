<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Jet Pup icon: a puppy face with flight goggles and a jet flame -->
  <defs>
    <radialGradient id="bg" cx="40%" cy="30%" r="80%">
      <stop offset="0" stop-color="#7fe7d8"/>
      <stop offset="1" stop-color="#2f8f88"/>
    </radialGradient>
    <radialGradient id="head" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffe0a0"/>
      <stop offset="1" stop-color="#e0a23e"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.5" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#ff4d5e" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="badge"><rect x="2" y="2" width="96" height="96" rx="22"/></clipPath>
  </defs>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#bg)"/>
