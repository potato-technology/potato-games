<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Shadow Heist game card: a masked orange cat burglar tiptoes away with a glowing blue gem from an empty display case,
       while a bulldog guard sweeps his flashlight beam the wrong way in a dark museum at night. Red laser beams glow in the corner. -->
  <defs>
    <pattern id="tiles" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#2f2945"/>
      <rect width="20" height="20" fill="#372f52"/>
      <rect x="20" y="20" width="20" height="20" fill="#372f52"/>
      <path d="M0 0 H40 M0 20 H40 M0 0 V40 M20 0 V40" stroke="#241f36" stroke-width="1.2"/>
      <path d="M4 12 Q14 18 22 30" stroke="#463c63" stroke-width="0.8" fill="none"/>
    </pattern>
    <linearGradient id="wallTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3c54"/>
      <stop offset="1" stop-color="#5e4c66"/>
    </linearGradient>
    <linearGradient id="wallFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c2f3c"/>
      <stop offset="1" stop-color="#4c1520"/>
    </linearGradient>
    <radialGradient id="lampPool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd690" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#ffb860" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffb860" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="beam" cx="440" cy="270" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff3c0" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#ffe08a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffe08a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gemGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a8dcff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#4aa3ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4aa3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0.55" stop-color="#05040c" stop-opacity="0"/>
      <stop offset="1" stop-color="#05040c" stop-opacity="0.75"/>
    </radialGradient>
    <radialGradient id="catHead" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffbd80"/>
      <stop offset="1" stop-color="#e8823a"/>
    </radialGradient>
    <radialGradient id="dogHead" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#f2c48a"/>
      <stop offset="1" stop-color="#c98a4e"/>
    </radialGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d55a0"/>
      <stop offset="0.5" stop-color="#2c3f78"/>
      <stop offset="1" stop-color="#1b284f"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8f0ff"/>
      <stop offset="0.5" stop-color="#4aa3ff"/>
      <stop offset="1" stop-color="#1c4fa8"/>
    </linearGradient>
    <linearGradient id="sack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8a868"/>
      <stop offset="1" stop-color="#8a5a2a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfeaff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9ccaf0" stop-opacity="0.12"/>
    </linearGradient>
    <clipPath id="shirtClip"><rect x="137" y="204" width="68" height="78" rx="26"/></clipPath>
    <clipPath id="dogBodyClip"><rect x="470" y="200" width="100" height="92" rx="34"/></clipPath>
  </defs>

  <!-- floor -->
  <rect width="640" height="360" fill="url(#tiles)"/>
  <rect width="640" height="360" fill="#120e24" opacity="0.45"/>
  <!-- rug -->
  <rect x="40" y="235" width="250" height="110" rx="4" fill="#7a1828"/>
  <rect x="48" y="243" width="234" height="94" fill="none" stroke="#e6bd52" stroke-width="3"/>
  <path d="M165 252 L205 290 L165 328 L125 290 Z" fill="#5c1020"/>
  <circle cx="165" cy="290" r="5" fill="#e6bd52"/>

  <!-- back wall (3/4 view) -->
  <rect x="0" y="0" width="640" height="66" fill="url(#wallTop)"/>
  <rect x="0" y="62" width="640" height="4" fill="#9a86a4"/>
  <rect x="0" y="66" width="640" height="34" fill="url(#wallFront)"/>
  <rect x="0" y="66" width="640" height="3" fill="#e2bb5c"/>
  <rect x="0" y="96" width="640" height="5" fill="#2a160e"/>
  <rect x="0" y="101" width="640" height="22" fill="#000" opacity="0.28"/>
  <!-- little paintings -->
  <g>
    <rect x="236" y="72" width="44" height="21" fill="#d9a83e"/>
    <rect x="240" y="75" width="36" height="15" fill="#6aa6d8"/>
    <path d="M240 90 L254 80 L262 86 L270 79 L276 84 V90 Z" fill="#3f6b3a"/>
    <rect x="392" y="72" width="34" height="21" fill="#d9a83e"/>
    <rect x="396" y="75" width="26" height="15" fill="#6b4a8a"/>
    <circle cx="409" cy="82" r="4" fill="#ffe08a"/>
  </g>

  <!-- lamp and its warm pool of light -->
  <ellipse cx="412" cy="150" rx="130" ry="105" fill="url(#lampPool)"/>
  <ellipse cx="412" cy="152" rx="16" ry="5" fill="#000" opacity="0.4"/>
  <rect x="409" y="112" width="6" height="38" fill="#c9a45c"/>
  <path d="M396 96 H428 L436 120 H388 Z" fill="#fff1c8"/>
  <ellipse cx="412" cy="120" rx="24" ry="5" fill="#fff8e0"/>

  <!-- display case (empty now!) -->
  <ellipse cx="322" cy="214" rx="42" ry="9" fill="#000" opacity="0.4"/>
  <rect x="290" y="168" width="64" height="44" rx="3" fill="#3d2a26"/>
  <rect x="290" y="160" width="64" height="20" fill="#5e403a"/>
  <rect x="290" y="178" width="64" height="2.5" fill="#e2bb5c"/>
  <ellipse cx="322" cy="166" rx="18" ry="6" fill="#6a1424"/>
  <rect x="292" y="112" width="60" height="62" fill="url(#glass)" stroke="#e0f2ff" stroke-opacity="0.75" stroke-width="2"/>
  <path d="M298 116 H310 L298 146 Z" fill="#fff" opacity="0.4"/>
  <rect x="306" y="196" width="32" height="9" rx="2" fill="#e2bb5c"/>

  <!-- the guard's flashlight beam (pointing the wrong way) -->
  <path d="M440 270 L232 360 L420 360 Z" fill="url(#beam)"/>
  <path d="M440 270 L232 360 M440 270 L420 360" stroke="#fff0b0" stroke-opacity="0.5" stroke-width="2"/>

  <!-- red laser gate -->
  <g>
    <rect x="0" y="318" width="10" height="34" fill="#2a2f36"/>
    <rect x="128" y="318" width="10" height="34" fill="#2a2f36"/>
    <path d="M8 326 H130 M8 344 H130" stroke="#ff2846" stroke-opacity="0.35" stroke-width="9" stroke-linecap="round"/>
    <path d="M8 326 H130 M8 344 H130" stroke="#ff5a6e" stroke-width="3" stroke-linecap="round"/>
    <path d="M8 326 H130 M8 344 H130" stroke="#ffe6ea" stroke-width="1"/>
  </g>

  <!-- ===== the bulldog guard ===== -->
  <ellipse cx="520" cy="300" rx="52" ry="11" fill="#000" opacity="0.45"/>
  <ellipse cx="500" cy="288" rx="16" ry="14" fill="#1b284f"/>
  <ellipse cx="540" cy="288" rx="16" ry="14" fill="#1b284f"/>
  <rect x="470" y="200" width="100" height="92" rx="34" fill="url(#navy)"/>
  <g clip-path="url(#dogBodyClip)">
    <rect x="470" y="262" width="100" height="10" fill="#15182a"/>
    <rect x="512" y="262" width="16" height="10" fill="#e2bb5c"/>
  </g>
  <path d="M500 222 l4 9 9 1 -7 6 2 9 -8 -5 -8 5 2 -9 -7 -6 9 -1 Z" fill="#e2bb5c"/>
  <path d="M520 204 l6 16 -6 18 -6 -18 Z" fill="#c2333d"/>
  <!-- arm + flashlight -->
  <ellipse cx="572" cy="240" rx="13" ry="22" fill="#2c3f78"/>
  <circle cx="574" cy="262" r="11" fill="#f5dcb8"/>
  <path d="M482 222 Q466 240 458 258" stroke="#2c3f78" stroke-width="24" stroke-linecap="round" fill="none"/>
  <g transform="translate(452 264) rotate(155)">
    <rect x="-14" y="-9" width="38" height="18" rx="5" fill="#3a3f48"/>
    <rect x="-22" y="-12" width="12" height="24" rx="3" fill="#6a717c"/>
    <rect x="-24" y="-10" width="4" height="20" fill="#fff6c8"/>
  </g>
  <circle cx="462" cy="256" r="11" fill="#f5dcb8"/>
  <!-- head -->
  <ellipse cx="474" cy="162" rx="15" ry="24" fill="#a8703c" transform="rotate(-20 474 162)"/>
  <ellipse cx="566" cy="162" rx="15" ry="24" fill="#a8703c" transform="rotate(20 566 162)"/>
  <ellipse cx="520" cy="158" rx="50" ry="42" fill="url(#dogHead)"/>
  <ellipse cx="500" cy="178" rx="22" ry="17" fill="#f5dcb8"/>
  <ellipse cx="536" cy="178" rx="22" ry="17" fill="#f5dcb8"/>
  <ellipse cx="516" cy="166" rx="13" ry="8.5" fill="#2a1d14"/>
  <ellipse cx="512" cy="163" rx="4" ry="2" fill="#fff" opacity="0.6"/>
  <circle cx="500" cy="146" r="8" fill="#fff"/>
  <circle cx="536" cy="146" r="8" fill="#fff"/>
  <circle cx="496" cy="147" r="5" fill="#1d1a17"/>
  <circle cx="532" cy="147" r="5" fill="#1d1a17"/>
  <circle cx="494" cy="145" r="1.6" fill="#fff"/>
  <circle cx="530" cy="145" r="1.6" fill="#fff"/>
  <path d="M488 132 L508 130" stroke="#5a3a1e" stroke-width="5" stroke-linecap="round"/>
  <path d="M526 126 L546 134" stroke="#5a3a1e" stroke-width="5" stroke-linecap="round"/>
  <path d="M506 190 Q516 186 526 190" stroke="#5a3a1e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- cap -->
  <path d="M474 128 Q520 76 566 128 Z" fill="#1b284f"/>
  <rect x="472" y="122" width="96" height="12" rx="4" fill="#2c3f78"/>
  <path d="M478 132 Q508 148 548 134 L546 128 Q510 136 478 126 Z" fill="#10131f"/>
  <circle cx="520" cy="110" r="7" fill="#e2bb5c"/>
  <!-- question bubble -->
  <g>
    <circle cx="590" cy="74" r="25" fill="#000" opacity="0.35"/>
    <circle cx="588" cy="70" r="25" fill="#fff3c4" stroke="#7a5a10" stroke-width="4"/>
    <path d="M588 70 L588 45 A25 25 0 0 1 612 76 Z" fill="#ffb627"/>
    <path d="M580 92 L588 104 L594 92 Z" fill="#fff3c4"/>
    <text x="588" y="82" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-weight="900" font-size="34" fill="#5a3a00">?</text>
  </g>

  <!-- ===== the cat burglar ===== -->
  <ellipse cx="172" cy="300" rx="46" ry="10" fill="#000" opacity="0.45"/>
  <!-- tail -->
  <path d="M146 262 C108 258 92 220 112 182" stroke="#f0954a" stroke-width="15" stroke-linecap="round" fill="none"/>
  <path d="M112 186 L108 172" stroke="#c96a2a" stroke-width="15" stroke-linecap="round"/>
  <!-- loot sack -->
  <ellipse cx="124" cy="226" rx="32" ry="34" fill="url(#sack)"/>
  <ellipse cx="112" cy="212" rx="10" ry="7" fill="#fff" opacity="0.2"/>
  <ellipse cx="132" cy="194" rx="11" ry="6" fill="#7a5530"/>
  <text x="122" y="240" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-weight="900" font-size="24" fill="#6a4520">$</text>
  <!-- tiptoe legs -->
  <ellipse cx="150" cy="286" rx="13" ry="16" fill="#2b2940" transform="rotate(25 150 286)"/>
  <ellipse cx="196" cy="290" rx="13" ry="16" fill="#2b2940" transform="rotate(-20 196 290)"/>
  <ellipse cx="142" cy="298" rx="12" ry="6" fill="#ffe2c4"/>
  <ellipse cx="204" cy="300" rx="12" ry="6" fill="#ffe2c4"/>
  <!-- striped shirt -->
  <rect x="137" y="204" width="68" height="78" rx="26" fill="#f4f1ea"/>
  <g clip-path="url(#shirtClip)" fill="#24222e">
    <rect x="130" y="214" width="80" height="8"/>
    <rect x="130" y="232" width="80" height="8"/>
    <rect x="130" y="250" width="80" height="8"/>
    <rect x="130" y="268" width="80" height="8"/>
    <rect x="170" y="200" width="40" height="90" fill="#000" opacity="0.15"/>
  </g>
  <rect x="140" y="198" width="62" height="13" rx="6" fill="#d6334a"/>
  <!-- arm holding the gem up high -->
  <path d="M198 226 Q222 212 232 182" stroke="#f4f1ea" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M212 216 L222 206" stroke="#24222e" stroke-width="5"/>
  <circle cx="234" cy="176" r="12" fill="#ffe2c4"/>
  <!-- other paw: shhh! -->
  <path d="M144 226 Q130 210 150 186" stroke="#f4f1ea" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- the stolen-back gem -->
  <circle cx="242" cy="146" r="46" fill="url(#gemGlow)"/>
  <path d="M220 140 L230 126 L254 126 L264 140 L242 168 Z" fill="#1c4fa8"/>
  <path d="M220 140 L264 140 L242 168 Z" fill="url(#gem)"/>
  <path d="M230 126 L254 126 L248 140 L236 140 Z" fill="#cfeaff"/>
  <path d="M226 140 L236 140 L240 160 Z" fill="#fff" opacity="0.6"/>
  <path d="M230 126 L233 116 L238 126 Z M246 126 L251 116 L254 126 Z" fill="#4aa3ff"/>
  <!-- head -->
  <path d="M128 132 L134 86 L160 112 Z" fill="#f0954a"/>
  <path d="M212 132 L206 86 L180 112 Z" fill="#f0954a"/>
  <path d="M134 124 L137 98 L152 113 Z" fill="#ff9fb0"/>
  <path d="M206 124 L203 98 L188 113 Z" fill="#ff9fb0"/>
  <ellipse cx="170" cy="146" rx="48" ry="42" fill="url(#catHead)"/>
  <path d="M166 106 h8 v14 h-8 Z M150 110 h7 v11 h-7 Z M183 110 h7 v11 h-7 Z" fill="#c96a2a"/>
  <ellipse cx="174" cy="168" rx="26" ry="17" fill="#ffe2c4"/>
  <!-- domino mask -->
  <path d="M126 140 Q172 122 218 140 L215 156 Q172 146 129 156 Z" fill="#1b1a24"/>
  <circle cx="153" cy="144" r="10" fill="#fff"/>
  <circle cx="193" cy="144" r="10" fill="#fff"/>
  <circle cx="157" cy="145" r="6.5" fill="#1d1a17"/>
  <circle cx="197" cy="145" r="6.5" fill="#1d1a17"/>
  <circle cx="159" cy="142" r="2.4" fill="#fff"/>
  <circle cx="199" cy="142" r="2.4" fill="#fff"/>
  <!-- nose, sly smile, whiskers -->
  <path d="M168 160 h12 l-6 6 Z" fill="#ff6f8a"/>
  <path d="M164 172 Q169 178 174 170 Q179 178 186 171" stroke="#6a3a1a" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M150 166 L118 160 M150 172 L118 176 M198 166 L230 160 M198 172 L230 176" stroke="#fff" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round"/>
  <!-- shush paw in front of the smile -->
  <circle cx="152" cy="182" r="12" fill="#ffe2c4"/>
  <path d="M152 170 v-12" stroke="#ffe2c4" stroke-width="7" stroke-linecap="round"/>

  <!-- sparkles -->
  <g fill="#fff">
    <path d="M276 104 q0 10 10 10 q-10 0 -10 10 q0 -10 -10 -10 q10 0 10 -10z"/>
    <path d="M208 110 q0 6 6 6 q-6 0 -6 6 q0 -6 -6 -6 q6 0 6 -6z" opacity="0.85"/>
    <path d="M268 176 q0 5 5 5 q-5 0 -5 5 q0 -5 -5 -5 q5 0 5 -5z" opacity="0.7"/>
  </g>

  <rect width="640" height="360" fill="url(#vignette)"/>

  <!-- logo badge -->
  <g>
    <rect x="16" y="14" width="214" height="50" rx="14" fill="#1b1930" stroke="#ffc94a" stroke-width="3"/>
    <text x="123" y="50" text-anchor="middle" font-family="'Trebuchet MS', 'Arial Black', Arial, sans-serif" font-weight="900" font-size="28" fill="#7a4f0a">SHADOW HEIST</text>
    <text x="123" y="47" text-anchor="middle" font-family="'Trebuchet MS', 'Arial Black', Arial, sans-serif" font-weight="900" font-size="28" fill="#ffc94a">SHADOW HEIST</text>
  </g>
</svg>
