<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Slice Squad game card: a watermelon sliced in two by a glowing swoosh, with fruit flying around -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6638"/>
      <stop offset="1" stop-color="#5a3418"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="48%" r="70%">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="melonflesh" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ff9cae"/>
      <stop offset="1" stop-color="#ef3b5d"/>
    </radialGradient>
    <radialGradient id="orangeskin" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset="0.55" stop-color="#ff922b"/>
      <stop offset="1" stop-color="#c25200"/>
    </radialGradient>
    <radialGradient id="appleskin" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ff8a8a"/>
      <stop offset="0.55" stop-color="#e03131"/>
      <stop offset="1" stop-color="#8f1313"/>
    </radialGradient>
    <radialGradient id="bomb" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#6b7a99"/>
      <stop offset="0.5" stop-color="#2b3350"/>
      <stop offset="1" stop-color="#0c0f1c"/>
    </radialGradient>
    <radialGradient id="kiwiflesh" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f2ffd6"/>
      <stop offset="0.4" stop-color="#b6e35a"/>
      <stop offset="1" stop-color="#62a02a"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b4dcff" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#d8f0ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="bamboo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f7d20"/>
      <stop offset="0.45" stop-color="#9be15d"/>
      <stop offset="1" stop-color="#2b5e12"/>
    </linearGradient>
  </defs>

  <!-- wooden dojo wall -->
  <rect width="640" height="360" fill="url(#wood)"/>
  <g stroke="#2a1405" stroke-opacity="0.5" stroke-width="3">
    <line x1="90" y1="0" x2="90" y2="360"/><line x1="180" y1="0" x2="180" y2="360"/><line x1="270" y1="0" x2="270" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/><line x1="450" y1="0" x2="450" y2="360"/><line x1="540" y1="0" x2="540" y2="360"/>
  </g>
  <g fill="none" stroke="#2a1405" stroke-opacity="0.18" stroke-width="2">
    <path d="M120 0 Q126 90 118 180 T124 360"/><path d="M220 0 Q214 100 222 200 T216 360"/><path d="M310 0 Q318 80 308 190 T314 360"/>
    <path d="M410 0 Q404 120 414 220 T406 360"/><path d="M500 0 Q508 100 498 200 T506 360"/><path d="M590 0 Q584 90 594 190 T586 360"/>
  </g>
  <!-- bamboo -->
  <g>
    <rect x="14" y="0" width="20" height="360" fill="url(#bamboo)"/>
    <rect x="46" y="0" width="15" height="360" fill="url(#bamboo)"/>
    <rect x="606" y="0" width="20" height="360" fill="url(#bamboo)"/>
    <rect x="580" y="0" width="15" height="360" fill="url(#bamboo)"/>
    <g fill="#2b5e12"><rect x="11" y="70" width="26" height="6"/><rect x="11" y="200" width="26" height="6"/><rect x="43" y="130" width="21" height="6"/><rect x="43" y="270" width="21" height="6"/>
      <rect x="603" y="90" width="26" height="6"/><rect x="603" y="230" width="26" height="6"/><rect x="577" y="40" width="21" height="6"/><rect x="577" y="170" width="21" height="6"/></g>
    <g fill="#4caf50"><ellipse cx="66" cy="84" rx="26" ry="7" transform="rotate(-25 66 84)"/><ellipse cx="72" cy="146" rx="24" ry="6" transform="rotate(-30 72 146)"/>
      <ellipse cx="574" cy="104" rx="26" ry="7" transform="rotate(25 574 104)"/><ellipse cx="568" cy="184" rx="24" ry="6" transform="rotate(30 568 184)"/></g>
  </g>

  <!-- juice splats on the wall -->
  <g fill="#ff4d6d" opacity="0.55">
    <circle cx="300" cy="196" r="34"/><circle cx="268" cy="176" r="18"/><circle cx="338" cy="214" r="20"/><circle cx="244" cy="226" r="8"/><circle cx="362" cy="168" r="9"/><circle cx="352" cy="246" r="6"/>
  </g>
  <g fill="#ffa94d" opacity="0.5"><circle cx="500" cy="110" r="22"/><circle cx="520" cy="92" r="10"/><circle cx="478" cy="128" r="7"/></g>

  <!-- the swoosh -->
  <path d="M120 300 Q260 220 520 70" fill="none" stroke="#9fd3ff" stroke-opacity="0.35" stroke-width="26" stroke-linecap="round"/>
  <path d="M120 300 Q260 220 520 70" fill="none" stroke="url(#blade)" stroke-width="9" stroke-linecap="round"/>

  <!-- watermelon halves flying apart -->
  <g transform="translate(262 168) rotate(-28)">
    <path d="M-62 0 A62 62 0 0 1 62 0 Z" fill="#2f9e44" stroke="#0b4219" stroke-width="3"/>
    <path d="M-56 0 A56 56 0 0 1 56 0 Z" fill="#e9fbd8"/>
    <path d="M-50 0 A50 50 0 0 1 50 0 Z" fill="url(#melonflesh)"/>
    <g fill="#2b1a12"><ellipse cx="-24" cy="-18" rx="3" ry="5"/><ellipse cx="0" cy="-30" rx="3" ry="5"/><ellipse cx="24" cy="-18" rx="3" ry="5"/><ellipse cx="-10" cy="-12" rx="3" ry="5"/><ellipse cx="12" cy="-10" rx="3" ry="5"/></g>
    <path d="M-34 -24 A40 40 0 0 1 -12 -38" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(318 214) rotate(152)">
    <path d="M-62 0 A62 62 0 0 1 62 0 Z" fill="#2f9e44" stroke="#0b4219" stroke-width="3"/>
    <path d="M-56 0 A56 56 0 0 1 56 0 Z" fill="#e9fbd8"/>
    <path d="M-50 0 A50 50 0 0 1 50 0 Z" fill="url(#melonflesh)"/>
    <g fill="#2b1a12"><ellipse cx="-24" cy="-18" rx="3" ry="5"/><ellipse cx="0" cy="-30" rx="3" ry="5"/><ellipse cx="24" cy="-18" rx="3" ry="5"/><ellipse cx="-10" cy="-12" rx="3" ry="5"/></g>
  </g>
  <!-- juice drops -->
  <g fill="#ff4d6d"><circle cx="352" cy="150" r="6"/><circle cx="370" cy="132" r="4"/><circle cx="226" cy="236" r="5"/><circle cx="212" cy="214" r="3.5"/><circle cx="388" cy="176" r="3"/><circle cx="242" cy="128" r="4"/></g>

  <!-- whole orange -->
  <g transform="translate(470 220)">
    <circle r="40" fill="#000" opacity="0.2" cx="4" cy="6"/>
    <circle r="40" fill="url(#orangeskin)" stroke="#8f3c00" stroke-width="3"/>
    <circle cx="0" cy="-37" r="4" fill="#5c8f2a"/>
    <ellipse cx="9" cy="-40" rx="9" ry="3.5" fill="#4caf50" transform="rotate(-20 9 -40)"/>
    <ellipse cx="-14" cy="-16" rx="10" ry="5" fill="#fff" opacity="0.55" transform="rotate(-40 -14 -16)"/>
  </g>
  <!-- apple -->
  <g transform="translate(150 120) rotate(-14)">
    <path d="M0 -24 C22 -42 46 -20 38 8 C33 34 13 40 0 34 C-13 40 -33 34 -38 8 C-46 -20 -22 -42 0 -24 Z" fill="url(#appleskin)" stroke="#6e0d0d" stroke-width="3"/>
    <path d="M0 -24 Q1 -36 6 -42" stroke="#5a3418" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="14" cy="-36" rx="11" ry="5" fill="#51cf66" transform="rotate(-25 14 -36)"/>
    <ellipse cx="-16" cy="-10" rx="8" ry="4" fill="#fff" opacity="0.55" transform="rotate(-40 -16 -10)"/>
  </g>
  <!-- kiwi half -->
  <g transform="translate(566 300) rotate(20)">
    <path d="M-30 0 A30 30 0 0 1 30 0 Z" fill="#8b5e34" stroke="#3a240f" stroke-width="2.5"/>
    <path d="M-27 0 A27 27 0 0 1 27 0 Z" fill="url(#kiwiflesh)"/>
    <path d="M-7 0 A7 7 0 0 1 7 0 Z" fill="#fbffe8"/>
    <g fill="#1d140b"><circle cx="-11" cy="-4" r="1.6"/><circle cx="-8" cy="-9" r="1.6"/><circle cx="-2" cy="-11" r="1.6"/><circle cx="4" cy="-11" r="1.6"/><circle cx="9" cy="-8" r="1.6"/><circle cx="11" cy="-3" r="1.6"/></g>
  </g>
  <!-- bomb to avoid -->
  <g transform="translate(96 268)">
    <circle r="40" fill="#ff3c3c" opacity="0.22"/>
    <rect x="-9" y="-36" width="18" height="10" rx="3" fill="#aab4c0"/>
    <path d="M0 -34 Q10 -48 18 -42" stroke="#a0784a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle r="30" fill="url(#bomb)" stroke="#05070d" stroke-width="2.5"/>
    <ellipse cx="-11" cy="-12" rx="7" ry="4" fill="#fff" opacity="0.5" transform="rotate(-40 -11 -12)"/>
    <path d="M-18 8 A20 20 0 0 0 18 8" stroke="#ff5050" stroke-width="4" fill="none"/>
    <g stroke="#ffd23f" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="-42" x2="26" y2="-50"/><line x1="18" y1="-42" x2="28" y2="-40"/><line x1="18" y1="-42" x2="16" y2="-54"/></g>
    <circle cx="18" cy="-42" r="4" fill="#fff8d0"/>
  </g>

  <rect width="640" height="360" fill="url(#vig)"/>

  <!-- title -->
  <g font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" text-anchor="middle">
    <text x="320" y="338" font-size="62" fill="#000" opacity="0.35">Slice Squad</text>
    <text x="320" y="332" font-size="62" stroke="#3a0a14" stroke-width="10" stroke-linejoin="round" fill="none">Slice Squad</text>
    <text x="320" y="332" font-size="62" fill="#ff5d73">Slice <tspan fill="#ffd23f">Squad</tspan></text>
  </g>
</svg>
