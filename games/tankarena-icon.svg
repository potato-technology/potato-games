      <stop offset="1" stop-color="#4f9a24"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7db4ff"/>
      <stop offset="1" stop-color="#2a62c0"/>
    </linearGradient>
    <radialGradient id="tur" cx="40%" cy="35%" r="70%">
