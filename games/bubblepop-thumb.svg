<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Bubble Pop game card: a wall of shiny bubbles, a cannon aiming up and a bubble popping -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fb2f2"/>
      <stop offset="0.65" stop-color="#bfe8ff"/>
      <stop offset="1" stop-color="#e8f8ff"/>
    </linearGradient>
    <radialGradient id="r" cx="32%" cy="28%" r="75%"><stop offset="0" stop-color="#ffd0d5"/><stop offset="0.35" stop-color="#ff7a86"/><stop offset="0.8" stop-color="#ff4d5e"/><stop offset="1" stop-color="#b8202f"/></radialGradient>
    <radialGradient id="y" cx="32%" cy="28%" r="75%"><stop offset="0" stop-color="#fff6c8"/><stop offset="0.35" stop-color="#ffdd6a"/><stop offset="0.8" stop-color="#ffc928"/><stop offset="1" stop-color="#b88a00"/></radialGradient>
    <radialGradient id="g" cx="32%" cy="28%" r="75%"><stop offset="0" stop-color="#d4ffe0"/><stop offset="0.35" stop-color="#7ae69a"/><stop offset="0.8" stop-color="#3fd16b"/><stop offset="1" stop-color="#1f8a40"/></radialGradient>
    <radialGradient id="b" cx="32%" cy="28%" r="75%"><stop offset="0" stop-color="#d6efff"/><stop offset="0.35" stop-color="#7cc4ff"/><stop offset="0.8" stop-color="#3ba6ff"/><stop offset="1" stop-color="#1a63b0"/></radialGradient>
    <radialGradient id="p" cx="32%" cy="28%" r="75%"><stop offset="0" stop-color="#eadcff"/><stop offset="0.35" stop-color="#c39bff"/><stop offset="0.8" stop-color="#a66bff"/><stop offset="1" stop-color="#6232b8"/></radialGradient>
    <radialGradient id="o" cx="32%" cy="28%" r="75%"><stop offset="0" stop-color="#ffe2c8"/><stop offset="0.35" stop-color="#ffae6a"/><stop offset="0.8" stop-color="#ff8a2a"/><stop offset="1" stop-color="#b85200"/></radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffe0f0"/></linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a8742a"/><stop offset="0.45" stop-color="#ffe08a"/><stop offset="1" stop-color="#8a5a1a"/></linearGradient>
    <radialGradient id="dome" cx="35%" cy="25%" r="80%"><stop offset="0" stop-color="#8b7bd8"/><stop offset="1" stop-color="#2c2266"/></radialGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#1a0a3a" stop-opacity="0.4"/></radialGradient>
    <g id="hi"><ellipse cx="-7" cy="-8" rx="7" ry="3.6" fill="#fff" opacity="0.9" transform="rotate(-38 -7 -8)"/></g>
    <g id="br"><circle r="20" fill="url(#r)"/><use href="#hi"/></g>
    <g id="by"><circle r="20" fill="url(#y)"/><use href="#hi"/></g>
    <g id="bg"><circle r="20" fill="url(#g)"/><use href="#hi"/></g>
    <g id="bb"><circle r="20" fill="url(#b)"/><use href="#hi"/></g>
    <g id="bp"><circle r="20" fill="url(#p)"/><use href="#hi"/></g>
    <g id="bo"><circle r="20" fill="url(#o)"/><use href="#hi"/></g>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="560" cy="60" r="34" fill="#fff3a8"/>
  <circle cx="560" cy="60" r="56" fill="#fff3a8" opacity="0.25"/>
  <g fill="#fff" opacity="0.9">
    <circle cx="80" cy="250" r="22"/><circle cx="108" cy="240" r="26"/><circle cx="136" cy="252" r="20"/>
    <circle cx="520" cy="200" r="18"/><circle cx="544" cy="190" r="22"/><circle cx="568" cy="202" r="16"/>
  </g>
  <path d="M0 320 Q 160 270 330 312 T 640 300 L 640 360 L 0 360 Z" fill="#7fd35a"/>
  <path d="M0 345 Q 200 310 400 340 T 640 330 L 640 360 L 0 360 Z" fill="#5fbf45"/>

  <!-- the bubble wall -->
  <g>
    <use href="#br" x="20" y="20"/><use href="#br" x="60" y="20"/><use href="#by" x="100" y="20"/><use href="#by" x="140" y="20"/><use href="#bg" x="180" y="20"/><use href="#bg" x="220" y="20"/><use href="#bb" x="260" y="20"/><use href="#bb" x="300" y="20"/><use href="#bp" x="340" y="20"/><use href="#bp" x="380" y="20"/><use href="#bo" x="420" y="20"/><use href="#bo" x="460" y="20"/><use href="#br" x="500" y="20"/><use href="#by" x="540" y="20"/><use href="#by" x="580" y="20"/><use href="#bg" x="620" y="20"/>
    <use href="#br" x="40" y="55"/><use href="#by" x="80" y="55"/><use href="#by" x="120" y="55"/><use href="#bg" x="160" y="55"/><use href="#bb" x="200" y="55"/><use href="#bb" x="240" y="55"/><use href="#bp" x="280" y="55"/><use href="#bp" x="320" y="55"/><use href="#bo" x="360" y="55"/><use href="#br" x="400" y="55"/><use href="#br" x="440" y="55"/><use href="#bg" x="480" y="55"/><use href="#bb" x="520" y="55"/><use href="#bb" x="560" y="55"/><use href="#bp" x="600" y="55"/>
    <use href="#bb" x="20" y="90"/><use href="#bb" x="60" y="90"/><use href="#bg" x="100" y="90"/><use href="#bp" x="140" y="90"/><use href="#bo" x="180" y="90"/><use href="#bo" x="220" y="90"/><use href="#br" x="260" y="90"/><use href="#by" x="300" y="90"/><use href="#bg" x="420" y="90"/><use href="#bg" x="460" y="90"/><use href="#bb" x="500" y="90"/><use href="#bo" x="540" y="90"/><use href="#bo" x="580" y="90"/><use href="#bp" x="620" y="90"/>
    <use href="#bp" x="40" y="125"/><use href="#bp" x="80" y="125"/><use href="#br" x="120" y="125"/><use href="#bb" x="160" y="125"/><use href="#bb" x="200" y="125"/><use href="#bg" x="480" y="125"/><use href="#by" x="520" y="125"/><use href="#by" x="560" y="125"/><use href="#bo" x="600" y="125"/>
  </g>
  <!-- a little chick trapped in a bubble -->
  <g transform="translate(240 125)">
    <circle r="20" fill="url(#y)"/>
    <circle cx="0" cy="2" r="11" fill="#fff6b0" stroke="#e0a400"/>
    <circle cx="-4" cy="0" r="1.8" fill="#1a1020"/><circle cx="4" cy="0" r="1.8" fill="#1a1020"/>
    <path d="M -2.5 4 L 2.5 4 L 0 7.5 Z" fill="#ff8a2a"/>
    <use href="#hi"/>
  </g>
  <!-- popping burst -->
  <g transform="translate(360 102)">
    <circle r="28" fill="none" stroke="#fff" stroke-width="4" opacity="0.85"/>
    <circle r="40" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
    <g fill="#c39bff">
      <circle cx="-34" cy="-12" r="6"/><circle cx="30" cy="-22" r="5"/><circle cx="36" cy="14" r="6"/><circle cx="-26" cy="24" r="5"/><circle cx="4" cy="-40" r="5"/><circle cx="2" cy="38" r="4"/>
    </g>
    <g fill="#fff">
      <path d="M -50 -2 l 6 -2 l -6 -2 l 2 -6 l -4 4 z"/>
    </g>
  </g>
  <!-- aim guide -->
  <g fill="#ff4d5e">
    <circle cx="350" cy="296" r="4"/><circle cx="354" cy="276" r="4"/><circle cx="358" cy="256" r="4"/><circle cx="362" cy="236" r="4"/><circle cx="366" cy="216" r="4"/><circle cx="370" cy="196" r="4"/><circle cx="374" cy="176" r="4"/><circle cx="378" cy="156" r="4"/>
  </g>
  <!-- cannon -->
  <g transform="translate(340 352)">
    <ellipse cx="0" cy="6" rx="70" ry="10" fill="#000" opacity="0.25"/>
    <g transform="rotate(12)"><rect x="-15" y="-74" width="30" height="66" rx="8" fill="url(#brass)"/><rect x="-19" y="-78" width="38" height="12" rx="5" fill="#e0b050"/></g>
    <path d="M -46 4 L -46 -20 A 46 46 0 0 1 46 -20 L 46 4 Z" fill="url(#dome)" stroke="#ffd43b" stroke-width="3"/>
    <circle cx="-24" cy="-10" r="5" fill="#ffd43b"/><circle cx="24" cy="-10" r="5" fill="#ffd43b"/>
  </g>
  <use href="#br" x="350" y="300"/>

  <rect width="640" height="360" fill="url(#vig)"/>
  <!-- title -->
  <g font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" font-size="74" stroke-linejoin="round" paint-order="stroke">
    <text x="22" y="236" stroke="#3a1060" stroke-width="10"><tspan fill="#ff4d5e">B</tspan><tspan fill="#ffc928">u</tspan><tspan fill="#3fd16b">b</tspan><tspan fill="#3ba6ff">b</tspan><tspan fill="#a66bff">l</tspan><tspan fill="#ff8a2a">e</tspan></text>
    <text x="400" y="236" fill="#ff6fb5" stroke="#3a1060" stroke-width="10">Pop!</text>
  </g>
</svg>
