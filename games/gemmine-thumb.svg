<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Gem Mine game card: a happy miner holds up a giant gem next to a mine cart full of treasure -->
  <defs>
    <radialGradient id="cave" cx="55%" cy="35%" r="80%">
      <stop offset="0" stop-color="#4a3f7a"/>
      <stop offset="0.6" stop-color="#2a2350"/>
      <stop offset="1" stop-color="#140f28"/>
    </radialGradient>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff2c0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffcf6a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cglowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a6ecff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#a6ecff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cglowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d8a6ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#d8a6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a5230"/>
      <stop offset="0.5" stop-color="#a8763f"/>
      <stop offset="1" stop-color="#5b3a1e"/>
    </linearGradient>
    <linearGradient id="beamH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8763f"/>
      <stop offset="1" stop-color="#5b3a1e"/>
    </linearGradient>
    <linearGradient id="cart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa3ae"/>
      <stop offset="0.5" stop-color="#6b7280"/>
      <stop offset="1" stop-color="#3a3f47"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e9ee"/>
      <stop offset="1" stop-color="#7d8692"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a68"/>
      <stop offset="1" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="overalls" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a8ae0"/>
      <stop offset="1" stop-color="#2f4f8a"/>
    </linearGradient>
    <radialGradient id="skin" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffd9b0"/>
      <stop offset="1" stop-color="#d99a62"/>
    </radialGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="1" stop-color="#e8a317"/>
    </linearGradient>
    <linearGradient id="amTable" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c8ff"/>
      <stop offset="0.6" stop-color="#a43be6"/>
      <stop offset="1" stop-color="#6e1fa8"/>
    </linearGradient>
    <linearGradient id="ruTable" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc2c6"/>
      <stop offset="0.6" stop-color="#ee2b3b"/>
      <stop offset="1" stop-color="#a0101e"/>
    </linearGradient>
    <linearGradient id="saTable" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cdeaff"/>
      <stop offset="0.6" stop-color="#2a7bff"/>
      <stop offset="1" stop-color="#123f9e"/>
    </linearGradient>
    <linearGradient id="emTable" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8ffdc"/>
      <stop offset="0.6" stop-color="#21c45e"/>
      <stop offset="1" stop-color="#0c7a35"/>
    </linearGradient>
    <linearGradient id="ciTable" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffbd0"/>
      <stop offset="0.6" stop-color="#ffd324"/>
      <stop offset="1" stop-color="#b88a00"/>
    </linearGradient>
    <linearGradient id="toTable" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe2bd"/>
      <stop offset="0.6" stop-color="#ff8c1a"/>
      <stop offset="1" stop-color="#b05200"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.4"/>
    </radialGradient>
    <!-- round cut gem (radius 20) -->
    <g id="ruby">
      <path d="M18.5 7.7 L7.7 18.5 L-7.7 18.5 L-18.5 7.7 L-18.5 -7.7 L-7.7 -18.5 L7.7 -18.5 L18.5 -7.7 Z" fill="#7a0a16"/>
      <path d="M18.5 7.7 L7.7 18.5 L4.3 10.4 L10.4 4.3 Z" fill="#8a0b18"/>
      <path d="M7.7 18.5 L-7.7 18.5 L-4.3 10.4 L4.3 10.4 Z" fill="#a8121f"/>
      <path d="M-7.7 18.5 L-18.5 7.7 L-10.4 4.3 L-4.3 10.4 Z" fill="#cf2030"/>
      <path d="M-18.5 7.7 L-18.5 -7.7 L-10.4 -4.3 L-10.4 4.3 Z" fill="#f2525f"/>
      <path d="M-18.5 -7.7 L-7.7 -18.5 L-4.3 -10.4 L-10.4 -4.3 Z" fill="#ff9aa2"/>
      <path d="M-7.7 -18.5 L7.7 -18.5 L4.3 -10.4 L-4.3 -10.4 Z" fill="#ff7a85"/>
      <path d="M7.7 -18.5 L18.5 -7.7 L10.4 -4.3 L4.3 -10.4 Z" fill="#ee2b3b"/>
      <path d="M18.5 -7.7 L18.5 7.7 L10.4 4.3 L10.4 -4.3 Z" fill="#c41a29"/>
      <path d="M10.4 4.3 L4.3 10.4 L-4.3 10.4 L-10.4 4.3 L-10.4 -4.3 L-4.3 -10.4 L4.3 -10.4 L10.4 -4.3 Z" fill="url(#ruTable)"/>
      <path d="M-10.4 -4.3 L-4.3 -10.4 L2 -10.4 L-10.4 2 Z" fill="#fff" opacity="0.45"/>
      <path d="M-7 -11 q0 4 4 4 q-4 0 -4 4 q0 -4 -4 -4 q4 0 4 -4z" fill="#fff"/>
    </g>
    <g id="amethyst">
      <path d="M18.5 7.7 L7.7 18.5 L-7.7 18.5 L-18.5 7.7 L-18.5 -7.7 L-7.7 -18.5 L7.7 -18.5 L18.5 -7.7 Z" fill="#470a75"/>
      <path d="M18.5 7.7 L7.7 18.5 L4.3 10.4 L10.4 4.3 Z" fill="#550d8a"/>
      <path d="M7.7 18.5 L-7.7 18.5 L-4.3 10.4 L4.3 10.4 Z" fill="#6e1fa8"/>
      <path d="M-7.7 18.5 L-18.5 7.7 L-10.4 4.3 L-4.3 10.4 Z" fill="#8a2fd0"/>
      <path d="M-18.5 7.7 L-18.5 -7.7 L-10.4 -4.3 L-10.4 4.3 Z" fill="#b866f0"/>
      <path d="M-18.5 -7.7 L-7.7 -18.5 L-4.3 -10.4 L-10.4 -4.3 Z" fill="#e3b4ff"/>
      <path d="M-7.7 -18.5 L7.7 -18.5 L4.3 -10.4 L-4.3 -10.4 Z" fill="#d08cff"/>
      <path d="M7.7 -18.5 L18.5 -7.7 L10.4 -4.3 L4.3 -10.4 Z" fill="#a43be6"/>
      <path d="M18.5 -7.7 L18.5 7.7 L10.4 4.3 L10.4 -4.3 Z" fill="#8229c4"/>
      <path d="M10.4 4.3 L4.3 10.4 L-4.3 10.4 L-10.4 4.3 L-10.4 -4.3 L-4.3 -10.4 L4.3 -10.4 L10.4 -4.3 Z" fill="url(#amTable)"/>
      <path d="M-10.4 -4.3 L-4.3 -10.4 L2 -10.4 L-10.4 2 Z" fill="#fff" opacity="0.45"/>
      <path d="M-7 -11 q0 4 4 4 q-4 0 -4 4 q0 -4 -4 -4 q4 0 4 -4z" fill="#fff"/>
    </g>
    <!-- diamond-shaped sapphire -->
    <g id="sapphire">
      <path d="M0 -22 L17 0 L0 22 L-17 0 Z" fill="#0a2b85"/>
      <path d="M0 -22 L17 0 L8.5 0 L0 -11 Z" fill="#4f95ff"/>
      <path d="M17 0 L0 22 L0 11 L8.5 0 Z" fill="#123f9e"/>
      <path d="M0 22 L-17 0 L-8.5 0 L0 11 Z" fill="#2a6ae0"/>
      <path d="M-17 0 L0 -22 L0 -11 L-8.5 0 Z" fill="#a6d2ff"/>
      <path d="M0 -11 L8.5 0 L0 11 L-8.5 0 Z" fill="url(#saTable)"/>
      <path d="M-5 -10 q0 3.5 3.5 3.5 q-3.5 0 -3.5 3.5 q0 -3.5 -3.5 -3.5 q3.5 0 3.5 -3.5z" fill="#fff"/>
    </g>
    <!-- emerald cut -->
    <g id="emerald">
      <path d="M-9 -20 L9 -20 L15 -14 L15 14 L9 20 L-9 20 L-15 14 L-15 -14 Z" fill="#085e27"/>
      <path d="M-9 -20 L9 -20 L5.4 -13.2 L-5.4 -13.2 Z" fill="#7ff0a8"/>
      <path d="M9 -20 L15 -14 L9 -9.2 L5.4 -13.2 Z" fill="#3fdc7a"/>
      <path d="M15 -14 L15 14 L9 9.2 L9 -9.2 Z" fill="#17a04a"/>
      <path d="M15 14 L9 20 L5.4 13.2 L9 9.2 Z" fill="#0c7a35"/>
      <path d="M9 20 L-9 20 L-5.4 13.2 L5.4 13.2 Z" fill="#0f8a3c"/>
      <path d="M-9 20 L-15 14 L-9 9.2 L-5.4 13.2 Z" fill="#21c45e"/>
      <path d="M-15 14 L-15 -14 L-9 -9.2 L-9 9.2 Z" fill="#5ee894"/>
      <path d="M-15 -14 L-9 -20 L-5.4 -13.2 L-9 -9.2 Z" fill="#a8ffc8"/>
      <path d="M-5.4 -13.2 L5.4 -13.2 L9 -9.2 L9 9.2 L5.4 13.2 L-5.4 13.2 L-9 9.2 L-9 -9.2 Z" fill="url(#emTable)"/>
      <path d="M-6 -11 q0 3.5 3.5 3.5 q-3.5 0 -3.5 3.5 q0 -3.5 -3.5 -3.5 q3.5 0 3.5 -3.5z" fill="#fff"/>
    </g>
    <!-- triangle citrine -->
    <g id="citrine">
      <path d="M0 -20 L19 13 L-19 13 Z" fill="#9a7400"/>
      <path d="M0 -20 L19 13 L8 6 L0 -8 Z" fill="#e8b500"/>
      <path d="M19 13 L-19 13 L-8 6 L8 6 Z" fill="#c49400"/>
      <path d="M-19 13 L0 -20 L0 -8 L-8 6 Z" fill="#fff08a"/>
      <path d="M0 -8 L8 6 L-8 6 Z" fill="url(#ciTable)"/>
      <path d="M-4 -6 q0 3 3 3 q-3 0 -3 3 q0 -3 -3 -3 q3 0 3 -3z" fill="#fff"/>
    </g>
    <!-- square topaz -->
    <g id="topaz">
      <path d="M-10 -16 L10 -16 L16 -10 L16 10 L10 16 L-10 16 L-16 10 L-16 -10 Z" fill="#9a4300"/>
      <path d="M-10 -16 L10 -16 L5 -8 L-5 -8 Z" fill="#ffb466"/>
      <path d="M16 -10 L16 10 L8 5 L8 -5 Z" fill="#d06a00"/>
      <path d="M10 16 L-10 16 L-5 8 L5 8 Z" fill="#b05200"/>
      <path d="M-16 10 L-16 -10 L-8 -5 L-8 5 Z" fill="#ffc98a"/>
      <path d="M-5 -8 L5 -8 L8 -5 L8 5 L5 8 L-5 8 L-8 5 L-8 -5 Z" fill="url(#toTable)"/>
      <path d="M-5 -6 q0 3 3 3 q-3 0 -3 3 q0 -3 -3 -3 q3 0 3 -3z" fill="#fff"/>
    </g>
  </defs>

  <!-- the cave -->
  <rect width="640" height="360" fill="url(#cave)"/>
  <g fill="#3a3168" opacity="0.7">
    <path d="M0 60 L40 40 L90 70 L70 120 L20 130 L0 110 Z"/>
    <path d="M110 0 L190 0 L170 40 L120 46 Z"/>
    <path d="M480 0 L560 0 L590 30 L530 50 L490 30 Z"/>
    <path d="M560 120 L640 100 L640 190 L590 180 Z"/>
    <path d="M0 200 L50 190 L60 240 L0 250 Z"/>
  </g>
  <g fill="#1c1638" opacity="0.6">
    <path d="M200 60 L260 50 L280 90 L230 100 Z"/>
    <path d="M380 40 L440 50 L430 90 L390 84 Z"/>
    <path d="M90 150 L130 140 L140 180 L100 186 Z"/>
  </g>

  <!-- glowing crystals in the walls -->
  <circle cx="70" cy="110" r="60" fill="url(#cglowA)"/>
  <g>
    <path d="M60 140 L70 80 L80 140 Z" fill="#7fd6ff"/><path d="M60 140 L70 80 L70 140 Z" fill="#c8f2ff"/>
    <path d="M44 146 L50 104 L62 146 Z" fill="#5ab8e6"/><path d="M44 146 L50 104 L52 146 Z" fill="#b8ecff"/>
    <path d="M78 146 L92 112 L96 146 Z" fill="#5ab8e6"/><path d="M78 146 L92 112 L88 146 Z" fill="#b8ecff"/>
  </g>
  <circle cx="584" cy="160" r="64" fill="url(#cglowB)"/>
  <g>
    <path d="M572 196 L586 126 L598 196 Z" fill="#b88cff"/><path d="M572 196 L586 126 L585 196 Z" fill="#ead6ff"/>
    <path d="M556 200 L562 150 L574 200 Z" fill="#9a66f0"/><path d="M556 200 L562 150 L564 200 Z" fill="#dcc2ff"/>
    <path d="M596 200 L612 156 L618 200 Z" fill="#9a66f0"/><path d="M596 200 L612 156 L608 200 Z" fill="#dcc2ff"/>
  </g>

  <!-- wooden mine supports -->
  <rect x="14" y="0" width="26" height="360" fill="url(#beam)"/>
  <rect x="600" y="0" width="26" height="360" fill="url(#beam)"/>
  <rect x="0" y="22" width="640" height="24" fill="url(#beamH)"/>
  <g fill="#3a2410"><circle cx="27" cy="34" r="3"/><circle cx="613" cy="34" r="3"/></g>

  <!-- hanging lantern -->
  <circle cx="330" cy="92" r="120" fill="url(#lamp)"/>
  <line x1="330" y1="46" x2="330" y2="68" stroke="#2a2a2a" stroke-width="2"/>
  <rect x="318" y="66" width="24" height="6" rx="2" fill="#5f6772"/>
  <rect x="320" y="72" width="20" height="30" rx="7" fill="#fff6d0"/>
  <circle cx="330" cy="88" r="6" fill="#ffb02e"/>
  <rect x="318" y="100" width="24" height="6" rx="2" fill="#5f6772"/>

  <!-- rails -->
  <g fill="#6b4a2a">
    <rect x="40" y="318" width="14" height="30" transform="skewX(-20)"/><rect x="110" y="318" width="14" height="30" transform="skewX(-20)"/>
    <rect x="180" y="318" width="14" height="30" transform="skewX(-20)"/><rect x="250" y="318" width="14" height="30" transform="skewX(-20)"/>
    <rect x="320" y="318" width="14" height="30" transform="skewX(-20)"/><rect x="390" y="318" width="14" height="30" transform="skewX(-20)"/>
    <rect x="460" y="318" width="14" height="30" transform="skewX(-20)"/><rect x="530" y="318" width="14" height="30" transform="skewX(-20)"/>
    <rect x="600" y="318" width="14" height="30" transform="skewX(-20)"/><rect x="670" y="318" width="14" height="30" transform="skewX(-20)"/>
  </g>
  <rect x="0" y="322" width="640" height="6" fill="url(#rail)"/>
  <rect x="0" y="340" width="640" height="7" fill="url(#rail)"/>

  <!-- mine cart full of gems -->
  <g>
    <ellipse cx="230" cy="324" rx="110" ry="8" fill="#000" opacity="0.35"/>
    <use href="#ruby" transform="translate(150 222) scale(1.15) rotate(-12)"/>
    <use href="#emerald" transform="translate(190 210) scale(1.1) rotate(10)"/>
    <use href="#citrine" transform="translate(232 214) scale(1.15) rotate(-6)"/>
    <use href="#sapphire" transform="translate(272 208) scale(1.1) rotate(14)"/>
    <use href="#topaz" transform="translate(308 222) scale(1.1) rotate(-10)"/>
    <use href="#amethyst" transform="translate(212 234) scale(1.05)"/>
    <use href="#ruby" transform="translate(256 236) scale(1) rotate(20)"/>
    <path d="M128 236 L332 236 L314 306 L146 306 Z" fill="url(#cart)"/>
    <path d="M128 236 L332 236 L330 246 L130 246 Z" fill="#c9cfd6"/>
    <g stroke="#3a3f47" stroke-width="3" opacity="0.7"><path d="M150 252 L162 300 M200 252 L204 300 M260 252 L256 300 M310 252 L298 300"/></g>
    <g fill="#d9dee6"><circle cx="142" cy="244" r="3"/><circle cx="318" cy="244" r="3"/><circle cx="160" cy="298" r="3"/><circle cx="300" cy="298" r="3"/></g>
    <circle cx="176" cy="312" r="15" fill="#2b2f36"/><circle cx="176" cy="312" r="7" fill="#9aa3ae"/>
    <circle cx="286" cy="312" r="15" fill="#2b2f36"/><circle cx="286" cy="312" r="7" fill="#9aa3ae"/>
  </g>

  <!-- rainbow gem rolling on the floor -->
  <g transform="translate(92 298)">
    <circle cx="0" cy="0" r="20" fill="#222"/>
    <path d="M0 0 L20 0 A20 20 0 0 1 10 17.3 Z" fill="#ee2b3b"/>
    <path d="M0 0 L10 17.3 A20 20 0 0 1 -10 17.3 Z" fill="#ff8c1a"/>
    <path d="M0 0 L-10 17.3 A20 20 0 0 1 -20 0 Z" fill="#ffd324"/>
    <path d="M0 0 L-20 0 A20 20 0 0 1 -10 -17.3 Z" fill="#21c45e"/>
    <path d="M0 0 L-10 -17.3 A20 20 0 0 1 10 -17.3 Z" fill="#2a7bff"/>
    <path d="M0 0 L10 -17.3 A20 20 0 0 1 20 0 Z" fill="#a43be6"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="2"/>
    <circle cx="0" cy="0" r="7" fill="#fff"/>
    <path d="M0 -12 q0 12 12 12 q-12 0 -12 12 q0 -12 -12 -12 q12 0 12 -12z" fill="#fff"/>
  </g>

  <!-- the miner -->
  <g transform="translate(450 0)">
    <ellipse cx="0" cy="326" rx="54" ry="9" fill="#000" opacity="0.35"/>
    <rect x="-24" y="268" width="20" height="54" rx="7" fill="#2f4f8a"/>
    <rect x="4" y="268" width="20" height="54" rx="7" fill="#2f4f8a"/>
    <rect x="-29" y="314" width="28" height="12" rx="5" fill="#4a2f18"/>
    <rect x="1" y="314" width="28" height="12" rx="5" fill="#4a2f18"/>
    <rect x="-38" y="186" width="76" height="92" rx="24" fill="url(#shirt)"/>
    <rect x="-30" y="216" width="60" height="62" rx="10" fill="url(#overalls)"/>
    <rect x="-27" y="186" width="9" height="34" fill="#2f4f8a"/><rect x="18" y="186" width="9" height="34" fill="#2f4f8a"/>
    <circle cx="-22" cy="216" r="4" fill="#ffd43b"/><circle cx="22" cy="216" r="4" fill="#ffd43b"/>
    <rect x="-11" y="230" width="22" height="16" rx="4" fill="#ffd43b"/>
    <!-- arms up holding the gem -->
    <path d="M-34 200 Q-58 160 -44 106" fill="none" stroke="url(#shirt)" stroke-width="20" stroke-linecap="round"/>
    <path d="M34 200 Q58 160 44 106" fill="none" stroke="url(#shirt)" stroke-width="20" stroke-linecap="round"/>
    <!-- head -->
    <rect x="-9" y="166" width="18" height="22" rx="6" fill="#d9a066"/>
    <circle cx="0" cy="146" r="34" fill="url(#skin)"/>
    <circle cx="-13" cy="146" r="5" fill="#2a1a10"/><circle cx="13" cy="146" r="5" fill="#2a1a10"/>
    <circle cx="-11" cy="144" r="1.8" fill="#fff"/><circle cx="15" cy="144" r="1.8" fill="#fff"/>
    <circle cx="-22" cy="160" r="6" fill="#ff8f8f" opacity="0.4"/><circle cx="22" cy="160" r="6" fill="#ff8f8f" opacity="0.4"/>
    <path d="M-12 160 Q0 178 12 160 Z" fill="#7a2a1e"/>
    <rect x="-7" y="160" width="14" height="4" rx="1.5" fill="#fff"/>
    <!-- hard hat with lamp -->
    <path d="M-38 128 A38 32 0 0 1 38 128 Z" fill="url(#hat)"/>
    <rect x="-46" y="124" width="92" height="10" rx="4" fill="#d18f12"/>
    <ellipse cx="-12" cy="108" rx="13" ry="5" fill="#fff" opacity="0.35" transform="rotate(-15 -12 108)"/>
    <circle cx="0" cy="110" r="10" fill="#9aa3ae"/>
    <circle cx="0" cy="110" r="7" fill="#fffbe0"/>
    <!-- the big gem -->
    <circle cx="0" cy="56" r="70" fill="url(#cglowB)"/>
    <use href="#amethyst" transform="translate(0 54) scale(2.5)"/>
    <circle cx="-44" cy="102" r="11" fill="url(#skin)"/>
    <circle cx="44" cy="102" r="11" fill="url(#skin)"/>
  </g>

  <!-- sparkles -->
  <g fill="#fff">
    <path d="M500 40 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z"/>
    <path d="M386 90 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" opacity="0.8"/>
    <path d="M196 170 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" opacity="0.9"/>
    <path d="M300 180 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z" opacity="0.8"/>
  </g>

  <!-- title sign -->
  <g transform="translate(60 62) rotate(-4)">
    <rect width="176" height="56" rx="14" fill="#3e1a73"/>
    <rect y="-4" width="176" height="56" rx="14" fill="#b47cff"/>
    <rect x="6" y="2" width="164" height="8" rx="4" fill="#fff" opacity="0.25"/>
    <text x="88" y="33" text-anchor="middle" font-family="'Arial Rounded MT Bold', 'Trebuchet MS', Arial, sans-serif" font-weight="900" font-size="30" fill="#fff">GEM MINE</text>
  </g>

  <rect width="640" height="360" fill="url(#vignette)"/>
</svg>
