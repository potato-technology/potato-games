<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Merge Mania game card: two eggs slide together on a wooden board and burst into a baby dragon, with a chick and a bluebird nearby, under a sunny sky -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc0ff"/>
      <stop offset="0.7" stop-color="#cdeeff"/>
      <stop offset="1" stop-color="#eefaff"/>
    </linearGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6ea80"/>
      <stop offset="1" stop-color="#6fcf5a"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dba264"/>
      <stop offset="1" stop-color="#a8692f"/>
    </linearGradient>
    <linearGradient id="tileCream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#eadcc0"/>
    </linearGradient>
    <linearGradient id="tileYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7c8"/>
      <stop offset="1" stop-color="#f2dc7c"/>
    </linearGradient>
    <linearGradient id="tileBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f3ff"/>
      <stop offset="1" stop-color="#a9d2f5"/>
    </linearGradient>
    <linearGradient id="tileGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaffd2"/>
      <stop offset="1" stop-color="#b6e88a"/>
    </linearGradient>
    <radialGradient id="egg" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#fff3de"/>
      <stop offset="1" stop-color="#dcc29a"/>
    </radialGradient>
    <radialGradient id="dragon" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#b6f29e"/>
      <stop offset="0.6" stop-color="#7fdc6a"/>
      <stop offset="1" stop-color="#3a9a3a"/>
    </radialGradient>
    <radialGradient id="chick" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff2a0"/>
      <stop offset="0.6" stop-color="#ffd84a"/>
      <stop offset="1" stop-color="#e0a400"/>
    </radialGradient>
    <radialGradient id="blue" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#a6d4ff"/>
      <stop offset="0.6" stop-color="#58a8ff"/>
      <stop offset="1" stop-color="#2f6fd0"/>
    </radialGradient>
    <radialGradient id="burst" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6b0" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffd43b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd43b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6b0"/>
      <stop offset="0.4" stop-color="#ffe680" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffe680" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- sky, sun, clouds, hills -->
  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="560" cy="58" r="80" fill="url(#sun)"/>
  <circle cx="560" cy="58" r="30" fill="#fff3a0"/>
  <g fill="#ffffff" opacity="0.95">
    <ellipse cx="90" cy="70" rx="56" ry="20"/><ellipse cx="60" cy="78" rx="30" ry="15"/><ellipse cx="118" cy="62" rx="32" ry="20"/>
    <ellipse cx="420" cy="40" rx="44" ry="15"/><ellipse cx="446" cy="32" rx="26" ry="15"/>
  </g>
  <path d="M0 280 Q 120 240 240 270 T 480 262 T 640 250 V360 H0 Z" fill="url(#hillA)"/>
  <path d="M0 320 Q 160 290 320 315 T 640 300 V360 H0 Z" fill="#62c24e"/>
  <g>
    <circle cx="40" cy="330" r="4" fill="#ff7aa8"/><circle cx="90" cy="342" r="4" fill="#ffe066"/><circle cx="600" cy="326" r="4" fill="#ffffff"/><circle cx="560" cy="344" r="4" fill="#ff7aa8"/>
  </g>

  <!-- the board -->
  <g transform="translate(330 196) rotate(-6)" filter="url(#shadow)">
    <rect x="-150" y="-110" width="300" height="230" rx="22" fill="url(#wood)" stroke="#7a4a1e" stroke-width="5"/>
    <g fill="#7a4a24" fill-opacity="0.28">
      <rect x="-136" y="-96" width="62" height="62" rx="11"/><rect x="-66" y="-96" width="62" height="62" rx="11"/><rect x="4" y="-96" width="62" height="62" rx="11"/><rect x="74" y="-96" width="62" height="62" rx="11"/>
      <rect x="-136" y="-26" width="62" height="62" rx="11"/><rect x="-66" y="-26" width="62" height="62" rx="11"/><rect x="4" y="-26" width="62" height="62" rx="11"/><rect x="74" y="-26" width="62" height="62" rx="11"/>
      <rect x="-136" y="44" width="62" height="62" rx="11"/><rect x="-66" y="44" width="62" height="62" rx="11"/><rect x="4" y="44" width="62" height="62" rx="11"/><rect x="74" y="44" width="62" height="62" rx="11"/>
    </g>
    <!-- egg tile -->
    <g transform="translate(-105 75)">
      <rect x="-31" y="-31" width="62" height="62" rx="11" fill="url(#tileCream)" stroke="#c9a777" stroke-width="2"/>
      <path d="M0 -20 C 14 -20 18 4 17 8 C 16 17 8 20 0 20 C -8 20 -16 17 -17 8 C -18 4 -14 -20 0 -20 Z" fill="url(#egg)" stroke="#a8875a" stroke-width="2"/>
    </g>
    <!-- bluebird tile -->
    <g transform="translate(105 -65)">
      <rect x="-31" y="-31" width="62" height="62" rx="11" fill="url(#tileBlue)" stroke="#6aa0cf" stroke-width="2"/>
      <circle cx="0" cy="2" r="17" fill="url(#blue)" stroke="#1f4f9a" stroke-width="2"/>
      <ellipse cx="0" cy="8" rx="10" ry="8" fill="#e4f2ff"/>
      <circle cx="-6" cy="-3" r="3" fill="#2a1a14"/><circle cx="6" cy="-3" r="3" fill="#2a1a14"/>
      <circle cx="-5" cy="-4" r="1.1" fill="#fff"/><circle cx="7" cy="-4" r="1.1" fill="#fff"/>
      <path d="M-3.5 1 L3.5 1 L0 6 Z" fill="#ffb02e"/>
    </g>
    <!-- chick tile -->
    <g transform="translate(-35 -65)">
      <rect x="-31" y="-31" width="62" height="62" rx="11" fill="url(#tileYellow)" stroke="#d4b040" stroke-width="2"/>
      <circle cx="0" cy="2" r="17" fill="url(#chick)" stroke="#a87a00" stroke-width="2"/>
      <path d="M0 -15 Q -3 -23 2 -24 M0 -15 Q 4 -21 7 -20" stroke="#ffc400" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="-6" cy="-2" r="3" fill="#2a1a14"/><circle cx="6" cy="-2" r="3" fill="#2a1a14"/>
      <circle cx="-5" cy="-3" r="1.1" fill="#fff"/><circle cx="7" cy="-3" r="1.1" fill="#fff"/>
      <path d="M-3.5 2 L3.5 2 L0 7 Z" fill="#ff9a1f"/>
      <ellipse cx="-11" cy="5" rx="3" ry="2" fill="#ff8aa0" opacity="0.6"/><ellipse cx="11" cy="5" rx="3" ry="2" fill="#ff8aa0" opacity="0.6"/>
    </g>
  </g>

  <!-- merge burst with the baby dragon popping out -->
  <circle cx="318" cy="222" r="95" fill="url(#burst)"/>
  <g fill="#ffd43b" opacity="0.8">
    <path d="M318 112 L326 200 L318 210 L310 200 Z"/>
    <path d="M428 222 L340 230 L330 222 L340 214 Z"/>
    <path d="M208 222 L296 214 L306 222 L296 230 Z"/>
    <path d="M396 144 L336 206 L326 204 L330 194 Z"/>
    <path d="M240 144 L306 194 L310 204 L300 206 Z"/>
  </g>
  <!-- two eggs flying in -->
  <g opacity="0.85">
    <path d="M210 236 C 222 236 226 254 225 258 C 224 266 218 268 210 268 C 202 268 196 266 195 258 C 194 254 198 236 210 236 Z" fill="url(#egg)" stroke="#a8875a" stroke-width="2"/>
    <path d="M168 252 h20 M160 244 h18 M164 262 h16" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M426 236 C 438 236 442 254 441 258 C 440 266 434 268 426 268 C 418 268 412 266 411 258 C 410 254 414 236 426 236 Z" fill="url(#egg)" stroke="#a8875a" stroke-width="2"/>
    <path d="M452 252 h20 M460 244 h18 M456 262 h16" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>
  <g transform="translate(318 222)" filter="url(#shadow)">
    <rect x="-52" y="-52" width="104" height="104" rx="18" fill="url(#tileGreen)" stroke="#ffd43b" stroke-width="5"/>
    <!-- wings -->
    <path d="M-14 -8 Q -26 -34 -44 -30 Q -38 -20 -42 -12 Q -32 -10 -34 -2 Q -24 -4 -14 6 Z" fill="#9fe090" stroke="#2f7a2f" stroke-width="2"/>
    <path d="M14 -8 Q 26 -34 44 -30 Q 38 -20 42 -12 Q 32 -10 34 -2 Q 24 -4 14 6 Z" fill="#9fe090" stroke="#2f7a2f" stroke-width="2"/>
    <!-- tail -->
    <path d="M14 22 Q 36 30 34 12" stroke="#3a9a3a" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="2" r="28" fill="url(#dragon)" stroke="#2f7a2f" stroke-width="2.5"/>
    <ellipse cx="0" cy="12" rx="15" ry="14" fill="#eef7a6"/>
    <path d="M-14 -20 L-21 -38 L-7 -24 Z M14 -20 L21 -38 L7 -24 Z" fill="#fff3d6" stroke="#9a7a40" stroke-width="1.2"/>
    <ellipse cx="0" cy="0" rx="13" ry="8" fill="#a8ec8c"/>
    <circle cx="-4" cy="-1" r="1.6" fill="#2f7a2f"/><circle cx="4" cy="-1" r="1.6" fill="#2f7a2f"/>
    <circle cx="-12" cy="-11" r="6" fill="#2a1a14"/><circle cx="12" cy="-11" r="6" fill="#2a1a14"/>
    <circle cx="-10" cy="-13" r="2.3" fill="#fff"/><circle cx="14" cy="-13" r="2.3" fill="#fff"/>
    <path d="M-5 4 Q 0 9 5 4" stroke="#2a1a14" stroke-width="2" fill="none" stroke-linecap="round"/>
    <ellipse cx="-20" cy="-2" rx="5" ry="3" fill="#ff8aa0" opacity="0.6"/><ellipse cx="20" cy="-2" rx="5" ry="3" fill="#ff8aa0" opacity="0.6"/>
    <rect x="-20" y="32" width="40" height="15" rx="7.5" fill="#503214" fill-opacity="0.6"/>
    <text x="0" y="44" font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" font-size="14" fill="#fff" text-anchor="middle">512</text>
  </g>
  <!-- sparkles -->
  <g fill="#ffffff">
    <path d="M250 150 q 3 9 12 12 q -9 3 -12 12 q -3 -9 -12 -12 q 9 -3 12 -12 Z"/>
    <path d="M396 290 q 2 7 9 9 q -7 2 -9 9 q -2 -7 -9 -9 q 7 -2 9 -9 Z"/>
    <path d="M392 150 q 2 6 8 8 q -6 2 -8 8 q -2 -6 -8 -8 q 6 -2 8 -8 Z"/>
  </g>
  <g fill="#ffd43b"><circle cx="270" cy="300" r="4"/><circle cx="372" cy="128" r="3.5"/><circle cx="226" cy="196" r="3"/></g>

  <!-- title -->
  <g font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" text-anchor="middle">
    <text x="320" y="78" font-size="62" fill="#7c3f0a" stroke="#7c3f0a" stroke-width="12" stroke-linejoin="round">Merge Mania</text>
    <text x="320" y="72" font-size="62" fill="#ffa63d" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Merge Mania</text>
  </g>
</svg>
