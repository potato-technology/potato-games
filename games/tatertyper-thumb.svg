  <!-- flying butter pat -->
  <g transform="translate(316 214) rotate(25)"><rect x="-9" y="-6" width="18" height="12" fill="#ffe066" stroke="#c9a227" stroke-width="2"/></g>

  <!-- keyboard -->
  <rect y="270" width="640" height="90" fill="#17151c"/>
  <g transform="translate(36 284)">
    <g fill="url(#key)" stroke="#4b4556" stroke-width="1.5">
      <rect x="0" y="0" width="42" height="30" rx="6"/><rect x="48" y="0" width="42" height="30" rx="6"/><rect x="96" y="0" width="42" height="30" rx="6"/><rect x="144" y="0" width="42" height="30" rx="6"/><rect x="192" y="0" width="42" height="30" rx="6"/><rect x="288" y="0" width="42" height="30" rx="6"/><rect x="336" y="0" width="42" height="30" rx="6"/><rect x="384" y="0" width="42" height="30" rx="6"/><rect x="432" y="0" width="42" height="30" rx="6"/><rect x="480" y="0" width="42" height="30" rx="6"/><rect x="528" y="0" width="42" height="30" rx="6"/>
      <rect x="22" y="36" width="42" height="30" rx="6"/><rect x="70" y="36" width="42" height="30" rx="6"/><rect x="118" y="36" width="42" height="30" rx="6"/><rect x="214" y="36" width="42" height="30" rx="6"/><rect x="262" y="36" width="42" height="30" rx="6"/><rect x="310" y="36" width="42" height="30" rx="6"/><rect x="358" y="36" width="42" height="30" rx="6"/><rect x="406" y="36" width="42" height="30" rx="6"/><rect x="454" y="36" width="42" height="30" rx="6"/><rect x="502" y="36" width="42" height="30" rx="6"/>
    </g>
    <rect x="240" y="0" width="42" height="30" rx="6" fill="url(#hot)"/>
    <rect x="166" y="36" width="42" height="30" rx="6" fill="url(#hot)"/>
    <g font-family="'Arial Rounded MT Bold', 'Trebuchet MS', Arial, sans-serif" font-weight="900" font-size="15" text-anchor="middle" fill="#cfc8da">
      <text x="21" y="20">Q</text><text x="69" y="20">W</text><text x="117" y="20">E</text><text x="165" y="20">R</text><text x="213" y="20">T</text><text x="261" y="20" fill="#2a1a00">Y</text><text x="309" y="20">U</text><text x="357" y="20">I</text><text x="405" y="20">O</text><text x="453" y="20">P</text>
      <text x="43" y="56">A</text><text x="91" y="56">S</text><text x="139" y="56">D</text><text x="187" y="56" fill="#2a1a00">F</text><text x="235" y="56">G</text><text x="283" y="56">H</text><text x="331" y="56">J</text><text x="379" y="56">K</text><text x="427" y="56">L</text>
    </g>
  </g>

  <!-- title -->
  <g transform="translate(22 132) rotate(-4)">
    <rect width="196" height="54" rx="14" fill="#a8620f"/>
    <rect y="-4" width="196" height="54" rx="14" fill="#ffb547"/>
    <text x="98" y="32" text-anchor="middle" font-family="'Arial Rounded MT Bold', 'Trebuchet MS', Arial, sans-serif" font-weight="900" font-size="28" fill="#2a1a00">TATER TYPER</text>
  </g>

  <rect width="640" height="360" fill="url(#vignette)"/>
</svg>
