  <g fill="#fff" opacity="0.85"><rect y="120" width="640" height="3"/><rect y="170" width="640" height="3"/><rect y="220" width="640" height="3"/><rect y="268" width="640" height="3"/></g>
  <g fill="#111"><rect x="590" y="120" width="8" height="8"/><rect x="598" y="128" width="8" height="8"/><rect x="590" y="136" width="8" height="8"/><rect x="598" y="144" width="8" height="8"/><rect x="590" y="152" width="8" height="8"/><rect x="598" y="160" width="8" height="8"/><rect x="590" y="168" width="8" height="8"/><rect x="598" y="176" width="8" height="8"/><rect x="590" y="184" width="8" height="8"/><rect x="598" y="192" width="8" height="8"/><rect x="590" y="200" width="8" height="8"/><rect x="598" y="208" width="8" height="8"/><rect x="590" y="216" width="8" height="8"/><rect x="598" y="224" width="8" height="8"/><rect x="590" y="232" width="8" height="8"/><rect x="598" y="240" width="8" height="8"/><rect x="590" y="248" width="8" height="8"/><rect x="598" y="256" width="8" height="8"/></g>
  <g fill="#fff"><rect x="598" y="120" width="8" height="8"/><rect x="590" y="128" width="8" height="8"/><rect x="598" y="136" width="8" height="8"/><rect x="590" y="144" width="8" height="8"/><rect x="598" y="152" width="8" height="8"/><rect x="590" y="160" width="8" height="8"/><rect x="598" y="168" width="8" height="8"/><rect x="590" y="176" width="8" height="8"/><rect x="598" y="184" width="8" height="8"/><rect x="590" y="192" width="8" height="8"/><rect x="598" y="200" width="8" height="8"/><rect x="590" y="208" width="8" height="8"/><rect x="598" y="216" width="8" height="8"/><rect x="590" y="224" width="8" height="8"/><rect x="598" y="232" width="8" height="8"/><rect x="590" y="240" width="8" height="8"/><rect x="598" y="248" width="8" height="8"/><rect x="590" y="256" width="8" height="8"/></g>

  <!-- runner 1 (in the lead) -->
  <g transform="translate(470 150)">
    <ellipse cx="0" cy="22" rx="22" ry="4" fill="#000" opacity="0.25"/>
    <path d="M-4 8 L-14 20 M4 8 L12 19" stroke="#6b4423" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="-12" cy="21" rx="6" ry="3.5" fill="#ff5e5e"/><ellipse cx="15" cy="20" rx="6" ry="3.5" fill="#ff5e5e"/>
    <ellipse cx="0" cy="-4" rx="15" ry="19" fill="url(#tater)" stroke="#6b4423" stroke-width="2"/>
    <rect x="-15" y="-15" width="30" height="5" fill="#ff5e5e"/>
    <circle cx="-4" cy="-5" r="2.2" fill="#1d1a17"/><circle cx="6" cy="-5" r="2.2" fill="#1d1a17"/>
    <path d="M-4 3 Q1 8 6 3" fill="none" stroke="#1d1a17" stroke-width="2" stroke-linecap="round"/>
    <path d="M-24 -10 h-14 M-26 -2 h-20 M-24 6 h-12" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
