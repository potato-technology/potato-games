    <path d="M-24 -6 h-14 M-26 2 h-18" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- runner 3 (slipping on butter) -->
  <g transform="translate(250 246) rotate(-18)">
    <ellipse cx="0" cy="22" rx="24" ry="5" fill="#ffe066" opacity="0.9"/>
    <path d="M-4 8 L-12 20 M4 8 L14 18" stroke="#6b4423" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="-10" cy="21" rx="6" ry="3.5" fill="#3ecf8e"/><ellipse cx="17" cy="19" rx="6" ry="3.5" fill="#3ecf8e"/>
