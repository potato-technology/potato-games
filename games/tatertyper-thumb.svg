<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Tater Typer game card: potato runners racing on a stadium track, with a glowing keyboard -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa9ee"/>
      <stop offset="1" stop-color="#cdeeff"/>
    </linearGradient>
    <linearGradient id="stands" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6270"/>
      <stop offset="1" stop-color="#3a3f49"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8462f"/>
      <stop offset="0.25" stop-color="#c9583e"/>
      <stop offset="1" stop-color="#b04c34"/>
    </linearGradient>
    <radialGradient id="tater" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#e3b27a"/>
      <stop offset="1" stop-color="#a8723f"/>
    </radialGradient>
    <radialGradient id="tater2" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#f5d98c"/>
      <stop offset="1" stop-color="#c79c3a"/>
    </radialGradient>
    <radialGradient id="tater3" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#d98a7f"/>
      <stop offset="1" stop-color="#9a4038"/>
    </radialGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3545"/>
      <stop offset="1" stop-color="#221f29"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <!-- sky and stands -->
  <rect width="640" height="360" fill="url(#sky)"/>
  <ellipse cx="120" cy="30" rx="40" ry="12" fill="#fff" opacity="0.85"/><ellipse cx="146" cy="24" rx="24" ry="11" fill="#fff" opacity="0.85"/>
  <ellipse cx="470" cy="22" rx="36" ry="10" fill="#fff" opacity="0.8"/>
  <circle cx="570" cy="26" r="16" fill="#fff6cf"/>
  <rect y="44" width="640" height="76" fill="url(#stands)"/>
  <g>
    <g fill="#c9925a"><ellipse cx="20" cy="66" rx="7" ry="9"/><ellipse cx="96" cy="62" rx="7" ry="9"/><ellipse cx="190" cy="66" rx="7" ry="9"/><ellipse cx="300" cy="62" rx="7" ry="9"/><ellipse cx="410" cy="66" rx="7" ry="9"/><ellipse cx="520" cy="62" rx="7" ry="9"/><ellipse cx="610" cy="66" rx="7" ry="9"/></g>
    <g fill="#e3c06a"><ellipse cx="58" cy="64" rx="7" ry="9"/><ellipse cx="146" cy="66" rx="7" ry="9"/><ellipse cx="250" cy="62" rx="7" ry="9"/><ellipse cx="356" cy="66" rx="7" ry="9"/><ellipse cx="466" cy="62" rx="7" ry="9"/><ellipse cx="572" cy="66" rx="7" ry="9"/></g>
    <g fill="#7d4e9e"><ellipse cx="38" cy="86" rx="7" ry="9"/><ellipse cx="170" cy="84" rx="7" ry="9"/><ellipse cx="330" cy="86" rx="7" ry="9"/><ellipse cx="490" cy="84" rx="7" ry="9"/></g>
    <g fill="#f2f2f2"><ellipse cx="78" cy="84" rx="7" ry="9"/><ellipse cx="226" cy="86" rx="7" ry="9"/><ellipse cx="386" cy="84" rx="7" ry="9"/><ellipse cx="546" cy="86" rx="7" ry="9"/></g>
    <g fill="#e9813c"><ellipse cx="120" cy="86" rx="7" ry="9"/><ellipse cx="276" cy="84" rx="7" ry="9"/><ellipse cx="440" cy="86" rx="7" ry="9"/><ellipse cx="600" cy="84" rx="7" ry="9"/></g>
    <path d="M150 60 L150 40 L164 44 L150 48" fill="#ff5e5e" stroke="#ddd" stroke-width="1.5"/>
    <path d="M412 62 L412 42 L426 46 L412 50" fill="#4fa3f0" stroke="#ddd" stroke-width="1.5"/>
  </g>
  <rect y="102" width="640" height="18" fill="#2a2d35"/>
  <rect x="10" y="104" width="150" height="14" fill="#ff7a59"/><rect x="170" y="104" width="150" height="14" fill="#4fa3f0"/><rect x="330" y="104" width="150" height="14" fill="#3ecf8e"/><rect x="490" y="104" width="140" height="14" fill="#ffb547"/>

  <!-- track -->
