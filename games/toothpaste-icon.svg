<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Toothpaste Pro icon: a tube laying a striped stripe of paste on a toothbrush -->
  <defs>
    <radialGradient id="bg" cx="35%" cy="28%" r="80%">
      <stop offset="0" stop-color="#8ff0dc"/>
      <stop offset="1" stop-color="#17a88f"/>
    </radialGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d4ff"/>
      <stop offset="0.3" stop-color="#4aa3ff"/>
      <stop offset="1" stop-color="#1f5fc0"/>
    </linearGradient>
    <linearGradient id="tuft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfdeef"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b3bfce"/>
      <stop offset="0.2" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#9aa6b8"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b438f"/>
      <stop offset="0.3" stop-color="#5a94ff"/>
      <stop offset="1" stop-color="#183c84"/>
    </linearGradient>
    <clipPath id="badge"><circle cx="50" cy="50" r="47"/></clipPath>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
  <g clip-path="url(#badge)">
    <circle cx="18" cy="44" r="4" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.5"/>
    <circle cx="80" cy="74" r="3.5" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.3"/>
    <g transform="translate(-2 -7)">
    <!-- brush -->
    <path d="M-6 84 h58 q6 0 9 -3 q3 -3 9 -3 h30 q5 0 5 4 q0 4 -5 4 h-106 z" fill="url(#handle)" stroke="#123a78" stroke-width="1.4"/>
    <g fill="url(#tuft)" stroke="#9fb3cc" stroke-width="0.8">
      <rect x="44" y="63" width="6" height="17" rx="3"/><rect x="51" y="62" width="6" height="18" rx="3"/><rect x="58" y="63" width="6" height="17" rx="3"/><rect x="65" y="62" width="6" height="18" rx="3"/><rect x="72" y="63" width="6" height="17" rx="3"/><rect x="79" y="62" width="6" height="18" rx="3"/>
    </g>
    <!-- paste stripe with curl -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M47 57 q6 -2 12 0 t12 0 t12 -1" stroke="#a9bdd3" stroke-width="13"/>
      <path d="M47 57 q6 -2 12 0 t12 0 t12 -1" stroke="#ffffff" stroke-width="10.5"/>
      <path d="M47 55 q6 -2 12 0 t12 0 t12 -1" stroke="#2f8cff" stroke-width="2"/>
      <path d="M47 59 q6 -2 12 0 t12 0 t12 -1" stroke="#ff4d6d" stroke-width="2"/>
      <path d="M82 56 q7 -1 8 -7 q0 -4 -3 -4" stroke="#a9bdd3" stroke-width="9"/>
      <path d="M82 56 q7 -1 8 -7 q0 -4 -3 -4" stroke="#ffffff" stroke-width="6.5"/>
      </g></g>
    <g fill="none" stroke-linecap="round">
      <!-- stream -->
      <path d="M44 42 v6" stroke="#a9bdd3" stroke-width="11"/>
      <path d="M44 42 v6" stroke="#ffffff" stroke-width="8.5"/>
      <path d="M46.5 42 v6" stroke="#ff4d6d" stroke-width="1.8"/>
      <path d="M41.5 42 v6" stroke="#2f8cff" stroke-width="1.8"/>
    </g>
    <!-- tube -->
    <g transform="translate(44 42) rotate(28) scale(0.7)">
      <path d="M-11 -14 Q-20 -16 -20 -26 L-23 -58 L23 -58 L20 -26 Q20 -16 11 -14 Z" fill="url(#body)" stroke="#5d6b84" stroke-opacity="0.5" stroke-width="1.2"/>
      <path d="M-20 -26 L-21 -40 Q-10 -34 0 -40 Q10 -46 21 -40 L20 -26 Q20 -16 11 -14 L-11 -14 Q-20 -16 -20 -26 Z" fill="url(#band)"/>
      <path d="M-21 -40 Q-10 -34 0 -40 Q10 -46 21 -40" stroke="#e63950" stroke-width="2.4" fill="none"/>
      <rect x="-14" y="-56" width="3" height="36" rx="1.5" fill="#ffffff" opacity="0.7"/>
      <rect x="-25" y="-65" width="50" height="9" rx="2.5" fill="#eef2f7" stroke="#5d6b84" stroke-opacity="0.5" stroke-width="1"/>
      <path d="M-12 -15 L12 -15 L9 -2 Q8 0 6 0 L-6 0 Q-8 0 -9 -2 Z" fill="#ffffff" stroke="#5d6b84" stroke-opacity="0.5" stroke-width="1"/>
    </g>
    <path d="M22 22 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z" fill="#ffe066"/>
    <path d="M18 54 l1.5 3.5 3.5 1.5 -3.5 1.5 -1.5 3.5 -1.5 -3.5 -3.5 -1.5 3.5 -1.5 z" fill="#ffffff"/>
  </g>
  <circle cx="50" cy="50" r="47" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
</svg>
