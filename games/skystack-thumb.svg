<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Sky Stack game card: a rainbow tower climbs from a sunny city through the clouds into a starry space sky while a new block swings in for a PERFECT drop -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0d2a"/>
      <stop offset="0.28" stop-color="#2b2a78"/>
      <stop offset="0.55" stop-color="#d0668a"/>
      <stop offset="0.75" stop-color="#ffb07a"/>
      <stop offset="1" stop-color="#9fdcff"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6d0"/>
      <stop offset="0.3" stop-color="#ffd59a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff9a6a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffd2a0"/>
      <stop offset="1" stop-color="#c8603e"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfefff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a0"/>
      <stop offset="1" stop-color="#ffbe1a"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd06a"/>
      <stop offset="1" stop-color="#3f8f45"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <g id="cloud">
      <ellipse cx="0" cy="10" rx="54" ry="9" fill="#b9c6e8" opacity="0.6"/>
      <circle cx="-30" cy="2" r="18" fill="#fff"/>
      <circle cx="-8" cy="-8" r="24" fill="#fff"/>
      <circle cx="18" cy="-4" r="20" fill="#fff"/>
      <circle cx="38" cy="4" r="14" fill="#fff"/>
      <rect x="-42" y="2" width="84" height="12" fill="#fff"/>
    </g>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="40" cy="20" r="1.4"/><circle cx="96" cy="44" r="1"/><circle cx="150" cy="16" r="1.6"/><circle cx="210" cy="60" r="1"/>
    <circle cx="300" cy="26" r="1.2"/><circle cx="350" cy="58" r="1"/><circle cx="420" cy="14" r="1.5"/><circle cx="470" cy="40" r="1"/>
    <circle cx="520" cy="70" r="1.2"/><circle cx="600" cy="24" r="1.6"/><circle cx="580" cy="96" r="1"/><circle cx="20" cy="88" r="1"/>
    <path d="M556 48 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" opacity="0.9"/>
    <path d="M250 30 l1.5 4.5 4.5 1.5 -4.5 1.5 -1.5 4.5 -1.5 -4.5 -4.5 -1.5 4.5 -1.5z" opacity="0.8"/>
  </g>
  <!-- ringed planet -->
  <g transform="translate(560 120)">
    <ellipse rx="44" ry="10" fill="none" stroke="#ffe0b0" stroke-opacity="0.6" stroke-width="5" transform="rotate(-18)"/>
    <circle r="24" fill="url(#planet)"/>
    <path d="M-42 13 A44 10 -18 0 0 42 -13" fill="none" stroke="#ffe8c4" stroke-width="5" transform="rotate(0)"/>
  </g>
  <!-- sun glow -->
  <circle cx="520" cy="250" r="110" fill="url(#sun)"/>
  <circle cx="520" cy="250" r="34" fill="#fff3c9"/>

  <!-- city -->
  <g fill="#6a7fc0" opacity="0.75">
    <rect x="0" y="282" width="40" height="80"/><rect x="44" y="262" width="34" height="100"/><rect x="82" y="290" width="44" height="70"/>
    <rect x="500" y="276" width="40" height="90"/><rect x="544" y="258" width="38" height="110"/><rect x="586" y="286" width="54" height="80"/>
  </g>
  <g fill="#ffe9a0" opacity="0.7">
    <rect x="50" y="272" width="5" height="7"/><rect x="62" y="272" width="5" height="7"/><rect x="50" y="288" width="5" height="7"/><rect x="62" y="304" width="5" height="7"/>
    <rect x="552" y="268" width="5" height="7"/><rect x="566" y="284" width="5" height="7"/><rect x="552" y="300" width="5" height="7"/><rect x="566" y="316" width="5" height="7"/>
  </g>
  <rect x="0" y="330" width="640" height="30" fill="url(#grass)"/>
  <rect x="0" y="342" width="640" height="12" fill="#4b4f5e"/>
  <g fill="#f4f0dc"><rect x="20" y="347" width="18" height="2"/><rect x="70" y="347" width="18" height="2"/><rect x="470" y="347" width="18" height="2"/><rect x="560" y="347" width="18" height="2"/><rect x="610" y="347" width="18" height="2"/></g>

  <!-- clouds behind -->
  <use href="#cloud" transform="translate(250 300) scale(0.9)" opacity="0.95"/>
  <use href="#cloud" transform="translate(600 196) scale(0.7)" opacity="0.9"/>

  <!-- tower (each floor: side, top, front) -->
  <g stroke="#000" stroke-opacity="0.18" stroke-width="1">
    <!-- base -->
    <rect x="368" y="314" width="132" height="18" fill="#7d86a8"/>
    <polygon points="500,314 510,306 510,324 500,332" fill="#5d6585"/>
    <polygon points="368,314 378,306 510,306 500,314" fill="#a3abc9"/>
    <!-- floors from bottom -->
    <g>
      <polygon points="494,296 504,288 504,306 494,314" fill="#c0461f"/>
      <rect x="374" y="296" width="120" height="18" fill="#ff7a3c"/>
    </g>
    <g>
      <polygon points="492,278 502,270 502,288 492,296" fill="#c27c10"/>
      <rect x="374" y="278" width="118" height="18" fill="#ffb21f"/>
    </g>
    <g>
      <polygon points="492,260 502,252 502,270 492,278" fill="#8aa31a"/>
      <rect x="378" y="260" width="114" height="18" fill="#c6e23a"/>
    </g>
    <g>
      <polygon points="492,242 502,234 502,252 492,260" fill="#2f9a3f"/>
      <rect x="378" y="242" width="114" height="18" fill="#4fd65f"/>
    </g>
    <g>
      <polygon points="492,224 502,216 502,234 492,242" fill="#1e8f86"/>
      <rect x="380" y="224" width="112" height="18" fill="#33d6c4"/>
    </g>
    <g>
      <polygon points="492,206 502,198 502,216 492,224" fill="#b88400"/>
      <rect x="380" y="206" width="112" height="18" fill="url(#gold)"/>
    </g>
    <g>
      <polygon points="490,188 500,180 500,198 490,206" fill="#2a5ab8"/>
      <rect x="382" y="188" width="108" height="18" fill="#4a8cf0"/>
    </g>
    <g>
      <polygon points="490,170 500,162 500,180 490,188" fill="#4b2fa8"/>
      <rect x="382" y="170" width="108" height="18" fill="#7a5af0"/>
    </g>
    <g>
      <polygon points="490,152 500,144 500,162 490,170" fill="#8a2a9c"/>
      <rect x="384" y="152" width="106" height="18" fill="#c95ae0"/>
      <polygon points="384,152 394,144 500,144 490,152" fill="#e7a2f5"/>
    </g>
  </g>
  <!-- gold block star + bevels -->
  <path d="M436 209 l2.6 5.4 5.9 0.8 -4.3 4.1 1 5.8 -5.2 -2.8 -5.2 2.8 1 -5.8 -4.3 -4.1 5.9 -0.8z" fill="#fff8d0"/>
  <g fill="#ffffff" opacity="0.28">
    <rect x="374" y="296" width="120" height="2"/><rect x="374" y="278" width="118" height="2"/><rect x="378" y="260" width="114" height="2"/>
    <rect x="378" y="242" width="114" height="2"/><rect x="380" y="224" width="112" height="2"/><rect x="382" y="188" width="108" height="2"/><rect x="382" y="170" width="108" height="2"/>
  </g>
  <!-- chopped piece tumbling -->
  <g transform="translate(528 176) rotate(28)">
    <rect x="-12" y="-9" width="24" height="18" fill="#c95ae0" stroke="#000" stroke-opacity="0.2"/>
  </g>
  <!-- builder on top -->
  <g transform="translate(420 144)">
    <ellipse cx="0" cy="0" rx="9" ry="2.5" fill="#000" opacity="0.2"/>
    <path d="M-3 -9 L-4 -1 M3 -9 L4 -1" stroke="#2a3a6a" stroke-width="3.4" stroke-linecap="round"/>
    <rect x="-8" y="-25" width="16" height="18" rx="6" fill="#ff8a2a"/>
    <rect x="-8" y="-19" width="16" height="2.4" fill="#ffe14a"/>
    <path d="M-7 -20 L-14 -32 M7 -20 L14 -32" stroke="#ffcf9e" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="0" cy="-32" r="7.5" fill="#ffcf9e"/>
    <circle cx="-2.5" cy="-33" r="1.3" fill="#1d1d26"/><circle cx="2.5" cy="-33" r="1.3" fill="#1d1d26"/>
    <path d="M-3 -29.5 Q0 -26.5 3 -29.5" stroke="#1d1d26" stroke-width="1.3" fill="none"/>
    <path d="M-8 -35 A8 8 0 0 1 8 -35 Z" fill="#ffd43b"/><rect x="-10" y="-36" width="20" height="2.6" fill="#ffd43b"/>
  </g>

  <!-- crane + swinging block -->
  <rect x="300" y="0" width="340" height="12" fill="#ffc21a"/>
  <path d="M300 12 L316 0 L332 12 L348 0 L364 12 L380 0 L396 12 L412 0 L428 12 L444 0 L460 12 L476 0 L492 12 L508 0 L524 12 L540 0 L556 12 L572 0 L588 12 L604 0 L620 12 L636 0" stroke="#a57400" stroke-width="1.6" fill="none"/>
  <line x1="436" y1="12" x2="452" y2="40" stroke="#3a3f5c" stroke-width="2.4"/>
  <path d="M446 42 a6 6 0 0 0 12 0" stroke="#ffd43b" stroke-width="3" fill="none"/>
  <path d="M452 46 L418 60 M452 46 L486 60" stroke="#3a3f5c" stroke-width="1.6"/>
  <g transform="translate(0 -40) rotate(-4 452 110)">
    <polygon points="490,100 500,92 500,110 490,118" fill="#c23a6a"/>
    <polygon points="384,100 394,92 500,92 490,100" fill="#ffb3d0"/>
    <rect x="384" y="100" width="106" height="18" fill="#ff5c9a" stroke="#000" stroke-opacity="0.18"/>
    <rect x="384" y="100" width="106" height="2.4" fill="#fff" opacity="0.35"/>
  </g>
  <!-- perfect sparkle -->
  <g fill="#fff6a8">
    <path d="M372 140 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
    <path d="M510 136 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z"/>
  </g>

  <!-- clouds in front -->
  <use href="#cloud" transform="translate(338 262) scale(0.8)" opacity="0.92"/>
  <use href="#cloud" transform="translate(560 300) scale(0.9)"/>

  <!-- title -->
  <g font-family="Fredoka, 'Trebuchet MS', Arial, sans-serif" font-weight="700">
    <text x="34" y="118" font-size="78" fill="#0f4a73">SKY</text>
    <text x="30" y="112" font-size="78" fill="url(#title)" stroke="#1b7fb5" stroke-width="3" paint-order="stroke">SKY</text>
    <text x="34" y="196" font-size="78" fill="#7a5800">STACK</text>
    <text x="30" y="190" font-size="78" fill="url(#gold)" stroke="#b88400" stroke-width="3" paint-order="stroke">STACK</text>
  </g>
  <g transform="translate(30 214)">
    <rect width="214" height="34" rx="17" fill="#0b1230" opacity="0.55"/>
    <text x="107" y="23" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-weight="900" font-size="15" fill="#ffffff">Build a tower to <tspan fill="#ffd43b">space!</tspan></text>
  </g>
  <!-- PERFECT pop -->
  <g transform="translate(560 66) rotate(8)">
    <text x="0" y="0" text-anchor="middle" font-family="Fredoka, 'Trebuchet MS', Arial, sans-serif" font-weight="700" font-size="28" fill="#ffd43b" stroke="#0b1230" stroke-width="5" paint-order="stroke">PERFECT!</text>
    <text x="0" y="24" text-anchor="middle" font-family="Fredoka, 'Trebuchet MS', Arial, sans-serif" font-weight="700" font-size="18" fill="#ff6bd6" stroke="#0b1230" stroke-width="4" paint-order="stroke">combo ×8</text>
  </g>
</svg>
