<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Hill Rider icon: a red jeep popping a wheelie on a green hill -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ab8f7"/>
      <stop offset="1" stop-color="#cdeeff"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a80"/>
      <stop offset="0.5" stop-color="#e8413c"/>
      <stop offset="1" stop-color="#9c1f1b"/>
    </linearGradient>
    <radialGradient id="rim" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#7d8494"/>
    </radialGradient>
    <clipPath id="badge"><rect x="2" y="2" width="96" height="96" rx="22"/></clipPath>
  </defs>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#bg)"/>
  <g clip-path="url(#badge)">
    <circle cx="78" cy="22" r="10" fill="#fffbe6"/>
    <path d="M0 70 C 25 52 55 50 100 62 L100 100 L0 100 Z" fill="#8a5a32"/>
    <path d="M0 70 C 25 52 55 50 100 62 L100 70 C 55 58 25 60 0 78 Z" fill="#57c241"/>
    <g transform="translate(50 50) rotate(-18)">
      <path d="M -12 -6 L -10 -16 L -4 -17" fill="none" stroke="#3a3f4b" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="-3" cy="-20" r="6" fill="#ffd7b0"/>
      <path d="M -9.3 -19 A 6.4 6.4 0 1 1 3.4 -18 Z" fill="#ff9f1c"/>
      <path d="M -30 -7 L 12 -7 L 17 -5 L 30 -4 L 30 5 L 25 5 A 8 8 0 0 0 10 5 L -12 5 A 8 8 0 0 0 -27 5 L -30 4 Z" fill="url(#body)" stroke="#141826" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="-19" cy="8" r="9.5" fill="#1b1d22"/><circle cx="-19" cy="8" r="5" fill="url(#rim)"/>
      <circle cx="18" cy="8" r="9.5" fill="#1b1d22"/><circle cx="18" cy="8" r="5" fill="url(#rim)"/>
    </g>
  </g>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="2.5"/>
