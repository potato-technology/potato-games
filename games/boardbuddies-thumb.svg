<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Board Buddies game card: a fox and a bunny playing checkers on a cozy table -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98f"/>
      <stop offset="1" stop-color="#ff9e5c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="20%" r="70%">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9773f"/>
      <stop offset="1" stop-color="#7e4a22"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a5f33"/>
      <stop offset="1" stop-color="#5d3519"/>
    </linearGradient>
    <radialGradient id="red" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ff9a8c"/>
      <stop offset="0.55" stop-color="#e8453c"/>
      <stop offset="1" stop-color="#9b1f19"/>
    </radialGradient>
    <radialGradient id="dark" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#7d8299"/>
      <stop offset="0.55" stop-color="#3b3e4c"/>
      <stop offset="1" stop-color="#16171f"/>
    </radialGradient>
    <radialGradient id="foxfur" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffb070"/>
      <stop offset="0.8" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#d9601a"/>
    </radialGradient>
    <radialGradient id="bunfur" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.8" stop-color="#f4eff8"/>
      <stop offset="1" stop-color="#d8cfe2"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a3"/>
      <stop offset="0.5" stop-color="#ffc93d"/>
      <stop offset="1" stop-color="#d48f00"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a97f0"/>
      <stop offset="1" stop-color="#2659b8"/>
    </linearGradient>
    <g id="redp">
      <ellipse cx="2" cy="5" rx="17" ry="16" fill="#000" opacity="0.25"/>
      <circle r="17" fill="url(#red)" stroke="#9b1f19" stroke-width="1.5"/>
      <circle r="11.5" fill="none" stroke="#000" stroke-opacity="0.2" stroke-width="2"/>
      <ellipse cx="-5" cy="-7" rx="6" ry="3" fill="#fff" opacity="0.45" transform="rotate(-30 -5 -7)"/>
    </g>
    <g id="darkp">
      <ellipse cx="2" cy="5" rx="17" ry="16" fill="#000" opacity="0.25"/>
      <circle r="17" fill="url(#dark)" stroke="#16171f" stroke-width="1.5"/>
      <circle r="11.5" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="2"/>
      <ellipse cx="-5" cy="-7" rx="6" ry="3" fill="#fff" opacity="0.35" transform="rotate(-30 -5 -7)"/>
    </g>
    <pattern id="planks" width="160" height="40" patternUnits="userSpaceOnUse">
      <rect width="160" height="40" fill="none" stroke="#5d3519" stroke-opacity="0.35" stroke-width="2"/>
      <path d="M4 12 Q60 8 156 13 M4 26 Q80 30 156 24" stroke="#5d3519" stroke-opacity="0.15" fill="none"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <rect width="640" height="360" fill="url(#glow)"/>
  <!-- wallpaper dots -->
  <g fill="#fff" opacity="0.18">
    <circle cx="40" cy="40" r="6"/><circle cx="120" cy="80" r="4"/><circle cx="560" cy="50" r="7"/><circle cx="610" cy="120" r="4"/>
    <circle cx="80" cy="150" r="5"/><circle cx="500" cy="110" r="5"/><circle cx="200" cy="30" r="4"/><circle cx="440" cy="30" r="5"/>
  </g>

  <!-- table -->
  <rect y="208" width="640" height="152" fill="url(#table)"/>
  <rect y="208" width="640" height="152" fill="url(#planks)"/>
  <rect y="204" width="640" height="8" fill="#d39a5f"/>

  <!-- four in a row board, back right -->
  <g transform="translate(470 120)">
    <rect x="-6" y="88" width="12" height="40" fill="#1d4590"/>
    <rect x="96" y="88" width="12" height="40" fill="#1d4590"/>
    <rect x="-14" y="-8" width="130" height="112" rx="14" fill="url(#blue)" stroke="#1d4590" stroke-width="3"/>
    <g fill="#16357a">
      <circle cx="8" cy="12" r="10"/><circle cx="34" cy="12" r="10"/><circle cx="60" cy="12" r="10"/><circle cx="86" cy="12" r="10"/>
      <circle cx="8" cy="38" r="10"/><circle cx="34" cy="38" r="10"/><circle cx="86" cy="38" r="10"/>
      <circle cx="8" cy="64" r="10"/><circle cx="86" cy="64" r="10"/>
    </g>
    <circle cx="60" cy="38" r="10" fill="#ffc93d" stroke="#c48a00" stroke-width="1.5"/>
    <circle cx="34" cy="64" r="10" fill="#e8453c" stroke="#9b1f19" stroke-width="1.5"/>
    <circle cx="60" cy="64" r="10" fill="#ffc93d" stroke="#c48a00" stroke-width="1.5"/>
    <circle cx="8" cy="90" r="10" fill="#e8453c" stroke="#9b1f19" stroke-width="1.5"/>
    <circle cx="34" cy="90" r="10" fill="#ffc93d" stroke="#c48a00" stroke-width="1.5"/>
    <circle cx="60" cy="90" r="10" fill="#e8453c" stroke="#9b1f19" stroke-width="1.5"/>
    <circle cx="86" cy="90" r="10" fill="#ffc93d" stroke="#c48a00" stroke-width="1.5"/>
  </g>

  <!-- fox, sitting behind the table on the right -->
  <g transform="translate(486 190)">
    <ellipse cx="0" cy="60" rx="54" ry="44" fill="url(#foxfur)" stroke="#8a3a0c" stroke-width="4"/>
    <ellipse cx="0" cy="68" rx="32" ry="30" fill="#fff6ea"/>
    <path d="M-32 -38 L-48 -92 L-8 -54 Z" fill="#ff8a3d" stroke="#8a3a0c" stroke-width="4" stroke-linejoin="round"/>
    <path d="M32 -38 L48 -92 L8 -54 Z" fill="#ff8a3d" stroke="#8a3a0c" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-30 -46 L-40 -78 L-16 -54 Z" fill="#4a3026"/>
    <path d="M30 -46 L40 -78 L16 -54 Z" fill="#4a3026"/>
    <ellipse cx="0" cy="-8" rx="62" ry="56" fill="url(#foxfur)" stroke="#8a3a0c" stroke-width="4"/>
    <path d="M-60 -6 Q-32 46 0 48 Q-14 10 -60 -6 Z" fill="#fff6ea"/>
    <path d="M60 -6 Q32 46 0 48 Q14 10 60 -6 Z" fill="#fff6ea"/>
    <path d="M-34 -18 Q-22 -32 -10 -18" fill="none" stroke="#2a1a12" stroke-width="5" stroke-linecap="round"/>
    <path d="M10 -18 Q22 -32 34 -18" fill="none" stroke="#2a1a12" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="0" cy="12" rx="9" ry="6" fill="#2b1d18"/>
    <path d="M-14 22 Q0 40 14 22 Z" fill="#7a2a28" stroke="#2a1a12" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="0" cy="30" rx="6" ry="3" fill="#ff8f9b"/>
    <!-- arm holding up a dark piece -->
    <ellipse cx="-58" cy="30" rx="11" ry="22" fill="#ff8a3d" stroke="#8a3a0c" stroke-width="3.5" transform="rotate(35 -58 30)"/>
  </g>

  <!-- checkers board, front left -->
  <g transform="translate(232 258) rotate(-6)">
    <ellipse cx="6" cy="72" rx="170" ry="26" fill="#000" opacity="0.25"/>
    <rect x="-160" y="-92" width="320" height="168" rx="14" fill="url(#frame)"/>
    <g transform="translate(-148 -82)">
      <rect width="296" height="148" fill="#f4ddb4"/>
      <g fill="#a8693a">
        <rect x="37" y="0" width="37" height="37"/><rect x="111" y="0" width="37" height="37"/><rect x="185" y="0" width="37" height="37"/><rect x="259" y="0" width="37" height="37"/>
        <rect x="0" y="37" width="37" height="37"/><rect x="74" y="37" width="37" height="37"/><rect x="148" y="37" width="37" height="37"/><rect x="222" y="37" width="37" height="37"/>
        <rect x="37" y="74" width="37" height="37"/><rect x="111" y="74" width="37" height="37"/><rect x="185" y="74" width="37" height="37"/><rect x="259" y="74" width="37" height="37"/>
        <rect x="0" y="111" width="37" height="37"/><rect x="74" y="111" width="37" height="37"/><rect x="148" y="111" width="37" height="37"/><rect x="222" y="111" width="37" height="37"/>
      </g>
      <use href="#darkp" x="55.5" y="18.5"/>
      <use href="#darkp" x="203.5" y="18.5"/>
      <use href="#darkp" x="240.5" y="55.5"/>
      <use href="#redp" x="92.5" y="92.5"/>
      <use href="#redp" x="18.5" y="129.5"/>
      <use href="#redp" x="166.5" y="129.5"/>
      <!-- jumping red king with arc -->
      <path d="M129 92 Q160 30 166 56" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="6 6" stroke-linecap="round" opacity="0.9"/>
      <g transform="translate(166 52) scale(1.15)">
        <use href="#redp"/>
        <path d="M-10 6 L-10 -6 L-5 0 L0 -10 L5 0 L10 -6 L10 6 Z" fill="url(#gold)" stroke="#8a5a00" stroke-width="1.5" stroke-linejoin="round"/>
      </g>
      <g fill="#ffd93b"><path d="M150 40 l3 -8 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 z"/></g>
    </g>
  </g>

  <!-- bunny peeking in from the left -->
  <g transform="translate(66 272)">
    <g transform="rotate(-12 -10 -60)">
      <ellipse cx="-16" cy="-92" rx="15" ry="44" fill="url(#bunfur)" stroke="#8d7fa0" stroke-width="3.5"/>
      <ellipse cx="-16" cy="-88" rx="7" ry="32" fill="#ffbcd0"/>
    </g>
    <g transform="rotate(14 20 -60)">
      <ellipse cx="22" cy="-92" rx="15" ry="44" fill="url(#bunfur)" stroke="#8d7fa0" stroke-width="3.5"/>
      <ellipse cx="22" cy="-88" rx="7" ry="32" fill="#ffbcd0"/>
    </g>
    <ellipse cx="0" cy="-24" rx="54" ry="48" fill="url(#bunfur)" stroke="#8d7fa0" stroke-width="3.5"/>
    <ellipse cx="-19" cy="-30" rx="8" ry="10" fill="#fff" stroke="#2a1a12" stroke-opacity="0.2"/>
    <ellipse cx="19" cy="-30" rx="8" ry="10" fill="#fff" stroke="#2a1a12" stroke-opacity="0.2"/>
    <ellipse cx="-18" cy="-28" rx="5.5" ry="6.5" fill="#2a1a12"/>
    <ellipse cx="20" cy="-28" rx="5.5" ry="6.5" fill="#2a1a12"/>
    <circle cx="-16" cy="-31" r="2" fill="#fff"/><circle cx="22" cy="-31" r="2" fill="#fff"/>
    <ellipse cx="-34" cy="-10" rx="8" ry="5" fill="#ffb7cb" opacity="0.8"/>
    <ellipse cx="34" cy="-10" rx="8" ry="5" fill="#ffb7cb" opacity="0.8"/>
    <ellipse cx="1" cy="-12" rx="5" ry="3.5" fill="#ff7fa3"/>
    <path d="M-8 -4 Q-4 2 0 -4 Q4 2 8 -4" fill="none" stroke="#2a1a12" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-4" y="-3" width="8" height="6" fill="#fff" stroke="#2a1a12" stroke-opacity="0.3"/>
    <!-- paws on the table edge -->
    <ellipse cx="-30" cy="22" rx="16" ry="10" fill="#fff" stroke="#8d7fa0" stroke-width="3"/>
    <ellipse cx="30" cy="22" rx="16" ry="10" fill="#fff" stroke="#8d7fa0" stroke-width="3"/>
  </g>

  <!-- title -->
  <g font-family="'Fredoka', 'Arial Rounded MT Bold', 'Trebuchet MS', Arial, sans-serif" font-weight="900" text-anchor="middle">
    <text x="320" y="78" font-size="66" textLength="520" lengthAdjust="spacingAndGlyphs" fill="#7a2f0a" opacity="0.35" transform="translate(0 6)">Board Buddies</text>
    <text x="320" y="78" font-size="66" textLength="520" lengthAdjust="spacingAndGlyphs" fill="none" stroke="#fff" stroke-width="12" stroke-linejoin="round">Board Buddies</text>
    <text x="320" y="78" font-size="66" textLength="520" lengthAdjust="spacingAndGlyphs" fill="#ff7a2b" stroke="#a5400d" stroke-width="3" stroke-linejoin="round">Board <tspan fill="#1fb3a0" stroke="#0f6f62">Buddies</tspan></text>
    <text x="230" y="114" font-size="19" textLength="360" lengthAdjust="spacingAndGlyphs" font-weight="800" fill="#7a3d14" font-family="'Nunito', 'Trebuchet MS', Arial, sans-serif">Checkers · Four in a Row · Reversi · Tic-Tac-Toe</text>
  </g>

  <!-- trophy -->
  <g transform="translate(590 300)">
    <path d="M-22 -40 L22 -40 L18 -10 Q0 4 -18 -10 Z" fill="url(#gold)" stroke="#8a5a00" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-22 -34 Q-38 -32 -30 -16 Q-24 -10 -16 -14" fill="none" stroke="#c48a00" stroke-width="4"/>
    <path d="M22 -34 Q38 -32 30 -16 Q24 -10 16 -14" fill="none" stroke="#c48a00" stroke-width="4"/>
    <rect x="-5" y="-6" width="10" height="16" fill="#d48f00"/>
    <rect x="-18" y="8" width="36" height="10" rx="3" fill="#7a4d0e"/>
    <path d="M-8 -30 l3 -7 l3 7" fill="none" stroke="#fff" stroke-width="2" opacity="0.7"/>
  </g>
  <!-- confetti -->
  <g>
    <rect x="590" y="200" width="10" height="6" rx="2" fill="#ff5d7a" transform="rotate(30 590 200)"/>
    <rect x="30" y="100" width="10" height="6" rx="2" fill="#38b6ff" transform="rotate(-20 30 100)"/>
    <rect x="420" y="40" width="10" height="6" rx="2" fill="#3ccf6e" transform="rotate(45 420 40)"/>
    <rect x="600" y="30" width="10" height="6" rx="2" fill="#a66bff" transform="rotate(10 600 30)"/>
    <circle cx="20" cy="190" r="4" fill="#ffc23d"/>
    <circle cx="430" cy="300" r="4" fill="#ff5d7a"/>
  </g>
</svg>
