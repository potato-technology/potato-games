<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Color Sort game card: glass tubes on a lab shelf, one pouring pink into another -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#211a52"/>
      <stop offset="1" stop-color="#3a2a78"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="62%" r="60%">
      <stop offset="0" stop-color="#b48cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#b48cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a06a3e"/>
      <stop offset="1" stop-color="#5b3a20"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="red" x1="0" x2="1"><stop offset="0" stop-color="#b81d33"/><stop offset="0.4" stop-color="#ff6b78"/><stop offset="1" stop-color="#c9213a"/></linearGradient>
    <linearGradient id="yel" x1="0" x2="1"><stop offset="0" stop-color="#c9a800"/><stop offset="0.4" stop-color="#fff08a"/><stop offset="1" stop-color="#d4b000"/></linearGradient>
    <linearGradient id="blu" x1="0" x2="1"><stop offset="0" stop-color="#1f2fa8"/><stop offset="0.4" stop-color="#6d85ff"/><stop offset="1" stop-color="#2537b8"/></linearGradient>
    <linearGradient id="grn" x1="0" x2="1"><stop offset="0" stop-color="#127a3a"/><stop offset="0.4" stop-color="#5ee38f"/><stop offset="1" stop-color="#16903f"/></linearGradient>
    <linearGradient id="pnk" x1="0" x2="1"><stop offset="0" stop-color="#c02a8f"/><stop offset="0.4" stop-color="#ff9be0"/><stop offset="1" stop-color="#d0369e"/></linearGradient>
    <linearGradient id="tea" x1="0" x2="1"><stop offset="0" stop-color="#0a8a80"/><stop offset="0.4" stop-color="#6ff0e0"/><stop offset="1" stop-color="#0d9d92"/></linearGradient>
    <linearGradient id="pur" x1="0" x2="1"><stop offset="0" stop-color="#6b21a8"/><stop offset="0.4" stop-color="#c993ff"/><stop offset="1" stop-color="#7a2bc0"/></linearGradient>
    <linearGradient id="org" x1="0" x2="1"><stop offset="0" stop-color="#c76a00"/><stop offset="0.4" stop-color="#ffc061"/><stop offset="1" stop-color="#d77a08"/></linearGradient>
    <clipPath id="t1"><path d="M96 130 V262 A19 19 0 0 0 134 262 V130 Z"/></clipPath>
    <clipPath id="t2"><path d="M176 130 V262 A19 19 0 0 0 214 262 V130 Z"/></clipPath>
    <clipPath id="t3"><path d="M426 130 V262 A19 19 0 0 0 464 262 V130 Z"/></clipPath>
    <clipPath id="t4"><path d="M506 130 V262 A19 19 0 0 0 544 262 V130 Z"/></clipPath>
    <clipPath id="t5"><path d="M296 150 V262 A19 19 0 0 0 334 262 V150 Z"/></clipPath>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#ffe3f4"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#spot)"/>
  <!-- window with moon -->
  <rect x="24" y="18" width="92" height="96" rx="8" fill="#101a40" stroke="#4a3a8a" stroke-width="5"/>
  <circle cx="84" cy="44" r="13" fill="#fdf6d0"/>
  <path d="M70 18 V114 M24 66 H116" stroke="#4a3a8a" stroke-width="4"/>
  <!-- background bubbles -->
  <g fill="none" stroke="#c6b6ff" stroke-opacity="0.3" stroke-width="2">
    <circle cx="580" cy="60" r="9"/><circle cx="604" cy="104" r="5"/><circle cx="560" cy="130" r="4"/><circle cx="150" cy="40" r="6"/><circle cx="250" cy="70" r="4"/><circle cx="400" cy="40" r="7"/>
  </g>

  <!-- shelf -->
  <rect x="56" y="286" width="532" height="20" rx="8" fill="#000" opacity="0.25"/>
  <rect x="52" y="280" width="532" height="20" rx="8" fill="url(#shelf)"/>
  <rect x="60" y="282" width="516" height="3" fill="#fff" opacity="0.25"/>
  <g fill="#000" opacity="0.28">
    <ellipse cx="115" cy="281" rx="26" ry="5"/><ellipse cx="195" cy="281" rx="26" ry="5"/><ellipse cx="315" cy="281" rx="26" ry="5"/><ellipse cx="445" cy="281" rx="26" ry="5"/><ellipse cx="525" cy="281" rx="26" ry="5"/>
  </g>

  <!-- tube 1 -->
  <g clip-path="url(#t1)">
    <rect x="90" y="236" width="50" height="50" fill="url(#red)"/>
    <rect x="90" y="204" width="50" height="32" fill="url(#blu)"/>
    <rect x="90" y="172" width="50" height="32" fill="url(#yel)"/>
    <rect x="90" y="140" width="50" height="32" fill="url(#grn)"/>
    <rect x="90" y="140" width="50" height="3" fill="#fff" opacity="0.45"/>
  </g>
  <!-- tube 2 -->
  <g clip-path="url(#t2)">
    <rect x="170" y="236" width="50" height="50" fill="url(#tea)"/>
    <rect x="170" y="204" width="50" height="32" fill="url(#org)"/>
    <rect x="170" y="172" width="50" height="32" fill="url(#pur)"/>
    <rect x="170" y="172" width="50" height="3" fill="#fff" opacity="0.45"/>
  </g>
  <!-- tube 5 (receiving) -->
  <g clip-path="url(#t5)">
    <rect x="290" y="236" width="50" height="50" fill="url(#pnk)"/>
    <rect x="290" y="204" width="50" height="32" fill="url(#pnk)"/>
    <rect x="290" y="198" width="50" height="7" fill="url(#pnk)"/>
    <rect x="290" y="197" width="50" height="3" fill="#fff" opacity="0.5"/>
  </g>
  <!-- tube 3 -->
  <g clip-path="url(#t3)">
    <rect x="420" y="236" width="50" height="50" fill="url(#yel)"/>
    <rect x="420" y="204" width="50" height="32" fill="url(#red)"/>
    <rect x="420" y="172" width="50" height="32" fill="url(#tea)"/>
    <rect x="420" y="140" width="50" height="32" fill="url(#blu)"/>
    <rect x="420" y="140" width="50" height="3" fill="#fff" opacity="0.45"/>
  </g>
  <!-- tube 4: sorted, corked -->
  <g clip-path="url(#t4)">
    <rect x="500" y="140" width="50" height="146" fill="url(#grn)"/>
    <rect x="500" y="140" width="50" height="3" fill="#fff" opacity="0.45"/>
  </g>
  <!-- glass outlines -->
  <g fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="3">
    <path d="M92 124 V262 A23 23 0 0 0 138 262 V124"/>
    <path d="M172 124 V262 A23 23 0 0 0 218 262 V124"/>
    <path d="M292 124 V262 A23 23 0 0 0 338 262 V124"/>
    <path d="M422 124 V262 A23 23 0 0 0 468 262 V124"/>
    <path d="M502 124 V262 A23 23 0 0 0 548 262 V124"/>
  </g>
  <g fill="url(#glass)" opacity="0.9">
    <rect x="96" y="134" width="14" height="120" rx="7"/><rect x="176" y="134" width="14" height="120" rx="7"/><rect x="296" y="134" width="14" height="120" rx="7"/><rect x="426" y="134" width="14" height="120" rx="7"/><rect x="506" y="134" width="14" height="120" rx="7"/>
  </g>
  <g fill="#eef0ff">
    <rect x="86" y="119" width="58" height="9" rx="4.5"/><rect x="166" y="119" width="58" height="9" rx="4.5"/><rect x="286" y="119" width="58" height="9" rx="4.5"/><rect x="416" y="119" width="58" height="9" rx="4.5"/><rect x="496" y="119" width="58" height="9" rx="4.5"/>
  </g>
  <!-- cork on the finished tube -->
  <rect x="500" y="98" width="50" height="30" rx="7" fill="#c98a50"/>
  <rect x="500" y="98" width="50" height="10" rx="5" fill="#e3ad78"/>
  <g fill="#7a4a20" opacity="0.6"><circle cx="512" cy="114" r="2.5"/><circle cx="532" cy="118" r="2.5"/><circle cx="540" cy="108" r="2"/></g>
  <!-- sparkles around the sorted tube -->
  <g fill="#fff6a8">
    <path d="M572 92 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
    <path d="M482 86 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
    <path d="M590 160 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z"/>
  </g>

  <!-- pouring tube, tilted over the middle tube -->
  <g transform="translate(318 106) rotate(-104)">
    <clipPath id="tp"><path d="M-19 6 V120 A19 19 0 0 0 19 120 V6 Z"/></clipPath>
    <g clip-path="url(#tp)">
      <rect x="-25" y="6" width="50" height="30" fill="url(#pnk)"/>
      <rect x="-25" y="36" width="50" height="40" fill="url(#org)"/>
      <rect x="-25" y="76" width="50" height="70" fill="url(#tea)"/>
    </g>
    <path d="M-23 0 V120 A23 23 0 0 0 23 120 V0" fill="none" stroke="#fff" stroke-opacity="0.65" stroke-width="3"/>
    <rect x="-29" y="-5" width="58" height="9" rx="4.5" fill="#eef0ff"/>
    <rect x="-19" y="12" width="12" height="96" rx="6" fill="#fff" opacity="0.3"/>
  </g>
  <!-- stream -->
  <path d="M322 110 Q318 150 315 198" fill="none" stroke="url(#pnk)" stroke-width="9" stroke-linecap="round"/>
  <path d="M321 112 Q317 150 314 196" fill="none" stroke="#ffd0f0" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <g fill="#ff9be0"><circle cx="300" cy="190" r="3"/><circle cx="330" cy="186" r="2.5"/><circle cx="306" cy="180" r="2"/></g>

  <!-- title -->
  <g font-family="Fredoka, 'Trebuchet MS', Arial Rounded MT Bold, sans-serif" font-weight="700" font-size="58" text-anchor="middle">
    <text x="320" y="347" fill="#140d33" stroke="#140d33" stroke-width="12" stroke-linejoin="round" opacity="0.85">Color Sort</text>
    <text x="320" y="347"><tspan fill="#ff4757">C</tspan><tspan fill="#ff9f1c">o</tspan><tspan fill="#ffe14d">l</tspan><tspan fill="#a3e635">o</tspan><tspan fill="#22c55e">r</tspan><tspan> </tspan><tspan fill="#38bdf8">S</tspan><tspan fill="#6d85ff">o</tspan><tspan fill="#c084fc">r</tspan><tspan fill="#ff6fcf">t</tspan></text>
  </g>
</svg>
