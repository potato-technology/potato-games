<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Wave Rider game card: a jet ski flying off a ramp over a tropical lagoon -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fd6dc"/>
      <stop offset="0.55" stop-color="#14a3cc"/>
      <stop offset="1" stop-color="#0b6f9e"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c4fa8"/>
      <stop offset="0.3" stop-color="#2f8fff"/>
      <stop offset="0.5" stop-color="#9fd0ff"/>
      <stop offset="0.7" stop-color="#2f8fff"/>
      <stop offset="1" stop-color="#1c4fa8"/>
    </linearGradient>
    <linearGradient id="hull2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b04a18"/>
      <stop offset="0.5" stop-color="#ffb07a"/>
      <stop offset="1" stop-color="#b04a18"/>
    </linearGradient>
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ffd447"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6f6ff"/>
    </linearGradient>
    <linearGradient id="title2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a0"/>
      <stop offset="1" stop-color="#ffb81f"/>
    </linearGradient>
    <radialGradient id="helmet" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#2f8fff"/>
      <stop offset="1" stop-color="#123f88"/>
    </radialGradient>
    <pattern id="caustic" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M0 30 L22 18 L48 26 L62 6 M48 26 L58 52 L80 46 M58 52 L40 72 L14 64 L0 70 M14 64 L22 18 M40 72 L44 80 M62 6 L80 12" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#sea)"/>
  <rect width="640" height="360" fill="url(#caustic)"/>
  <!-- swells -->
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M-20 120 Q160 90 340 120 T700 110" stroke-opacity="0.18" stroke-width="10"/>
    <path d="M-20 250 Q160 220 340 250 T700 240" stroke-opacity="0.15" stroke-width="10"/>
  </g>

  <!-- island -->
  <g>
    <path d="M500 40 Q560 10 640 30 L640 150 Q590 170 540 140 Q480 110 500 40 Z" fill="#7ee6e0" opacity="0.55"/>
    <path d="M515 48 Q565 22 640 40 L640 135 Q590 152 548 128 Q500 102 515 48 Z" fill="#f2dca0" stroke="#fff" stroke-width="3"/>
    <path d="M540 58 Q580 40 640 54 L640 115 Q600 128 565 110 Q530 92 540 58 Z" fill="#5cbf52"/>
    <g transform="translate(590 78)"><g fill="#3f9a3a"><path d="M0 0 q14 -9 30 -2 q-16 6 -30 2z" transform="rotate(10)"/><path d="M0 0 q14 -9 30 -2 q-16 6 -30 2z" transform="rotate(80)"/><path d="M0 0 q14 -9 30 -2 q-16 6 -30 2z" transform="rotate(150)"/><path d="M0 0 q14 -9 30 -2 q-16 6 -30 2z" transform="rotate(220)"/><path d="M0 0 q14 -9 30 -2 q-16 6 -30 2z" transform="rotate(290)"/></g><circle r="5" fill="#8a5a2a"/></g>
    <g transform="translate(560 96) scale(0.8)"><g fill="#57b84a"><path d="M0 0 q14 -9 30 -2 q-16 6 -30 2z" transform="rotate(40)"/><path d="M0 0 q14 -9 30 -2 q-16 6 -30 2z" transform="rotate(110)"/><path d="M0 0 q14 -9 30 -2 q-16 6 -30 2z" transform="rotate(180)"/><path d="M0 0 q14 -9 30 -2 q-16 6 -30 2z" transform="rotate(250)"/><path d="M0 0 q14 -9 30 -2 q-16 6 -30 2z" transform="rotate(320)"/></g><circle r="5" fill="#8a5a2a"/></g>
  </g>

  <!-- buoys -->
  <g>
    <circle cx="96" cy="230" r="20" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="3"/>
    <circle cx="100" cy="234" r="13" fill="#003a55" opacity="0.35"/>
    <circle cx="96" cy="230" r="13" fill="#ff4d3c"/><circle cx="96" cy="230" r="7.5" fill="none" stroke="#fff" stroke-width="3.5"/>
    <path d="M48 230 l10 -9 v5 h12 v8 h-12 v5 z" fill="#ff4d3c" stroke="#7a1810" stroke-width="1.5"/>
    <circle cx="560" cy="250" r="20" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="3"/>
    <circle cx="564" cy="254" r="13" fill="#003a55" opacity="0.35"/>
    <circle cx="560" cy="250" r="13" fill="#ffd02a"/><circle cx="560" cy="250" r="7.5" fill="none" stroke="#fff" stroke-width="3.5"/>
    <path d="M608 250 l-10 -9 v5 h-12 v8 h12 v5 z" fill="#ffd02a" stroke="#7a5a00" stroke-width="1.5"/>
  </g>

  <!-- ramp -->
  <g transform="translate(250 268) rotate(-12)">
    <rect x="-60" y="-30" width="120" height="60" rx="8" fill="#003a55" opacity="0.3" transform="translate(8 8)"/>
    <rect x="-60" y="-30" width="120" height="60" rx="8" fill="url(#ramp)" stroke="#a0501a" stroke-width="3"/>
    <path d="M-38 -16 l14 16 l-14 16 M-10 -16 l14 16 l-14 16 M18 -16 l14 16 l-14 16" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" stroke-opacity="0.9"/>
    <rect x="52" y="-30" width="8" height="60" fill="#fff"/>
  </g>
  <!-- wake trailing into the ramp -->
  <path d="M60 330 Q140 300 200 285" fill="none" stroke="#fff" stroke-opacity="0.75" stroke-width="16" stroke-linecap="round"/>
  <path d="M40 345 Q130 320 196 296 M80 350 Q150 318 204 276" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>

  <!-- rival jet ski -->
  <g transform="translate(420 300) rotate(-20)">
    <path d="M42 0 Q26 -14 -8 -15 L-38 -13 Q-44 0 -38 13 L-8 15 Q26 14 42 0 Z" fill="url(#hull2)" stroke="#5a2408" stroke-width="2"/>
    <rect x="-30" y="-6" width="26" height="12" rx="5" fill="#20252f"/>
    <circle cx="-14" cy="0" r="8" fill="#ff8a3c" stroke="#5a2408" stroke-width="1.5"/>
    <path d="M-44 -6 Q-90 0 -44 6" fill="#fff" opacity="0.6"/>
  </g>

  <!-- the hero, flying! -->
  <ellipse cx="350" cy="250" rx="62" ry="18" fill="#003a55" opacity="0.25"/>
  <g transform="translate(360 168) rotate(-24) scale(1.9)">
    <path d="M38 0 Q23 -13 -6 -13.5 L-34 -12.5 Q-40 0 -34 12.5 L-6 13.5 Q23 13 38 0 Z" fill="url(#hull)" stroke="#0d2a5a" stroke-width="1.6"/>
    <path d="M27 -6 Q5 -12 -28 -10.5 M27 6 Q5 12 -28 10.5" fill="none" stroke="#fff" stroke-width="1.6"/>
    <path d="M17 -6 Q23 0 17 6 L13 0 Z" fill="#a0dcff"/>
    <rect x="-28" y="-6" width="27" height="12" rx="5.5" fill="#20252f"/>
    <path d="M6 -12 L8 0 L6 12" fill="none" stroke="#1b2028" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-10 -7 L6 -11 M-10 7 L6 11" stroke="#1c4fa8" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="-12" cy="0" rx="7" ry="9.5" fill="#1c4fa8"/>
    <rect x="-13.2" y="-8" width="2.4" height="16" fill="#fff"/>
    <circle cx="-5" cy="0" r="6.5" fill="url(#helmet)" stroke="#0d1a33" stroke-width="1"/>
    <path d="M-5 -6.5 A6.5 6.5 0 0 1 -5 6.5 Z" fill="#1b2a3a" transform="rotate(-90 -5 0) rotate(90 -5 0)"/>
  </g>
  <!-- spray off the ramp -->
  <g fill="#fff">
    <circle cx="300" cy="226" r="5" opacity="0.9"/><circle cx="288" cy="210" r="4" opacity="0.8"/><circle cx="312" cy="206" r="3.5" opacity="0.8"/><circle cx="276" cy="232" r="3" opacity="0.7"/><circle cx="296" cy="190" r="3" opacity="0.6"/>
  </g>
  <g stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="270" y1="196" x2="244" y2="206"/><line x1="276" y1="178" x2="254" y2="184"/>
  </g>

  <!-- title -->
  <g font-family="Fredoka, 'Trebuchet MS', Arial, sans-serif" font-weight="700" font-size="72" text-anchor="middle" stroke-linejoin="round">
    <text x="300" y="86" fill="#063a5a" stroke="#063a5a" stroke-width="14">WAVE RIDER</text>
    <text x="300" y="81" fill="#127fae" stroke="#127fae" stroke-width="9">WAVE RIDER</text>
    <text x="300" y="79"><tspan fill="url(#title)">WAVE </tspan><tspan fill="url(#title2)">RIDER</tspan></text>
  </g>
</svg>
