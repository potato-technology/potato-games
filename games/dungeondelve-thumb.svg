<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Dungeon Delve game card: a little knight swings a sword at a cute slime that bursts into sparkles, with a bat, a skeleton and a glowing treasure chest in a torch-lit dungeon -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2440"/>
      <stop offset="1" stop-color="#3a3458"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f4a72"/>
      <stop offset="1" stop-color="#3a3658"/>
    </linearGradient>
    <radialGradient id="torch" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb84a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff8a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="slime" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#b8f7a8"/>
      <stop offset="0.6" stop-color="#6ee06a"/>
      <stop offset="1" stop-color="#3a9a3a"/>
    </radialGradient>
    <radialGradient id="bat" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#d6b4ff"/>
      <stop offset="1" stop-color="#7a4ac4"/>
    </radialGradient>
    <radialGradient id="metal" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8a96a8"/>
    </radialGradient>
    <radialGradient id="chestGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe08a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffe08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d0904a"/>
      <stop offset="1" stop-color="#8a5420"/>
    </linearGradient>
    <pattern id="bricks" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="url(#wall)"/>
      <rect x="2" y="2" width="20" height="9" rx="2" fill="#4a4470"/>
      <rect x="26" y="2" width="20" height="9" rx="2" fill="#4a4470"/>
      <rect x="-10" y="14" width="20" height="9" rx="2" fill="#4a4470"/>
      <rect x="14" y="14" width="20" height="9" rx="2" fill="#4a4470"/>
      <rect x="38" y="14" width="20" height="9" rx="2" fill="#4a4470"/>
    </pattern>
    <pattern id="tiles" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#4a456c"/>
      <rect width="32" height="32" fill="#524d78"/>
      <rect x="32" y="32" width="32" height="32" fill="#524d78"/>
      <path d="M0 63 H64 M63 0 V64" stroke="#000" stroke-opacity="0.15" stroke-width="2"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- walls and floor -->
  <rect width="640" height="360" fill="url(#tiles)"/>
  <rect width="640" height="120" fill="url(#bricks)"/>
  <rect y="112" width="640" height="10" fill="#000" opacity="0.3"/>
  <rect y="122" width="640" height="30" fill="#000" opacity="0.15"/>
  <!-- torches -->
  <g>
    <circle cx="110" cy="70" r="80" fill="url(#torch)"/>
    <circle cx="530" cy="70" r="80" fill="url(#torch)"/>
    <rect x="104" y="72" width="12" height="24" rx="3" fill="#5a3a20"/>
    <rect x="524" y="72" width="12" height="24" rx="3" fill="#5a3a20"/>
    <path d="M98 74 Q 100 50 110 40 Q 120 50 122 74 Z" fill="#ff9f1c"/>
    <path d="M104 74 Q 105 60 110 54 Q 115 60 116 74 Z" fill="#fff3a0"/>
    <path d="M518 74 Q 520 50 530 40 Q 540 50 542 74 Z" fill="#ff9f1c"/>
    <path d="M524 74 Q 525 60 530 54 Q 535 60 536 74 Z" fill="#fff3a0"/>
  </g>
  <!-- crystals on the floor -->
  <g opacity="0.7">
    <path d="M40 330 L 48 304 L 56 330 Z" fill="#7af0ff"/><path d="M54 330 L 60 314 L 66 330 Z" fill="#b48cff"/>
    <path d="M590 250 L 598 224 L 606 250 Z" fill="#7af0ff"/><path d="M604 250 L 610 236 L 616 250 Z" fill="#b48cff"/>
  </g>

  <!-- treasure chest -->
  <circle cx="540" cy="300" r="70" fill="url(#chestGlow)"/>
  <g transform="translate(540 300)" filter="url(#sh)">
    <rect x="-36" y="-14" width="72" height="40" rx="6" fill="url(#chest)" stroke="#4a2a10" stroke-width="3"/>
    <path d="M-36 -14 Q 0 -50 36 -14 Z" fill="#b8783e" stroke="#4a2a10" stroke-width="3" transform="rotate(-18 -36 -14)"/>
    <rect x="-36" y="-2" width="72" height="5" fill="#ffd43b"/>
    <rect x="-5" y="-12" width="10" height="16" fill="#ffd43b"/>
    <g fill="#6ee7ff"><path d="M-12 -24 l6 -8 l6 8 l-6 8 Z"/><path d="M8 -30 l5 -7 l5 7 l-5 7 Z" fill="#ff7ab8"/></g>
  </g>

  <!-- skeleton (cute) -->
  <g transform="translate(440 200)" filter="url(#sh)">
    <ellipse cx="0" cy="44" rx="20" ry="6" fill="#000" opacity="0.25"/>
    <path d="M-6 18 L -8 40 M6 18 L 8 40" stroke="#f4efe8" stroke-width="5" stroke-linecap="round"/>
    <rect x="-12" y="-4" width="24" height="22" rx="7" fill="#3a3040" opacity="0.6"/>
    <path d="M0 -6 V 18 M-11 2 Q 0 6 11 2 M-11 9 Q 0 13 11 9" stroke="#f4efe8" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M-12 -2 L -22 10 M12 -2 L 22 -10" stroke="#f4efe8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-24" r="18" fill="#fbf8f2" stroke="#5a5048" stroke-width="2"/>
    <rect x="-10" y="-14" width="20" height="10" rx="4" fill="#ece4d8"/>
    <ellipse cx="-7" cy="-26" rx="5" ry="6" fill="#2a2030"/><ellipse cx="7" cy="-26" rx="5" ry="6" fill="#2a2030"/>
    <circle cx="-6" cy="-25" r="2" fill="#7af0ff"/><circle cx="8" cy="-25" r="2" fill="#7af0ff"/>
  </g>

  <!-- bat -->
  <g transform="translate(330 150)" filter="url(#sh)">
    <path d="M10 -4 Q 36 -30 54 -8 Q 44 -6 46 4 Q 34 0 32 10 Q 22 4 10 6 Z" fill="#7a4ac4" stroke="#3a1a6a" stroke-width="2"/>
    <path d="M-10 -4 Q -36 -30 -54 -8 Q -44 -6 -46 4 Q -34 0 -32 10 Q -22 4 -10 6 Z" fill="#7a4ac4" stroke="#3a1a6a" stroke-width="2"/>
    <circle r="18" fill="url(#bat)" stroke="#3a1a6a" stroke-width="2"/>
    <path d="M-12 -12 L -8 -26 L -2 -14 Z M12 -12 L 8 -26 L 2 -14 Z" fill="#a070e0"/>
    <circle cx="-6" cy="-2" r="5" fill="#fff"/><circle cx="6" cy="-2" r="5" fill="#fff"/>
    <circle cx="-5" cy="-1" r="2.6" fill="#1d1a24"/><circle cx="7" cy="-1" r="2.6" fill="#1d1a24"/>
    <path d="M-3 7 L -1 11 L 1 7 Z M2 7 L 4 11 L 6 7 Z" fill="#fff"/>
  </g>

  <!-- slime getting poofed into sparkles -->
  <g transform="translate(300 268)">
    <circle r="62" fill="#ffffff" opacity="0.12"/>
    <g fill="#ffffff">
      <path d="M-50 -40 q 4 12 16 16 q -12 4 -16 16 q -4 -12 -16 -16 q 12 -4 16 -16 Z"/>
      <path d="M48 -30 q 3 9 12 12 q -9 3 -12 12 q -3 -9 -12 -12 q 9 -3 12 -12 Z"/>
      <path d="M40 34 q 3 8 10 10 q -7 2 -10 10 q -2 -8 -10 -10 q 8 -2 10 -10 Z"/>
    </g>
    <g fill="#ffe066"><path d="M-30 30 q 3 8 10 10 q -7 2 -10 10 q -2 -8 -10 -10 q 8 -2 10 -10 Z"/><circle cx="10" cy="-52" r="4"/></g>
    <g fill="#ff8cc6"><circle cx="-56" cy="10" r="4"/><circle cx="58" cy="0" r="3.5"/></g>
    <g fill="#7af0ff"><circle cx="-20" cy="-56" r="3.5"/><circle cx="24" cy="52" r="3.5"/></g>
    <path d="M-34 20 C -40 -6 -22 -34 0 -34 C 22 -34 40 -6 34 20 Q 0 30 -34 20 Z" fill="url(#slime)" stroke="#2a6a2a" stroke-width="3"/>
    <ellipse cx="-12" cy="-20" rx="8" ry="5" fill="#ffffff" opacity="0.75" transform="rotate(-25 -12 -20)"/>
    <path d="M-16 -4 l 8 6 M-16 2 l 8 -6 M8 -4 l 8 6 M8 2 l 8 -6" stroke="#1d1a24" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="0" cy="12" rx="5" ry="4" fill="#1d1a24"/>
  </g>

  <!-- the knight -->
  <g transform="translate(160 260)" filter="url(#sh)">
    <ellipse cx="0" cy="40" rx="30" ry="9" fill="#000" opacity="0.3"/>
    <!-- cape -->
    <path d="M-18 -8 Q -46 18 -14 30 L 12 4 Z" fill="#b8242a"/>
    <!-- feet -->
    <ellipse cx="-12" cy="34" rx="11" ry="7" fill="#3a3448"/><ellipse cx="12" cy="34" rx="11" ry="7" fill="#3a3448"/>
    <!-- body -->
    <ellipse cx="0" cy="8" rx="26" ry="26" fill="url(#metal)" stroke="#2a2a3a" stroke-width="3"/>
    <rect x="-24" y="14" width="48" height="6" fill="#ffd43b"/>
    <!-- shield -->
    <path d="M-40 -4 H -16 V 14 Q -28 30 -40 14 Z" fill="#ff5e5e" stroke="#2a2a3a" stroke-width="3"/>
    <rect x="-30" y="-2" width="4" height="22" fill="#ffd43b"/>
    <!-- helmet -->
    <circle cx="0" cy="-28" r="24" fill="url(#metal)" stroke="#2a2a3a" stroke-width="3"/>
    <rect x="-14" y="-36" width="34" height="14" rx="6" fill="#1d1a24"/>
    <circle cx="-2" cy="-29" r="3.5" fill="#9ff0ff"/><circle cx="11" cy="-29" r="3.5" fill="#9ff0ff"/>
    <path d="M0 -50 Q -22 -74 -36 -48 Q -18 -58 0 -46 Z" fill="#ff5e5e"/>
    <circle cx="0" cy="-50" r="5" fill="#ffd43b"/>
  </g>
  <!-- sword swing -->
  <path d="M196 196 A 96 96 0 0 1 252 318 L 226 296 A 62 62 0 0 0 190 230 Z" fill="#ffffff" opacity="0.55"/>
  <g transform="translate(196 252) rotate(-20)" filter="url(#sh)">
    <rect x="-6" y="-4" width="12" height="8" fill="#8a5420"/>
    <rect x="4" y="-12" width="6" height="24" fill="#ffd43b"/>
    <path d="M10 -6 L 82 -4 L 94 0 L 82 4 L 10 6 Z" fill="#eef4fa" stroke="#2a2a3a" stroke-width="2.5"/>
    <rect x="14" y="-1.5" width="64" height="2" fill="#ffffff"/>
  </g>

  <!-- title -->
  <g font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" text-anchor="middle">
    <text x="320" y="86" font-size="62" fill="#3e2580" stroke="#3e2580" stroke-width="12" stroke-linejoin="round">Dungeon Delve</text>
    <text x="320" y="80" font-size="62" fill="#b48cff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Dungeon Delve</text>
  </g>
</svg>
