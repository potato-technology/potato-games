<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Goal Rush game card: a striker in blue blasts a glowing ball past a diving goalie into the net, under floodlights with a cheering crowd -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1430"/>
      <stop offset="1" stop-color="#25335a"/>
    </linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3448"/>
      <stop offset="1" stop-color="#3a4660"/>
    </linearGradient>
    <linearGradient id="grassA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4cb050"/>
      <stop offset="1" stop-color="#3a9a3e"/>
    </linearGradient>
    <radialGradient id="flood" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbe0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fffbe0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d0d8"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd43b" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffb02e" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff3a0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff9f1c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jersey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a9bff"/>
      <stop offset="1" stop-color="#1864c8"/>
    </linearGradient>
    <linearGradient id="kjersey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd86f"/>
      <stop offset="1" stop-color="#2b9a3e"/>
    </linearGradient>
    <pattern id="net" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 0 L12 12 M12 0 L0 12" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.2"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- night sky, floodlights and stands -->
  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="70" cy="30" r="90" fill="url(#flood)" opacity="0.6"/>
  <circle cx="570" cy="30" r="90" fill="url(#flood)" opacity="0.6"/>
  <g fill="#fffbe6"><rect x="48" y="16" width="44" height="14" rx="3"/><rect x="548" y="16" width="44" height="14" rx="3"/></g>
  <rect x="0" y="60" width="640" height="90" fill="url(#stand)"/>
  <g>
    <g fill="#ff6b6b"><circle cx="20" cy="82" r="7"/><circle cx="110" cy="96" r="7"/><circle cx="215" cy="80" r="7"/><circle cx="330" cy="98" r="7"/><circle cx="440" cy="82" r="7"/><circle cx="545" cy="96" r="7"/></g>
    <g fill="#4dabf7"><circle cx="45" cy="98" r="7"/><circle cx="140" cy="80" r="7"/><circle cx="250" cy="96" r="7"/><circle cx="360" cy="80" r="7"/><circle cx="470" cy="98" r="7"/><circle cx="600" cy="80" r="7"/></g>
    <g fill="#ffd43b"><circle cx="75" cy="80" r="7"/><circle cx="180" cy="98" r="7"/><circle cx="290" cy="80" r="7"/><circle cx="400" cy="96" r="7"/><circle cx="505" cy="80" r="7"/><circle cx="625" cy="98" r="7"/></g>
    <g fill="#3ee07a"><circle cx="5" cy="118" r="7"/><circle cx="95" cy="118" r="7"/><circle cx="195" cy="120" r="7"/><circle cx="305" cy="118" r="7"/><circle cx="415" cy="120" r="7"/><circle cx="520" cy="118" r="7"/><circle cx="615" cy="120" r="7"/></g>
    <g fill="#ffffff"><circle cx="50" cy="122" r="7"/><circle cx="150" cy="120" r="7"/><circle cx="255" cy="122" r="7"/><circle cx="360" cy="122" r="7"/><circle cx="470" cy="122" r="7"/><circle cx="570" cy="122" r="7"/></g>
    <g fill="#f1c27d"><circle cx="20" cy="73" r="4.5"/><circle cx="110" cy="87" r="4.5"/><circle cx="215" cy="71" r="4.5"/><circle cx="330" cy="89" r="4.5"/><circle cx="440" cy="73" r="4.5"/><circle cx="545" cy="87" r="4.5"/><circle cx="45" cy="89" r="4.5"/><circle cx="140" cy="71" r="4.5"/><circle cx="250" cy="87" r="4.5"/><circle cx="360" cy="71" r="4.5"/><circle cx="470" cy="89" r="4.5"/><circle cx="600" cy="71" r="4.5"/><circle cx="75" cy="71" r="4.5"/><circle cx="180" cy="89" r="4.5"/><circle cx="290" cy="71" r="4.5"/><circle cx="400" cy="87" r="4.5"/><circle cx="505" cy="71" r="4.5"/><circle cx="625" cy="89" r="4.5"/></g>
    <g fill="#c68642"><circle cx="5" cy="109" r="4.5"/><circle cx="95" cy="109" r="4.5"/><circle cx="195" cy="111" r="4.5"/><circle cx="305" cy="109" r="4.5"/><circle cx="415" cy="111" r="4.5"/><circle cx="520" cy="109" r="4.5"/><circle cx="615" cy="111" r="4.5"/><circle cx="50" cy="113" r="4.5"/><circle cx="150" cy="111" r="4.5"/><circle cx="255" cy="113" r="4.5"/><circle cx="360" cy="113" r="4.5"/><circle cx="470" cy="113" r="4.5"/><circle cx="570" cy="113" r="4.5"/></g>
  </g>
  <!-- ad boards -->
  <g font-family="Nunito, sans-serif" font-weight="900" font-size="11" text-anchor="middle">
    <rect x="0" y="142" width="160" height="16" fill="#ff6b5a"/><text x="80" y="154" fill="#fff">GOAL RUSH</text>
    <rect x="160" y="142" width="160" height="16" fill="#1c7ed6"/><text x="240" y="154" fill="#fff">PLAY FAIR</text>
    <rect x="320" y="142" width="160" height="16" fill="#ffd43b"/><text x="400" y="154" fill="#3a2a00">GO TEAM!</text>
    <rect x="480" y="142" width="160" height="16" fill="#3ee07a"/><text x="560" y="154" fill="#063a1a">SUPER SHOT</text>
  </g>
  <!-- pitch with stripes -->
  <rect x="0" y="158" width="640" height="202" fill="url(#grassA)"/>
  <g fill="#43a047"><rect x="0" y="158" width="64" height="202"/><rect x="128" y="158" width="64" height="202"/><rect x="256" y="158" width="64" height="202"/><rect x="384" y="158" width="64" height="202"/><rect x="512" y="158" width="64" height="202"/></g>
  <g stroke="#ffffff" stroke-opacity="0.85" stroke-width="3" fill="none">
    <path d="M440 170 H 640"/>
    <path d="M470 170 V 350 H 640"/>
    <path d="M470 260 A 50 50 0 0 0 470 260"/>
    <path d="M60 170 A 70 70 0 0 1 60 350" stroke-opacity="0.5"/>
  </g>

  <!-- goal with net -->
  <g filter="url(#sh)">
    <path d="M520 196 L 600 186 L 600 330 L 520 316 Z" fill="url(#net)"/>
    <path d="M520 196 L 600 186 L 600 330 L 520 316" fill="none" stroke="#d8dde3" stroke-width="3"/>
    <path d="M520 196 V 316" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <path d="M520 196 L 600 186" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- diving goalie -->
  <g transform="translate(540 236) rotate(-60)" filter="url(#sh)">
    <ellipse cx="0" cy="0" rx="22" ry="14" fill="url(#kjersey)" stroke="#1a5a24" stroke-width="2"/>
    <rect x="-34" y="-9" width="16" height="16" rx="5" fill="#1a1a1a"/>
    <circle cx="-38" cy="-6" r="5" fill="#222"/><circle cx="-36" cy="6" r="5" fill="#222"/>
    <circle cx="30" cy="0" r="11" fill="#e0ac69"/>
    <path d="M30 -11 A 11 11 0 0 1 30 11" fill="#2b1b10"/>
    <circle cx="20" cy="-18" r="7" fill="#ff6b5a"/><circle cx="22" cy="18" r="7" fill="#ff6b5a"/>
  </g>

  <!-- the shot -->
  <path d="M250 262 Q 380 228 498 220" stroke="url(#trail)" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M300 250 Q 400 226 490 220" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="502" cy="219" r="34" fill="url(#glow)"/>
  <g transform="translate(502 219)">
    <circle r="15" fill="url(#ball)" stroke="#333" stroke-width="1.5"/>
    <path d="M0 -6 L5.7 -1.9 L3.5 4.9 L-3.5 4.9 L-5.7 -1.9 Z" fill="#26262c"/>
    <path d="M-13 -6 L-8 -9 M13 -6 L8 -9 M-9 10 L-5 13 M9 10 L5 13" stroke="#26262c" stroke-width="3"/>
    <circle cx="-5" cy="-6" r="3.5" fill="#ffffff" opacity="0.9"/>
  </g>
  <g fill="#ffffff"><path d="M470 180 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z"/><path d="M560 278 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 Z"/></g>

  <!-- the striker -->
  <g transform="translate(222 268)" filter="url(#sh)">
    <ellipse cx="2" cy="44" rx="30" ry="8" fill="#000" opacity="0.25"/>
    <!-- kicking leg -->
    <path d="M6 14 L 30 26" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="34" cy="28" rx="9" ry="6" fill="#1e1e24"/>
    <!-- standing leg -->
    <path d="M-6 14 L -10 38" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="-12" cy="41" rx="9" ry="5" fill="#1e1e24"/>
    <rect x="-16" y="4" width="30" height="14" rx="5" fill="#ffffff" stroke="#c0c6cc" stroke-width="1.5"/>
    <!-- arms -->
    <path d="M-16 -18 L -34 -32" stroke="#3a9bff" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-36" cy="-34" r="5" fill="#f1c27d"/>
    <path d="M16 -18 L 30 -4" stroke="#3a9bff" stroke-width="8" stroke-linecap="round"/>
    <circle cx="32" cy="-2" r="5" fill="#f1c27d"/>
    <ellipse cx="0" cy="-12" rx="19" ry="19" fill="url(#jersey)" stroke="#0c3f80" stroke-width="2"/>
    <text x="-2" y="-5" font-family="Nunito, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">9</text>
    <circle cx="4" cy="-44" r="15" fill="#f1c27d" stroke="#a87a48" stroke-width="1.5"/>
    <path d="M-11 -46 A 15 15 0 0 1 19 -48 Q 8 -54 -11 -46 Z" fill="#2b1b10"/>
    <circle cx="9" cy="-43" r="2.4" fill="#1d1a17"/><circle cx="17" cy="-43" r="2.4" fill="#1d1a17"/>
    <path d="M9 -36 Q 14 -32 19 -36" stroke="#1d1a17" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- grass bits -->
  <g fill="#7fd66a"><rect x="250" y="296" width="5" height="3" rx="1"/><rect x="262" y="288" width="4" height="3" rx="1"/><rect x="242" y="302" width="4" height="3" rx="1"/></g>

  <!-- title -->
  <g font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" text-anchor="middle">
    <text x="250" y="66" font-size="64" fill="#0f5a2a" stroke="#0f5a2a" stroke-width="12" stroke-linejoin="round">Goal Rush</text>
    <text x="250" y="60" font-size="64" fill="#3ee07a" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Goal Rush</text>
  </g>
</svg>
