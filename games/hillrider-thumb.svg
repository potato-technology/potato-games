<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Hill Rider game card: a jeep flying over green hills, chasing coins -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa6f0"/>
      <stop offset="0.65" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#eef9ff"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="0.35" stop-color="#fff3b8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff3b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6cde6"/>
      <stop offset="1" stop-color="#cfe6f2"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ccb84"/>
      <stop offset="1" stop-color="#5f9f55"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a32"/>
      <stop offset="0.5" stop-color="#6a4223"/>
      <stop offset="1" stop-color="#3f2614"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a80"/>
      <stop offset="0.45" stop-color="#e8413c"/>
      <stop offset="1" stop-color="#9c1f1b"/>
    </linearGradient>
    <radialGradient id="rim" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c9ced8"/>
      <stop offset="1" stop-color="#6b7180"/>
    </radialGradient>
    <linearGradient id="helmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.5" stop-color="#ffc23c"/>
      <stop offset="1" stop-color="#ff8a1c"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="1" stop-color="#e0a01e"/>
    </linearGradient>
    <linearGradient id="can" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b5e"/>
      <stop offset="0.5" stop-color="#e8413c"/>
      <stop offset="1" stop-color="#a8221e"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset="0.65" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.28"/>
    </radialGradient>
    <g id="wheel">
      <circle r="24" fill="#1b1d22"/>
      <circle r="24" fill="none" stroke="#0c0d10" stroke-width="5" stroke-dasharray="5 4"/>
      <circle r="14" fill="url(#rim)"/>
      <circle r="4.5" fill="#5b6170"/>
      <g fill="#000" fill-opacity="0.3"><ellipse cx="8" cy="0" rx="3" ry="2"/><ellipse cx="-4" cy="7" rx="3" ry="2" transform="rotate(120 -4 7)"/><ellipse cx="-4" cy="-7" rx="3" ry="2" transform="rotate(-120 -4 -7)"/></g>
    </g>
    <g id="coinG">
      <circle r="13" fill="#a87400"/>
      <circle r="12" cy="-1" fill="url(#coin)"/>
      <circle r="7.5" cy="-1" fill="none" stroke="#b07c00" stroke-width="2"/>
    </g>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="540" cy="70" r="90" fill="url(#sun)"/>
  <circle cx="540" cy="70" r="30" fill="#fffbe6"/>
  <!-- clouds -->
  <g fill="#fff">
    <g opacity="0.95"><circle cx="90" cy="70" r="22"/><circle cx="118" cy="58" r="28"/><circle cx="150" cy="70" r="20"/><rect x="90" y="70" width="62" height="18"/></g>
    <g opacity="0.9"><circle cx="352" cy="44" r="16"/><circle cx="372" cy="36" r="20"/><circle cx="395" cy="46" r="14"/><rect x="352" y="46" width="44" height="12"/></g>
  </g>
  <!-- far hills -->
  <path d="M0 200 C 70 160 140 170 200 185 S 330 150 400 170 S 540 140 640 175 L640 360 L0 360 Z" fill="url(#far)"/>
  <!-- windmill -->
  <g transform="translate(470 190)">
    <path d="M -6 0 L -3 -36 L 3 -36 L 6 0 Z" fill="#f2efe6"/>
    <path d="M -5 -36 L 0 -44 L 5 -36 Z" fill="#c0504d"/>
    <g transform="translate(0 -38) rotate(20)" fill="#fff"><rect x="-1.5" y="-24" width="3" height="24"/><rect x="-1.5" y="0" width="3" height="24"/><rect x="-24" y="-1.5" width="24" height="3"/><rect x="0" y="-1.5" width="24" height="3"/></g>
  </g>
  <path d="M0 240 C 80 205 150 215 230 230 S 380 200 470 220 S 590 205 640 215 L640 360 L0 360 Z" fill="url(#mid)"/>
  <!-- tree line -->
  <g fill="#4f8e45">
    <circle cx="40" cy="226" r="12"/><circle cx="58" cy="222" r="10"/><circle cx="520" cy="214" r="12"/><circle cx="540" cy="218" r="9"/><circle cx="604" cy="212" r="11"/>
  </g>
  <!-- main ground with a hill and a wooden ramp -->
  <path d="M0 300 C 60 290 110 262 170 258 L 250 230 L 250 300 C 330 318 420 300 470 286 C 530 270 590 278 640 290 L640 360 L0 360 Z" fill="url(#soil)"/>
  <path d="M0 300 C 60 290 110 262 170 258 L 170 270 C 110 274 60 302 0 312 Z" fill="#57c241"/>
  <path d="M250 300 C 330 318 420 300 470 286 C 530 270 590 278 640 290 L 640 302 C 590 290 530 282 470 298 C 420 312 330 330 250 312 Z" fill="#57c241"/>
  <path d="M0 300 C 60 290 110 262 170 258" fill="none" stroke="#8fe36b" stroke-width="3"/>
  <path d="M250 300 C 330 318 420 300 470 286 C 530 270 590 278 640 290" fill="none" stroke="#8fe36b" stroke-width="3"/>
  <!-- ramp -->
  <path d="M170 258 L 250 230 L 250 300 L 170 300 Z" fill="#7a4a26"/>
  <g stroke="#4e2c14" stroke-width="5"><line x1="190" y1="252" x2="190" y2="300"/><line x1="220" y1="241" x2="220" y2="300"/><line x1="246" y1="232" x2="246" y2="300"/></g>
  <g stroke="#4e2c14" stroke-width="3"><line x1="190" y1="300" x2="220" y2="250"/><line x1="220" y1="300" x2="246" y2="240"/></g>
  <path d="M170 258 L 250 230 L 250 240 L 170 268 Z" fill="#c98b4e" stroke="#8a5a2a" stroke-width="1.5"/>
  <!-- pebbles -->
  <g fill="#4a2d17" opacity="0.8"><ellipse cx="60" cy="335" rx="7" ry="4"/><ellipse cx="320" cy="340" rx="8" ry="5"/><ellipse cx="560" cy="330" rx="6" ry="4"/><ellipse cx="430" cy="350" rx="9" ry="5"/></g>
  <!-- fuel can -->
  <g transform="translate(560 282)">
    <ellipse cx="0" cy="2" rx="14" ry="3" fill="#000" opacity="0.25"/>
    <rect x="-12" y="-30" width="24" height="31" rx="4" fill="url(#can)" stroke="#7a1612" stroke-width="1.5"/>
    <rect x="-8" y="-37" width="11" height="8" rx="2" fill="#a8221e"/>
    <rect x="4" y="-38" width="4" height="6" fill="#ffd43b"/>
    <path d="M -8 -26 L 8 -6 M 8 -26 L -8 -6" stroke="#fff" stroke-opacity="0.4" stroke-width="2"/>
  </g>
  <!-- coin arc -->
  <use href="#coinG" x="330" y="150"/>
  <use href="#coinG" x="370" y="132"/>
  <use href="#coinG" x="410" y="124"/>
  <use href="#coinG" x="450" y="128"/>
  <use href="#coinG" x="490" y="142"/>
  <!-- speed lines -->
  <g stroke="#fff" stroke-opacity="0.75" stroke-width="3" stroke-linecap="round">
    <line x1="150" y1="168" x2="196" y2="168"/><line x1="138" y1="186" x2="190" y2="186"/><line x1="160" y1="204" x2="200" y2="204"/>
  </g>
  <!-- the jeep, mid-air -->
  <g transform="translate(290 190) rotate(-14)">
    <!-- shocks -->
    <g stroke="#c9ced8" stroke-width="4"><line x1="-46" y1="10" x2="-46" y2="34"/><line x1="46" y1="10" x2="46" y2="34"/></g>
    <!-- roll bar + driver -->
    <path d="M -40 -14 L -36 -38 L -20 -40" fill="none" stroke="#3a3f4b" stroke-width="4" stroke-linecap="round"/>
    <rect x="-20" y="-33" width="19" height="21" rx="6" fill="#3d7be0"/>
    <path d="M -6 -27 L 9 -23 L 18 -25" fill="none" stroke="#ffd7b0" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-8" cy="-44" r="11" fill="#ffd7b0"/>
    <path d="M -19.5 -42 A 11.6 11.6 0 1 1 4 -40 Z" fill="url(#helmet)" stroke="#000" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="-9.5" y="-55.5" width="3" height="11" fill="#fff"/>
    <ellipse cx="0" cy="-47" rx="5" ry="2.2" fill="#28405a" opacity="0.85"/>
    <circle cx="-2" cy="-42" r="1.6" fill="#2b2b2b"/>
    <path d="M -4 -38 Q -1 -35 2 -38" fill="none" stroke="#7a3d2a" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 26 -14 L 18 -38" stroke="#3a3f4b" stroke-width="3"/>
    <!-- body -->
    <path d="M -66 -16 L 26 -16 L 36 -12 L 68 -10 Q 72 -9 71 -3 L 70 8 L 60 9 A 18 18 0 0 0 26 9 L -26 10 A 18 18 0 0 0 -60 9 L -66 8 Z" fill="url(#body)" stroke="#141826" stroke-width="2.2" stroke-linejoin="round"/>
    <rect x="-60" y="-13" width="80" height="2.5" fill="#fff" opacity="0.35"/>
    <rect x="-66" y="-3" width="136" height="4" fill="#7a1612" opacity="0.7"/>
    <ellipse cx="69" cy="-6" rx="2.2" ry="3.6" fill="#ffe9a0"/>
    <circle cx="-70" cy="-21" r="11" fill="#1b1d22"/><circle cx="-70" cy="-21" r="5.5" fill="#8a90a0"/>
    <!-- wheels -->
    <use href="#wheel" x="-44" y="16"/>
    <use href="#wheel" x="44" y="16"/>
  </g>
  <!-- dust puffs behind -->
  <g fill="#d9b88a" opacity="0.8"><circle cx="196" cy="246" r="9"/><circle cx="182" cy="238" r="6"/><circle cx="210" cy="232" r="5"/></g>

  <rect width="640" height="360" fill="url(#vig)"/>
  <!-- title -->
  <g font-family="Fredoka, 'Trebuchet MS', Arial, sans-serif" font-weight="700" text-anchor="middle">
    <text x="320" y="96" font-size="76" fill="#7a3a00" stroke="#7a3a00" stroke-width="14" stroke-linejoin="round">HILL RIDER</text>
    <text x="320" y="90" font-size="76" fill="url(#title)" stroke="#fff" stroke-width="2.5" stroke-linejoin="round">HILL RIDER</text>
  </g>
</svg>
