<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Putt Party icon: a golf ball rolling up to the cup with a red flag, on a round green -->
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#8fe06a"/>
      <stop offset="1" stop-color="#2f7a2c"/>
    </radialGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e6ebf0"/>
      <stop offset="1" stop-color="#8f99a3"/>
    </radialGradient>
    <linearGradient id="flag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a4a"/>
      <stop offset="1" stop-color="#c0221a"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
  <path d="M8 62 Q50 50 92 62" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.12"/>
  <!-- cup -->
  <ellipse cx="64" cy="72" rx="16" ry="6.5" fill="#0a0a0a" stroke="#ffffff" stroke-width="2.5"/>
  <!-- flag -->
  <rect x="62.5" y="16" width="4" height="56" rx="2" fill="#ffffff"/>
  <path d="M66 18 Q77 14 85 22 Q78 29 66 35 Z" fill="url(#flag)" stroke="#8a1810" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="64.5" cy="16" r="3" fill="#ffd43b"/>
  <!-- ball with a speed trail -->
  <path d="M10 76 Q20 72 28 72" fill="none" stroke="#fff7c2" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <ellipse cx="38" cy="80" rx="11" ry="3.5" fill="#123a12" opacity="0.4"/>
  <circle cx="36" cy="70" r="12" fill="url(#ball)" stroke="#5e6870" stroke-width="1.5"/>
  <ellipse cx="32" cy="65" rx="4" ry="2.6" fill="#ffffff" transform="rotate(-30 32 65)"/>
  <circle cx="50" cy="50" r="47" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.5"/>
</svg>
