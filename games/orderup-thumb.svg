<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Order Up! game card: a happy customer at the diner holding up a big burger -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf1e1"/>
      <stop offset="1" stop-color="#ecd9bb"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ab4f0"/>
      <stop offset="1" stop-color="#cdeeff"/>
    </linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#d6d0c5"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f4f7"/>
      <stop offset="0.5" stop-color="#9aa3ae"/>
      <stop offset="1" stop-color="#d5dae0"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a6b"/>
      <stop offset="1" stop-color="#d9462a"/>
    </linearGradient>
    <radialGradient id="skin" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffd9b0"/>
      <stop offset="1" stop-color="#d99a62"/>
    </radialGradient>
    <radialGradient id="bun" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ffd896"/>
      <stop offset="0.6" stop-color="#eaa24c"/>
      <stop offset="1" stop-color="#b9702a"/>
    </radialGradient>
    <linearGradient id="patty" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6038"/>
      <stop offset="1" stop-color="#3f2210"/>
    </linearGradient>
    <linearGradient id="cheese" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#f2a91c"/>
    </linearGradient>
    <linearGradient id="fry" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe58a"/>
      <stop offset="1" stop-color="#e0a82a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="100%">
      <stop offset="0" stop-color="#fff1c4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff1c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <!-- wall and window -->
  <rect width="640" height="360" fill="url(#wall)"/>
  <rect x="150" y="34" width="440" height="190" rx="6" fill="url(#sky)"/>
  <circle cx="520" cy="80" r="22" fill="#fff3c4"/>
  <circle cx="520" cy="80" r="40" fill="#fff3c4" opacity="0.25"/>
  <g fill="#fff" opacity="0.85">
    <ellipse cx="250" cy="70" rx="34" ry="11"/><ellipse cx="272" cy="63" rx="22" ry="11"/><ellipse cx="230" cy="66" rx="18" ry="9"/>
  </g>
  <g fill="#6d7d92">
    <rect x="156" y="130" width="46" height="94"/><rect x="206" y="108" width="40" height="116"/><rect x="250" y="146" width="56" height="78"/>
    <rect x="452" y="120" width="44" height="104"/><rect x="500" y="98" width="38" height="126"/><rect x="542" y="140" width="46" height="84"/>
  </g>
  <g fill="#fff" opacity="0.25">
    <rect x="164" y="140" width="8" height="10"/><rect x="180" y="140" width="8" height="10"/><rect x="164" y="160" width="8" height="10"/><rect x="214" y="120" width="8" height="10"/><rect x="230" y="120" width="8" height="10"/><rect x="214" y="140" width="8" height="10"/>
    <rect x="460" y="130" width="8" height="10"/><rect x="476" y="130" width="8" height="10"/><rect x="508" y="110" width="8" height="10"/><rect x="524" y="110" width="8" height="10"/><rect x="508" y="130" width="8" height="10"/>
  </g>
  <rect x="150" y="34" width="440" height="190" rx="6" fill="none" stroke="#7a5530" stroke-width="9"/>
  <rect x="140" y="226" width="460" height="9" fill="#8a5d34"/>
  <!-- red and white tiles under the window -->
  <g>
    <rect x="0" y="236" width="640" height="34" fill="#fbfbfb"/>
    <path d="M0 236h17v17H0zM34 236h17v17H34zM68 236h17v17H68zM102 236h17v17h-17zM136 236h17v17h-17zM170 236h17v17h-17zM204 236h17v17h-17zM238 236h17v17h-17zM272 236h17v17h-17zM306 236h17v17h-17zM340 236h17v17h-17zM374 236h17v17h-17zM408 236h17v17h-17zM442 236h17v17h-17zM476 236h17v17h-17zM510 236h17v17h-17zM544 236h17v17h-17zM578 236h17v17h-17zM612 236h17v17h-17z" fill="#d93a3a"/>
    <path d="M17 253h17v17H17zM51 253h17v17H51zM85 253h17v17H85zM119 253h17v17h-17zM153 253h17v17h-17zM187 253h17v17h-17zM221 253h17v17h-17zM255 253h17v17h-17zM289 253h17v17h-17zM323 253h17v17h-17zM357 253h17v17h-17zM391 253h17v17h-17zM425 253h17v17h-17zM459 253h17v17h-17zM493 253h17v17h-17zM527 253h17v17h-17zM561 253h17v17h-17zM595 253h17v17h-17zM629 253h17v17h-17z" fill="#d93a3a"/>
  </g>

  <!-- hanging lamp glow -->
  <path d="M300 0 L340 0 L460 270 L180 270 Z" fill="url(#glow)"/>
  <line x1="320" y1="0" x2="320" y2="16" stroke="#222" stroke-width="2"/>
  <path d="M310 16 L330 16 L346 34 L294 34 Z" fill="#2e8a68"/>
  <rect x="294" y="32" width="52" height="3" fill="#d4a017"/>

  <!-- ORDER UP! sign -->
  <g transform="translate(22 22) rotate(-4)">
    <rect width="168" height="58" rx="14" fill="#c4502f"/>
    <rect y="-4" width="168" height="58" rx="14" fill="#ff7a59"/>
    <text x="84" y="35" text-anchor="middle" font-family="'Arial Rounded MT Bold', 'Trebuchet MS', Arial, sans-serif" font-weight="900" font-size="30" fill="#fff">ORDER UP!</text>
  </g>

  <!-- the customer -->
  <g>
    <path d="M222 300 Q226 214 288 206 L352 206 Q414 214 418 300 Z" fill="url(#shirt)"/>
    <path d="M296 206 Q320 226 344 206" fill="none" stroke="#a8311b" stroke-width="7" stroke-linecap="round"/>
    <rect x="306" y="178" width="28" height="32" rx="9" fill="#d18e55"/>
    <circle cx="276" cy="146" r="12" fill="#d99a62"/>
    <circle cx="364" cy="146" r="12" fill="#d99a62"/>
    <ellipse cx="320" cy="140" rx="46" ry="50" fill="url(#skin)"/>
    <path d="M273 132 Q270 82 322 82 Q372 82 368 128 Q352 106 322 108 Q292 108 276 136 Z" fill="#3b2414"/>
    <ellipse cx="300" cy="96" rx="18" ry="5" fill="#fff" opacity="0.15" transform="rotate(-15 300 96)"/>
    <path d="M292 122 Q302 114 312 121" fill="none" stroke="#2b1a0f" stroke-width="4" stroke-linecap="round"/>
    <path d="M328 121 Q338 114 348 122" fill="none" stroke="#2b1a0f" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="302" cy="137" rx="9" ry="8" fill="#fff"/>
    <ellipse cx="338" cy="137" rx="9" ry="8" fill="#fff"/>
    <circle cx="303" cy="138" r="5" fill="#3b2414"/>
    <circle cx="339" cy="138" r="5" fill="#3b2414"/>
    <circle cx="305" cy="135.5" r="1.8" fill="#fff"/>
    <circle cx="341" cy="135.5" r="1.8" fill="#fff"/>
    <path d="M315 152 Q320 158 325 152" fill="none" stroke="#a8693b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="290" cy="158" r="8" fill="#ff8f8f" opacity="0.4"/>
    <circle cx="350" cy="158" r="8" fill="#ff8f8f" opacity="0.4"/>
    <path d="M301 166 Q320 190 339 166 Z" fill="#7a2a1e"/>
    <rect x="308" y="166" width="24" height="6" rx="2" fill="#fff"/>
    <!-- arm raising the burger -->
    <path d="M404 250 Q430 200 436 160" fill="none" stroke="url(#shirt)" stroke-width="30" stroke-linecap="round"/>
    <circle cx="438" cy="150" r="17" fill="url(#skin)"/>
  </g>

  <!-- big burger -->
  <g transform="translate(446 112) rotate(-8)">
    <ellipse cx="0" cy="46" rx="56" ry="8" fill="#000" opacity="0.12"/>
    <rect x="-54" y="20" width="108" height="22" rx="11" fill="#d98c3a"/>
    <rect x="-50" y="20" width="100" height="5" rx="2.5" fill="#f6c27a" opacity="0.6"/>
    <ellipse cx="0" cy="16" rx="56" ry="14" fill="url(#patty)"/>
    <g stroke="#2a1408" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <line x1="-30" y1="9" x2="-24" y2="22"/><line x1="-10" y1="9" x2="-4" y2="22"/><line x1="10" y1="9" x2="16" y2="22"/><line x1="30" y1="9" x2="36" y2="22"/>
    </g>
    <path d="M-56 6 L56 6 L56 12 Q40 12 36 26 Q32 12 12 12 Q4 12 0 30 Q-4 12 -56 12 Z" fill="url(#cheese)"/>
    <ellipse cx="-24" cy="1" rx="22" ry="7" fill="#d32f2f"/><ellipse cx="-24" cy="0" rx="17" ry="5" fill="#f0614f"/>
    <ellipse cx="24" cy="1" rx="22" ry="7" fill="#d32f2f"/><ellipse cx="24" cy="0" rx="17" ry="5" fill="#f0614f"/>
    <path d="M-60 -4 Q-52 6 -44 -2 Q-36 8 -28 -2 Q-20 8 -12 -2 Q-4 8 4 -2 Q12 8 20 -2 Q28 8 36 -2 Q44 8 52 -2 Q58 4 60 -4 Z" fill="#5cbf3a"/>
    <path d="M-56 -5 A56 38 0 0 1 56 -5 Z" fill="url(#bun)"/>
    <ellipse cx="-20" cy="-28" rx="16" ry="5" fill="#fff" opacity="0.3" transform="rotate(-15 -20 -28)"/>
    <g fill="#fff4d6">
      <ellipse cx="-26" cy="-18" rx="4" ry="2.2" transform="rotate(20 -26 -18)"/><ellipse cx="-8" cy="-27" rx="4" ry="2.2" transform="rotate(-10 -8 -27)"/>
      <ellipse cx="12" cy="-26" rx="4" ry="2.2" transform="rotate(25 12 -26)"/><ellipse cx="30" cy="-17" rx="4" ry="2.2" transform="rotate(-25 30 -17)"/>
      <ellipse cx="2" cy="-14" rx="4" ry="2.2" transform="rotate(5 2 -14)"/><ellipse cx="-40" cy="-9" rx="4" ry="2.2"/><ellipse cx="42" cy="-6" rx="4" ry="2.2"/>
    </g>
  </g>
  <!-- sparkles around the burger -->
  <g fill="#fff">
    <path d="M520 60 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
    <path d="M392 70 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" opacity="0.8"/>
  </g>

  <!-- counter -->
  <rect x="0" y="292" width="640" height="34" fill="url(#counter)"/>
  <path d="M40 300 C70 310 100 298 140 316 M260 298 C290 310 330 300 370 314 M480 300 C510 312 540 302 590 316" fill="none" stroke="#a89e90" stroke-opacity="0.3"/>
  <rect x="0" y="326" width="640" height="12" fill="url(#chrome)"/>
  <rect x="0" y="338" width="640" height="22" fill="#2f3138"/>
  <!-- hands resting on the counter -->
  <ellipse cx="262" cy="300" rx="20" ry="11" fill="url(#skin)"/>

  <!-- fries -->
  <g transform="translate(98 300)">
    <ellipse cx="0" cy="22" rx="30" ry="6" fill="#000" opacity="0.15"/>
    <g fill="url(#fry)">
      <rect x="-22" y="-44" width="8" height="40" transform="rotate(-8 -18 -24)"/><rect x="-12" y="-52" width="8" height="46"/><rect x="-2" y="-48" width="8" height="42" transform="rotate(6 2 -26)"/>
      <rect x="8" y="-54" width="8" height="48" transform="rotate(-4 12 -30)"/><rect x="16" y="-42" width="8" height="38" transform="rotate(10 20 -24)"/>
    </g>
    <path d="M-30 -14 L30 -14 L22 24 L-22 24 Z" fill="#e53935"/>
    <rect x="-28" y="-5" width="56" height="5" fill="#fff"/>
    <circle cx="0" cy="10" r="6" fill="#ffd43b"/>
  </g>
  <!-- soda -->
  <g transform="translate(560 288)">
    <ellipse cx="0" cy="34" rx="22" ry="5" fill="#000" opacity="0.15"/>
    <path d="M-22 -24 L22 -24 L16 32 L-16 32 Z" fill="#fafafa"/>
    <path d="M-20 -6 L20 -6 L18 6 L-18 6 Z" fill="#e53935"/>
    <ellipse cx="0" cy="-24" rx="24" ry="6" fill="#eee"/>
    <line x1="5" y1="-26" x2="14" y2="-52" stroke="#ff5e8a" stroke-width="5" stroke-linecap="round"/>
  </g>

  <rect width="640" height="360" fill="url(#vignette)"/>
</svg>
