<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Tennis Ace game card: a fox swinging at a blazing ball on a court full of cheering animals -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ab8f7"/>
      <stop offset="1" stop-color="#cdeeff"/>
    </linearGradient>
    <linearGradient id="court" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a6fbc"/>
      <stop offset="1" stop-color="#4a82d6"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6ffc0"/>
      <stop offset="0.5" stop-color="#c6f24e"/>
      <stop offset="1" stop-color="#8fbf1e"/>
    </linearGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#f8ffb0"/>
      <stop offset="0.6" stop-color="#d8f54a"/>
      <stop offset="1" stop-color="#8fb51a"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a2b" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffd43b" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="fur" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffb070"/>
      <stop offset="1" stop-color="#e8762a"/>
    </radialGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9dee8"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9ced8"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="0.65" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.3"/>
    </radialGradient>
    <pattern id="crowd" width="32" height="26" patternUnits="userSpaceOnUse">
      <rect width="32" height="26" fill="#24375c"/>
      <rect x="3" y="15" width="11" height="11" fill="#ff6b6b"/><circle cx="8.5" cy="11" r="5" fill="#f2c48d"/>
      <rect x="19" y="15" width="11" height="11" fill="#4fb8ff"/><circle cx="24.5" cy="11" r="5" fill="#8a5a36"/><circle cx="21" cy="6.5" r="2" fill="#8a5a36"/><circle cx="28" cy="6.5" r="2" fill="#8a5a36"/>
    </pattern>
    <pattern id="crowd2" width="32" height="26" patternUnits="userSpaceOnUse" x="16">
      <rect width="32" height="26" fill="#2b4170"/>
      <rect x="3" y="15" width="11" height="11" fill="#ffd43b"/><circle cx="8.5" cy="11" r="5" fill="#ffffff"/><circle cx="5" cy="6.5" r="2" fill="#ffffff"/><circle cx="12" cy="6.5" r="2" fill="#ffffff"/>
      <rect x="19" y="15" width="11" height="11" fill="#3ecf8e"/><circle cx="24.5" cy="11" r="5" fill="#e8b04a"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <!-- grandstand -->
  <rect y="20" width="640" height="26" fill="url(#crowd)"/>
  <rect y="46" width="640" height="26" fill="url(#crowd2)"/>
  <rect y="72" width="640" height="26" fill="url(#crowd)"/>
  <rect y="98" width="640" height="14" fill="#2f6bd1"/>
  <text x="160" y="109" font-family="Fredoka, Arial, sans-serif" font-weight="700" font-size="11" fill="#fff" text-anchor="middle">CITY HARD COURT</text>
  <text x="480" y="109" font-family="Fredoka, Arial, sans-serif" font-weight="700" font-size="11" fill="#fff" text-anchor="middle">CITY HARD COURT</text>
  <!-- surrounding ground + court in perspective -->
  <rect y="112" width="640" height="248" fill="#4f9a62"/>
  <path d="M 220 112 L 420 112 L 600 360 L 40 360 Z" fill="url(#court)"/>
  <g stroke="#fff" stroke-width="3" fill="none">
    <path d="M 220 112 L 420 112 L 600 360 L 40 360 Z"/>
    <line x1="245" y1="112" x2="98" y2="360"/><line x1="395" y1="112" x2="542" y2="360"/>
    <line x1="232" y1="150" x2="408" y2="150"/>
    <line x1="320" y1="150" x2="320" y2="290"/>
    <line x1="168" y1="290" x2="472" y2="290"/>
  </g>
  <!-- net -->
  <rect x="150" y="186" width="340" height="30" fill="#14181e" opacity="0.35"/>
  <g stroke="#14181e" stroke-opacity="0.5" stroke-width="1">
    <line x1="150" y1="193" x2="490" y2="193"/><line x1="150" y1="200" x2="490" y2="200"/><line x1="150" y1="207" x2="490" y2="207"/>
  </g>
  <rect x="150" y="183" width="340" height="5" fill="#fff"/>
  <rect x="146" y="183" width="5" height="36" fill="#2b2f3a"/><rect x="489" y="183" width="5" height="36" fill="#2b2f3a"/>
  <!-- far player (small tiger) -->
  <g transform="translate(360 150)">
    <ellipse cx="0" cy="18" rx="9" ry="2.5" fill="#000" opacity="0.25"/>
    <rect x="-2.5" y="6" width="2" height="11" fill="#e8762a"/><rect x="1" y="6" width="2" height="11" fill="#e8762a"/>
    <rect x="-4" y="-3" width="8" height="10" rx="2" fill="#2b2f3a"/>
    <circle cx="0" cy="-7" r="4.5" fill="#ff9a2b"/>
    <path d="M -4 -10 L -3 -14 L -1 -11 Z M 4 -10 L 3 -14 L 1 -11 Z" fill="#ff9a2b"/>
    <ellipse cx="9" cy="-4" rx="3" ry="4" fill="none" stroke="#c9ced8" stroke-width="1.2"/>
  </g>
  <!-- blazing ball -->
  <path d="M 330 122 Q 380 140 452 196" fill="none" stroke="url(#trail)" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <ellipse cx="455" cy="264" rx="10" ry="3.5" fill="#000" opacity="0.25"/>
  <circle cx="455" cy="198" r="12" fill="url(#ball)"/>
  <path d="M 445 192 A 10 10 0 0 1 447 208" fill="none" stroke="#fff" stroke-width="2.4" opacity="0.85"/>
  <!-- the fox, swinging -->
  <g transform="translate(395 330)">
    <ellipse cx="0" cy="2" rx="38" ry="9" fill="#000" opacity="0.28"/>
    <!-- legs -->
    <path d="M -9 -60 L -16 -6" stroke="#e8762a" stroke-width="10" stroke-linecap="round"/>
    <path d="M 9 -60 L 14 -6" stroke="#e8762a" stroke-width="10" stroke-linecap="round"/>
    <rect x="-26" y="-9" width="18" height="9" rx="4" fill="#fff"/><rect x="6" y="-9" width="18" height="9" rx="4" fill="#fff"/>
    <!-- tail -->
    <path d="M 2 -62 Q 34 -60 30 -92" fill="none" stroke="#f08a3c" stroke-width="12" stroke-linecap="round"/>
    <path d="M 31 -84 L 30 -94" stroke="#fff3e6" stroke-width="9" stroke-linecap="round"/>
    <!-- shorts + shirt -->
    <rect x="-20" y="-74" width="40" height="18" rx="6" fill="#2f6bd1"/>
    <rect x="-21" y="-110" width="42" height="40" rx="11" fill="url(#shirt)"/>
    <!-- racket arm swinging up to the ball -->
    <path d="M 16 -102 L 40 -126" stroke="#f08a3c" stroke-width="9" stroke-linecap="round"/>
    <path d="M 40 -126 L 50 -140" stroke="#2b2f3a" stroke-width="4"/>
    <ellipse cx="60" cy="-160" rx="14" ry="19" transform="rotate(30 60 -160)" fill="#fff" fill-opacity="0.35" stroke="#ff5d6c" stroke-width="4"/>
    <!-- other arm -->
    <path d="M -16 -102 L -34 -86" stroke="#f08a3c" stroke-width="9" stroke-linecap="round"/>
    <!-- head (from behind) -->
    <path d="M -15 -130 L -12 -150 L -3 -136 Z" fill="#f08a3c"/><path d="M 15 -130 L 12 -150 L 3 -136 Z" fill="#f08a3c"/>
    <path d="M -12 -133 L -11 -144 L -5 -136 Z" fill="#fff3e6"/><path d="M 12 -133 L 11 -144 L 5 -136 Z" fill="#fff3e6"/>
    <circle cx="0" cy="-124" r="17" fill="url(#fur)"/>
    <rect x="-17" y="-133" width="34" height="5" fill="#e8413c"/>
    <ellipse cx="0" cy="-118" rx="8" ry="6" fill="#d9682a" opacity="0.6"/>
  </g>
  <!-- PERFECT pop -->
  <g transform="translate(520 160) rotate(-8)">
    <text x="0" y="0" font-family="Fredoka, Arial, sans-serif" font-weight="800" font-size="26" fill="#1f2b00" stroke="#1f2b00" stroke-width="6" stroke-linejoin="round" text-anchor="middle">PERFECT!</text>
    <text x="0" y="0" font-family="Fredoka, Arial, sans-serif" font-weight="800" font-size="26" fill="#c6f24e" text-anchor="middle">PERFECT!</text>
  </g>
  <rect width="640" height="360" fill="url(#vig)"/>
  <g font-family="Fredoka, 'Trebuchet MS', Arial, sans-serif" font-weight="700" text-anchor="middle">
    <text x="190" y="268" font-size="70" fill="#1f3a00" stroke="#1f3a00" stroke-width="14" stroke-linejoin="round">TENNIS</text>
    <text x="190" y="262" font-size="70" fill="url(#title)" stroke="#fff" stroke-width="2.5" stroke-linejoin="round">TENNIS</text>
    <text x="190" y="330" font-size="70" fill="#1f3a00" stroke="#1f3a00" stroke-width="14" stroke-linejoin="round">ACE</text>
    <text x="190" y="324" font-size="70" fill="url(#title)" stroke="#fff" stroke-width="2.5" stroke-linejoin="round">ACE</text>
  </g>
</svg>
